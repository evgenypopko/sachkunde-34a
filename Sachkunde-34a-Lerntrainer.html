<script>
/* Sachgebiet 2: Datenschutzrecht. Eigene prüfungsnahe Übungsfragen – keine Original-IHK-Fragen. */
SK.fragen("ds", [
  { u: "begriff", d: 1, q: "Was sind personenbezogene Daten im Sinne der DS-GVO?", o: ["Alle Informationen, die sich auf eine identifizierte oder identifizierbare natürliche Person beziehen", ["Nur Name und Anschrift", "Der Begriff ist viel weiter, z. B. auch Kennzeichen oder Videobilder."], ["Nur elektronisch gespeicherte Informationen", "Auf die Form der Speicherung kommt es nicht an."], ["Alle Informationen über Unternehmen", "Geschützt sind natürliche Personen, nicht juristische."]], e: "Art. 4 Nr. 1 DS-GVO: Entscheidend ist, ob eine natürliche Person direkt oder indirekt identifiziert werden kann.", r: "Art. 4 Nr. 1 DS-GVO" },
  { u: "begriff", t: "mc", d: 1, q: "Welche zwei Angaben sind personenbezogene Daten?", o: ["Das Kfz-Kennzeichen eines Besuchers im Wachbuch", "Die Videoaufnahme, auf der ein Mitarbeiter erkennbar ist", ["Die Zahl der Besucher pro Tag", "Eine reine Summe lässt keinen Rückschluss auf eine Person zu."], ["Die Außentemperatur am Werkstor", "Sie hat keinen Personenbezug."]], e: "Kennzeichen und Bildaufnahmen lassen sich einer Person zuordnen und sind damit personenbezogen.", r: "Art. 4 Nr. 1 DS-GVO" },
  { u: "begriff", d: 1, q: "Was bedeutet „Verarbeitung“ im Sinne der DS-GVO?", o: ["Jeder Vorgang im Zusammenhang mit personenbezogenen Daten, z. B. Erheben, Speichern, Verwenden, Übermitteln, Löschen", ["Nur das Speichern in einer Datenbank", "Speichern ist nur ein Beispiel."], ["Nur die Weitergabe an Dritte", "Die Weitergabe ist nur ein Beispiel."], ["Nur die automatische Auswertung durch Software", "Auch nicht automatisierte Vorgänge in Dateisystemen sind erfasst."]], e: "Der Verarbeitungsbegriff ist umfassend und reicht vom Erheben bis zum Vernichten.", r: "Art. 4 Nr. 2 DS-GVO" },
  { u: "begriff", d: 2, q: "Wer ist „Verantwortlicher“ im Sinne der DS-GVO?", o: ["Die Stelle, die über Zwecke und Mittel der Verarbeitung entscheidet", ["Immer die Person, die die Daten eingibt", "Die eingebende Person handelt meist nur nach Weisung."], ["Die Datenschutzaufsichtsbehörde", "Sie überwacht, ist aber nicht Verantwortlicher."], ["Die betroffene Person selbst", "Sie ist diejenige, deren Daten verarbeitet werden."]], e: "Verantwortlicher ist, wer allein oder gemeinsam mit anderen über Zwecke und Mittel entscheidet – z. B. der Betreiber eines Objekts.", r: "Art. 4 Nr. 7 DS-GVO" },
  { u: "begriff", d: 2, q: "Ein Sicherheitsunternehmen führt für einen Kunden die Besucherverwaltung streng nach dessen Weisungen. Welche Rolle hat es datenschutzrechtlich typischerweise?", o: ["Auftragsverarbeiter", ["Betroffene Person", "Betroffen sind die Besucher."], ["Aufsichtsbehörde", "Das ist eine staatliche Stelle."], ["Dritter ohne jede Pflicht", "Auch der Auftragsverarbeiter hat Pflichten."]], e: "Wer personenbezogene Daten im Auftrag und nach Weisung des Verantwortlichen verarbeitet, ist Auftragsverarbeiter. Dafür ist ein Vertrag nach Art. 28 DS-GVO nötig. Die Einordnung hängt vom Einzelfall ab.", r: "Art. 4 Nr. 8, Art. 28 DS-GVO" },
  { u: "begriff", t: "mc", d: 2, q: "Welche zwei Daten gehören zu den besonderen Kategorien nach Art. 9 DS-GVO?", o: ["Gesundheitsdaten", "Religiöse Überzeugung", ["Telefonnummer", "Sie ist ein gewöhnliches personenbezogenes Datum."], ["Kfz-Kennzeichen", "Es ist ein gewöhnliches personenbezogenes Datum."]], e: "Besondere Kategorien sind u. a. ethnische Herkunft, politische Meinung, Religion, Gewerkschaftszugehörigkeit, genetische und biometrische Daten, Gesundheit und Sexualleben.", r: "Art. 9 DS-GVO" },
  { u: "begriff", t: "tf", d: 1, a: false, q: "Das Datenschutzrecht gilt nur für Daten, die elektronisch gespeichert sind.", e: "Es gilt auch für nicht automatisierte Verarbeitungen, wenn die Daten in einem Dateisystem gespeichert sind oder werden sollen – etwa ein geordnetes Besucherbuch.", r: "Art. 2 Abs. 1 DS-GVO" },
  { u: "begriff", t: "zu", d: 2, q: "Ordne jedem Begriff die passende Beschreibung zu.", p: [["Betroffene Person", "Mensch, dessen Daten verarbeitet werden"], ["Verantwortlicher", "entscheidet über Zwecke und Mittel"], ["Auftragsverarbeiter", "verarbeitet nach Weisung für einen anderen"], ["Aufsichtsbehörde", "überwacht die Einhaltung des Datenschutzes"]], e: "Diese vier Rollen kehren in der DS-GVO immer wieder." },

  { u: "grundsatz", d: 2, q: "Was verlangt der Grundsatz der Zweckbindung?", o: ["Daten dürfen nur für festgelegte, eindeutige und legitime Zwecke erhoben und nicht in unvereinbarer Weise weiterverarbeitet werden.", ["Daten dürfen beliebig genutzt werden, sobald sie einmal erhoben sind.", "Das widerspricht der Zweckbindung."], ["Daten müssen immer für Werbezwecke freigegeben werden.", "Eine solche Pflicht gibt es nicht."], ["Daten müssen dauerhaft gespeichert bleiben.", "Das widerspricht der Speicherbegrenzung."]], e: "Der Zweck muss vor der Erhebung feststehen. Besucherdaten für die Zutrittskontrolle dürfen z. B. nicht für Werbung genutzt werden.", r: "Art. 5 Abs. 1 Buchst. b DS-GVO" },
  { u: "grundsatz", d: 1, q: "Was bedeutet Datenminimierung?", o: ["Es werden nur die Daten verarbeitet, die für den Zweck erforderlich sind.", ["Es werden möglichst viele Daten auf Vorrat gesammelt.", "Vorratssammlung widerspricht dem Grundsatz."], ["Daten werden in möglichst kleiner Schrift notiert.", "Der Grundsatz betrifft den Umfang, nicht die Darstellung."], ["Daten werden nur einmal pro Jahr gelöscht.", "Das betrifft die Speicherdauer."]], e: "Datenminimierung heißt: dem Zweck angemessen, erheblich und auf das notwendige Maß beschränkt.", r: "Art. 5 Abs. 1 Buchst. c DS-GVO" },
  { u: "grundsatz", t: "mc", d: 2, q: "Welche zwei Grundsätze nennt Art. 5 DS-GVO?", o: ["Speicherbegrenzung", "Integrität und Vertraulichkeit", ["Gewinnorientierung", "Das ist kein Datenschutzgrundsatz."], ["Vollständige Veröffentlichung", "Das widerspricht der Vertraulichkeit."]], e: "Art. 5 nennt Rechtmäßigkeit, Treu und Glauben, Transparenz, Zweckbindung, Datenminimierung, Richtigkeit, Speicherbegrenzung, Integrität und Vertraulichkeit sowie die Rechenschaftspflicht.", r: "Art. 5 DS-GVO" },
  { u: "grundsatz", d: 2, q: "Wann ist die Verarbeitung personenbezogener Daten rechtmäßig?", o: ["Wenn mindestens eine Rechtsgrundlage nach Art. 6 DS-GVO vorliegt, z. B. Einwilligung, Vertrag, rechtliche Pflicht oder berechtigtes Interesse", ["Immer, wenn sie technisch möglich ist", "Technische Machbarkeit ist keine Rechtsgrundlage."], ["Nur mit richterlichem Beschluss", "Ein Beschluss ist nicht erforderlich."], ["Nur wenn die betroffene Person bezahlt wird", "Bezahlung ist keine Voraussetzung."]], e: "Es gilt ein Verbot mit Erlaubnisvorbehalt: Ohne Rechtsgrundlage ist die Verarbeitung unzulässig.", r: "Art. 6 Abs. 1 DS-GVO" },
  { u: "grundsatz", d: 2, q: "Welche Aussage zur Einwilligung ist richtig?", o: ["Sie muss freiwillig erteilt werden und kann jederzeit mit Wirkung für die Zukunft widerrufen werden.", ["Sie gilt unwiderruflich für immer.", "Der Widerruf ist jederzeit möglich."], ["Sie kann durch Schweigen erteilt werden.", "Erforderlich ist eine eindeutige bestätigende Handlung."], ["Sie darf durch Druck erzwungen werden.", "Dann fehlt die Freiwilligkeit."]], e: "Die Einwilligung muss freiwillig, informiert und eindeutig sein; der Verantwortliche muss sie nachweisen können.", r: "Art. 4 Nr. 11, Art. 7 DS-GVO" },
  { u: "grundsatz", t: "tf", d: 2, a: true, q: "Der Verantwortliche muss nachweisen können, dass er die Datenschutzgrundsätze einhält.", e: "Das ist die Rechenschaftspflicht.", r: "Art. 5 Abs. 2 DS-GVO" },
  { u: "grundsatz", d: 2, f: 1, q: "Am Empfang sollen Besucher erfasst werden. Welche Lösung entspricht dem Grundsatz der Datenminimierung am besten?", o: ["Name, Firma, Ansprechpartner und Zeit des Besuchs erfassen", ["Zusätzlich Familienstand und Religionszugehörigkeit erfragen", "Diese Angaben sind für den Zweck nicht erforderlich."], ["Den Personalausweis kopieren und dauerhaft ablegen", "Eine Kopie ist in der Regel nicht erforderlich und unverhältnismäßig."], ["Von jedem Besucher ein Foto für das Archiv anfertigen", "Dafür fehlt regelmäßig die Erforderlichkeit."]], e: "Erhoben wird nur, was für die Zutrittskontrolle gebraucht wird.", r: "Art. 5 Abs. 1 Buchst. c DS-GVO" },
  { u: "grundsatz", t: "fa", d: 2, q: "Nenne die Grundsätze der Verarbeitung personenbezogener Daten nach Art. 5 DS-GVO.", m: "Rechtmäßigkeit, Verarbeitung nach Treu und Glauben und Transparenz; Zweckbindung; Datenminimierung; Richtigkeit; Speicherbegrenzung; Integrität und Vertraulichkeit. Hinzu kommt die Rechenschaftspflicht des Verantwortlichen.", c: ["Rechtmäßigkeit, Treu und Glauben, Transparenz", "Zweckbindung", "Datenminimierung", "Richtigkeit", "Speicherbegrenzung", "Integrität und Vertraulichkeit", "Rechenschaftspflicht"] },

  { u: "rechte", d: 1, q: "Welches Recht hat eine betroffene Person nach Art. 15 DS-GVO?", o: ["Auskunft darüber, ob und welche Daten über sie verarbeitet werden", ["Einsicht in die Daten aller anderen Personen", "Das Auskunftsrecht betrifft nur die eigenen Daten."], ["Schadensersatz ohne Schaden", "Schadensersatz setzt einen Schaden voraus."], ["Löschung aller Daten des Unternehmens", "Das Löschungsrecht betrifft nur die eigenen Daten."]], e: "Das Auskunftsrecht ist die Grundlage für alle weiteren Betroffenenrechte.", r: "Art. 15 DS-GVO" },
  { u: "rechte", t: "mc", d: 2, q: "Welche zwei Rechte stehen betroffenen Personen nach der DS-GVO zu?", o: ["Recht auf Berichtigung unrichtiger Daten", "Recht auf Löschung, wenn die Daten nicht mehr erforderlich sind", ["Recht, die Verarbeitung durch den Staat generell zu verbieten", "Ein solches Recht besteht nicht."], ["Recht auf Herausgabe der Datenverarbeitungsanlage", "Ein solches Recht besteht nicht."]], e: "Zu den Betroffenenrechten gehören Information, Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit und Widerspruch.", r: "Art. 12–22 DS-GVO" },
  { u: "rechte", d: 2, f: 1, q: "Ein Besucher verlangt von der Wachperson am Empfang Auskunft, welche Daten über ihn gespeichert sind. Wie reagiert sie richtig?", o: ["Sie nimmt das Anliegen auf und leitet es an den Verantwortlichen bzw. die dafür benannte Stelle weiter.", ["Sie lehnt ab, weil Besucher keine Rechte haben.", "Auch Besucher sind betroffene Personen."], ["Sie zeigt ihm das gesamte Besucherbuch.", "Damit würden Daten anderer Personen offengelegt."], ["Sie löscht sofort alle Einträge des Tages.", "Dafür ist sie nicht zuständig; zudem wären andere betroffen."]], e: "Auskunft erteilt der Verantwortliche. Die Wachperson gibt das Ersuchen unverzüglich weiter und offenbart keine Daten Dritter.", r: "Art. 12, 15 DS-GVO" },
  { u: "rechte", d: 2, q: "Wann müssen personenbezogene Daten gelöscht werden?", o: ["Unter anderem, wenn sie für den Zweck, für den sie erhoben wurden, nicht mehr notwendig sind", ["Erst nach 30 Jahren", "Eine solche Pauschalfrist gibt es nicht."], ["Nie, wenn sie einmal rechtmäßig erhoben wurden", "Auch rechtmäßig erhobene Daten sind zu löschen."], ["Nur auf Anordnung eines Gerichts", "Die Löschpflicht besteht kraft Gesetzes."]], e: "Art. 17 DS-GVO („Recht auf Vergessenwerden“) – Ausnahmen bestehen z. B. bei gesetzlichen Aufbewahrungspflichten.", r: "Art. 17 DS-GVO" },
  { u: "rechte", t: "tf", d: 2, a: true, q: "Werden Daten bei der betroffenen Person selbst erhoben, muss der Verantwortliche sie bei der Erhebung über Zweck und Verantwortlichen informieren.", e: "Das ist die Informationspflicht nach Art. 13 DS-GVO.", r: "Art. 13 DS-GVO" },
  { u: "rechte", d: 3, q: "Welches Recht hat eine betroffene Person gegenüber einer Verarbeitung, die auf ein berechtigtes Interesse gestützt wird?", o: ["Ein Widerspruchsrecht aus Gründen, die sich aus ihrer besonderen Situation ergeben", ["Kein Recht", "Das Widerspruchsrecht ist ausdrücklich vorgesehen."], ["Ein Recht auf sofortige Strafanzeige gegen die Wachperson", "Das ist kein Betroffenenrecht der DS-GVO."], ["Ein Recht auf Löschung der Daten aller Beteiligten", "Betroffenenrechte beziehen sich auf die eigenen Daten."]], e: "Nach Art. 21 DS-GVO kann die betroffene Person widersprechen; der Verantwortliche muss dann zwingende schutzwürdige Gründe nachweisen.", r: "Art. 21 DS-GVO" },
  { u: "rechte", t: "fa", d: 2, q: "Nenne fünf Rechte der betroffenen Person nach der DS-GVO.", m: "Recht auf transparente Information (Art. 13, 14), Auskunftsrecht (Art. 15), Recht auf Berichtigung (Art. 16), Recht auf Löschung (Art. 17), Recht auf Einschränkung der Verarbeitung (Art. 18), Recht auf Datenübertragbarkeit (Art. 20), Widerspruchsrecht (Art. 21) sowie das Recht, nicht einer ausschließlich automatisierten Entscheidung unterworfen zu werden (Art. 22). Außerdem besteht ein Beschwerderecht bei der Aufsichtsbehörde.", c: ["Information", "Auskunft", "Berichtigung", "Löschung", "Einschränkung", "Widerspruch"] },

  { u: "video", d: 2, q: "Was muss bei der Videoüberwachung öffentlich zugänglicher Räume zum frühestmöglichen Zeitpunkt erkennbar gemacht werden?", o: ["Der Umstand der Beobachtung sowie Name und Kontaktdaten des Verantwortlichen", ["Die Namen aller Wachpersonen", "Das ist nicht vorgeschrieben."], ["Der Kaufpreis der Kameras", "Das ist nicht vorgeschrieben."], ["Nichts – verdeckte Überwachung ist der Regelfall", "Die Überwachung ist kenntlich zu machen."]], e: "Die Hinweispflicht ergibt sich aus § 4 Abs. 2 BDSG und den Informationspflichten der DS-GVO; üblich ist ein Hinweisschild mit Piktogramm.", r: "§ 4 Abs. 2 BDSG; Art. 13 DS-GVO" },
  { u: "video", t: "mc", d: 2, q: "Zu welchen zwei Zwecken nennt § 4 BDSG die Videoüberwachung öffentlich zugänglicher Räume als möglich?", o: ["Zur Wahrnehmung des Hausrechts", "Zur Wahrnehmung berechtigter Interessen für konkret festgelegte Zwecke", ["Zur Unterhaltung des Wachpersonals", "Das ist kein zulässiger Zweck."], ["Zur lückenlosen Leistungskontrolle aller Kunden", "Das ist kein zulässiger Zweck."]], e: "§ 4 BDSG nennt außerdem die Aufgabenerfüllung öffentlicher Stellen. Stets dürfen schutzwürdige Interessen der Betroffenen nicht überwiegen. Für private Betreiber wird zusätzlich Art. 6 Abs. 1 Buchst. f DS-GVO herangezogen.", r: "§ 4 Abs. 1 BDSG; Art. 6 Abs. 1 Buchst. f DS-GVO" },
  { u: "video", d: 2, q: "Wie lange dürfen Videoaufzeichnungen gespeichert werden?", o: ["Nur so lange, wie sie zur Erreichung des Zwecks erforderlich sind; danach sind sie unverzüglich zu löschen.", ["Grundsätzlich unbegrenzt", "Das widerspricht der Speicherbegrenzung."], ["Mindestens zehn Jahre", "Eine solche Mindestfrist gibt es nicht."], ["Bis der Speicher voll ist, unabhängig vom Zweck", "Maßgeblich ist die Erforderlichkeit, nicht die Speichergröße."]], e: "Aufnahmen sind zu löschen, wenn sie nicht mehr erforderlich sind oder schutzwürdige Interessen entgegenstehen. Aufsichtsbehörden halten meist nur wenige Tage für vertretbar.", r: "§ 4 Abs. 5 BDSG; Art. 5 Abs. 1 Buchst. e DS-GVO" },
  { u: "video", d: 2, f: 1, q: "Ein Kollege möchte eine lustige Szene aus der Videoüberwachung mit dem Handy abfilmen und in einer Chatgruppe teilen. Wie ist das zu bewerten?", o: ["Unzulässig: Die Aufnahmen dürfen nur für den festgelegten Zweck genutzt werden.", ["Zulässig, wenn die Gruppe privat ist", "Auch eine private Gruppe ist eine unbefugte Weitergabe."], ["Zulässig, wenn die Gesichter klein zu sehen sind", "Erkennbarkeit bleibt in der Regel bestehen; der Zweck fehlt ohnehin."], ["Zulässig nach Dienstschluss", "Die Uhrzeit ändert nichts."]], e: "Das verletzt Zweckbindung und Vertraulichkeit (Art. 5 Abs. 1 Buchst. b und f DS-GVO) und kann arbeitsrechtliche Folgen, Schadensersatz und Sanktionen nach sich ziehen.", r: "Art. 5 Abs. 1 Buchst. b und f DS-GVO" },
  { u: "video", t: "tf", d: 2, a: false, q: "In Umkleide- und Sanitärräumen ist Videoüberwachung zulässig, wenn ein Hinweisschild angebracht ist.", e: "Dort ist die Intimsphäre betroffen. Eine Überwachung ist unzulässig und kann nach § 201a StGB strafbar sein.", r: "§ 201a StGB; Art. 6 DS-GVO" },
  { u: "video", d: 3, q: "Die Polizei bittet nach einer Straftat um Herausgabe von Videoaufnahmen. Wie verhält sich die Wachperson richtig?", o: ["Sie verweist an den Verantwortlichen bzw. handelt nach der Dienstanweisung und dokumentiert die Herausgabe.", ["Sie verweigert jede Zusammenarbeit.", "Die Übermittlung zur Strafverfolgung kann zulässig sein."], ["Sie schickt die Aufnahmen über ihren privaten Messenger.", "Das ist kein sicherer und zulässiger Übermittlungsweg."], ["Sie löscht die Aufnahmen vorsorglich.", "Damit würden Beweismittel vernichtet."]], e: "Über die Herausgabe entscheidet der Verantwortliche. Der Vorgang wird dokumentiert.", r: "§ 4 Abs. 3 BDSG; Dienstanweisung" },

  { u: "tom", d: 2, q: "Was sind „technische und organisatorische Maßnahmen“ (TOM)?", o: ["Maßnahmen, die ein dem Risiko angemessenes Schutzniveau für die Daten gewährleisten", ["Maßnahmen zur Steigerung des Umsatzes", "Sie dienen der Datensicherheit."], ["Dienstpläne für das Wachpersonal", "Dienstpläne sind keine TOM im Sinne des Art. 32."], ["Werbemaßnahmen des Unternehmens", "Sie dienen der Datensicherheit."]], e: "Beispiele: Zutritts-, Zugangs- und Zugriffskontrolle, Verschlüsselung, Schulung, Vertraulichkeitsverpflichtung.", r: "Art. 24, 32 DS-GVO" },
  { u: "tom", t: "mc", d: 2, q: "Welche zwei Maßnahmen sind typische technische oder organisatorische Schutzmaßnahmen?", o: ["Wachbuch verschlossen aufbewahren", "Bildschirm beim Verlassen des Arbeitsplatzes sperren", ["Passwort auf einem Zettel am Monitor notieren", "Das gefährdet die Vertraulichkeit."], ["Besucherlisten offen am Tresen auslegen", "Andere Besucher könnten mitlesen."]], e: "Unbefugte dürfen keine Kenntnis von den Daten erlangen.", r: "Art. 32 DS-GVO" },
  { u: "tom", d: 2, q: "Innerhalb welcher Frist ist eine Verletzung des Schutzes personenbezogener Daten in der Regel der Aufsichtsbehörde zu melden?", o: ["Unverzüglich und möglichst binnen 72 Stunden nach Bekanntwerden", ["Innerhalb von sechs Monaten", "Die Frist ist deutlich kürzer."], ["Gar nicht – es genügt eine interne Notiz", "Die Meldepflicht besteht, wenn ein Risiko für Betroffene nicht ausgeschlossen ist."], ["Erst nach Abschluss eines Strafverfahrens", "Die Meldung hängt nicht von einem Strafverfahren ab."]], e: "Die Meldung macht der Verantwortliche. Sie entfällt nur, wenn voraussichtlich kein Risiko für die Betroffenen besteht.", r: "Art. 33 DS-GVO" },
  { u: "tom", d: 2, f: 1, q: "Eine Wachperson verliert auf dem Kontrollgang das Diensthandy mit Besucherdaten. Was ist zuerst zu tun?", o: ["Den Verlust unverzüglich dem Vorgesetzten bzw. dem Verantwortlichen melden", ["Abwarten, ob das Handy wieder auftaucht", "Die Meldefrist läuft ab Bekanntwerden."], ["Den Verlust verschweigen, um Ärger zu vermeiden", "Das verhindert die gesetzlich nötige Reaktion."], ["Privat ein Ersatzgerät kaufen und nichts sagen", "Der Vorfall bleibt eine meldepflichtige Datenpanne."]], e: "Nur bei sofortiger Meldung kann der Verantwortliche sperren, bewerten und fristgerecht melden.", r: "Art. 33 DS-GVO; Dienstanweisung" },
  { u: "tom", d: 3, q: "Ab wann müssen nichtöffentliche Stellen nach § 38 BDSG in der Regel einen Datenschutzbeauftragten benennen?", o: ["Wenn in der Regel mindestens 20 Personen ständig mit der automatisierten Verarbeitung personenbezogener Daten beschäftigt sind", ["Ab dem ersten Beschäftigten", "Die Schwelle liegt höher."], ["Erst ab 500 Beschäftigten", "Die Schwelle liegt deutlich niedriger."], ["Nie – das ist freiwillig", "Unter den gesetzlichen Voraussetzungen ist die Benennung Pflicht."]], e: "Daneben gibt es Benennungspflichten unabhängig von der Personenzahl, z. B. bei Verarbeitungen, die eine Datenschutz-Folgenabschätzung erfordern.", r: "§ 38 BDSG; Art. 37 DS-GVO" },
  { u: "tom", t: "tf", d: 2, a: true, q: "Ein Auftragsverarbeiter darf personenbezogene Daten grundsätzlich nur auf dokumentierte Weisung des Verantwortlichen verarbeiten.", e: "Das ist Kern der Auftragsverarbeitung.", r: "Art. 28, 29 DS-GVO" },
  { u: "tom", t: "zu", d: 2, q: "Ordne jede Kontrolle ihrem Ziel zu.", p: [["Zutrittskontrolle", "Unbefugte kommen nicht in die Räume"], ["Zugangskontrolle", "Unbefugte können die IT-Systeme nicht nutzen"], ["Zugriffskontrolle", "Berechtigte sehen nur die Daten ihrer Berechtigung"]], e: "Zutritt betrifft Räume, Zugang die Systeme, Zugriff die Daten." },

  { u: "sanktion", d: 2, q: "Welche Höchstgrenze nennt Art. 83 DS-GVO für Geldbußen bei schweren Verstößen?", o: ["Bis zu 20 Millionen Euro oder bis zu 4 % des weltweiten Jahresumsatzes", ["Bis zu 500 Euro", "Der Rahmen ist um ein Vielfaches höher."], ["Bis zu 50.000 Euro", "Der Rahmen der DS-GVO ist höher."], ["Es gibt keine Geldbußen", "Die DS-GVO sieht empfindliche Geldbußen vor."]], e: "Maßgeblich ist der jeweils höhere Betrag.", r: "Art. 83 DS-GVO" },
  { u: "sanktion", d: 2, q: "Was regelt Art. 82 DS-GVO?", o: ["Den Anspruch auf Schadensersatz für materielle und immaterielle Schäden durch Datenschutzverstöße", ["Die Höhe der Prüfungsgebühren", "Das ist nicht Gegenstand der DS-GVO."], ["Die Ausbildung zum Datenschutzbeauftragten", "Das regelt Art. 82 nicht."], ["Die Speicherdauer von Videoaufnahmen", "Das regelt Art. 82 nicht."]], e: "Jede Person, der wegen eines Verstoßes ein Schaden entstanden ist, hat Anspruch auf Schadensersatz.", r: "Art. 82 DS-GVO" },
  { u: "sanktion", t: "mc", d: 2, q: "Welche zwei Handlungen stellt das StGB unter Strafe?", o: ["Unbefugtes Aufnehmen des nichtöffentlich gesprochenen Wortes (§ 201)", "Unbefugtes Öffnen eines verschlossenen Briefes (§ 202)", ["Notieren eines Kennzeichens im Rahmen der Zufahrtskontrolle", "Das ist bei entsprechendem Zweck zulässig."], ["Höfliches Fragen nach dem Namen eines Besuchers", "Das ist nicht strafbar."]], e: "Die §§ 201–202a StGB schützen das gesprochene Wort, den höchstpersönlichen Lebensbereich, das Briefgeheimnis und Daten.", r: "§§ 201, 202 StGB" },
  { u: "sanktion", d: 2, f: 1, q: "Eine Wachperson nimmt ein vertrauliches Gespräch im Besprechungsraum heimlich mit dem Handy auf. Welcher Straftatbestand kommt in Betracht?", o: ["Verletzung der Vertraulichkeit des Wortes (§ 201 StGB)", ["Hausfriedensbruch (§ 123 StGB)", "Sie hält sich berechtigt im Objekt auf."], ["Urkundenfälschung (§ 267 StGB)", "Es wird keine Urkunde hergestellt oder verfälscht."], ["Sachbeschädigung (§ 303 StGB)", "Es wird keine Sache beschädigt."]], e: "Strafbar ist bereits das unbefugte Aufnehmen des nichtöffentlich gesprochenen Wortes.", r: "§ 201 StGB" },
  { u: "sanktion", t: "tf", d: 2, a: true, q: "Wer sich unbefugt Zugang zu besonders gesicherten Daten verschafft, indem er die Zugangssicherung überwindet, kann sich nach § 202a StGB strafbar machen.", e: "§ 202a StGB stellt das Ausspähen von Daten unter Strafe.", r: "§ 202a StGB" },
  { u: "sanktion", t: "fa", d: 2, q: "Welche Folgen können Datenschutzverstöße für das Unternehmen und für die Wachperson haben?", m: "Für das Unternehmen: Geldbußen nach Art. 83 DS-GVO, Schadensersatzansprüche nach Art. 82 DS-GVO, Maßnahmen der Aufsichtsbehörde und Vertrauens- bzw. Auftragsverlust. Für die Wachperson: arbeitsrechtliche Folgen bis zur Kündigung, Schadensersatz sowie Strafbarkeit nach §§ 201 ff. StGB oder – unter den dort genannten engen Voraussetzungen – nach § 42 BDSG. Auch die gewerberechtliche Zuverlässigkeit kann in Frage stehen.", c: ["Geldbuße", "Schadensersatz", "arbeitsrechtliche Folgen", "Strafbarkeit", "Zuverlässigkeit"] },

  { u: "praxis", d: 1, f: 1, q: "Ein Anrufer gibt sich als Ehemann einer Mitarbeiterin aus und fragt, ob sie noch im Haus ist. Wie handelt die Wachperson richtig?", o: ["Sie gibt keine Auskunft über Anwesenheit und bietet an, eine Nachricht weiterzuleiten.", ["Sie nennt die Anwesenheitszeiten laut Zutrittsprotokoll.", "Das wäre eine unbefugte Übermittlung."], ["Sie gibt die private Handynummer der Mitarbeiterin weiter.", "Das wäre eine unbefugte Übermittlung."], ["Sie verbindet ungeprüft mit dem Vorgesetzten der Mitarbeiterin.", "Auch das offenbart Informationen und ist nicht ihre Entscheidung."]], e: "Die Identität des Anrufers ist nicht prüfbar, und eine Rechtsgrundlage für die Auskunft fehlt.", r: "Art. 5, 6 DS-GVO; § 17 BewachV" },
  { u: "praxis", d: 2, q: "Wie ist das Wachbuch aus Sicht des Datenschutzes zu führen?", o: ["Sachlich, auf das Erforderliche beschränkt und vor Einsicht Unbefugter geschützt", ["Mit möglichst vielen persönlichen Einschätzungen über Mitarbeiter des Kunden", "Wertungen ohne Erforderlichkeit verstoßen gegen die Datenminimierung."], ["Offen am Empfangstresen, damit jeder nachlesen kann", "Unbefugte dürfen keinen Einblick erhalten."], ["Gar nicht, um Datenschutzprobleme zu vermeiden", "Die Dokumentation ist erforderlich."]], e: "Das Wachbuch enthält personenbezogene Daten und unterliegt Zweckbindung, Datenminimierung und Vertraulichkeit.", r: "Art. 5 DS-GVO" },
  { u: "praxis", t: "mc", d: 2, q: "Welche zwei Verhaltensweisen entsprechen dem Datenschutz am Empfang?", o: ["Besucherausweise nach Rückgabe so ablegen, dass Namen nicht einsehbar sind", "Telefonate mit personenbezogenem Inhalt nicht vor wartenden Besuchern führen", ["Besucherliste des Vortags im Papierkorb entsorgen", "Sie ist datenschutzgerecht zu vernichten."], ["Monitor der Videoanlage zum Besucherbereich drehen", "Unbefugte könnten mitsehen."]], e: "Vertraulichkeit bedeutet im Alltag vor allem: Mitlesen, Mithören und Mitsehen verhindern.", r: "Art. 5 Abs. 1 Buchst. f, Art. 32 DS-GVO" },
  { u: "praxis", d: 2, q: "Aus welchem Grundrecht leitet sich das Recht auf informationelle Selbstbestimmung ab?", o: ["Aus dem allgemeinen Persönlichkeitsrecht (Art. 2 Abs. 1 in Verbindung mit Art. 1 Abs. 1 GG)", ["Aus der Berufsfreiheit (Art. 12 GG)", "Das ist nicht die Grundlage."], ["Aus dem Eigentumsrecht (Art. 14 GG)", "Das ist nicht die Grundlage."], ["Aus der Versammlungsfreiheit (Art. 8 GG)", "Das ist nicht die Grundlage."]], e: "Jeder soll grundsätzlich selbst über Preisgabe und Verwendung seiner Daten bestimmen können. Auf EU-Ebene schützt Art. 8 der Grundrechtecharta personenbezogene Daten.", r: "Art. 2 Abs. 1, Art. 1 Abs. 1 GG; Art. 8 GRCh" },
  { u: "praxis", t: "tf", d: 1, a: false, q: "Nach Dienstende darf eine Wachperson im Freundeskreis erzählen, welche prominente Person sie heute im Objekt gesehen hat.", e: "Das verletzt die Verschwiegenheitspflicht und die Vertraulichkeit – auch außerhalb der Dienstzeit und nach dem Ausscheiden.", r: "§ 17 Abs. 3 BewachV; Art. 5 DS-GVO" },
  { u: "praxis", d: 2, f: 1, q: "Bei einer Zufahrtskontrolle soll die Wachperson Kennzeichen und Fahrernamen notieren. Ein Fahrer fragt, wozu das dient. Was ist richtig?", o: ["Sie nennt den Zweck (Zufahrts- und Sicherheitskontrolle) und verweist für Weiteres auf die Datenschutzhinweise des Betreibers.", ["Sie antwortet, das gehe ihn nichts an.", "Betroffene haben Anspruch auf transparente Information."], ["Sie erfindet einen Grund.", "Das verstößt gegen Treu und Glauben und Transparenz."], ["Sie verzichtet bei Nachfrage immer auf die Erfassung.", "Die Erfassung kann als Zutrittsbedingung zulässig sein."]], e: "Transparenz ist ein Grundsatz der DS-GVO: Betroffene sollen wissen, wer welche Daten wozu verarbeitet.", r: "Art. 5 Abs. 1 Buchst. a, Art. 13 DS-GVO" },
  { u: "praxis", t: "fa", d: 2, f: 1, q: "Du findest beim Kontrollgang im Kopierraum eine Liste mit Namen, Geburtsdaten und Gehältern von Mitarbeitern des Kunden. Was tust du?", m: "Ich lese die Liste nicht weiter durch, kopiere oder fotografiere sie nicht und gebe den Inhalt an niemanden weiter. Ich sichere die Unterlage vor dem Zugriff Unbefugter, etwa in einem verschlossenen Umschlag, und übergebe sie nach der Dienstanweisung dem zuständigen Ansprechpartner des Kunden oder meinem Vorgesetzten. Den Fund dokumentiere ich im Wachbuch ohne die Inhalte wiederzugeben: Zeit, Ort, Art der Unterlage, an wen übergeben.", c: ["nicht auswerten, nicht kopieren", "vor Unbefugten sichern", "an Zuständige übergeben", "sachlich dokumentieren"] }
]);

<script>
/* Sachgebiet 3: Bürgerliches Gesetzbuch. Eigene prüfungsnahe Übungsfragen – keine Original-IHK-Fragen. */
SK.fragen("bgb", [
  { u: "eigbes", d: 1, q: "Was ist Eigentum im Sinne des § 903 BGB?", o: ["Die rechtliche Herrschaft über eine Sache: Der Eigentümer darf mit ihr nach Belieben verfahren und andere von jeder Einwirkung ausschließen.", ["Die tatsächliche Gewalt über eine Sache", "Das ist der Besitz (§ 854 BGB)."], ["Das Recht, eine Sache zu mieten", "Miete ist ein Vertragsverhältnis."], ["Die Pflicht, eine Sache zu bewachen", "Das ist kein Eigentum."]], e: "Eigentum ist das umfassendste Recht an einer Sache; Grenzen setzen Gesetze und Rechte Dritter.", r: "§ 903 BGB" },
  { u: "eigbes", d: 1, q: "Wie wird der Besitz einer Sache nach § 854 BGB erworben?", o: ["Durch die Erlangung der tatsächlichen Gewalt über die Sache", ["Durch Eintragung im Grundbuch", "Das betrifft das Eigentum an Grundstücken."], ["Durch Zahlung des Kaufpreises", "Zahlung allein verschafft keinen Besitz."], ["Durch eine notarielle Urkunde", "Besitz ist ein tatsächliches Verhältnis."]], e: "Besitz ist die tatsächliche Sachherrschaft – unabhängig davon, wem die Sache gehört.", r: "§ 854 BGB" },
  { u: "eigbes", d: 2, f: 1, q: "Ein Dieb hat eine Geldbörse gestohlen und in seine Jacke gesteckt. Wer ist Eigentümer, wer Besitzer?", o: ["Der Bestohlene bleibt Eigentümer, der Dieb ist (unrechtmäßiger) Besitzer.", ["Der Dieb ist Eigentümer und Besitzer.", "Durch Diebstahl wird kein Eigentum erworben."], ["Der Bestohlene bleibt Eigentümer und Besitzer.", "Die tatsächliche Gewalt hat jetzt der Dieb."], ["Niemand ist Eigentümer, bis die Polizei entscheidet.", "Das Eigentum bleibt beim Bestohlenen."]], e: "Besitz ist rein tatsächlich. Auch der Dieb hat Besitz; er hat ihn nur durch verbotene Eigenmacht erlangt.", r: "§§ 854, 858, 903 BGB" },
  { u: "eigbes", d: 2, q: "Was ist ein Besitzdiener (§ 855 BGB)?", o: ["Wer die tatsächliche Gewalt über eine Sache für einen anderen ausübt und dessen Weisungen folgen muss", ["Wer eine Sache gemietet hat", "Der Mieter ist selbst Besitzer."], ["Wer eine Sache gestohlen hat", "Der Dieb ist unrechtmäßiger Besitzer."], ["Wer Eigentümer ist, die Sache aber verliehen hat", "Er ist mittelbarer Besitzer."]], e: "Beim Besitzdiener ist nur der andere Besitzer. Wachpersonen sind in der Regel Besitzdiener des Auftraggebers.", r: "§ 855 BGB" },
  { u: "eigbes", t: "mc", d: 2, q: "Welche zwei Personen sind Besitzer und nicht bloß Besitzdiener?", o: ["Die Mieterin einer Wohnung", "Der Entleiher eines Buches", ["Die Wachperson im bewachten Objekt", "Sie übt die Gewalt weisungsgebunden für den Auftraggeber aus."], ["Die Kassiererin an der Ladenkasse", "Sie ist Besitzdienerin des Geschäftsinhabers."]], e: "Mieter und Entleiher üben die Sachherrschaft für sich selbst aus. Wer im fremden Erwerbsgeschäft weisungsgebunden handelt, ist Besitzdiener.", r: "§§ 854, 855 BGB" },
  { u: "eigbes", t: "tf", d: 1, a: true, q: "Eigentümer und Besitzer einer Sache können verschiedene Personen sein.", e: "Beispiel Miete: Der Vermieter ist Eigentümer, der Mieter Besitzer.", r: "§§ 854, 903 BGB" },
  { u: "eigbes", d: 2, q: "Wer ist bei einem Mietverhältnis unmittelbarer Besitzer der Wohnung?", o: ["Der Mieter", ["Der Vermieter", "Der Vermieter ist mittelbarer Besitzer."], ["Der Hausverwalter", "Er verwaltet, besitzt die Wohnung aber nicht."], ["Die Gemeinde", "Sie hat mit dem Besitz nichts zu tun."]], e: "Der Mieter übt die tatsächliche Gewalt aus; der Vermieter ist mittelbarer Besitzer (§ 868 BGB).", r: "§§ 854, 868 BGB" },
  { u: "eigbes", t: "zu", d: 2, q: "Ordne jedem sachenrechtlichen Begriff die passende Beschreibung zu.", p: [["Eigentum", "rechtliche Herrschaft über eine Sache"], ["Besitz", "tatsächliche Gewalt über eine Sache"], ["Besitzdiener", "übt die Gewalt weisungsgebunden für einen anderen aus"], ["Verbotene Eigenmacht", "Besitzentziehung oder -störung ohne Willen des Besitzers"]], e: "Diese vier Begriffe sind die Grundlage des Besitzschutzes." },
  { u: "eigbes", t: "fa", d: 2, q: "Erkläre den Unterschied zwischen Eigentum und Besitz und nenne ein Beispiel.", m: "Eigentum ist die rechtliche Zuordnung einer Sache: Der Eigentümer darf nach § 903 BGB mit ihr nach Belieben verfahren und andere ausschließen. Besitz ist die tatsächliche Gewalt über die Sache (§ 854 BGB). Beides kann auseinanderfallen. Beispiel: Beim Mietwagen ist die Vermietungsfirma Eigentümerin, der Mieter Besitzer. Auch ein Dieb ist Besitzer, aber nicht Eigentümer.", c: ["Eigentum = rechtliche Herrschaft (§ 903)", "Besitz = tatsächliche Gewalt (§ 854)", "können auseinanderfallen", "Beispiel"] },

  { u: "besitzschutz", d: 1, q: "Was ist verbotene Eigenmacht (§ 858 BGB)?", o: ["Wer dem Besitzer ohne dessen Willen den Besitz entzieht oder ihn im Besitz stört, ohne dass das Gesetz es gestattet", ["Jede Benutzung fremder Sachen mit Erlaubnis", "Mit Willen des Besitzers liegt keine verbotene Eigenmacht vor."], ["Das Überschreiten der Arbeitszeit", "Das hat mit Besitz nichts zu tun."], ["Die Ausübung des Hausrechts", "Das ist ein Recht des Besitzers."]], e: "Verbotene Eigenmacht ist widerrechtlich. Sie ist der Auslöser für die Besitzschutzrechte.", r: "§ 858 BGB" },
  { u: "besitzschutz", d: 2, q: "Was erlaubt die Besitzwehr nach § 859 Abs. 1 BGB?", o: ["Der Besitzer darf sich verbotener Eigenmacht mit Gewalt erwehren.", ["Der Besitzer darf den Störer bestrafen.", "Strafen verhängt nur der Staat."], ["Der Besitzer darf den Störer durchsuchen.", "Eine Durchsuchung deckt § 859 nicht."], ["Der Besitzer darf den Störer für 24 Stunden einsperren.", "Das wäre Freiheitsberaubung."]], e: "Besitzwehr ist die Abwehr einer noch andauernden Störung oder Entziehung. Die Gewalt muss erforderlich sein.", r: "§ 859 Abs. 1 BGB" },
  { u: "besitzschutz", d: 2, q: "Unter welcher Voraussetzung darf der Besitzer eine weggenommene bewegliche Sache dem Täter mit Gewalt wieder abnehmen (Besitzkehr)?", o: ["Wenn der Täter auf frischer Tat betroffen oder verfolgt wird", ["Jederzeit, auch Wochen später", "Dann ist nur noch der Rechtsweg möglich."], ["Nur mit Zustimmung der Polizei", "Eine Zustimmung ist nicht erforderlich."], ["Nur wenn die Sache mehr als 50 Euro wert ist", "Der Wert spielt keine Rolle."]], e: "§ 859 Abs. 2 BGB erlaubt die Wiederabnahme nur in engem zeitlichen Zusammenhang mit der Wegnahme.", r: "§ 859 Abs. 2 BGB" },
  { u: "besitzschutz", d: 2, q: "Was erlaubt § 859 Abs. 3 BGB dem Besitzer eines Grundstücks, dem der Besitz durch verbotene Eigenmacht entzogen wurde?", o: ["Er darf sich sofort nach der Entziehung des Besitzes durch Entsetzung des Täters wieder bemächtigen.", ["Er darf das Grundstück des Täters besetzen.", "Das deckt die Vorschrift nicht."], ["Er darf den Täter jederzeit, auch nach Monaten, mit Gewalt entfernen.", "Das Recht besteht nur sofort nach der Entziehung."], ["Er darf vom Täter eine Geldstrafe kassieren.", "Strafen verhängt nur der Staat."]], e: "Auch hier gilt der enge zeitliche Zusammenhang („sofort“).", r: "§ 859 Abs. 3 BGB" },
  { u: "besitzschutz", d: 1, q: "Auf welche Vorschrift stützt sich die Wachperson, wenn sie für den Auftraggeber Besitzwehr oder Besitzkehr ausübt?", o: ["§ 860 BGB – Selbsthilfe des Besitzdieners", ["§ 127 StPO", "Das ist die vorläufige Festnahme."], ["§ 34 StGB", "Das ist der rechtfertigende Notstand."], ["§ 823 BGB", "Das regelt den Schadensersatz."]], e: "Der Besitzdiener darf die dem Besitzer nach § 859 BGB zustehenden Rechte ausüben.", r: "§ 860 BGB" },
  { u: "besitzschutz", d: 2, f: 1, q: "Ein Ladendetektiv sieht, wie ein Mann ein Parfüm einsteckt und ohne zu zahlen den Kassenbereich verlässt. Er stellt ihn direkt hinter der Kasse. Der Mann will weitergehen. Was darf der Detektiv nach § 859 Abs. 2 BGB?", o: ["Dem Mann das Parfüm mit der erforderlichen Gewalt wieder abnehmen", ["Dem Mann zusätzlich das Portemonnaie als Pfand abnehmen", "Besitzkehr betrifft nur die weggenommene Sache."], ["Den Mann zur Abschreckung schlagen", "Erlaubt ist nur die zur Wiedererlangung erforderliche Gewalt."], ["Nichts, er muss den Mann ziehen lassen", "Bei frischer Tat ist Besitzkehr zulässig."]], e: "Der Täter ist auf frischer Tat betroffen. Die Besitzkehr erlaubt die Wiederabnahme; daneben kommt § 127 Abs. 1 StPO in Betracht.", r: "§§ 859 Abs. 2, 860 BGB" },
  { u: "besitzschutz", d: 3, f: 1, q: "Ein Kunde entdeckt eine Woche nach einem Diebstahl sein gestohlenes Fahrrad vor einem Café. Der mutmaßliche Dieb sitzt daneben. Darf der Kunde ihm das Rad mit Gewalt abnehmen?", o: ["Nein, die Tat ist nicht mehr frisch; er muss Polizei bzw. Gericht einschalten.", ["Ja, Besitzkehr ist zeitlich unbegrenzt möglich.", "Besitzkehr setzt frische Tat voraus."], ["Ja, weil er Eigentümer ist.", "Auch der Eigentümer darf sein Recht nicht eigenmächtig mit Gewalt durchsetzen."], ["Ja, wenn er vorher dreimal warnt.", "Eine Warnung ersetzt die Voraussetzungen nicht."]], e: "Ohne frische Tat bleibt nur staatliche Hilfe. Selbsthilfe nach § 229 BGB käme nur in Betracht, wenn obrigkeitliche Hilfe nicht rechtzeitig zu erlangen wäre.", r: "§§ 859 Abs. 2, 229 BGB" },
  { u: "besitzschutz", t: "mc", d: 2, q: "Welche zwei Handlungen sind verbotene Eigenmacht?", o: ["Ein Fremder parkt ohne Erlaubnis auf dem Kundenparkplatz und blockiert die Zufahrt.", "Ein Besucher nimmt einen Firmenlaptop vom Schreibtisch und geht damit weg.", ["Ein Lieferant stellt mit Erlaubnis des Pförtners Ware im Hof ab.", "Hier handelt er mit Willen des Besitzers."], ["Die Reinigungskraft betritt vereinbarungsgemäß die Büros.", "Hier besteht eine Erlaubnis."]], e: "Verbotene Eigenmacht ist Besitzstörung oder Besitzentziehung ohne Willen des Besitzers.", r: "§ 858 BGB" },
  { u: "besitzschutz", t: "tf", d: 2, a: false, q: "Besitzwehr nach § 859 BGB darf jede beliebige Gewalt einschließen, solange der Besitz geschützt wird.", e: "Zulässig ist nur die erforderliche Gewalt; außerdem gilt die Verhältnismäßigkeit.", r: "§ 859 BGB" },
  { u: "besitzschutz", t: "tf", d: 2, a: true, q: "Ein Mieter darf sich mit Besitzwehr auch gegen den Eigentümer wehren, wenn dieser eigenmächtig die Wohnung betritt.", e: "Der Besitzschutz gilt gegen jedermann, der verbotene Eigenmacht übt – auch gegen den Eigentümer.", r: "§§ 858, 859 BGB" },
  { u: "besitzschutz", t: "fa", d: 2, q: "Erkläre Besitzwehr und Besitzkehr und nenne die jeweilige Voraussetzung.", m: "Besitzwehr (§ 859 Abs. 1 BGB): Der Besitzer darf sich verbotener Eigenmacht mit Gewalt erwehren, solange die Störung oder Entziehung andauert. Besitzkehr (§ 859 Abs. 2 und 3 BGB): Ist eine bewegliche Sache bereits weggenommen, darf er sie dem auf frischer Tat betroffenen oder verfolgten Täter wieder abnehmen; bei Grundstücken darf er sich sofort nach der Entziehung wieder in den Besitz setzen. Beides setzt verbotene Eigenmacht voraus, und die Gewalt muss erforderlich sein. Der Besitzdiener darf diese Rechte nach § 860 BGB ausüben.", c: ["verbotene Eigenmacht als Voraussetzung", "Besitzwehr = Abwehr", "Besitzkehr = Wiederabnahme bei frischer Tat / sofort", "Erforderlichkeit", "§ 860 für Besitzdiener"] },

  { u: "hausrecht", d: 1, q: "Aus welchen zivilrechtlichen Vorschriften wird das Hausrecht hergeleitet?", o: ["Aus Eigentum und Besitz, insbesondere §§ 858 ff., 903, 1004 BGB", ["Aus § 127 StPO", "Das ist die vorläufige Festnahme."], ["Aus der Bewachungsverordnung", "Die BewachV regelt Pflichten des Gewerbes."], ["Aus dem Waffengesetz", "Das hat mit dem Hausrecht nichts zu tun."]], e: "Wer Eigentümer oder berechtigter Besitzer ist, darf bestimmen, wer Räume betritt, und Störungen abwehren.", r: "§§ 858 ff., 903, 1004 BGB" },
  { u: "hausrecht", d: 2, q: "Was kann der Eigentümer nach § 1004 BGB verlangen, wenn sein Eigentum anders als durch Entziehung beeinträchtigt wird?", o: ["Beseitigung der Beeinträchtigung und bei Wiederholungsgefahr Unterlassung", ["Die sofortige Verhaftung des Störers", "Das ist keine zivilrechtliche Rechtsfolge."], ["Eine Geldstrafe", "Strafen gibt es nur im Strafrecht."], ["Die Abschiebung des Störers", "Das ist keine zivilrechtliche Rechtsfolge."]], e: "§ 1004 BGB gibt den Beseitigungs- und Unterlassungsanspruch, z. B. als Grundlage eines Hausverbots.", r: "§ 1004 BGB" },
  { u: "hausrecht", t: "mc", d: 2, q: "Welche zwei Maßnahmen sind vom Hausrecht gedeckt?", o: ["Festlegen von Zutrittsbedingungen in einer Hausordnung", "Aussprechen eines Hausverbots gegenüber einem Störer", ["Erheben eines Bußgeldes bei Verstößen", "Bußgelder sind hoheitliche Sanktionen."], ["Beschlagnahme mitgebrachter Gegenstände", "Beschlagnahme ist eine hoheitliche Maßnahme."]], e: "Das Hausrecht erlaubt, über Zutritt und Verbleib zu entscheiden – nicht aber, zu strafen oder zu beschlagnahmen.", r: "§§ 903, 1004 BGB" },
  { u: "hausrecht", d: 2, f: 1, q: "Ein Gast, gegen den ein Hausverbot besteht, betritt erneut das Einkaufszentrum. Welches zivilrechtliche Recht steht dem Betreiber zu?", o: ["Besitzwehr: Er bzw. die beauftragte Wachperson darf ihn mit erforderlichen Mitteln hinausweisen.", ["Selbsthilfe durch Wegnahme seines Ausweises", "Dafür gibt es keine Grundlage."], ["Ein Recht auf sofortige Geldzahlung", "Ein solcher Anspruch entsteht nicht automatisch."], ["Keines, solange er nichts stiehlt", "Bereits das Betreten ist Besitzstörung."]], e: "Das Betreten gegen den Willen des Berechtigten ist verbotene Eigenmacht und zugleich Hausfriedensbruch.", r: "§§ 858, 859, 860 BGB; § 123 StGB" },
  { u: "hausrecht", t: "tf", d: 1, a: true, q: "Die Wachperson übt das Hausrecht nicht aus eigenem Recht aus, sondern für den Berechtigten.", e: "Sie handelt als Besitzdienerin bzw. aufgrund vertraglicher Übertragung.", r: "§§ 855, 860 BGB; § 34a Abs. 5 GewO" },

  { u: "notwehr", d: 1, q: "Was ist Notwehr nach § 227 BGB?", o: ["Die Verteidigung, die erforderlich ist, um einen gegenwärtigen rechtswidrigen Angriff von sich oder einem anderen abzuwenden", ["Jede Vergeltung für erlittenes Unrecht", "Vergeltung ist keine Verteidigung."], ["Die vorsorgliche Abwehr eines vielleicht morgen drohenden Angriffs", "Der Angriff muss gegenwärtig sein."], ["Die Abwehr einer rechtmäßigen Polizeimaßnahme", "Der Angriff muss rechtswidrig sein."]], e: "§ 227 BGB entspricht § 32 StGB: Eine durch Notwehr gebotene Handlung ist nicht widerrechtlich.", r: "§ 227 BGB" },
  { u: "notwehr", d: 2, q: "Welche zivilrechtliche Folge hat eine durch Notwehr gebotene Handlung?", o: ["Sie ist nicht widerrechtlich; der Verteidiger schuldet dem Angreifer keinen Schadensersatz.", ["Der Verteidiger haftet immer für alle Schäden.", "Ohne Widerrechtlichkeit keine Haftung nach § 823 BGB."], ["Der Angreifer erhält Schmerzensgeld.", "Der Angreifer hat keinen Anspruch."], ["Beide teilen sich den Schaden.", "Eine Schadensteilung findet nicht statt."]], e: "Notwehr ist ein Rechtfertigungsgrund. Bei Überschreitung der Grenzen kann dagegen Haftung entstehen.", r: "§§ 227, 823 BGB" },
  { u: "notwehr", t: "mc", d: 2, q: "Welche zwei Voraussetzungen muss ein Angriff für die Notwehr erfüllen?", o: ["Er muss gegenwärtig sein.", "Er muss rechtswidrig sein.", ["Er muss von einem Erwachsenen ausgehen.", "Auch gegen Angriffe von Kindern oder Schuldunfähigen ist Notwehr möglich, allerdings eingeschränkt."], ["Er muss angekündigt worden sein.", "Eine Ankündigung ist nicht erforderlich."]], e: "Notwehrlage: gegenwärtiger rechtswidriger Angriff auf ein Rechtsgut.", r: "§ 227 BGB; § 32 StGB" },
  { u: "notwehr", d: 2, f: 1, q: "Ein Einbrecher flieht ohne Beute und ist bereits hinter dem Zaun verschwunden. Die Wachperson wirft ihm einen Stein hinterher und trifft ihn. Liegt Notwehr vor?", o: ["Nein, der Angriff ist beendet; es fehlt die Gegenwärtigkeit.", ["Ja, weil der Einbruch rechtswidrig war", "Die Rechtswidrigkeit genügt nicht; der Angriff muss noch andauern."], ["Ja, weil Wachpersonen erweiterte Rechte haben", "Sie haben keine erweiterten Rechte."], ["Ja, wenn der Stein klein war", "Die Größe ändert nichts an der fehlenden Notwehrlage."]], e: "Ist der Angriff abgeschlossen und keine Beute zu sichern, ist jede Gewalt Vergeltung. Die Wachperson haftet nach § 823 BGB und macht sich strafbar.", r: "§ 227 BGB; § 823 BGB" },
  { u: "notwehr", t: "tf", d: 1, a: true, q: "Notwehr zugunsten eines anderen nennt man Nothilfe.", e: "§ 227 BGB und § 32 StGB erfassen den Angriff „von sich oder einem anderen“.", r: "§ 227 BGB" },
  { u: "notwehr", d: 2, q: "Was bedeutet „erforderlich“ bei der Notwehr?", o: ["Der Verteidiger wählt unter mehreren gleich wirksamen Mitteln das mildeste.", ["Er muss immer fliehen, bevor er sich verteidigt.", "Eine generelle Fluchtpflicht besteht nicht."], ["Er darf jedes Mittel einsetzen, das ihm einfällt.", "Erlaubt ist nur das mildeste wirksame Mittel."], ["Er muss zuerst die Polizei um Erlaubnis fragen.", "Das ist bei einem gegenwärtigen Angriff nicht möglich."]], e: "Die Verteidigung muss geeignet sein, den Angriff sofort und sicher zu beenden, und dabei das schonendste Mittel wählen.", r: "§ 227 BGB; § 32 StGB" },

  { u: "notstand", d: 2, q: "Was regelt § 228 BGB (Verteidigungsnotstand)?", o: ["Die Beschädigung oder Zerstörung einer fremden Sache, von der selbst eine Gefahr ausgeht", ["Die Abwehr eines menschlichen Angriffs", "Das ist Notwehr."], ["Die Wegnahme einer Sache zur Sicherung eines Anspruchs", "Das ist Selbsthilfe."], ["Den Zugriff auf eine unbeteiligte Sache", "Das regelt § 904 BGB."]], e: "Defensivnotstand: Die Gefahr geht von der Sache aus, die beschädigt wird. Der Schaden darf nicht außer Verhältnis zur Gefahr stehen.", r: "§ 228 BGB" },
  { u: "notstand", d: 2, q: "Was regelt § 904 BGB (Angriffsnotstand)?", o: ["Die Einwirkung auf eine unbeteiligte fremde Sache, um eine gegenwärtige Gefahr abzuwenden", ["Die Zerstörung der Sache, von der die Gefahr ausgeht", "Das regelt § 228 BGB."], ["Die Abwehr eines Angriffs durch einen Menschen", "Das ist Notwehr."], ["Die Festnahme eines Schuldners", "Das ist Selbsthilfe nach § 229 BGB."]], e: "Aggressivnotstand: Der Eigentümer muss die Einwirkung dulden, wenn der drohende Schaden unverhältnismäßig groß ist. Er kann Schadensersatz verlangen.", r: "§ 904 BGB" },
  { u: "notstand", d: 2, f: 1, q: "Ein frei laufender Hund greift auf dem Werksgelände einen Besucher an. Die Wachperson verletzt den Hund mit einem Stock, um den Angriff zu stoppen. Welche Vorschrift rechtfertigt das zivilrechtlich?", o: ["§ 228 BGB – Verteidigungsnotstand", ["§ 904 BGB – Angriffsnotstand", "Die Gefahr geht hier von der beschädigten „Sache“ selbst aus."], ["§ 229 BGB – Selbsthilfe", "Es geht nicht um die Sicherung eines Anspruchs."], ["§ 859 BGB – Besitzwehr", "Es geht nicht um Besitzschutz."]], e: "Auf Tiere sind die für Sachen geltenden Vorschriften entsprechend anzuwenden (§ 90a BGB). Die Gefahr geht vom Hund aus – also § 228 BGB.", r: "§§ 228, 90a BGB" },
  { u: "notstand", d: 2, f: 1, q: "In einem Büro bricht Feuer aus. Die Wachperson schlägt die Scheibe eines Nachbarbüros ein, um an den Feuerlöscher zu gelangen. Welche Vorschrift ist einschlägig?", o: ["§ 904 BGB – Angriffsnotstand", ["§ 228 BGB – Verteidigungsnotstand", "Von der Scheibe geht keine Gefahr aus."], ["§ 227 BGB – Notwehr", "Es liegt kein menschlicher Angriff vor."], ["§ 229 BGB – Selbsthilfe", "Es wird kein Anspruch gesichert."]], e: "Die Scheibe ist eine unbeteiligte Sache. Der Eigentümer muss den Eingriff dulden, kann aber Ersatz verlangen.", r: "§ 904 BGB" },
  { u: "notstand", t: "mc", d: 3, q: "Welche zwei Aussagen zu § 904 BGB treffen zu?", o: ["Der drohende Schaden muss gegenüber dem Schaden des Eigentümers unverhältnismäßig groß sein.", "Der Eigentümer kann Ersatz des ihm entstehenden Schadens verlangen.", ["Die Gefahr muss von der beschädigten Sache ausgehen.", "Das ist die Voraussetzung des § 228 BGB."], ["Der Eigentümer darf die Einwirkung mit Gewalt verhindern.", "Er ist nicht berechtigt, die Einwirkung zu verbieten."]], e: "Beim Angriffsnotstand wird ein Unbeteiligter in Anspruch genommen – daher strenge Abwägung und Schadensersatz.", r: "§ 904 BGB" },
  { u: "notstand", t: "tf", d: 2, a: false, q: "Wer im Verteidigungsnotstand nach § 228 BGB handelt, schuldet immer Schadensersatz.", e: "Die Handlung ist nicht widerrechtlich. Schadensersatz schuldet nur, wer die Gefahr selbst verschuldet hat (§ 228 Satz 2 BGB).", r: "§ 228 BGB" },
  { u: "notstand", t: "zu", d: 2, q: "Ordne jede Situation der passenden Vorschrift zu.", p: [["Angriff durch einen Menschen wird abgewehrt", "§ 227 BGB"], ["Angreifender Hund wird verletzt", "§ 228 BGB"], ["Fremde Tür wird aufgebrochen, um einen Verletzten zu retten", "§ 904 BGB"], ["Flüchtender Schuldner wird festgehalten, Polizei nicht erreichbar", "§ 229 BGB"]], e: "Entscheidend ist, wovon die Gefahr ausgeht und worauf eingewirkt wird." },
  { u: "notstand", t: "fa", d: 3, q: "Grenze Verteidigungsnotstand (§ 228 BGB) und Angriffsnotstand (§ 904 BGB) voneinander ab.", m: "Beim Verteidigungsnotstand geht die Gefahr von der Sache aus, die beschädigt oder zerstört wird, z. B. von einem angreifenden Hund. Die Handlung ist nicht widerrechtlich, wenn sie zur Abwendung erforderlich ist und der Schaden nicht außer Verhältnis zur Gefahr steht. Beim Angriffsnotstand wird auf eine unbeteiligte fremde Sache eingewirkt, um eine gegenwärtige Gefahr abzuwenden, z. B. Einschlagen einer fremden Scheibe zur Rettung. Der drohende Schaden muss unverhältnismäßig groß sein; der Eigentümer muss dulden, kann aber Schadensersatz verlangen.", c: ["§ 228: Gefahr geht von der Sache aus", "§ 904: unbeteiligte Sache", "unterschiedlicher Abwägungsmaßstab", "Schadensersatz bei § 904"] },

  { u: "selbsthilfe", d: 2, q: "Unter welcher Voraussetzung ist Selbsthilfe nach § 229 BGB zulässig?", o: ["Obrigkeitliche Hilfe ist nicht rechtzeitig zu erlangen, und ohne sofortiges Eingreifen besteht die Gefahr, dass die Verwirklichung des Anspruchs vereitelt oder wesentlich erschwert wird.", ["Immer, wenn jemand einen Anspruch hat", "Der Anspruch allein genügt nicht."], ["Wenn die Polizei zwar erreichbar, aber langsam ist", "Ist Hilfe rechtzeitig zu erlangen, scheidet Selbsthilfe aus."], ["Wenn der Schuldner unhöflich ist", "Das ist keine Voraussetzung."]], e: "Selbsthilfe ist eine eng begrenzte Ausnahme vom Gewaltmonopol und dient nur der vorläufigen Sicherung eines Anspruchs.", r: "§ 229 BGB" },
  { u: "selbsthilfe", t: "mc", d: 2, q: "Welche zwei Maßnahmen nennt § 229 BGB als mögliche Selbsthilfe?", o: ["Wegnahme, Zerstörung oder Beschädigung einer Sache", "Festnahme eines fluchtverdächtigen Verpflichteten", ["Durchsuchung der Wohnung des Verpflichteten", "Das ist nicht genannt und wäre hoheitlich."], ["Verhängung einer Vertragsstrafe", "Das ist keine Selbsthilfemaßnahme."]], e: "Außerdem nennt § 229 BGB die Beseitigung des Widerstands des Verpflichteten gegen eine Handlung, die er zu dulden hat.", r: "§ 229 BGB" },
  { u: "selbsthilfe", d: 3, q: "Was muss nach § 230 BGB geschehen, wenn jemand im Wege der Selbsthilfe festgenommen wurde und nicht wieder freigelassen wird?", o: ["Es ist unverzüglich der persönliche Sicherheitsarrest beim Amtsgericht zu beantragen.", ["Nichts, die Festnahme kann beliebig lange dauern.", "Das wäre Freiheitsberaubung."], ["Die Person ist dem Arbeitgeber zu übergeben.", "Der Arbeitgeber ist dafür nicht zuständig."], ["Es ist eine Kaution festzusetzen.", "Das können Private nicht."]], e: "Die Selbsthilfe darf nicht weiter gehen, als zur Abwendung der Gefahr erforderlich ist; in der Praxis wird die Person unverzüglich der Polizei übergeben.", r: "§ 230 BGB" },
  { u: "selbsthilfe", d: 3, q: "Welche Folge hat es nach § 231 BGB, wenn jemand irrtümlich annimmt, die Voraussetzungen der Selbsthilfe lägen vor?", o: ["Er ist zum Schadensersatz verpflichtet, auch wenn der Irrtum nicht auf Fahrlässigkeit beruht.", ["Er haftet nie, wenn er gutgläubig war.", "§ 231 BGB ordnet eine Haftung ohne Verschulden an."], ["Er wird automatisch freigesprochen.", "§ 231 betrifft die zivilrechtliche Haftung."], ["Der andere muss den Schaden selbst tragen.", "Der Handelnde haftet."]], e: "Wer Selbsthilfe übt, trägt das Irrtumsrisiko vollständig.", r: "§ 231 BGB" },
  { u: "selbsthilfe", d: 2, f: 1, q: "Ein Gast will ein Restaurant verlassen, ohne zu bezahlen. Er nennt keinen Namen und will gehen. Die Polizei ist verständigt, braucht aber einige Minuten. Was darf die beauftragte Wachperson nach § 229 BGB?", o: ["Den Gast bis zum Eintreffen der Polizei festhalten, um die Feststellung seiner Personalien zu ermöglichen", ["Ihm das Geld aus der Tasche nehmen", "Selbsthilfe dient der Sicherung, nicht der eigenmächtigen Befriedigung."], ["Sein Auto als Pfand behalten und ihn laufen lassen", "Milderes Mittel ist die Personalienfeststellung durch die Polizei."], ["Nichts, weil es nur um Geld geht", "Gerade die Sicherung zivilrechtlicher Ansprüche regelt § 229 BGB."]], e: "Der Anspruch auf Zahlung würde vereitelt, wenn der unbekannte Gast verschwindet. Festhalten bis zur Identitätsfeststellung ist zulässig.", r: "§§ 229, 230 BGB" },
  { u: "selbsthilfe", t: "tf", d: 2, a: false, q: "Selbsthilfe nach § 229 BGB erlaubt es, den geschuldeten Geldbetrag eigenmächtig aus der Geldbörse des Schuldners zu nehmen.", e: "Selbsthilfe sichert den Anspruch nur vorläufig. Die Durchsetzung ist Sache der Gerichte.", r: "§§ 229, 230 BGB" },
  { u: "selbsthilfe", t: "tf", d: 1, a: true, q: "Die Selbsthilfe darf nicht weiter gehen, als zur Abwendung der Gefahr erforderlich ist.", e: "So bestimmt es § 230 Abs. 1 BGB.", r: "§ 230 BGB" },
  { u: "selbsthilfe", t: "fa", d: 3, q: "Nenne die Voraussetzungen und Grenzen der Selbsthilfe nach §§ 229, 230 BGB.", m: "Voraussetzungen: Es besteht ein durchsetzbarer Anspruch. Obrigkeitliche Hilfe ist nicht rechtzeitig zu erlangen. Ohne sofortiges Eingreifen besteht die Gefahr, dass die Verwirklichung des Anspruchs vereitelt oder wesentlich erschwert wird. Zulässige Mittel: Wegnahme, Zerstörung oder Beschädigung einer Sache, Festnahme des fluchtverdächtigen Verpflichteten, Beseitigung seines Widerstands. Grenzen: nur so weit wie erforderlich; nach Wegnahme ist der dingliche Arrest, nach Festnahme der persönliche Sicherheitsarrest beim Amtsgericht zu beantragen. Bei Irrtum haftet der Handelnde nach § 231 BGB ohne Verschulden.", c: ["Anspruch", "obrigkeitliche Hilfe nicht rechtzeitig", "Vereitelung/wesentliche Erschwerung", "zulässige Mittel", "Erforderlichkeit, Arrest", "Haftung bei Irrtum"] },

  { u: "haftung", d: 1, q: "Wer ist nach § 823 Abs. 1 BGB zum Schadensersatz verpflichtet?", o: ["Wer vorsätzlich oder fahrlässig Leben, Körper, Gesundheit, Freiheit, Eigentum oder ein sonstiges Recht eines anderen widerrechtlich verletzt", ["Nur wer vorsätzlich handelt", "Auch Fahrlässigkeit genügt."], ["Jeder, in dessen Nähe ein Schaden entsteht", "Erforderlich sind Verletzungshandlung, Widerrechtlichkeit und Verschulden."], ["Nur Unternehmen, keine Privatpersonen", "§ 823 gilt für jedermann."]], e: "§ 823 BGB ist die Grundnorm der unerlaubten Handlung.", r: "§ 823 Abs. 1 BGB" },
  { u: "haftung", d: 2, q: "Was ist Fahrlässigkeit nach § 276 BGB?", o: ["Das Außerachtlassen der im Verkehr erforderlichen Sorgfalt", ["Das bewusste und gewollte Herbeiführen eines Schadens", "Das ist Vorsatz."], ["Jeder Zufall", "Zufall ist kein Verschulden."], ["Das Handeln auf Weisung", "Eine Weisung schließt Fahrlässigkeit nicht aus."]], e: "Fahrlässig handelt, wer die gebotene Sorgfalt nicht beachtet.", r: "§ 276 Abs. 2 BGB" },
  { u: "haftung", d: 2, q: "Ab welchem Alter sind Kinder nach § 828 BGB für Schäden überhaupt verantwortlich?", o: ["Ab Vollendung des siebten Lebensjahres – abhängig von ihrer Einsichtsfähigkeit", ["Ab Geburt", "Unter sieben Jahren besteht keine Verantwortlichkeit."], ["Erst ab 18 Jahren", "Die Deliktsfähigkeit beginnt eingeschränkt früher."], ["Erst ab 21 Jahren", "Das ist keine Grenze des § 828 BGB."]], e: "Wer das siebte Lebensjahr nicht vollendet hat, ist nicht verantwortlich. Bis 18 kommt es auf die Einsicht an; für Unfälle im Straßen- und Bahnverkehr gilt bis zum zehnten Lebensjahr eine Sonderregel.", r: "§ 828 BGB" },
  { u: "haftung", d: 2, f: 1, q: "Eine Wachperson stößt beim Kontrollgang aus Unachtsamkeit eine teure Vase des Kunden um. Welche Vorschrift begründet ihre persönliche Haftung gegenüber dem Kunden dem Grunde nach?", o: ["§ 823 Abs. 1 BGB – fahrlässige Eigentumsverletzung", ["§ 904 BGB", "Es liegt kein Notstand vor."], ["§ 229 BGB", "Es liegt keine Selbsthilfe vor."], ["§ 965 BGB", "Das betrifft den Fund."]], e: "Fahrlässige Eigentumsverletzung führt zur Schadensersatzpflicht. Daneben haftet das Unternehmen aus dem Bewachungsvertrag; im Innenverhältnis gelten arbeitsrechtliche Haftungserleichterungen.", r: "§ 823 Abs. 1 BGB" },
  { u: "haftung", d: 3, q: "Was regelt § 831 BGB?", o: ["Die Haftung des Geschäftsherrn für Schäden, die sein Verrichtungsgehilfe in Ausführung der Verrichtung einem Dritten widerrechtlich zufügt", ["Die Haftung des Tierhalters", "Das regelt § 833 BGB."], ["Die Haftung Minderjähriger", "Das regelt § 828 BGB."], ["Den Finderlohn", "Das regelt § 971 BGB."]], e: "Das Sicherheitsunternehmen haftet für seine Wachpersonen, kann sich aber entlasten, wenn es sie sorgfältig ausgewählt und überwacht hat.", r: "§ 831 BGB" },
  { u: "haftung", d: 2, q: "Wer haftet nach § 833 BGB, wenn ein Diensthund einen Passanten beißt?", o: ["Der Tierhalter", ["Immer nur der Passant selbst", "Der Geschädigte haftet nicht für den eigenen Schaden."], ["Der Hersteller der Leine", "Er ist nicht Tierhalter."], ["Die Polizei", "Sie ist nicht Tierhalter."]], e: "§ 833 BGB begründet die Tierhalterhaftung. Bei Nutztieren, die dem Beruf oder Erwerb dienen, kann sich der Halter entlasten, wenn er die erforderliche Sorgfalt beachtet hat.", r: "§ 833 BGB" },
  { u: "haftung", t: "mc", d: 2, q: "Welche zwei Rechtsgüter nennt § 823 Abs. 1 BGB ausdrücklich?", o: ["Gesundheit", "Eigentum", ["Gewinnchancen", "Reine Vermögensinteressen sind nicht ausdrücklich genannt."], ["Gute Laune", "Das ist kein geschütztes Rechtsgut."]], e: "Genannt sind Leben, Körper, Gesundheit, Freiheit, Eigentum und sonstige Rechte.", r: "§ 823 Abs. 1 BGB" },
  { u: "haftung", t: "mc", d: 3, q: "Welche zwei Aussagen zur Haftung treffen zu?", o: ["Wer in Notwehr handelt, haftet dem Angreifer nicht auf Schadensersatz.", "Wer bei einer vermeintlichen Selbsthilfe irrt, haftet auch ohne Verschulden.", ["Wer fahrlässig handelt, haftet nie.", "Fahrlässigkeit genügt für § 823 BGB."], ["Ein sechsjähriges Kind haftet wie ein Erwachsener.", "Unter sieben Jahren besteht keine Verantwortlichkeit."]], e: "Rechtfertigungsgründe schließen die Widerrechtlichkeit aus; § 231 BGB ist eine Ausnahme mit verschuldensunabhängiger Haftung.", r: "§§ 227, 231, 823, 828 BGB" },
  { u: "haftung", t: "tf", d: 2, a: true, q: "Wer einem anderen widerrechtlich die Freiheit entzieht, kann neben dem materiellen Schaden auch Schmerzensgeld schulden.", e: "§ 253 Abs. 2 BGB gewährt bei Verletzung von Körper, Gesundheit, Freiheit oder sexueller Selbstbestimmung eine billige Entschädigung in Geld.", r: "§§ 823, 253 Abs. 2 BGB" },
  { u: "haftung", t: "tf", d: 2, a: false, q: "Eine Wachperson haftet für eine unberechtigte Festnahme nicht, wenn sie in Dienstkleidung handelt.", e: "Dienstkleidung ändert nichts. Fehlen die Voraussetzungen eines Rechtfertigungsgrundes, kommen Schadensersatz und Strafbarkeit in Betracht.", r: "§ 823 BGB; § 239 StGB" },
  { u: "haftung", d: 2, q: "Was bedeutet Mitverschulden (§ 254 BGB)?", o: ["Hat der Geschädigte den Schaden mitverursacht, wird sein Ersatzanspruch entsprechend gekürzt.", ["Der Geschädigte verliert immer jeden Anspruch.", "Es kommt auf das Maß der Mitverursachung an."], ["Der Schädiger zahlt das Doppelte.", "Das ist nicht die Rechtsfolge."], ["Beide werden bestraft.", "§ 254 BGB regelt keine Strafe."]], e: "Der Umfang des Ersatzes hängt davon ab, inwieweit der Schaden vorwiegend von dem einen oder anderen Teil verursacht wurde.", r: "§ 254 BGB" },
  { u: "haftung", t: "fa", d: 2, q: "Nenne die Voraussetzungen eines Schadensersatzanspruchs nach § 823 Abs. 1 BGB.", m: "Erstens die Verletzung eines geschützten Rechtsguts: Leben, Körper, Gesundheit, Freiheit, Eigentum oder ein sonstiges Recht. Zweitens eine Handlung oder ein pflichtwidriges Unterlassen, das die Verletzung verursacht hat. Drittens Widerrechtlichkeit – sie fehlt bei Rechtfertigungsgründen wie Notwehr. Viertens Verschulden, also Vorsatz oder Fahrlässigkeit, sowie Deliktsfähigkeit. Fünftens ein Schaden, der durch die Verletzung entstanden ist.", c: ["Rechtsgutsverletzung", "Handlung und Ursächlichkeit", "Widerrechtlichkeit", "Verschulden", "Schaden"] },

  { u: "sache", d: 1, q: "Was sind Sachen im Sinne des § 90 BGB?", o: ["Nur körperliche Gegenstände", ["Auch Forderungen und Rechte", "Rechte sind keine körperlichen Gegenstände."], ["Auch Ideen und Erfindungen", "Sie sind nicht körperlich."], ["Auch Menschen", "Menschen sind Rechtssubjekte, keine Sachen."]], e: "Sachen sind körperliche Gegenstände – fest, flüssig oder gasförmig, sofern abgrenzbar.", r: "§ 90 BGB" },
  { u: "sache", d: 2, q: "Wie behandelt das BGB Tiere (§ 90a BGB)?", o: ["Tiere sind keine Sachen; die für Sachen geltenden Vorschriften sind aber entsprechend anzuwenden, soweit nichts anderes bestimmt ist.", ["Tiere sind Sachen wie alle anderen.", "§ 90a BGB stellt klar, dass sie keine Sachen sind."], ["Tiere sind Rechtspersonen.", "Tiere haben keine Rechtsfähigkeit."], ["Für Tiere gilt das BGB gar nicht.", "Die Sachvorschriften gelten entsprechend."]], e: "Deshalb kann man z. B. Eigentum an einem Tier haben und es kann „beschädigt“ werden.", r: "§ 90a BGB" },
  { u: "sache", d: 2, q: "Was muss der Finder einer verlorenen Sache nach § 965 BGB tun?", o: ["Den Fund unverzüglich dem Verlierer, dem Eigentümer oder – wenn er diese nicht kennt – der zuständigen Behörde anzeigen", ["Die Sache behalten", "Das wäre Unterschlagung."], ["Die Sache am Fundort liegen lassen und nichts tun", "Wer die Sache an sich nimmt, hat Finderpflichten."], ["Die Sache verkaufen und den Erlös spenden", "Dazu ist er nicht berechtigt."]], e: "Bei Sachen im Wert bis zehn Euro entfällt die Anzeige an die Behörde. Der Finder muss die Sache außerdem verwahren (§ 966 BGB).", r: "§§ 965, 966 BGB" },
  { u: "sache", d: 3, f: 1, q: "Eine Wachperson findet bei ihrem Kontrollgang im bewachten Kaufhaus eine Geldbörse. Wie ist das rechtlich einzuordnen?", o: ["Sie findet für den Hausrechtsinhaber und gibt die Geldbörse nach der Dienstanweisung beim Auftraggeber bzw. bei dessen Fundstelle ab.", ["Sie ist Finderin und darf die Geldbörse nach sechs Monaten behalten.", "Wer als Besitzdiener im Dienst findet, erwirbt keine eigenen Finderrechte."], ["Sie darf das Bargeld als Finderlohn sofort entnehmen.", "Das wäre eine Straftat."], ["Sie muss die Geldbörse liegen lassen.", "Die Sicherung des Funds gehört zu ihren Aufgaben."]], e: "Im Dienst gefundene Sachen werden für den Auftraggeber in Besitz genommen. Der Fund wird dokumentiert und übergeben.", r: "§§ 855, 965, 978 BGB; Dienstanweisung" },
  { u: "sache", d: 3, q: "Was gilt nach § 978 BGB für Funde in Geschäftsräumen einer öffentlichen Behörde oder in Beförderungsmitteln einer dem öffentlichen Verkehr dienenden Verkehrsanstalt?", o: ["Der Finder hat die Sache unverzüglich an die Behörde oder Verkehrsanstalt bzw. deren Angestellte abzuliefern.", ["Der Finder darf die Sache sofort behalten.", "Es besteht eine Ablieferungspflicht."], ["Der Finder muss die Sache dem nächsten Passanten übergeben.", "Das ist keine zulässige Ablieferung."], ["Der Fund ist nur dem Eigentümer persönlich zu melden.", "Die Sache ist an die Behörde oder Anstalt abzuliefern."]], e: "Für solche Funde gelten Sonderregeln; die allgemeinen Vorschriften der §§ 965 ff. BGB sind nur eingeschränkt anwendbar.", r: "§ 978 BGB" },
  { u: "sache", t: "mc", d: 2, q: "Welche zwei Pflichten hat der Finder nach dem BGB?", o: ["Anzeigepflicht", "Verwahrungspflicht", ["Pflicht, einen Finderlohn zu zahlen", "Finderlohn kann der Finder verlangen, nicht schulden."], ["Pflicht, die Sache zu versichern", "Eine Versicherungspflicht besteht nicht."]], e: "Hinzu kommt die Ablieferungspflicht auf Anordnung der zuständigen Behörde (§ 967 BGB).", r: "§§ 965–967 BGB" },
  { u: "sache", t: "tf", d: 2, a: true, q: "Wer eine gefundene Sache behält, ohne den Fund anzuzeigen, kann sich wegen Unterschlagung strafbar machen.", e: "Die rechtswidrige Zueignung einer fremden Sache ohne Wegnahme ist Unterschlagung (§ 246 StGB).", r: "§ 965 BGB; § 246 StGB" },
  { u: "sache", t: "tf", d: 1, a: false, q: "Elektrischer Strom ist eine Sache im Sinne des § 90 BGB.", e: "Strom ist kein körperlicher Gegenstand. Deshalb gibt es im Strafrecht einen eigenen Tatbestand (§ 248c StGB).", r: "§ 90 BGB" },

  { u: "allg", d: 1, q: "Welche drei Elemente gehören zur Verhältnismäßigkeit?", o: ["Geeignetheit, Erforderlichkeit, Angemessenheit", ["Schnelligkeit, Härte, Abschreckung", "Das sind keine Elemente der Verhältnismäßigkeit."], ["Vorsatz, Fahrlässigkeit, Zufall", "Das sind Verschuldensformen."], ["Besitz, Eigentum, Miete", "Das sind sachenrechtliche Begriffe."]], e: "Jede Rechtsausübung mit Eingriffscharakter muss diese drei Stufen bestehen.", r: "Rahmenplan Sachgebiet 3" },
  { u: "allg", d: 2, q: "Was verbietet das Schikaneverbot (§ 226 BGB)?", o: ["Die Ausübung eines Rechts, wenn sie nur den Zweck haben kann, einem anderen Schaden zuzufügen", ["Jede Ausübung des Hausrechts", "Die sachlich begründete Ausübung bleibt zulässig."], ["Das Stellen einer Rechnung", "Das ist keine Schikane."], ["Die Erstattung einer Strafanzeige", "Eine berechtigte Anzeige ist keine Schikane."]], e: "Rechte dürfen nicht missbraucht werden, um andere zu schädigen.", r: "§ 226 BGB" },
  { u: "allg", d: 2, f: 1, q: "Ein mit Hausrecht betrauter Mitarbeiter verweigert einem Lieferanten immer wieder grundlos den Zutritt, nur um ihn zu ärgern. Gegen welchen Grundsatz verstößt er?", o: ["Gegen das Schikaneverbot", ["Gegen die Datenminimierung", "Die betrifft das Datenschutzrecht."], ["Gegen das Legalitätsprinzip", "Das gilt für Strafverfolgungsbehörden."], ["Gegen die Gewerbefreiheit", "Die betrifft den Zugang zum Gewerbe."]], e: "Die Rechtsausübung dient hier nur der Schädigung. Außerdem handelt er gegen die Interessen des Auftraggebers.", r: "§ 226 BGB" },
  { u: "allg", d: 1, q: "Wann beginnt die Rechtsfähigkeit des Menschen?", o: ["Mit der Vollendung der Geburt", ["Mit 7 Jahren", "Mit 7 beginnt die beschränkte Geschäftsfähigkeit."], ["Mit 14 Jahren", "Mit 14 beginnt die Strafmündigkeit."], ["Mit 18 Jahren", "Mit 18 tritt die Volljährigkeit ein."]], e: "Rechtsfähigkeit ist die Fähigkeit, Träger von Rechten und Pflichten zu sein.", r: "§ 1 BGB" },
  { u: "allg", d: 2, q: "Wer ist nach dem BGB beschränkt geschäftsfähig?", o: ["Minderjährige, die das siebte Lebensjahr vollendet haben", ["Kinder unter sieben Jahren", "Sie sind geschäftsunfähig."], ["Alle Personen über 65", "Das Alter allein beschränkt die Geschäftsfähigkeit nicht."], ["Alle Arbeitnehmer in der Probezeit", "Das hat mit der Geschäftsfähigkeit nichts zu tun."]], e: "Von 7 bis zur Vollendung des 18. Lebensjahres besteht beschränkte Geschäftsfähigkeit (§ 106 BGB).", r: "§§ 104, 106 BGB" },
  { u: "allg", t: "mc", d: 2, q: "Welche zwei Vorschriften sind zivilrechtliche Rechtfertigungsgründe?", o: ["§ 227 BGB (Notwehr)", "§ 904 BGB (Angriffsnotstand)", ["§ 823 BGB (Schadensersatzpflicht)", "Das ist eine Haftungsnorm."], ["§ 242 StGB (Diebstahl)", "Das ist ein Straftatbestand."]], e: "Zivilrechtliche Rechtfertigungsgründe sind §§ 227, 228, 229, 859, 904 BGB.", r: "§§ 227–229, 859, 904 BGB" },
  { u: "allg", t: "mc", d: 2, q: "Welche zwei Aussagen zur Abgrenzung von Zivil- und Strafrecht treffen zu?", o: ["Das Zivilrecht regelt u. a. den Ausgleich von Schäden zwischen Privaten.", "Das Strafrecht regelt den staatlichen Strafanspruch gegen den Täter.", ["Schadensersatz wird vom Staatsanwalt festgesetzt.", "Schadensersatz wird zivilrechtlich geltend gemacht."], ["Eine Tat kann nie zugleich zivil- und strafrechtliche Folgen haben.", "Beides kann nebeneinander eintreten."]], e: "Eine Körperverletzung kann Strafe (StGB) und Schadensersatz (BGB) nach sich ziehen.", r: "§ 823 BGB; § 223 StGB" },
  { u: "allg", t: "tf", d: 2, a: true, q: "Eine Handlung, die nach § 32 StGB durch Notwehr gerechtfertigt ist, ist auch zivilrechtlich nicht widerrechtlich.", e: "Die Rechtsordnung ist einheitlich: Was gerechtfertigt ist, löst keine Haftung nach § 823 BGB aus.", r: "§ 227 BGB; § 32 StGB" },
  { u: "allg", d: 2, q: "Welche Vertragsart ist der Bewachungsvertrag in der Regel?", o: ["Ein Dienstvertrag", ["Ein Kaufvertrag", "Es wird keine Sache übereignet."], ["Ein Mietvertrag", "Es wird keine Sache zum Gebrauch überlassen."], ["Ein Schenkungsvertrag", "Die Leistung erfolgt gegen Vergütung."]], e: "Geschuldet wird die Bewachungstätigkeit, kein bestimmter Erfolg.", r: "§ 611 BGB" },
  { u: "allg", t: "fa", d: 2, q: "Erkläre den Grundsatz der Verhältnismäßigkeit an einem Beispiel aus dem Wachdienst.", m: "Eine Maßnahme muss geeignet, erforderlich und angemessen sein. Beispiel: Ein Besucher weigert sich, das Gebäude trotz Hausverbot zu verlassen. Geeignet ist jede Maßnahme, die ihn zum Gehen bringt. Erforderlich ist das mildeste gleich wirksame Mittel: zuerst nochmalige Aufforderung, dann Begleiten zum Ausgang, erst dann einfache körperliche Einwirkung wie Schieben. Angemessen ist die Maßnahme, wenn der Nachteil für den Besucher nicht außer Verhältnis zum geschützten Hausrecht steht – ein Schlag oder der Einsatz eines Schlagstocks wäre es nicht.", c: ["geeignet", "erforderlich = mildestes Mittel", "angemessen", "abgestuftes Beispiel"] },
  { u: "besitzschutz", t: "mc", d: 2, q: "Welche zwei Aussagen zur Besitzkehr bei beweglichen Sachen sind richtig?", o: ["Sie setzt voraus, dass der Täter auf frischer Tat betroffen oder verfolgt wird.", "Sie erlaubt die Wiederabnahme der Sache mit der erforderlichen Gewalt.", ["Sie ist auch Tage nach der Tat noch zulässig.", "Ohne frische Tat bleibt nur der Rechtsweg."], ["Sie erlaubt, dem Täter zusätzlich eigene Sachen als Pfand abzunehmen.", "Sie betrifft nur die weggenommene Sache."]], e: "§ 859 Abs. 2 BGB.", r: "§ 859 Abs. 2 BGB" },
  { u: "eigbes", t: "mc", d: 2, q: "Welche zwei Befugnisse hat der Eigentümer nach § 903 BGB?", o: ["Mit der Sache nach Belieben verfahren", "Andere von jeder Einwirkung ausschließen", ["Gesetze außer Kraft setzen, die sein Eigentum beschränken", "Das Eigentum besteht nur im Rahmen der Gesetze."], ["Rechte Dritter an der Sache ignorieren", "Rechte Dritter, etwa des Mieters, begrenzen das Eigentum."]], e: "Die Befugnisse bestehen, soweit nicht das Gesetz oder Rechte Dritter entgegenstehen.", r: "§ 903 BGB" },
  { u: "selbsthilfe", t: "mc", d: 3, q: "Welche zwei Voraussetzungen müssen für die Selbsthilfe nach § 229 BGB vorliegen?", o: ["Obrigkeitliche Hilfe ist nicht rechtzeitig zu erlangen.", "Ohne sofortiges Eingreifen droht die Vereitelung oder wesentliche Erschwerung des Anspruchs.", ["Der Verpflichtete muss vorbestraft sein.", "Das ist keine Voraussetzung."], ["Der Anspruch muss mindestens 1.000 Euro betragen.", "Eine Wertgrenze gibt es nicht."]], e: "Beide Voraussetzungen müssen zugleich vorliegen.", r: "§ 229 BGB" },
  { u: "notwehr", t: "mc", d: 2, q: "Welche zwei Aussagen zur Notwehr nach § 227 BGB sind richtig?", o: ["Eine durch Notwehr gebotene Handlung ist nicht widerrechtlich.", "Die Verteidigung muss erforderlich sein.", ["Notwehr ist auch gegen einen längst beendeten Angriff zulässig.", "Der Angriff muss gegenwärtig sein."], ["Notwehr steht nur Eigentümern zu.", "Sie steht jedermann zu."]], e: "§ 227 BGB entspricht inhaltlich § 32 StGB.", r: "§ 227 BGB" },
  { u: "haftung", t: "mc", d: 2, q: "Welche zwei Personen sind nach dem BGB für einen von ihnen verursachten Schaden nicht verantwortlich?", o: ["Ein fünfjähriges Kind", "Eine Person, die im Zustand der Bewusstlosigkeit einen Schaden verursacht", ["Ein 17-Jähriger mit der erforderlichen Einsicht", "Er ist bei vorhandener Einsicht verantwortlich."], ["Ein Erwachsener, der fahrlässig handelt", "Fahrlässigkeit genügt für die Haftung."]], e: "§ 827 BGB (Bewusstlosigkeit, krankhafte Störung) und § 828 Abs. 1 BGB (unter sieben Jahren).", r: "§§ 827, 828 BGB" },
  { u: "sache", t: "mc", d: 2, q: "Welche zwei Gegenstände sind Sachen im Sinne des § 90 BGB?", o: ["Ein Schlüsselbund", "Ein Dienstfahrzeug", ["Eine Geldforderung", "Forderungen sind Rechte, keine körperlichen Gegenstände."], ["Ein Passwort", "Es ist kein körperlicher Gegenstand."]], e: "Sachen sind nur körperliche Gegenstände.", r: "§ 90 BGB" }
]);
