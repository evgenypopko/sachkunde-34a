  "u": "https://recht.nrw.de/lrgv/gesetz/13122025-polizeigesetz-des-landes-nordrhein-westfalen-bekanntmachung-der-neufassung/",
  "h": "recht.nrw.de"
 },
 {
  "k": "§ 3 Abs. 1 PolG NRW",
  "g": "PolG NRW",
  "n": "3",
  "a": null,
  "t": "Ermessen",
  "b": [
   "oso"
  ],
  "w": "(1) Die Polizei trifft ihre Maßnahmen nach pflichtgemäßem Ermessen.",
  "e": "Die Polizei entscheidet nach pflichtgemäßem Ermessen, ob und wie sie eingreift.",
  "u": "https://recht.nrw.de/lrgv/gesetz/13122025-polizeigesetz-des-landes-nordrhein-westfalen-bekanntmachung-der-neufassung/",
  "h": "recht.nrw.de"
 },
 {
  "k": "§ 8 Abs. 1 PolG NRW",
  "g": "PolG NRW",
  "n": "8",
  "a": null,
  "t": "Allgemeine Befugnisse",
  "b": [
   "oso"
  ],
  "w": "(1) Die Polizei kann die notwendigen Maßnahmen treffen, um eine im einzelnen Falle bestehende, konkrete Gefahr für die öffentliche Sicherheit oder Ordnung (Gefahr) abzuwehren, soweit nicht die §§ 9 bis 46 die Befugnisse der Polizei besonders regeln.",
  "e": "Bei einer konkreten Gefahr darf die Polizei die nötigen Maßnahmen treffen.",
  "u": "https://recht.nrw.de/lrgv/gesetz/13122025-polizeigesetz-des-landes-nordrhein-westfalen-bekanntmachung-der-neufassung/",
  "h": "recht.nrw.de"
 },
 {
  "k": "§ 12 Abs. 1 Nr. 1 PolG NRW (Auszug)",
  "g": "PolG NRW",
  "n": "12",
  "a": null,
  "t": "Identitätsfeststellung",
  "b": [
   "oso"
  ],
  "w": "(1) Die Polizei kann die Identität einer Person feststellen, 1. zur Abwehr einer Gefahr,",
  "e": "Die Polizei darf feststellen, wer jemand ist – etwa zur Abwehr einer Gefahr.",
  "u": "https://recht.nrw.de/lrgv/gesetz/13122025-polizeigesetz-des-landes-nordrhein-westfalen-bekanntmachung-der-neufassung/",
  "h": "recht.nrw.de"
 },
 {
  "k": "§ 39 Abs. 1 Nr. 1 und 2 PolG NRW (Auszug)",
  "g": "PolG NRW",
  "n": "39",
  "a": null,
  "t": "Durchsuchung von Personen",
  "b": [
   "oso"
  ],
  "w": "(1) Die Polizei kann außer in den Fällen des § 12 Abs. 2 Satz 4 eine Person durchsuchen, wenn 1. sie nach diesem Gesetz oder anderen Rechtsvorschriften festgehalten werden kann, 2. Tatsachen die Annahme rechtfertigen, dass sie Sachen mit sich führt, die sichergestellt werden dürfen,",
  "e": "Die Polizei darf Personen unter bestimmten Voraussetzungen durchsuchen.",
  "u": "https://recht.nrw.de/lrgv/gesetz/13122025-polizeigesetz-des-landes-nordrhein-westfalen-bekanntmachung-der-neufassung/",
  "h": "recht.nrw.de"
 },
 {
  "k": "§ 43 Nr. 1 und 2 PolG NRW (Auszug)",
  "g": "PolG NRW",
  "n": "43",
  "a": null,
  "t": "Sicherstellung",
  "b": [
   "oso"
  ],
  "w": "Die Polizei kann eine Sache sicherstellen, 1. um eine gegenwärtige Gefahr abzuwehren, 2. um den Eigentümer oder den rechtmäßigen Inhaber der tatsächlichen Gewalt vor Verlust oder Beschädigung einer Sache zu schützen,",
  "e": "Die Polizei darf Sachen sicherstellen, etwa um eine Gefahr abzuwehren.",
  "u": "https://recht.nrw.de/lrgv/gesetz/13122025-polizeigesetz-des-landes-nordrhein-westfalen-bekanntmachung-der-neufassung/",
  "h": "recht.nrw.de"
 },
 {
  "k": "§ 1 Abs. 1 OBG NRW",
  "g": "OBG NRW",
  "n": "1",
  "a": null,
  "t": "Aufgaben der Ordnungsbehörden",
  "b": [
   "oso"
  ],
  "w": "(1) Die Ordnungsbehörden haben die Aufgabe, Gefahren für die öffentliche Sicherheit oder Ordnung abzuwehren (Gefahrenabwehr).",
  "e": "Auch die Ordnungsbehörden wehren Gefahren für die öffentliche Sicherheit oder Ordnung ab.",
  "u": "https://recht.nrw.de/lrgv/gesetz/01072026-ordnungsbehoerdengesetz-obg/",
  "h": "recht.nrw.de"
 },
 {
  "k": "§ 14 Abs. 1 OBG NRW",
  "g": "OBG NRW",
  "n": "14",
  "a": null,
  "t": "Voraussetzungen des Eingreifens",
  "b": [
   "oso"
  ],
  "w": "(1) Die Ordnungsbehörden können die notwendigen Maßnahmen treffen, um eine im einzelnen Falle bestehende Gefahr für die öffentliche Sicherheit oder Ordnung (Gefahr) abzuwehren.",
  "e": "Bei einer Gefahr dürfen die Ordnungsbehörden die nötigen Maßnahmen treffen.",
  "u": "https://recht.nrw.de/lrgv/gesetz/01072026-ordnungsbehoerdengesetz-obg/",
  "h": "recht.nrw.de"
 },
 {
  "k": "§ 1 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "1",
  "a": null,
  "t": "Geltungsbereich",
  "b": [
   "uvv"
  ],
  "w": "Diese Unfallverhütungsvorschrift gilt für Wach- und Sicherungstätigkeiten zum Schutze von Personen und Sachwerten.",
  "e": "Die Vorschrift gilt für alle Wach- und Sicherungstätigkeiten zum Schutz von Personen und Sachen.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 3 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "3",
  "a": null,
  "t": "Eignung",
  "b": [
   "uvv"
  ],
  "w": "Der Unternehmer hat dafür zu sorgen, dass Wach- und Sicherungstätigkeiten nur von Versicherten ausgeführt werden, die die erforderlichen Befähigungen besitzen. Die Versicherten dürfen für diese Tätigkeiten nicht offensichtlich ungeeignet sein. Über die Befähigungen sind Aufzeichnungen zu führen.",
  "e": "Eingesetzt werden darf nur, wer befähigt und nicht offensichtlich ungeeignet ist.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 4 Abs. 1 und 2 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "4",
  "a": "1",
  "t": "Dienstanweisungen",
  "b": [
   "uvv"
  ],
  "w": "(1) Der Unternehmer hat das Verhalten des Wach- und Sicherungspersonals einschließlich des Weitermeldens von Mängeln und besonderen Gefahren durch Dienstanweisungen zu regeln. (2) Der Unternehmer hat dafür zu sorgen, dass das Wach- und Sicherungspersonal anhand der Dienstanweisungen vor Aufnahme der Tätigkeit und darüber hinaus regelmäßig unterwiesen wird. Außerdem ist das sicherheitsgerechte Verhalten bei besonderen Gefahren soweit wie möglich zu üben.",
  "e": "Der Unternehmer regelt den Dienst durch Dienstanweisungen und unterweist danach – vor Beginn und regelmäßig.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 4 Abs. 3 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "4",
  "a": "3",
  "t": "Pflichten der Versicherten",
  "b": [
   "uvv"
  ],
  "w": "(3) Die Versicherten haben die der Arbeitssicherheit dienenden Maßnahmen zu unterstützen und die Dienstanweisungen zu befolgen. Sie dürfen keine Weisungen des Auftraggebers befolgen, die dem Sicherungsauftrag entgegenstehen.",
  "e": "Dienstanweisungen befolgen – aber keine Wünsche des Kunden, die dem Sicherungsauftrag widersprechen.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 5 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "5",
  "a": null,
  "t": "Verbot berauschender Mittel",
  "b": [
   "uvv"
  ],
  "w": "Der Genuss von alkoholischen Getränken und die Einnahme anderer berauschender Mittel sind während der Dienstzeit verboten. Dies gilt auch für einen angemessenen Zeitraum vor dem Einsatz. Bei Dienstantritt muss Nüchternheit gegeben sein.",
  "e": "Kein Alkohol und keine Drogen im Dienst und in der Zeit davor. Zum Dienst kommt man nüchtern.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 6 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "6",
  "a": null,
  "t": "Übernahme von Wach- und Sicherungsaufgaben",
  "b": [
   "uvv"
  ],
  "w": "(1) Der Unternehmer darf Wach- und Sicherungsaufgaben nur übernehmen, wenn vermeidbare Gefahrstellen im jeweiligen Objektbereich beseitigt oder ausreichend abgesichert werden. (2) Sicherungsumfang und -ablauf einschließlich vorgesehener Nebentätigkeiten müssen schriftlich festgelegt werden.",
  "e": "Ein Auftrag wird nur übernommen, wenn Gefahrstellen beseitigt oder gesichert sind; Umfang und Ablauf werden schriftlich festgelegt.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 7 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "7",
  "a": null,
  "t": "Sicherungstätigkeiten mit besonderen Gefahren",
  "b": [
   "uvv"
  ],
  "w": "Der Unternehmer hat sicherzustellen, dass das Wach- und Sicherungspersonal überwacht wird, wenn sich bei Sicherungstätigkeiten besondere Gefahren ergeben können.",
  "e": "Bei besonderen Gefahren wird das Personal überwacht.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 8 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "8",
  "a": null,
  "t": "Überprüfung von zu sichernden Objekten",
  "b": [
   "uvv"
  ],
  "w": "(1) Der Unternehmer hat unabhängig von den Pflichten des Auftraggebers sicherzustellen, dass die zu sichernden Objekte auf Gefahren geprüft werden. Über diese Prüfungen sind Aufzeichnungen zu führen. Die Prüfungen haben regelmäßig, bei besonderem Anlass unverzüglich zu erfolgen. (2) Der Unternehmer hat vom Auftraggeber zu verlangen, dass vermeidbare Gefahren beseitigt oder Gefahrstellen abgesichert werden. Bis zum Abschluss dieser Sicherungsmaßnahmen hat der Unternehmer Regelungen zu treffen, die die Sicherheit des Wach- und Sicherungspersonals auf andere Weise gewährleisten. (3) Die Versicherten haben festgestellte Gefahren und die dagegen getroffenen Maßnahmen dem Unternehmer zu melden.",
  "e": "Objekte werden regelmäßig auf Gefahren geprüft. Wer eine Gefahr entdeckt, meldet sie dem Unternehmer.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 9 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "9",
  "a": null,
  "t": "Objekteinweisung",
  "b": [
   "uvv"
  ],
  "w": "(1) Der Unternehmer hat dafür zu sorgen, dass das Wach- und Sicherungspersonal in das jeweilige zu sichernde Objekt und in die spezifischen Gefahren eingewiesen wird. (2) Die Einweisungen sind zu den Zeiten vorzunehmen, zu denen die Tätigkeit des Wach- und Sicherungspersonals ausgeübt wird. (3) Der Unternehmer hat dafür zu sorgen, dass für alle Objekte und Objektbereiche, in denen Hunde eingesetzt sind, das Wach- und Sicherungspersonal über das Verhalten bei der Begegnung mit diesen Hunden unterwiesen wird.",
  "e": "Vor dem Einsatz wird man ins Objekt und seine Gefahren eingewiesen – zu den Zeiten, zu denen man dort arbeitet.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 10 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "10",
  "a": null,
  "t": "Ausrüstung",
  "b": [
   "uvv"
  ],
  "w": "(1) Der Unternehmer hat dafür zu sorgen, dass sich die für das Wach- und Sicherungspersonal erforderlichen Einrichtungen, Ausrüstungen und Hilfsmittel in ordnungsgemäßem Zustand befinden und dass das Wach- und Sicherungspersonal in deren Handhabungen unterwiesen ist. (2) Anlegbare Ausrüstungen und Hilfsmittel müssen so beschaffen und angelegt sein, dass die Bewegungsfreiheit, insbesondere die der Hände, nicht mehr als nach den Umständen unvermeidbar beeinträchtigt wird. (3) Der Unternehmer hat dafür zu sorgen, dass der jeweiligen Wach- und Sicherungsaufgabe entsprechendes Schuhwerk von den Versicherten getragen wird. (4) Der Unternehmer hat dafür zu sorgen, dass bei Dunkelheit eingesetztes Wach- und Sicherungspersonal mit leistungsfähigen Handleuchten ausgerüstet ist. (5) Die Versicherten haben die zur Verfügung gestellten Ausrüstungen und Hilfsmittel bestimmungsgemäß zu benutzen.",
  "e": "Ausrüstung muss in Ordnung sein und die Hände frei lassen. Bei Dunkelheit gibt es Handleuchten.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 11 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "11",
  "a": null,
  "t": "Brillenträger",
  "b": [
   "uvv"
  ],
  "w": "Versicherte, die bei Wach- und Sicherungsaufgaben zur Korrektur ihres Sehvermögens eine Brille tragen müssen, haben diese gegen Verlieren zu sichern oder eine Ersatzbrille mitzuführen.",
  "e": "Brillenträger sichern die Brille oder haben eine Ersatzbrille dabei.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 12 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "12",
  "a": null,
  "t": "Hunde",
  "b": [
   "uvv"
  ],
  "w": "(1) Als Diensthunde dürfen nur geprüfte Hunde mit Hundeführern eingesetzt werden. Hunde, die für die Aufgabe nicht geeignet sind, die zur Bösartigkeit neigen oder deren Leistungsstand nicht mehr gegeben ist und die dadurch Personen gefährden können, dürfen nicht eingesetzt werden. (2) Abweichend von Absatz 1 dürfen auch ungeprüfte Hunde zu Wahrnehmungs- und Meldeaufgaben eingesetzt werden, wenn hierbei der Führer seinen Hund unter Kontrolle hat. (3) Eine Überforderung der Hunde durch Ausbildung und Einsatz ist zu vermeiden.",
  "e": "Als Diensthunde nur geprüfte, geeignete Hunde mit Hundeführer.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 13 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "13",
  "a": null,
  "t": "Hundezwinger",
  "b": [
   "uvv"
  ],
  "w": "(1) Werden Hunde in Zwingern oder Zwingeranlagen gehalten, hat der Unternehmer dafür zu sorgen, dass die Zwinger so beschaffen und ausgestattet sind, dass eine Einzelhaltung aller Hunde ermöglicht wird. (2) Der Unternehmer hat dafür zu sorgen, dass an den Zwingern auf das Zutrittsverbot durch das Verbotszeichen „Zutritt für Unbefugte verboten“ hingewiesen ist. (3) Belegte Zwinger dürfen nur von Hundeführern oder vom Unternehmer beauftragten Personen, die mit dem jeweiligen Hund vertraut sind, betreten werden. (4) Belegte Zwinger müssen abgeschlossen sein, sofern ein Entweichen des Hundes oder der Zutritt Unbefugter nicht auf andere Weise verhindert ist. (5) Die Säuberung und Instandhaltung von Zwingern darf nur dann durchgeführt werden, wenn diese nicht durch Hunde belegt sind.",
  "e": "Zwinger: Einzelhaltung, Zutrittsverbot für Unbefugte, belegt abgeschlossen.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 15 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "15",
  "a": null,
  "t": "Hundeführer",
  "b": [
   "uvv"
  ],
  "w": "(1) Als Hundeführer dürfen nur Versicherte eingesetzt werden, die entsprechend unterwiesen worden sind und dem Unternehmer ihre Befähigung nachgewiesen haben. (2) Der Unternehmer hat dafür zu sorgen, dass ihm die Befähigung zum Hundeführer regelmäßig nachgewiesen wird. Bei nicht mehr ausreichender Befähigung ist die Befugnis zum Führen von Hunden zu entziehen.",
  "e": "Hundeführer müssen unterwiesen sein und ihre Befähigung regelmäßig nachweisen.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 16 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "16",
  "a": null,
  "t": "Hundeführung",
  "b": [
   "uvv"
  ],
  "w": "(1) Die Übernahme und Abgabe des Hundes einschließlich des An- und Ableinens müssen im Zwinger bei geschlossener Tür vorgenommen werden. Bei zulässiger Anbindehaltung kann die Übernahme und Abgabe auch an den entsprechenden Einrichtungen erfolgen. Eine Übergabe von Person zu Person ist nicht erlaubt. (2) Vor jeder Kontaktaufnahme mit einem Hund haben sich die vom Unternehmer hierzu beauftragten Versicherten in geeigneter Weise davon zu überzeugen, dass der Hund folgsam und nicht aggressiv ist. Andernfalls ist der Direktkontakt zu unterlassen und der Hund nicht einzusetzen. (3) Werden Hunde mit verschiedenen Hundeführern eingesetzt, so ist eine einheitliche Kommandosprache festzulegen und anzuwenden. (4) Die Befestigung der Führleine am Körper des Hundeführers sowie am Fahrrad oder Moped ist untersagt. (5) Eine Hundeführung ohne Führleine darf nur in Objektbereichen erfolgen, in denen eine Begegnung mit Dritten nicht zu erwarten ist. (6) Bei einer Begegnung mit Dritten ist der angeleinte Hund fest an der kurzen Leine so zu führen, dass er Dritte nicht erreichen kann.",
  "e": "Hunde werden im Zwinger übernommen, nie von Hand zu Hand. Leine nicht am Körper befestigen; bei Begegnungen kurze Leine.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 18 Abs. 1 und 2 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "18",
  "a": null,
  "t": "Ausrüstung mit Schusswaffen",
  "b": [
   "uvv"
  ],
  "w": "(1) Der Unternehmer hat unter Beachtung der waffenrechtlichen Bestimmungen sicherzustellen, dass eine Ausrüstung des Wach- und Sicherungspersonals mit Schusswaffen nur dann erfolgt, wenn er dies ausdrücklich anordnet. Es dürfen nur Versicherte mit Schusswaffen ausgerüstet werden, die nach dem Waffenrecht zuverlässig, geeignet und sachkundig sowie an den Waffen ausgebildet sind. (2) Der Unternehmer hat sicherzustellen, dass Versicherte, die Träger von Schusswaffen nach Absatz 1 sind, regelmäßig an Schießübungen teilnehmen und ihre Schießfertigkeit sowie Sachkunde nach dem Waffenrecht ihm oder einem Sachkundigen nachweisen.",
  "e": "Schusswaffen nur auf ausdrückliche Anordnung und nur für zuverlässige, sachkundige, ausgebildete Personen mit regelmäßigem Schießtraining.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 19 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "19",
  "a": null,
  "t": "Schusswaffen",
  "b": [
   "uvv"
  ],
  "w": "(1) Es dürfen nur Schusswaffen bereitgehalten und geführt werden, die amtlich geprüft sind und ein in der Bundesrepublik Deutschland anerkanntes Beschusszeichen tragen. (2) Der Unternehmer hat dafür zu sorgen, dass Schusswaffen bei Verdacht auf Mängel, mindestens jedoch einmal jährlich durch Sachkundige hinsichtlich ihrer Handhabungssicherheit geprüft werden. (3) Der Unternehmer hat dafür zu sorgen, dass die Instandsetzung von Schusswaffen nur durch Inhaber einer Erlaubnis nach § 7 oder § 41 Waffengesetz erfolgt. (4) Das Bereithalten und Führen von Schreck- oder Gas-Schusswaffen ist bei der Durchführung von Wach- und Sicherungsaufgaben unzulässig.",
  "e": "Nur amtlich geprüfte Schusswaffen, jährlich kontrolliert. Schreckschuss- und Gaswaffen sind im Wachdienst unzulässig.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 20 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "20",
  "a": null,
  "t": "Führen von Schusswaffen",
  "b": [
   "uvv"
  ],
  "w": "(1) Schusswaffen müssen in geeigneten Trageeinrichtungen geführt werden. Das Abgleiten oder Herausfallen der Waffe muss durch eine Sicherung verhindert sein. (2) Munition darf nicht lose mitgeführt werden. (3) Außer bei drohender Gefahr darf sich keine Patrone vor dem Lauf befinden. Dies gilt nicht, wenn durch konstruktive Maßnahmen sichergestellt ist, dass sich bei entspanntem Hahn kein Schuss lösen kann. (4) Geführte Schusswaffen mit einer äußeren Sicherungseinrichtung sind, ausgenommen bei ihrem Einsatz, zu sichern. (5) Von den Bestimmungen der Absätze 3 und 4 darf für Bereiche abgewichen werden, in denen entsprechende behördliche oder militärische Sonderregelungen bestehen.",
  "e": "Schusswaffen im gesicherten Holster tragen, Munition nicht lose, grundsätzlich keine Patrone vor dem Lauf.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 21 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "21",
  "a": null,
  "t": "Übergabe von Schusswaffen",
  "b": [
   "uvv"
  ],
  "w": "(1) Schusswaffen dürfen nur in entladenem Zustand übergeben werden. (2) Der Übernehmende hat sich sofort vom Ladezustand der Waffe zu überzeugen und diese auf augenfällige Mängel zu kontrollieren. (3) Bei Feststellung von Mängeln darf die Waffe nicht geführt werden. Vor einer Wiederverwendung ist sie einer sachkundigen Instandsetzung zuzuleiten. (4) Beim Laden und Entladen von Schusswaffen müssen diese an sicherem Ort auf eine geeignete Kugelfangeinrichtung gerichtet sein. Jegliches Hantieren mit der Waffe hat hierbei so zu erfolgen, dass keine Versicherten durch einen sich lösenden Schuss verletzt werden können.",
  "e": "Waffen nur entladen übergeben; der Übernehmende prüft sofort Ladezustand und Mängel.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 22 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "22",
  "a": null,
  "t": "Aufbewahrung von Schusswaffen und Munition",
  "b": [
   "uvv"
  ],
  "w": "(1) Der Unternehmer hat dafür zu sorgen, dass für die Aufbewahrung von Schusswaffen und Munition zumindest Stahlblechschränke mit Sicherheitsschloss oder entsprechend sichere Einrichtungen vorhanden sind, die eine getrennte Unterbringung von Waffen und Munition ermöglichen und Schutz gegen Abhandenkommen oder unbefugten Zugriff gewährleisten. (2) Die Aufbewahrung von Schusswaffen und Munition muss in verschlossenen Einrichtungen nach Absatz 1 erfolgen. Schusswaffen dürfen nur im entladenen Zustand aufbewahrt werden.",
  "e": "Waffen entladen und getrennt von der Munition in verschlossenen Stahlschränken aufbewahren.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 24 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "24",
  "a": null,
  "t": "Eignung für Geldtransporte",
  "b": [
   "uvv"
  ],
  "w": "Der Unternehmer darf für Geldtransporte nur Personen einsetzen, die mindestens 18 Jahre alt, persönlich zuverlässig und geeignet sowie für diese Aufgabe besonders ausgebildet und eingewiesen sind.",
  "e": "Geldtransporte nur mit Personen ab 18, die zuverlässig, geeignet und besonders ausgebildet sind.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 25 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "25",
  "a": null,
  "t": "Geldtransporte durch Boten",
  "b": [
   "uvv"
  ],
  "w": "(1) Der Unternehmer hat dafür zu sorgen, dass Geldtransporte durch Boten in öffentlich zugänglichen Bereichen von mindestens zwei Personen durchgeführt werden, von denen eine Person die Sicherung übernimmt. Dies gilt auch für entsprechende Wegstrecken zwischen Transportfahrzeugen und Übergabe- oder Übernahmestellen. (2) Von Absatz 1 darf nur abgewichen werden, wenn – das Geld unauffällig in der bürgerlichen Kleidung getragen wird, – der Transport nicht als Geldtransport erkennbar ist, – der Anreiz zu Überfällen durch technische Ausrüstungen, die für Außenstehende deutlich erkennbar sind, nachhaltig verringert wird oder – ausschließlich Hartgeld transportiert wird und dies auch für Außenstehende durch Transportverlauf und Transportabwicklung erkennbar ist. (3) Zum Tragen bestimmte Geldtransportbehältnisse müssen ausreichend handhabbar sein. Sie dürfen mit Boten nicht fest verbunden sein.",
  "e": "Geldboten gehen in öffentlichen Bereichen mindestens zu zweit; einer sichert. Behälter nie am Körper festmachen.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 26 Abs. 5 und 6 DGUV Vorschrift 23",
  "g": "DGUV Vorschrift 23",
  "n": "26",
  "a": null,
  "t": "Geldtransporte mit Fahrzeugen",
  "b": [
   "uvv"
  ],
  "w": "(5) Geldtransportfahrzeuge müssen während des Be- und Entladens in öffentlich zugänglichen Bereichen ständig besetzt bleiben. Hierbei müssen die Türen des mit mindestens einer Person besetzten Fahrzeugteils verriegelt sein. (6) Überfälle sind unverzüglich über Funk zu melden. Akustisch-optisch wirkende Fahrzeug-Alarmanlagen sind jedoch nur den jeweiligen Umständen entsprechend zu betätigen, sofern hierdurch keine zusätzliche Gefährdung zu erwarten ist.",
  "e": "Beim Be- und Entladen bleibt das Fahrzeug besetzt und verriegelt. Überfälle sofort per Funk melden.",
  "u": "https://publikationen.dguv.de/regelwerk/dguv-vorschriften/",
  "h": "DGUV Vorschrift 23, Fassung vom 1. Januar 1997"
 },
 {
  "k": "§ 2 Abs. 1 DGUV Vorschrift 1",
  "g": "DGUV Vorschrift 1",
  "n": "2",
  "a": null,
  "t": "Grundpflichten des Unternehmers",
  "b": [
   "uvv"
  ],
  "w": "(1) Der Unternehmer hat die erforderlichen Maßnahmen zur Verhütung von Arbeitsunfällen, Berufskrankheiten und arbeitsbedingten Gesundheitsgefahren sowie für eine wirksame Erste Hilfe zu treffen. Die zu treffenden Maßnahmen sind insbesondere in staatlichen Arbeitsschutzvorschriften (Anlage 1), dieser Unfallverhütungsvorschrift und in weiteren Unfallverhütungsvorschriften näher bestimmt. Die in staatlichem Recht bestimmten Maßnahmen gelten auch zum Schutz von Versicherten, die keine Beschäftigten sind.",
  "e": "Der Unternehmer muss Unfälle und Gesundheitsgefahren verhüten und für wirksame Erste Hilfe sorgen.",
  "u": "https://vorschriften.bgn-branchenwissen.de/daten/dguv/1/2.htm",

  /* ================= Gesetze verständlich ================= */
  // Zerlegt eine Fundstellenangabe ("§§ 859 Abs. 2, 860") in Paragrafen mit Absatz- und Nummernangaben.

        else if (m[1] === "Nr.") cur.nr = (cur.nr || []).concat(list);
      } else if (m[5]) {
        for (var k = +m[5]; k <= +m[6] && k - m[5] < 60; k++) items.push(cur = { n: String(k) });

        if (!c.res) o += '<div class="selfrate"><p><b>Wie war deine Antwort?</b> Diese Selbsteinschätzung ist keine IHK-Bewertung.</p><div class="actions"><button class="btn btn-ok" data-a="rate" data-arg="ok">' + icon("check") + 'richtig</button><button class="btn" data-a="rate" data-arg="partial">teilweise richtig</button><button class="btn" data-a="rate" data-arg="unsure">' + icon("q") + 'unsicher</button><button class="btn btn-bad" data-a="rate" data-arg="wrong">' + icon("repeat") + "wiederholen</button></div></div>";

    } else if (c.res) {
      if (c.res === "ok") o += '<button class="btn" data-a="unsure">' + icon("q") + "Als unsicher markieren</button>";

      o += '<button class="btn btn-primary btn-lg" data-a="next" id="nextbtn">' + (SESS.i + 1 >= SESS.ids.length ? "Runde abschließen" : "Nächste Frage") + icon("arrow") + "</button>";
    }

  }
  function canCheck(q, c) {
    if (q.t === "zu") return c.pick.every(function (p) { return p !== ""; });

  }
  function gradeCur() {
    var q = QBY[SESS.cur.id], c = SESS.cur, ok;

    var nb = $("#nextbtn"); if (nb) nb.focus();
  }
  function ttsSay(part) {
    var q = SESS && SESS.cur ? QBY[SESS.cur.id] : null, c = SESS && SESS.cur; if (!q) return;
    var qt = q.question, ot = "", et = "";

  }
  function sessionDone() {

  /* ================= Fragenkatalog ================= */
  var CAT = { text: "", area: "", type: "", st: "", page: 0 };

  }

  function viewFragen() {

    o += sel("area", [["", "Alle Sachgebiete"]].concat(SK.areaOrder.map(function (id) { return [id, SK.areas[id].part + " · " + SK.areas[id].short]; })), "Sachgebiet");
    o += sel("type", [["", "Alle Typen"]].concat(Object.keys(TYPE_L).map(function (t) { return [t, TYPE_L[t]]; })), "Fragetyp");
    o += sel("st", [["", "Jeder Status"], ["neu", "neu"], ["heute wiederholen", "heute wiederholen"], ["morgen wiederholen", "morgen wiederholen"], ["unsicher", "unsicher"], ["Problemfrage", "Problemfrage"], ["sicher", "sicher"], ["fav", "Favoriten"]], "Status");

  /* ================= Prüfungssimulation ================= */
  var EX_NOTE = "Diese Prüfungssimulation ist selbst erstellt und keine echte IHK-Prüfung. Sie orientiert sich an öffentlich verfügbaren Informationen zum aktuellen Prüfungsformat. Die tatsächliche Auswahl und Gewichtung der IHK kann abweichen.";
  var EXV = { timer: 0, result: null, confirm: false };
  function buildExam(short) {
    var cfg = SK.examConfig, ids = [], f = short ? cfg.shortExam.factor : 1;
    SK.areaOrder.forEach(function (aid) {
      var d = cfg.distribution[aid]; if (!d) return;
      var nq = Math.max(1, Math.round(d.q * f)), dbl = Math.min(nq, Math.round((d.pts - d.q) * f)), sgl = nq - dbl;
      var mc = shuffle(SK.questions.filter(function (q) { return q.area === aid && q.t === "mc" && q.correctAnswers.length === 2; }));
      var sc = shuffle(SK.questions.filter(function (q) { return q.area === aid && q.t === "sc"; }));
      var pick = mc.slice(0, dbl); sgl += dbl - pick.length;
      var pick2 = sc.slice(0, sgl), rest = sgl - pick2.length;
      if (rest > 0) pick2 = pick2.concat(mc.slice(dbl, dbl + rest));
      ids = ids.concat(shuffle(pick.concat(pick2)).map(function (q) { return q.id; }));
    });
    var perm = {}, max = 0;
    ids.forEach(function (id) { perm[id] = shuffle(range(QBY[id].options.length)); max += QBY[id].correctAnswers.length * cfg.pointsPerCorrectAnswer; });
    var dur = short ? cfg.shortExam.durationMinutes : cfg.durationMinutes;
    S.exam = { ids: ids, perm: perm, ans: {}, flag: {}, i: 0, start: Date.now(), end: Date.now() + dur * 60000, short: !!short, max: max };
    save();
  }
  function scoreQ(q, sel) {
    var p = 0; (sel || []).forEach(function (x) { if (q.correctAnswers.indexOf(x) >= 0) p += SK.examConfig.pointsPerCorrectAnswer; else p -= SK.examConfig.wrongAnswerPenalty; });
    return Math.max(0, p);
  }
  function submitExam() {
    var e = S.exam; if (!e) return;
    clearInterval(EXV.timer);
    var pts = 0, by = {}, wrong = [];
    e.ids.forEach(function (id) {
      var q = QBY[id], sel = e.ans[id] || [], p = scoreQ(q, sel), m = q.correctAnswers.length * SK.examConfig.pointsPerCorrectAnswer;
      pts += p; var b = by[q.area] || (by[q.area] = { pts: 0, max: 0 }); b.pts += p; b.max += m;
      var full = p === m && sel.length === q.correctAnswers.length;
      if (!full) wrong.push(id);
      if (sel.length) record(id, full ? "ok" : "wrong", "exam");
    });
    var pass = e.short ? pts >= e.max / 2 : pts >= SK.examConfig.passPoints;
    var res = { ts: Date.now(), pts: pts, max: e.max, pct: pct(pts, e.max), pass: pass, short: e.short, dur: Math.round((Math.min(Date.now(), e.end) - e.start) / 1000), by: by, wrong: wrong, ans: e.ans, ids: e.ids };
    S.exams.push({ ts: res.ts, pts: pts, max: e.max, pct: res.pct, pass: pass, short: e.short, dur: res.dur, by: by, wrong: wrong });
    S.exam = null; save(); EXV.result = res; EXV.confirm = false; render();
  }
  function examTick() {

    var left = (e.end - Date.now()) / 1000;

    if (el) { el.textContent = fmtClock(left); el.parentNode.classList.toggle("low", left < 600); }
  }
  function viewPruefung() {
    var cfg = SK.examConfig;

    var o = head("Prüfungssimulation", "Prüfung simulieren", "Getrennt vom Lernmodus: keine Lösungen während der Bearbeitung, Ergebnis erst nach Abgabe oder Zeitablauf.");
    o += '<div class="note note-warn">' + icon("warn") + "<div>" + EX_NOTE + "</div></div>";
    o += '<div class="grid g2"><section class="card"><h3>Vollständige Simulation</h3><dl class="kv"><dt>Fragen</dt><dd>' + cfg.questionCount + "</dd><dt>Zeit</dt><dd>" + cfg.durationMinutes + " Minuten</dd><dt>Höchstpunktzahl</dt><dd>" + cfg.maxPoints + " Punkte</dd><dt>Bestanden ab</dt><dd>" + cfg.passPoints + ' Punkten (50 %)</dd></dl><button class="btn btn-primary btn-lg" data-a="ex-start">' + icon("exam") + "Simulation starten</button></section>";
    o += '<section class="card"><h3>Kurztest</h3><dl class="kv"><dt>Fragen</dt><dd>etwa ' + Math.round(cfg.questionCount * cfg.shortExam.factor) + "</dd><dt>Zeit</dt><dd>" + cfg.shortExam.durationMinutes + ' Minuten</dd><dt>Bestanden ab</dt><dd>50 % der Punkte</dd><dt>Hinweis</dt><dd>zählt nicht für die Prüfungsreife</dd></dl><button class="btn btn-lg" data-a="ex-start" data-arg="short">Kurztest starten</button></section></div>';
    o += '<section class="card"><h3>So wird gewertet</h3><ul class="bul"><li>Aufgaben mit einer richtigen Antwort: ein Kreuz, 1 Punkt.</li><li>Aufgaben mit zwei richtigen Antworten: höchstens zwei Kreuze, je richtigem Kreuz 1 Punkt (Teilpunkte).</li><li>Falsche Kreuze bringen keinen Punkt und führen zu keinem Abzug.</li></ul><p class="muted">Fragenanzahl, Punkte, Dauer und Bestehensgrenze: ' + h(cfg.sourceStatus) + ". Verteilung auf die Sachgebiete: " + h(cfg.distributionStatus) + '. Die Detailregeln der IHK-Auswertung sind nicht vollständig veröffentlicht; diese Simulation ist deshalb eine vereinfachte Lernsimulation. <a href="#/quellen">Mehr dazu</a></p></section>';
    if (S.exams.length) { o += '<section class="card"><h3>Bisherige Ergebnisse</h3><ul class="rows">'; S.exams.slice().reverse().slice(0, 8).forEach(function (e) { o += "<li><span>" + fmtDateTime(e.ts) + (e.short ? " · Kurztest" : "") + '</span><span class="num">' + e.pts + " / " + e.max + " · " + e.pct + " %</span>" + chip(e.pass ? "bestanden" : "nicht bestanden", e.pass ? "ok" : "bad", e.pass ? "check" : "x") + "</li>"; }); o += "</ul></section>"; }
    return o;
  }
  function examRun() {

    if (EXV.confirm) o += '<div class="note note-warn" role="alertdialog" aria-label="Abgabe bestätigen">' + icon("warn") + "<div><b>Simulation jetzt abgeben?</b> " + (n - answered ? (n - answered) + " Fragen sind noch unbeantwortet. " : "") + 'Danach sind keine Änderungen mehr möglich.<div class="actions"><button class="btn btn-primary" data-a="ex-submit">Ja, abgeben</button><button class="btn" data-a="ex-submit-no">Weiter bearbeiten</button></div></div></div>';

    o += '<section class="card"><h3>Übersicht</h3><div class="exgrid">';
    e.ids.forEach(function (id, i) { var a = (e.ans[id] || []).length; o += '<button class="' + (a ? "done" : "") + (e.flag[id] ? " flag" : "") + '"' + (i === e.i ? ' aria-current="true"' : "") + ' data-a="ex-go" data-arg="' + i + '" aria-label="Frage ' + (i + 1) + (a ? ", beantwortet" : ", offen") + (e.flag[id] ? ", markiert" : "") + '">' + (i + 1) + "</button>"; });
    o += '</div><p class="legend"><span><i class="lg done"></i>beantwortet</span><span><i class="lg"></i>offen</span><span><i class="lg flag"></i>markiert</span></p></section>';
    return o;
  }
  function examResult(r) {

  /* ================= Mündliche Prüfung ================= */
  var ORAL = { show: false, text: "", checks: [] };
  function viewMuendlich(id) {

      var o = head("Mündliche Prüfung", "Falltraining", SK.cases.length + " eigene Fallbeispiele. Schwerpunkte der mündlichen Prüfung sind nach § 11 BewachV das Recht der öffentlichen Sicherheit und Ordnung einschließlich Gewerberecht sowie der Umgang mit Menschen.");

      });

    }

    "oral-next": function () {
      var open = SK.cases.filter(function (c) { return !(S.oral[c.id] && S.oral[c.id].n) && c.id !== ORAL.id; });
      var pool = open.length ? open : SK.cases.filter(function (c) { return c.id !== ORAL.id; });
      location.hash = "#/muendlich/" + pool[open.length ? 0 : Math.floor(Math.random() * pool.length)].id;
    },
    "oral-tts": function (p) { var c = CBY[ORAL.id]; TTS.speak(p === "s" ? c.s + " Aufgabe: " + c.a : c.l.join(". ")); },
    theme: function (t) { S.settings.theme = t; save(); applyTheme(); render(); },
    export: function () {
      var data = JSON.stringify({ app: "sachkunde-34a-lerntrainer", exported: new Date().toISOString(), state: S }, null, 2);
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
      a.download = "sachkunde-34a-fortschritt-" + today() + ".json"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000); toast("Fortschritt als JSON-Datei exportiert");
    },
    "update-now": function () { if (updateWorker) updateWorker.postMessage("aktualisieren"); },
    "update-later": function () { updateWorker = null; renderBanner(); },
    "del-ask": function () { SETV.del = true; render(); }, "del-no": function () { SETV.del = false; render(); },
    "del-yes": function () {
      try { localStorage.removeItem(KEY); } catch (e) {}
      S = defaults(); SESS = null; EXV.result = null; SETV.del = false; applyTheme(); save(); render(); toast("Der gesamte Fortschritt wurde gelöscht");
    }
  };
  var CHG = {
    match: function (i, el) { SESS.cur.pick[+i] = el.value; var b = $('[data-a="check"]'); if (b) b.disabled = !canCheck(QBY[SESS.cur.id], SESS.cur); },
    cat: function (k, el) { CAT[k] = el.value; CAT.page = 0; $("#cat-list").innerHTML = catList(); },
    set: function (k, el) { S.settings[k] = el.checked; if (k === "tts" && !el.checked) TTS.stop(); save(); applyTheme(); render(); },
    "set-val": function (k, el) { S.settings[k] = k === "rate" ? +el.value : el.value; save(); render(); },
    goal: function (k, el) { S.goals[k] = Math.max(0, Math.min(500, parseInt(el.value, 10) || 0)); save(); toast("Tagesziel gespeichert"); },
    srs: function (k, el) {
      var a = el.value.split(/[,;\s]+/).map(Number).filter(function (n) { return n >= 1 && n <= 365; });
      if (a.length < 2) { toast("Bitte mindestens zwei Abstände zwischen 1 und 365 Tagen angeben"); el.value = srs().intervalsDays.join(", "); return; }
      S.srs.intervalsDays = a; save(); el.value = a.join(", "); toast("Wiederholungsabstände gespeichert");
    },
    "oral-check": function (i, el) { ORAL.checks[+i] = el.checked; },
    import: function (k, el) {
      var f = el.files && el.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result), st = d && d.state ? d.state : d;
          if (!st || typeof st !== "object" || typeof st.q !== "object" || !Array.isArray(st.exams)) throw new Error("format");
          S = merge(defaults(), st); save(); applyTheme(); render(); toast("Fortschritt importiert");
        } catch (e) { toast("Diese Datei ist kein gültiger Fortschritts-Export."); }
      };
      fr.onerror = function () { toast("Die Datei konnte nicht gelesen werden."); };
      fr.readAsText(f); el.value = "";
    }
  };
  var INP = {
    "cat-text": function (el) { CAT.text = el.value; CAT.page = 0; $("#cat-list").innerHTML = catList(); },
    gloss: function (el) { GL = el.value; $("#gloss-list").innerHTML = glossList(); },
    "oral-text": function (el) { ORAL.text = el.value; }
  };

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-a]");
    var sheet = $("#sheet");
    if (!el) { if (!sheet.hidden && !ev.target.closest("#sheet .sheet-in")) sheet.hidden = true; else if (ev.target.closest("#sheet a")) sheet.hidden = true; return; }
    if (el.disabled) return;
    var fn = A[el.getAttribute("data-a")];
    if (fn) { if (el.tagName === "A") ev.preventDefault(); fn(el.getAttribute("data-arg"), el); }
  });
  document.addEventListener("change", function (ev) { var el = ev.target.closest("[data-chg]"); if (el && CHG[el.getAttribute("data-chg")]) CHG[el.getAttribute("data-chg")](el.getAttribute("data-arg"), el); });
  document.addEventListener("input", function (ev) { var el = ev.target.closest("[data-inp]"); if (el && INP[el.getAttribute("data-inp")]) INP[el.getAttribute("data-inp")](el); });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") { $("#sheet").hidden = true; } });
  window.addEventListener("hashchange", function () {
    $("#sheet").hidden = true;
    if (route().name !== "lernen" && SESS && SESS.i >= SESS.ids.length) SESS = null;
    render(); $("#main").focus({ preventScroll: true });
  });
  window.addEventListener("beforeunload", function () { TTS.stop(); });

  applyTheme(); renderBanner(); render();

  /* Web-App: Offline-Speicher registrieren (nur über http/https, nicht bei Doppelklick auf die Datei). */
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    var reloading = false, hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      // Beim allerersten Start (noch kein Offline-Speicher aktiv) nicht neu laden – nur bei einem Update.
      if (!hadController) { hadController = true; return; }
      if (reloading) return; reloading = true; location.reload();
    });
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      function ready(w) { if (w && navigator.serviceWorker.controller) { updateWorker = w; renderBanner(); } }
      if (reg.waiting) ready(reg.waiting);
      reg.addEventListener("updatefound", function () {
        var w = reg.installing; if (!w) return;
        w.addEventListener("statechange", function () { if (w.state === "installed") ready(w); });
      });
    }).catch(function () { /* ohne sw.js (z. B. Einzeldatei) läuft die App normal weiter */ });
  }
  window.SKApp = { state: function () { return S; }, record: record, status: status };
})();

</script>
</body>
</html>
