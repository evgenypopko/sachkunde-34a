  "w": "(1) Der Gewerbetreibende hat den Wachdienst durch eine Dienstanweisung nach Maßgabe der Sätze 2 und 3 zu regeln. Die Dienstanweisung muss den Hinweis enthalten, dass die Wachperson nicht die Eigenschaft und die Befugnisse eines Polizeivollzugsbeamten, oder eines sonstigen Bediensteten einer Behörde besitzt. Die Dienstanweisung muss ferner bestimmen, dass die Wachperson während des Dienstes nur mit Zustimmung des Gewerbetreibenden eine Schusswaffe, Hieb- und Stoßwaffen sowie Reizstoffsprühgeräte führen darf und jeden Gebrauch dieser Waffen unverzüglich der zuständigen Polizeidienststelle und dem Gewerbetreibenden anzuzeigen hat.",
  "e": "Die Dienstanweisung regelt den Wachdienst. Sie stellt klar: keine Polizeibefugnisse, Waffen nur mit Zustimmung des Chefs, jeder Waffengebrauch wird sofort gemeldet.",
  "u": "https://www.gesetze-im-internet.de/bewachv_2019/__17.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 34 Abs. 1 PolG NRW",
  "g": "PolG NRW",
  "n": "34",
  "a": "1",
  "t": "Platzverweisung",
  "b": [
   "oso"
  ],
  "w": "(1) Die Polizei kann zur Abwehr einer Gefahr eine Person vorübergehend von einem Ort verweisen oder ihr vorübergehend das Betreten eines Ortes verbieten. Die Platzverweisung kann ferner gegen eine Person angeordnet werden, die den Einsatz der Feuerwehr oder von Hilfs- oder Rettungsdiensten behindert.",
  "e": "Nur die Polizei darf jemanden von einem öffentlichen Ort wegschicken (Platzverweisung).",
  "u": "https://recht.nrw.de/lrgv/gesetz/13122025-polizeigesetz-des-landes-nordrhein-westfalen-bekanntmachung-der-neufassung/",
  "h": "recht.nrw.de"
 },
 {
  "k": "§ 1 Abs. 2 PolG NRW",
  "g": "PolG NRW",
  "n": "1",
  "a": "2",
  "t": "Schutz privater Rechte",
  "b": [
   "oso"
  ],
  "w": "(2) Der Schutz privater Rechte obliegt der Polizei nach diesem Gesetz nur dann, wenn gerichtlicher Schutz nicht rechtzeitig zu erlangen ist und wenn ohne polizeiliche Hilfe die Verwirklichung des Rechts vereitelt oder wesentlich erschwert werden würde.",
  "e": "Private Ansprüche schützt die Polizei nur im Eilfall – wenn ein Gericht nicht rechtzeitig helfen kann.",
  "u": "https://recht.nrw.de/lrgv/gesetz/13122025-polizeigesetz-des-landes-nordrhein-westfalen-bekanntmachung-der-neufassung/",
  "h": "recht.nrw.de"
 },
 {
  "k": "Art. 4 Nr. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "4",
  "a": null,
  "t": "Personenbezogene Daten",
  "b": [
   "ds"
  ],
  "w": "1. „personenbezogene Daten“ alle Informationen, die sich auf eine identifizierte oder identifizierbare natürliche Person (im Folgenden „betroffene Person“) beziehen; als identifizierbar wird eine natürliche Person angesehen, die direkt oder indirekt, insbesondere mittels Zuordnung zu einer Kennung wie einem Namen, zu einer Kennnummer, zu Standortdaten, zu einer Online-Kennung oder zu einem oder mehreren besonderen Merkmalen, die Ausdruck der physischen, physiologischen, genetischen, psychischen, wirtschaftlichen, kulturellen oder sozialen Identität dieser natürlichen Person sind, identifiziert werden kann;",
  "e": "Personenbezogen ist jede Angabe, die sich einem bestimmten Menschen zuordnen lässt.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 5 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "5",
  "a": null,
  "t": "Grundsätze der Verarbeitung",
  "b": [
   "ds"
  ],
  "w": "(1) Personenbezogene Daten müssen a) auf rechtmäßige Weise, nach Treu und Glauben und in einer für die betroffene Person nachvollziehbaren Weise verarbeitet werden („Rechtmäßigkeit, Verarbeitung nach Treu und Glauben, Transparenz“); b) für festgelegte, eindeutige und legitime Zwecke erhoben werden und dürfen nicht in einer mit diesen Zwecken nicht zu vereinbarenden Weise weiterverarbeitet werden; eine Weiterverarbeitung für im öffentlichen Interesse liegende Archivzwecke, für wissenschaftliche oder historische Forschungszwecke oder für statistische Zwecke gilt gemäß Artikel 89 Absatz 1 nicht als unvereinbar mit den ursprünglichen Zwecken („Zweckbindung“); c) dem Zweck angemessen und erheblich sowie auf das für die Zwecke der Verarbeitung notwendige Maß beschränkt sein („Datenminimierung“); d) sachlich richtig und erforderlichenfalls auf dem neuesten Stand sein; es sind alle angemessenen Maßnahmen zu treffen, damit personenbezogene Daten, die im Hinblick auf die Zwecke ihrer Verarbeitung unrichtig sind, unverzüglich gelöscht oder berichtigt werden („Richtigkeit“); e) in einer Form gespeichert werden, die die Identifizierung der betroffenen Personen nur so lange ermöglicht, wie es für die Zwecke, für die sie verarbeitet werden, erforderlich ist; personenbezogene Daten dürfen länger gespeichert werden, soweit die personenbezogenen Daten vorbehaltlich der Durchführung geeigneter technischer und organisatorischer Maßnahmen, die von dieser Verordnung zum Schutz der Rechte und Freiheiten der betroffenen Person gefordert werden, ausschließlich für im öffentlichen Interesse liegende Archivzwecke oder für wissenschaftliche und historische Forschungszwecke oder für statistische Zwecke gemäß Artikel 89 Absatz 1 verarbeitet werden („Speicherbegrenzung“); f) in einer Weise verarbeitet werden, die eine angemessene Sicherheit der personenbezogenen Daten gewährleistet, einschließlich Schutz vor unbefugter oder unrechtmäßiger Verarbeitung und vor unbeabsichtigtem Verlust, unbeabsichtigter Zerstörung oder unbeabsichtigter Schädigung durch geeignete technische und organisatorische Maßnahmen („Integrität und Vertraulichkeit“);",
  "e": "Daten nur rechtmäßig, für einen klaren Zweck, so wenig wie nötig, richtig, nicht länger als nötig und sicher verarbeiten.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 6 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "6",
  "a": null,
  "t": "Rechtmäßigkeit",
  "b": [
   "ds"
  ],
  "w": "(1) Die Verarbeitung ist nur rechtmäßig, wenn mindestens eine der nachstehenden Bedingungen erfüllt ist: a) Die betroffene Person hat ihre Einwilligung zu der Verarbeitung der sie betreffenden personenbezogenen Daten für einen oder mehrere bestimmte Zwecke gegeben; b) die Verarbeitung ist für die Erfüllung eines Vertrags, dessen Vertragspartei die betroffene Person ist, oder zur Durchführung vorvertraglicher Maßnahmen erforderlich, die auf Anfrage der betroffenen Person erfolgen; c) die Verarbeitung ist zur Erfüllung einer rechtlichen Verpflichtung erforderlich, der der Verantwortliche unterliegt; d) die Verarbeitung ist erforderlich, um lebenswichtige Interessen der betroffenen Person oder einer anderen natürlichen Person zu schützen; e) die Verarbeitung ist für die Wahrnehmung einer Aufgabe erforderlich, die im öffentlichen Interesse liegt oder in Ausübung öffentlicher Gewalt erfolgt, die dem Verantwortlichen übertragen wurde; f) die Verarbeitung ist zur Wahrung der berechtigten Interessen des Verantwortlichen oder eines Dritten erforderlich, sofern nicht die Interessen oder Grundrechte und Grundfreiheiten der betroffenen Person, die den Schutz personenbezogener Daten erfordern, überwiegen, insbesondere dann, wenn es sich bei der betroffenen Person um ein Kind handelt.",
  "e": "Daten darf man nur verarbeiten, wenn es einen erlaubten Grund gibt – z. B. Einwilligung, Vertrag, gesetzliche Pflicht oder berechtigtes Interesse.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 33 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "33",
  "a": null,
  "t": "Meldung von Datenpannen",
  "b": [
   "ds"
  ],
  "w": "(1) Im Falle einer Verletzung des Schutzes personenbezogener Daten meldet der Verantwortliche unverzüglich und möglichst binnen 72 Stunden, nachdem ihm die Verletzung bekannt wurde, diese der gemäß Artikel 51 zuständigen Aufsichtsbehörde, es sei denn, dass die Verletzung des Schutzes personenbezogener Daten voraussichtlich nicht zu einem Risiko für die Rechte und Freiheiten natürlicher Personen führt. Erfolgt die Meldung an die Aufsichtsbehörde nicht binnen 72 Stunden, so ist ihr eine Begründung für die Verzögerung beizufügen.",
  "e": "Eine Datenpanne meldet der Verantwortliche sofort, möglichst innerhalb von 72 Stunden, der Aufsichtsbehörde.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "§ 4 Abs. 2 BDSG",
  "g": "BDSG",
  "n": "4",
  "a": "2",
  "t": "Hinweis auf Videoüberwachung",
  "b": [
   "ds"
  ],
  "w": "(2) Der Umstand der Beobachtung und der Name und die Kontaktdaten des Verantwortlichen sind durch geeignete Maßnahmen zum frühestmöglichen Zeitpunkt erkennbar zu machen.",
  "e": "Wer öffentlich zugängliche Räume filmt, muss darauf hinweisen und sagen, wer verantwortlich ist.",
  "u": "https://www.gesetze-im-internet.de/bdsg_2018/__4.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 227 BGB",
  "g": "BGB",
  "n": "227",
  "a": null,
  "t": "Notwehr",
  "b": [
   "bgb"
  ],
  "w": "(1) Eine durch Notwehr gebotene Handlung ist nicht widerrechtlich. (2) Notwehr ist diejenige Verteidigung, welche erforderlich ist, um einen gegenwärtigen rechtswidrigen Angriff von sich oder einem anderen abzuwenden.",
  "e": "Wer sich oder andere gegen einen laufenden, unerlaubten Angriff verteidigt, handelt nicht rechtswidrig – solange er nur das Nötige tut.",
  "u": "https://www.gesetze-im-internet.de/bgb/__227.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 228 BGB",
  "g": "BGB",
  "n": "228",
  "a": null,
  "t": "Notstand (Verteidigungsnotstand)",
  "b": [
   "bgb"
  ],
  "w": "Wer eine fremde Sache beschädigt oder zerstört, um eine durch sie drohende Gefahr von sich oder einem anderen abzuwenden, handelt nicht widerrechtlich, wenn die Beschädigung oder die Zerstörung zur Abwendung der Gefahr erforderlich ist und der Schaden nicht außer Verhältnis zu der Gefahr steht. Hat der Handelnde die Gefahr verschuldet, so ist er zum Schadensersatz verpflichtet.",
  "e": "Geht die Gefahr von einer Sache aus, darf man genau diese Sache beschädigen, um die Gefahr abzuwehren.",
  "u": "https://www.gesetze-im-internet.de/bgb/__228.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 904 BGB",
  "g": "BGB",
  "n": "904",
  "a": null,
  "t": "Notstand (Angriffsnotstand)",
  "b": [
   "bgb"
  ],
  "w": "Der Eigentümer einer Sache ist nicht berechtigt, die Einwirkung eines anderen auf die Sache zu verbieten, wenn die Einwirkung zur Abwendung einer gegenwärtigen Gefahr notwendig und der drohende Schaden gegenüber dem aus der Einwirkung dem Eigentümer entstehenden Schaden unverhältnismäßig groß ist. Der Eigentümer kann Ersatz des ihm entstehenden Schadens verlangen.",
  "e": "Um eine akute Gefahr abzuwenden, darf man auch eine unbeteiligte fremde Sache benutzen oder beschädigen. Der Eigentümer bekommt den Schaden ersetzt.",
  "u": "https://www.gesetze-im-internet.de/bgb/__904.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 229 BGB",
  "g": "BGB",
  "n": "229",
  "a": null,
  "t": "Selbsthilfe",
  "b": [
   "bgb"
  ],
  "w": "Wer zum Zwecke der Selbsthilfe eine Sache wegnimmt, zerstört oder beschädigt oder wer zum Zwecke der Selbsthilfe einen Verpflichteten, welcher der Flucht verdächtig ist, festnimmt oder den Widerstand des Verpflichteten gegen eine Handlung, die dieser zu dulden verpflichtet ist, beseitigt, handelt nicht widerrechtlich, wenn obrigkeitliche Hilfe nicht rechtzeitig zu erlangen ist und ohne sofortiges Eingreifen die Gefahr besteht, dass die Verwirklichung des Anspruchs vereitelt oder wesentlich erschwert werde.",
  "e": "Ist keine Polizei rechtzeitig erreichbar und droht der Anspruch verloren zu gehen, darf man ihn vorläufig selbst sichern.",
  "u": "https://www.gesetze-im-internet.de/bgb/__229.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 823 Abs. 1 BGB",
  "g": "BGB",
  "n": "823",
  "a": "1",
  "t": "Schadensersatzpflicht",
  "b": [
   "bgb"
  ],
  "w": "(1) Wer vorsätzlich oder fahrlässig das Leben, den Körper, die Gesundheit, die Freiheit, das Eigentum oder ein sonstiges Recht eines anderen widerrechtlich verletzt, ist dem anderen zum Ersatz des daraus entstehenden Schadens verpflichtet.",
  "e": "Wer absichtlich oder aus Unachtsamkeit einen anderen verletzt oder dessen Sachen beschädigt, muss den Schaden ersetzen.",
  "u": "https://www.gesetze-im-internet.de/bgb/__823.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 854 Abs. 1 BGB",
  "g": "BGB",
  "n": "854",
  "a": "1",
  "t": "Besitz",
  "b": [
   "bgb"
  ],
  "w": "(1) Der Besitz einer Sache wird durch die Erlangung der tatsächlichen Gewalt über die Sache erworben.",
  "e": "Besitzer ist, wer die Sache tatsächlich in der Hand hat – egal, wem sie gehört.",
  "u": "https://www.gesetze-im-internet.de/bgb/__854.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 855 BGB",
  "g": "BGB",
  "n": "855",
  "a": null,
  "t": "Besitzdiener",
  "b": [
   "bgb"
  ],
  "w": "Übt jemand die tatsächliche Gewalt über eine Sache für einen anderen in dessen Haushalt oder Erwerbsgeschäft oder in einem ähnlichen Verhältnis aus, vermöge dessen er den sich auf die Sache beziehenden Weisungen des anderen Folge zu leisten hat, so ist nur der andere Besitzer.",
  "e": "Wer eine Sache nur für seinen Chef und nach dessen Weisung hat, ist kein Besitzer, sondern Besitzdiener.",
  "u": "https://www.gesetze-im-internet.de/bgb/__855.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 858 Abs. 1 BGB",
  "g": "BGB",
  "n": "858",
  "a": "1",
  "t": "Verbotene Eigenmacht",
  "b": [
   "bgb"
  ],
  "w": "(1) Wer dem Besitzer ohne dessen Willen den Besitz entzieht oder ihn im Besitz stört, handelt, sofern nicht das Gesetz die Entziehung oder die Störung gestattet, widerrechtlich (verbotene Eigenmacht).",
  "e": "Wer jemandem ohne dessen Willen eine Sache wegnimmt oder ihn im Besitz stört, handelt unerlaubt.",
  "u": "https://www.gesetze-im-internet.de/bgb/__858.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 859 BGB",
  "g": "BGB",
  "n": "859",
  "a": null,
  "t": "Selbsthilfe des Besitzers",
  "b": [
   "bgb"
  ],
  "w": "(1) Der Besitzer darf sich verbotener Eigenmacht mit Gewalt erwehren. (2) Wird eine bewegliche Sache dem Besitzer mittels verbotener Eigenmacht weggenommen, so darf er sie dem auf frischer Tat betroffenen oder verfolgten Täter mit Gewalt wieder abnehmen. (3) Wird dem Besitzer eines Grundstücks der Besitz durch verbotene Eigenmacht entzogen, so darf er sofort nach der Entziehung sich des Besitzes durch Entsetzung des Täters wieder bemächtigen.",
  "e": "Der Besitzer darf sich gegen Wegnahme oder Störung wehren (Besitzwehr) und eine weggenommene Sache dem Täter sofort wieder abnehmen (Besitzkehr).",
  "u": "https://www.gesetze-im-internet.de/bgb/__859.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 860 BGB",
  "g": "BGB",
  "n": "860",
  "a": null,
  "t": "Selbsthilfe des Besitzdieners",
  "b": [
   "bgb"
  ],
  "w": "Zur Ausübung der dem Besitzer nach § 859 zustehenden Rechte ist auch derjenige befugt, welcher die tatsächliche Gewalt nach § 855 für den Besitzer ausübt.",
  "e": "Diese Abwehrrechte darf auch der Besitzdiener ausüben – also die Wachperson für den Auftraggeber.",
  "u": "https://www.gesetze-im-internet.de/bgb/__860.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 903 BGB",
  "g": "BGB",
  "n": "903",
  "a": null,
  "t": "Befugnisse des Eigentümers",
  "b": [
   "bgb"
  ],
  "w": "Der Eigentümer einer Sache kann, soweit nicht das Gesetz oder Rechte Dritter entgegenstehen, mit der Sache nach Belieben verfahren und andere von jeder Einwirkung ausschließen. Der Eigentümer eines Tieres hat bei der Ausübung seiner Befugnisse die besonderen Vorschriften zum Schutz der Tiere zu beachten.",
  "e": "Dem Eigentümer gehört die Sache: Er darf mit ihr machen, was er will, und andere fernhalten – im Rahmen der Gesetze.",
  "u": "https://www.gesetze-im-internet.de/bgb/__903.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 965 BGB",
  "g": "BGB",
  "n": "965",
  "a": null,
  "t": "Anzeigepflicht des Finders",
  "b": [
   "bgb"
  ],
  "w": "(1) Wer eine verlorene Sache findet und an sich nimmt, hat dem Verlierer oder dem Eigentümer oder einem sonstigen Empfangsberechtigten unverzüglich Anzeige zu machen. (2) Kennt der Finder die Empfangsberechtigten nicht oder ist ihm ihr Aufenthalt unbekannt, so hat er den Fund und die Umstände, welche für die Ermittlung der Empfangsberechtigten erheblich sein können, unverzüglich der zuständigen Behörde anzuzeigen. Ist die Sache nicht mehr als zehn Euro wert, so bedarf es der Anzeige nicht.",
  "e": "Wer etwas findet und mitnimmt, muss es sofort dem Verlierer oder der Behörde melden.",
  "u": "https://www.gesetze-im-internet.de/bgb/__965.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 12 StGB",
  "g": "StGB",
  "n": "12",
  "a": null,
  "t": "Verbrechen und Vergehen",
  "b": [
   "str"
  ],
  "w": "(1) Verbrechen sind rechtswidrige Taten, die im Mindestmaß mit Freiheitsstrafe von einem Jahr oder darüber bedroht sind. (2) Vergehen sind rechtswidrige Taten, die im Mindestmaß mit einer geringeren Freiheitsstrafe oder die mit Geldstrafe bedroht sind.",
  "e": "Verbrechen: Mindeststrafe ein Jahr Freiheitsstrafe. Alles darunter ist ein Vergehen.",
  "u": "https://www.gesetze-im-internet.de/stgb/__12.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 13 Abs. 1 StGB",
  "g": "StGB",
  "n": "13",
  "a": "1",
  "t": "Begehen durch Unterlassen",
  "b": [
   "str"
  ],
  "w": "(1) Wer es unterläßt, einen Erfolg abzuwenden, der zum Tatbestand eines Strafgesetzes gehört, ist nach diesem Gesetz nur dann strafbar, wenn er rechtlich dafür einzustehen hat, daß der Erfolg nicht eintritt, und wenn das Unterlassen der Verwirklichung des gesetzlichen Tatbestandes durch ein Tun entspricht.",
  "e": "Auch Nichtstun kann strafbar sein – wenn man verpflichtet ist, den Schaden zu verhindern (Garantenstellung).",
  "u": "https://www.gesetze-im-internet.de/stgb/__13.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 19 StGB",
  "g": "StGB",
  "n": "19",
  "a": null,
  "t": "Schuldunfähigkeit des Kindes",
  "b": [
   "str"
  ],
  "w": "Schuldunfähig ist, wer bei Begehung der Tat noch nicht vierzehn Jahre alt ist.",
  "e": "Kinder unter 14 Jahren können nicht bestraft werden.",
  "u": "https://www.gesetze-im-internet.de/stgb/__19.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 22 StGB",
  "g": "StGB",
  "n": "22",
  "a": null,
  "t": "Versuch",
  "b": [
   "str"
  ],
  "w": "Eine Straftat versucht, wer nach seiner Vorstellung von der Tat zur Verwirklichung des Tatbestandes unmittelbar ansetzt.",
  "e": "Versuch heißt: Der Täter hat mit der Tat schon direkt begonnen (unmittelbares Ansetzen).",
  "u": "https://www.gesetze-im-internet.de/stgb/__22.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 32 StGB",
  "g": "StGB",
  "n": "32",
  "a": null,
  "t": "Notwehr",
  "b": [
   "str"
  ],
  "w": "(1) Wer eine Tat begeht, die durch Notwehr geboten ist, handelt nicht rechtswidrig. (2) Notwehr ist die Verteidigung, die erforderlich ist, um einen gegenwärtigen rechtswidrigen Angriff von sich oder einem anderen abzuwenden.",
  "e": "Gegen einen laufenden, unerlaubten Angriff darf man sich und andere verteidigen – mit dem mildesten Mittel, das sicher wirkt.",
  "u": "https://www.gesetze-im-internet.de/stgb/__32.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 33 StGB",
  "g": "StGB",
  "n": "33",
  "a": null,
  "t": "Überschreitung der Notwehr",
  "b": [
   "str"
  ],
  "w": "Überschreitet der Täter die Grenzen der Notwehr aus Verwirrung, Furcht oder Schrecken, so wird er nicht bestraft.",
  "e": "Wer aus Angst oder Schrecken zu heftig abwehrt, wird nicht bestraft.",
  "u": "https://www.gesetze-im-internet.de/stgb/__33.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 34 StGB",
  "g": "StGB",
  "n": "34",
  "a": null,
  "t": "Rechtfertigender Notstand",
  "b": [
   "str"
  ],
  "w": "Wer in einer gegenwärtigen, nicht anders abwendbaren Gefahr für Leben, Leib, Freiheit, Ehre, Eigentum oder ein anderes Rechtsgut eine Tat begeht, um die Gefahr von sich oder einem anderen abzuwenden, handelt nicht rechtswidrig, wenn bei Abwägung der widerstreitenden Interessen, namentlich der betroffenen Rechtsgüter und des Grades der ihnen drohenden Gefahren, das geschützte Interesse das beeinträchtigte wesentlich überwiegt. Dies gilt jedoch nur, soweit die Tat ein angemessenes Mittel ist, die Gefahr abzuwenden.",
  "e": "Bei akuter Gefahr darf man ein fremdes Rechtsgut verletzen, wenn das Gerettete deutlich wichtiger ist und es keinen anderen Weg gibt.",
  "u": "https://www.gesetze-im-internet.de/stgb/__34.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 123 StGB",
  "g": "StGB",
  "n": "123",
  "a": null,
  "t": "Hausfriedensbruch",
  "b": [
   "str",
   "oso"
  ],
  "w": "(1) Wer in die Wohnung, in die Geschäftsräume oder in das befriedete Besitztum eines anderen oder in abgeschlossene Räume, welche zum öffentlichen Dienst oder Verkehr bestimmt sind, widerrechtlich eindringt, oder wer, wenn er ohne Befugnis darin verweilt, auf die Aufforderung des Berechtigten sich nicht entfernt, wird mit Freiheitsstrafe bis zu einem Jahr oder mit Geldstrafe bestraft. (2) Die Tat wird nur auf Antrag verfolgt.",
  "e": "Wer unerlaubt in fremde Räume eindringt oder trotz Aufforderung nicht geht, macht sich strafbar. Verfolgt wird nur auf Antrag.",
  "u": "https://www.gesetze-im-internet.de/stgb/__123.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 223 Abs. 1 StGB",
  "g": "StGB",
  "n": "223",
  "a": null,
  "t": "Körperverletzung",
  "b": [
   "str"
  ],
  "w": "(1) Wer eine andere Person körperlich mißhandelt oder an der Gesundheit schädigt, wird mit Freiheitsstrafe bis zu fünf Jahren oder mit Geldstrafe bestraft.",
  "e": "Wer einen anderen körperlich misshandelt oder an der Gesundheit schädigt, macht sich strafbar.",
  "u": "https://www.gesetze-im-internet.de/stgb/__223.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 224 Abs. 1 StGB",
  "g": "StGB",
  "n": "224",
  "a": null,
  "t": "Gefährliche Körperverletzung",
  "b": [
   "str"
  ],
  "w": "(1) Wer die Körperverletzung 1. durch Beibringung von Gift oder anderen gesundheitsschädlichen Stoffen, 2. mittels einer Waffe oder eines anderen gefährlichen Werkzeugs, 3. mittels eines hinterlistigen Überfalls, 4. mit einem anderen Beteiligten gemeinschaftlich oder 5. mittels einer das Leben gefährdenden Behandlung begeht, wird mit Freiheitsstrafe von sechs Monaten bis zu zehn Jahren, in minder schweren Fällen mit Freiheitsstrafe von drei Monaten bis zu fünf Jahren bestraft.",
  "e": "Gefährlich wird die Körperverletzung zum Beispiel mit Waffe oder gefährlichem Werkzeug oder gemeinsam mit anderen.",
  "u": "https://www.gesetze-im-internet.de/stgb/__224.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 239 Abs. 1 StGB",
  "g": "StGB",
  "n": "239",
  "a": null,
  "t": "Freiheitsberaubung",
  "b": [
   "str"
  ],
  "w": "(1) Wer einen Menschen einsperrt oder auf andere Weise der Freiheit beraubt, wird mit Freiheitsstrafe bis zu fünf Jahren oder mit Geldstrafe bestraft.",
  "e": "Wer einen Menschen einsperrt oder festhält, ohne es zu dürfen, macht sich strafbar.",
  "u": "https://www.gesetze-im-internet.de/stgb/__239.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 240 StGB",
  "g": "StGB",
  "n": "240",
  "a": null,
  "t": "Nötigung",
  "b": [
   "str"
  ],
  "w": "(1) Wer einen Menschen rechtswidrig mit Gewalt oder durch Drohung mit einem empfindlichen Übel zu einer Handlung, Duldung oder Unterlassung nötigt, wird mit Freiheitsstrafe bis zu drei Jahren oder mit Geldstrafe bestraft. (2) Rechtswidrig ist die Tat, wenn die Anwendung der Gewalt oder die Androhung des Übels zu dem angestrebten Zweck als verwerflich anzusehen ist.",
  "e": "Wer jemanden mit Gewalt oder Drohung zu etwas zwingt, macht sich strafbar – wenn das Mittel für diesen Zweck verwerflich ist.",
  "u": "https://www.gesetze-im-internet.de/stgb/__240.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 242 Abs. 1 StGB",
  "g": "StGB",
  "n": "242",
  "a": null,
  "t": "Diebstahl",
  "b": [
   "str"
  ],
  "w": "(1) Wer eine fremde bewegliche Sache einem anderen in der Absicht wegnimmt, die Sache sich oder einem Dritten rechtswidrig zuzueignen, wird mit Freiheitsstrafe bis zu fünf Jahren oder mit Geldstrafe bestraft.",
  "e": "Diebstahl: eine fremde Sache wegnehmen, um sie zu behalten.",
  "u": "https://www.gesetze-im-internet.de/stgb/__242.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 246 Abs. 1 StGB",
  "g": "StGB",
  "n": "246",
  "a": null,
  "t": "Unterschlagung",
  "b": [
   "str"
  ],
  "w": "(1) Wer eine fremde bewegliche Sache sich oder einem Dritten rechtswidrig zueignet, wird mit Freiheitsstrafe bis zu drei Jahren oder mit Geldstrafe bestraft, wenn die Tat nicht in anderen Vorschriften mit schwererer Strafe bedroht ist.",
  "e": "Unterschlagung: eine fremde Sache behalten, die man schon hat – ohne sie wegzunehmen.",
  "u": "https://www.gesetze-im-internet.de/stgb/__246.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 249 Abs. 1 StGB",
  "g": "StGB",
  "n": "249",
  "a": null,
  "t": "Raub",
  "b": [
   "str"
  ],
  "w": "(1) Wer mit Gewalt gegen eine Person oder unter Anwendung von Drohungen mit gegenwärtiger Gefahr für Leib oder Leben eine fremde bewegliche Sache einem anderen in der Absicht wegnimmt, die Sache sich oder einem Dritten rechtswidrig zuzueignen, wird mit Freiheitsstrafe nicht unter einem Jahr bestraft.",
  "e": "Raub: Wegnahme mit Gewalt gegen eine Person oder mit Drohung gegen Leib oder Leben.",
  "u": "https://www.gesetze-im-internet.de/stgb/__249.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 252 StGB",
  "g": "StGB",
  "n": "252",
  "a": null,
  "t": "Räuberischer Diebstahl",
  "b": [
   "str"
  ],
  "w": "Wer, bei einem Diebstahl auf frischer Tat betroffen, gegen eine Person Gewalt verübt oder Drohungen mit gegenwärtiger Gefahr für Leib oder Leben anwendet, um sich im Besitz des gestohlenen Gutes zu erhalten, ist gleich einem Räuber zu bestrafen.",
  "e": "Wer nach dem Diebstahl ertappt wird und Gewalt anwendet, um die Beute zu behalten, wird wie ein Räuber bestraft.",
  "u": "https://www.gesetze-im-internet.de/stgb/__252.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 303 Abs. 1 StGB",
  "g": "StGB",
  "n": "303",
  "a": null,
  "t": "Sachbeschädigung",
  "b": [
   "str"
  ],
  "w": "(1) Wer rechtswidrig eine fremde Sache beschädigt oder zerstört, wird mit Freiheitsstrafe bis zu zwei Jahren oder mit Geldstrafe bestraft.",
  "e": "Wer eine fremde Sache absichtlich beschädigt oder zerstört, macht sich strafbar.",
  "u": "https://www.gesetze-im-internet.de/stgb/__303.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 323c Abs. 1 StGB",
  "g": "StGB",
  "n": "323c",
  "a": null,
  "t": "Unterlassene Hilfeleistung",
  "b": [
   "str"
  ],
  "w": "(1) Wer bei Unglücksfällen oder gemeiner Gefahr oder Not nicht Hilfe leistet, obwohl dies erforderlich und ihm den Umständen nach zuzumuten, insbesondere ohne erhebliche eigene Gefahr und ohne Verletzung anderer wichtiger Pflichten möglich ist, wird mit Freiheitsstrafe bis zu einem Jahr oder mit Geldstrafe bestraft.",
  "e": "Bei einem Unglück muss jeder helfen, soweit es nötig und zumutbar ist.",
  "u": "https://www.gesetze-im-internet.de/stgb/__323c.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 127 Abs. 1 StPO",
  "g": "StPO",
  "n": "127",
  "a": null,
  "t": "Vorläufige Festnahme",
  "b": [
   "str"
  ],
  "w": "(1) Wird jemand auf frischer Tat betroffen oder verfolgt, so ist, wenn er der Flucht verdächtig ist oder seine Identität nicht sofort festgestellt werden kann, jedermann befugt, ihn auch ohne richterliche Anordnung vorläufig festzunehmen. Die Feststellung der Identität einer Person durch die Staatsanwaltschaft oder die Beamten des Polizeidienstes bestimmt sich nach § 163b Abs. 1.",
  "e": "Jeder darf einen Täter festhalten, den er auf frischer Tat ertappt – aber nur, wenn er fliehen will oder nicht feststeht, wer er ist.",
  "u": "https://www.gesetze-im-internet.de/stpo/__127.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 2 Abs. 1 WaffG",
  "g": "WaffG",
  "n": "2",
  "a": "1",
  "t": "Mindestalter",
  "b": [
   "waf"
  ],
  "w": "(1) Der Umgang mit Waffen oder Munition ist nur Personen gestattet, die das 18. Lebensjahr vollendet haben.",
  "e": "Mit Waffen darf nur umgehen, wer mindestens 18 ist.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__2.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 28 Abs. 1 und 2 WaffG",
  "g": "WaffG",
  "n": "28",
  "a": null,
  "t": "Schusswaffen im Bewachungsgewerbe",
  "b": [
   "waf"
  ],
  "w": "(1) Ein Bedürfnis zum Erwerb, Besitz und Führen von Schusswaffen wird bei einem Bewachungsunternehmer (§ 34a der Gewerbeordnung) anerkannt, wenn er glaubhaft macht, dass Bewachungsaufträge wahrgenommen werden oder werden sollen, die aus Gründen der Sicherung einer gefährdeten Person im Sinne des § 19 oder eines gefährdeten Objektes Schusswaffen erfordern. Satz 1 gilt entsprechend für Wachdienste als Teil wirtschaftlicher Unternehmungen. Ein nach den Sätzen 1 und 2 glaubhaft gemachtes Bedürfnis umfasst auch den Erwerb und Besitz der für die dort genannten Schusswaffen bestimmten Munition. (2) Die Schusswaffe darf nur bei der tatsächlichen Durchführung eines konkreten Auftrages nach Absatz 1 geführt werden. Der Unternehmer hat dies auch bei seinem Bewachungspersonal in geeigneter Weise sicherzustellen.",
  "e": "Bewachungsunternehmen bekommen Schusswaffen nur für Aufträge, die das wegen einer Gefährdung erfordern – und nur dabei dürfen sie geführt werden.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__28.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 42 Abs. 1 WaffG",
  "g": "WaffG",
  "n": "42",
  "a": null,
  "t": "Waffenverbot bei Veranstaltungen",
  "b": [
   "waf"
  ],
  "w": "(1) Wer an öffentlichen Vergnügungen, Volksfesten, Sportveranstaltungen, Messen, Ausstellungen, Märkten oder ähnlichen öffentlichen Veranstaltungen teilnimmt, darf keine Waffen im Sinne des § 1 Abs. 2 führen. Dies gilt auch, wenn für die Teilnahme ein Eintrittsgeld zu entrichten ist, sowie für Theater-, Kino-, und Diskothekenbesuche und für Tanzveranstaltungen.",
  "e": "Bei öffentlichen Veranstaltungen darf man keine Waffen bei sich führen.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__42.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 42a Abs. 1 WaffG",
  "g": "WaffG",
  "n": "42a",
  "a": null,
  "t": "Führverbot für bestimmte Gegenstände",
  "b": [
   "waf"
  ],
  "w": "(1) Es ist verboten 1. Anscheinswaffen, 2. Hieb- und Stoßwaffen nach Anlage 1 Abschnitt 1 Unterabschnitt 2 Nr. 1.1 oder 3. Messer mit einhändig feststellbarer Klinge (Einhandmesser) oder feststehende Messer mit einer Klingenlänge über 12 cm zu führen.",
  "e": "Anscheinswaffen, Schlagstöcke und bestimmte Messer darf man nicht bei sich führen – außer mit berechtigtem Grund.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__42a.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "Art. 1 GG",
  "g": "GG",
  "n": "1",
  "a": null,
  "t": "Menschenwürde",
  "b": [
   "oso"
  ],
  "w": "(1) Die Würde des Menschen ist unantastbar. Sie zu achten und zu schützen ist Verpflichtung aller staatlichen Gewalt. (2) Das Deutsche Volk bekennt sich darum zu unverletzlichen und unveräußerlichen Menschenrechten als Grundlage jeder menschlichen Gemeinschaft, des Friedens und der Gerechtigkeit in der Welt. (3) Die nachfolgenden Grundrechte binden Gesetzgebung, vollziehende Gewalt und Rechtsprechung als unmittelbar geltendes Recht.",
  "e": "Die Würde jedes Menschen ist unantastbar. Der Staat muss sie schützen; die Grundrechte binden alle Staatsgewalt.",
  "u": "https://www.gesetze-im-internet.de/gg/art_1.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "Art. 3 GG",
  "g": "GG",
  "n": "3",
  "a": null,
  "t": "Gleichheit",
  "b": [
   "oso",
   "umm"
  ],
  "w": "(1) Alle Menschen sind vor dem Gesetz gleich. (2) Männer und Frauen sind gleichberechtigt. Der Staat fördert die tatsächliche Durchsetzung der Gleichberechtigung von Frauen und Männern und wirkt auf die Beseitigung bestehender Nachteile hin. (3) Niemand darf wegen seines Geschlechtes, seiner Abstammung, seiner Rasse, seiner Sprache, seiner Heimat und Herkunft, seines Glaubens, seiner religiösen oder politischen Anschauungen benachteiligt oder bevorzugt werden. Niemand darf wegen seiner Behinderung benachteiligt werden.",
  "e": "Alle Menschen sind vor dem Gesetz gleich. Niemand darf wegen Geschlecht, Herkunft, Glauben oder Behinderung benachteiligt werden.",
  "u": "https://www.gesetze-im-internet.de/gg/art_3.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "Art. 5 Abs. 1 und 2 GG",
  "g": "GG",
  "n": "5",
  "a": null,
  "t": "Meinungsfreiheit",
  "b": [
   "oso"
  ],
  "w": "(1) Jeder hat das Recht, seine Meinung in Wort, Schrift und Bild frei zu äußern und zu verbreiten und sich aus allgemein zugänglichen Quellen ungehindert zu unterrichten. Die Pressefreiheit und die Freiheit der Berichterstattung durch Rundfunk und Film werden gewährleistet. Eine Zensur findet nicht statt. (2) Diese Rechte finden ihre Schranken in den Vorschriften der allgemeinen Gesetze, den gesetzlichen Bestimmungen zum Schutze der Jugend und in dem Recht der persönlichen Ehre.",
  "e": "Jeder darf seine Meinung frei äußern. Grenzen setzen die allgemeinen Gesetze, der Jugendschutz und die persönliche Ehre.",
  "u": "https://www.gesetze-im-internet.de/gg/art_5.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "Art. 8 GG",
  "g": "GG",
  "n": "8",
  "a": null,
  "t": "Versammlungsfreiheit",
  "b": [
   "oso"
  ],
  "w": "(1) Alle Deutschen haben das Recht, sich ohne Anmeldung oder Erlaubnis friedlich und ohne Waffen zu versammeln. (2) Für Versammlungen unter freiem Himmel kann dieses Recht durch Gesetz oder auf Grund eines Gesetzes beschränkt werden.",
  "e": "Deutsche dürfen sich friedlich und ohne Waffen versammeln – ohne Anmeldung oder Erlaubnis.",
  "u": "https://www.gesetze-im-internet.de/gg/art_8.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "Art. 10 Abs. 1 GG",
  "g": "GG",
  "n": "10",
  "a": null,
  "t": "Brief-, Post- und Fernmeldegeheimnis",
  "b": [
   "oso"
  ],
  "w": "(1) Das Briefgeheimnis sowie das Post- und Fernmeldegeheimnis sind unverletzlich.",
  "e": "Briefe, Post und Telefongespräche sind geheim.",
  "u": "https://www.gesetze-im-internet.de/gg/art_10.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "Art. 12 Abs. 1 GG",
  "g": "GG",
  "n": "12",
  "a": null,
  "t": "Berufsfreiheit",
  "b": [
   "oso"
  ],
  "w": "(1) Alle Deutschen haben das Recht, Beruf, Arbeitsplatz und Ausbildungsstätte frei zu wählen. Die Berufsausübung kann durch Gesetz oder auf Grund eines Gesetzes geregelt werden.",
  "e": "Deutsche dürfen ihren Beruf frei wählen. Wie ein Beruf ausgeübt wird, darf ein Gesetz regeln.",
  "u": "https://www.gesetze-im-internet.de/gg/art_12.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "Art. 13 Abs. 1 und 2 GG",
  "g": "GG",
  "n": "13",
  "a": null,
  "t": "Unverletzlichkeit der Wohnung",
  "b": [
   "oso"
  ],
  "w": "(1) Die Wohnung ist unverletzlich. (2) Durchsuchungen dürfen nur durch den Richter, bei Gefahr im Verzuge auch durch die in den Gesetzen vorgesehenen anderen Organe angeordnet und nur in der dort vorgeschriebenen Form durchgeführt werden.",
  "e": "Die Wohnung ist geschützt. Durchsucht werden darf sie grundsätzlich nur auf richterliche Anordnung.",
  "u": "https://www.gesetze-im-internet.de/gg/art_13.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "Art. 14 Abs. 1 und 2 GG",
  "g": "GG",
  "n": "14",
  "a": null,
  "t": "Eigentum",
  "b": [
   "oso"
  ],
  "w": "(1) Das Eigentum und das Erbrecht werden gewährleistet. Inhalt und Schranken werden durch die Gesetze bestimmt. (2) Eigentum verpflichtet. Sein Gebrauch soll zugleich dem Wohle der Allgemeinheit dienen.",
  "e": "Eigentum ist geschützt – es verpflichtet aber auch gegenüber der Allgemeinheit.",
  "u": "https://www.gesetze-im-internet.de/gg/art_14.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "Art. 19 Abs. 1 und 2 GG",
  "g": "GG",
  "n": "19",
  "a": null,
  "t": "Einschränkung von Grundrechten",
  "b": [
   "oso"
  ],
  "w": "(1) Soweit nach diesem Grundgesetz ein Grundrecht durch Gesetz oder auf Grund eines Gesetzes eingeschränkt werden kann, muß das Gesetz allgemein und nicht nur für den Einzelfall gelten. Außerdem muß das Gesetz das Grundrecht unter Angabe des Artikels nennen. (2) In keinem Falle darf ein Grundrecht in seinem Wesensgehalt angetastet werden.",
  "e": "Ein Gesetz, das ein Grundrecht einschränkt, muss für alle gelten. Der Kern des Grundrechts bleibt immer unangetastet.",
  "u": "https://www.gesetze-im-internet.de/gg/art_19.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "Art. 20 Abs. 1 bis 3 GG",
  "g": "GG",
  "n": "20",
  "a": null,
  "t": "Staatsgrundsätze",
  "b": [
   "oso"
  ],
  "w": "(1) Die Bundesrepublik Deutschland ist ein demokratischer und sozialer Bundesstaat. (2) Alle Staatsgewalt geht vom Volke aus. Sie wird vom Volke in Wahlen und Abstimmungen und durch besondere Organe der Gesetzgebung, der vollziehenden Gewalt und der Rechtsprechung ausgeübt. (3) Die Gesetzgebung ist an die verfassungsmäßige Ordnung, die vollziehende Gewalt und die Rechtsprechung sind an Gesetz und Recht gebunden.",
  "e": "Deutschland ist ein demokratischer und sozialer Bundesstaat. Gesetzgebung, Verwaltung und Gerichte sind getrennt und an das Recht gebunden.",
  "u": "https://www.gesetze-im-internet.de/gg/art_20.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "Art. 30 GG",
  "g": "GG",
  "n": "30",
  "a": null,
  "t": "Zuständigkeit der Länder",
  "b": [
   "oso"
  ],
  "w": "Die Ausübung der staatlichen Befugnisse und die Erfüllung der staatlichen Aufgaben ist Sache der Länder, soweit dieses Grundgesetz keine andere Regelung trifft oder zuläßt.",
  "e": "Staatliche Aufgaben sind Sache der Länder, soweit das Grundgesetz nichts anderes bestimmt.",
  "u": "https://www.gesetze-im-internet.de/gg/art_30.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "Art. 31 GG",
  "g": "GG",
  "n": "31",
  "a": null,
  "t": "Vorrang des Bundesrechts",
  "b": [
   "oso"
  ],
  "w": "Bundesrecht bricht Landesrecht.",
  "e": "Bundesrecht geht Landesrecht vor.",
  "u": "https://www.gesetze-im-internet.de/gg/art_31.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "Art. 70 Abs. 1 GG",
  "g": "GG",
  "n": "70",
  "a": null,
  "t": "Gesetzgebung der Länder",
  "b": [
   "oso"
  ],
  "w": "(1) Die Länder haben das Recht der Gesetzgebung, soweit dieses Grundgesetz nicht dem Bunde Gesetzgebungsbefugnisse verleiht.",
  "e": "Die Länder machen die Gesetze, soweit das Grundgesetz nicht dem Bund die Zuständigkeit gibt.",
  "u": "https://www.gesetze-im-internet.de/gg/art_70.html",
  "h": "gesetze-im-internet.de"
 },
 {

  "t": "Bewacherregister; Verordnungsermächtigung",
  "b": [

  ],
  "w": "(1) Beim Statistischen Bundesamt (Registerbehörde) wird ein Bewacherregister eingerichtet und geführt, in dem zum Zweck der Unterstützung der für den Vollzug des § 34a zuständigen Behörden Daten zu Gewerbetreibenden nach § 34a Absatz 1 Satz 1, Wachpersonen nach § 34a Absatz 1a Satz 1 und mit der Leitung des Betriebes oder einer Zweigniederlassung beauftragten Personen elektronisch auswertbar zu erfassen sind. Das Bewacherregister ist räumlich, organisatorisch und personell von den Bereichen, die Aufgaben der Bundesstatistik wahrnehmen, getrennt zu führen.",
  "e": "Beim Statistischen Bundesamt wird ein Register geführt, in dem Bewachungsunternehmer, Wachpersonen und Leitungspersonal erfasst sind.",

  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 14 Abs. 1 (Auszug) GewO",
  "g": "GewO",
  "n": "14",

  "t": "Anzeigepflicht; Verordnungsermächtigung",
  "b": [

  ],

  "e": "Wer ein Gewerbe beginnt, verlegt oder aufgibt, muss das der Behörde gleichzeitig anzeigen.",

  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 29 Abs. 1 und 2 GewO",
  "g": "GewO",
  "n": "29",
  "a": null,
  "t": "Auskunft und Nachschau",
  "b": [
   "gew"
  ],
  "w": "(1) Gewerbetreibende oder sonstige Personen, 1. die einer Erlaubnis nach den §§ 30, 31, 33a, 33c, 33d, 33i, 34, 34a, 34b, 34c, 34d, 34f, 34h oder 34i bedürfen oder nach § 34i Absatz 4 von der Erlaubnispflicht befreit sind, 2. die nach § 34b Abs. 5 oder § 36 öffentlich bestellt sind, 3. die ein überwachungsbedürftiges Gewerbe im Sinne des § 38 Abs. 1 betreiben, 4. gegen die ein Untersagungsverfahren nach § 35 oder § 59 eröffnet oder abgeschlossen wurde oder 5. soweit diese einer gewerblichen Tätigkeit nach § 42 Absatz 1 des Kulturgutschutzgesetzes nachgehen, (Betroffene), haben den Beauftragten der zuständigen öffentlichen Stelle auf Verlangen die für die Überwachung des Geschäftsbetriebs erforderlichen mündlichen und schriftlichen Auskünfte unentgeltlich zu erteilen. (2) Die Beauftragten sind befugt, zum Zwecke der Überwachung Grundstücke und Geschäftsräume des Betroffenen während der üblichen Geschäftszeit zu betreten, dort Prüfungen und Besichtigungen vorzunehmen, sich die geschäftlichen Unterlagen vorlegen zu lassen und in diese Einsicht zu nehmen. Zur Verhütung dringender Gefahren für die öffentliche Sicherheit oder Ordnung können die Grundstücke und Geschäftsräume tagsüber auch außerhalb der in Satz 1 genannten Zeit sowie tagsüber auch dann betreten werden, wenn sie zugleich Wohnzwecken des Betroffenen dienen; das Grundrecht der Unverletzlichkeit der Wohnung (Artikel 13 des Grundgesetzes) wird insoweit eingeschränkt.",
  "e": "Erlaubnispflichtige Betriebe müssen der Behörde Auskunft geben und Kontrollen der Geschäftsräume dulden.",
  "u": "https://www.gesetze-im-internet.de/gewo/__29.html",
  "h": "gesetze-im-internet.de"
 },

 {
  "k": "§ 34a Abs. 4 GewO",
  "g": "GewO",
  "n": "34a",
  "a": "4",
  "t": "Untersagung der Beschäftigung",
  "b": [
   "gew"
  ],
  "w": "(4) Die Beschäftigung einer Person, die in einem Bewachungsunternehmen mit Bewachungsaufgaben beschäftigt ist, oder einer mit der Leitung des Betriebes oder einer Zweigniederlassung beauftragten Person kann dem Gewerbetreibenden untersagt werden, wenn Tatsachen die Annahme rechtfertigen, dass die Person die für ihre Tätigkeit erforderliche Zuverlässigkeit nicht besitzt.",
  "e": "Die Behörde kann verbieten, eine unzuverlässige Person mit Bewachungsaufgaben zu beschäftigen.",

 {
  "k": "§ 6 Abs. 1 BewachV",
  "g": "BewachV",
  "n": "6",
  "a": null,
  "t": "Verfahren",
  "b": [
   "gew"
  ],
  "w": "(1) Die Unterrichtung erfolgt mündlich. Die zu unterrichtende Person muss über die zur Ausübung der Tätigkeit und zum Verständnis des Unterrichtungsverfahrens unverzichtbaren deutschen Sprachkenntnisse, mindestens auf dem Kompetenzniveau B1 des Gemeinsamen Europäischen Referenzrahmens verfügen. Die Unterrichtung hat mindestens 40 Unterrichtsstunden zu dauern. Eine Unterrichtsstunde beträgt 45 Minuten. Mehrere Personen können gleichzeitig unterrichtet werden, wobei die Zahl der Unterrichtsteilnehmer 20 nicht übersteigen soll.",
  "e": "Die Unterrichtung ist mündlich, dauert mindestens 40 Unterrichtsstunden zu je 45 Minuten und setzt Deutschkenntnisse auf Niveau B1 voraus.",
  "u": "https://www.gesetze-im-internet.de/bewachv_2019/__6.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 9 BewachV",
  "g": "BewachV",
  "n": "9",
  "a": null,
  "t": "Zweck und Gegenstand der Sachkundeprüfung",
  "b": [
   "gew"
  ],
  "w": "(1) Zweck der Sachkundeprüfung nach § 34a Absatz 1 Satz 3 Nummer 3 und Absatz 1a Satz 2 der Gewerbeordnung ist es, den Nachweis zu erbringen, dass die dort genannten Personen die für die eigenverantwortliche Wahrnehmung der Bewachungsaufgaben erforderlichen Kenntnisse über die dafür notwendigen rechtlichen Vorschriften und fachbezogenen Pflichten und Befugnisse sowie deren praktische Anwendung erworben haben. (2) Gegenstand der Sachkundeprüfung sind die in § 7 in Verbindung mit Anlage 2 aufgeführten Sachgebiete; die Prüfung soll sich auf jedes der dort aufgeführten Gebiete erstrecken.",
  "e": "Die Sachkundeprüfung soll zeigen, dass man Rechte, Pflichten und Befugnisse im Wachdienst kennt und anwenden kann – in allen Sachgebieten.",
  "u": "https://www.gesetze-im-internet.de/bewachv_2019/__9.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 10 BewachV",
  "g": "BewachV",
  "n": "10",
  "a": null,
  "t": "Zuständige Stelle und Prüfungsausschuss",
  "b": [
   "gew"
  ],
  "w": "(1) Die Sachkundeprüfung kann bei jeder Industrie- und Handelskammer abgelegt werden, die diese anbietet. (2) Für die Abnahme der Prüfung errichtet die Industrie- und Handelskammer mindestens einen Prüfungsausschuss. Sie beruft die Mitglieder des Ausschusses sowie den Vorsitzenden und seinen Stellvertreter. Die Mitglieder müssen für die Prüfungsgebiete sachkundig und für die Mitwirkung im Prüfungswesen geeignet sein.",
  "e": "Die Prüfung legt man bei einer IHK ab; sie richtet dafür einen Prüfungsausschuss ein.",
  "u": "https://www.gesetze-im-internet.de/bewachv_2019/__10.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 11 Abs. 1 bis 6 BewachV",
  "g": "BewachV",
  "n": "11",
  "a": null,
  "t": "Prüfung, Verfahren",
  "b": [
   "gew"
  ],
  "w": "(1) Die Sachkundeprüfung ist in einen mündlichen und einen schriftlichen Teil zu gliedern. (2) Im mündlichen Prüfungsteil können gleichzeitig bis zu fünf Prüflinge geprüft werden; er soll für jeden Prüfling etwa 15 Minuten dauern. Im mündlichen Prüfungsteil ist ein Schwerpunkt auf die in § 7 Nummer 1 und 6 genannten Gebiete zu legen. (3) Der schriftliche Teil der Prüfung kann mit Hilfe unterschiedlicher Medien durchgeführt werden. (4) Die Leistung des Prüflings ist von dem Prüfungsausschuss mit bestanden oder nicht bestanden zu bewerten. Die Prüfung ist bestanden, wenn die Leistungen des Prüflings im schriftlichen Teil und im mündlichen Teil der Prüfung jeweils mindestens mit ausreichend bewertet wurden. (5) Die Prüfung ist nicht öffentlich. Es können jedoch außer den Mitgliedern des Prüfungsausschusses und den zu prüfenden Personen folgende Personen anwesend sein: 1. beauftragte Vertreter der Aufsichtsbehörden, 2. Mitglieder eines anderen Prüfungsausschusses, 3. Vertreter der Industrie- und Handelskammern, 4. Personen, die beauftragt sind, die Qualität der Prüfungen zu kontrollieren, oder 5. Personen, die dafür vorgesehen sind, in einen Prüfungsausschuss berufen zu werden. Diese Personen dürfen nicht in die laufende Prüfung eingreifen oder in die Beratung über das Prüfungsergebnis einbezogen werden. (6) Die Prüfung darf wiederholt werden.",
  "e": "Die Prüfung hat einen schriftlichen und einen mündlichen Teil; beide müssen bestanden werden. Mündlich etwa 15 Minuten, Schwerpunkt Sachgebiete 1 und 6.",
  "u": "https://www.gesetze-im-internet.de/bewachv_2019/__11.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 14 Abs. 2 BewachV",
  "g": "BewachV",
  "n": "14",
  "a": null,
  "t": "Umfang der Versicherung",
  "b": [
   "gew"
  ],
  "w": "(2) Die Mindestversicherungssumme beträgt je Schadensereignis 1. für Personenschäden 1 000 000 Euro, 2. für Sachschäden 250 000 Euro, 3. für das Abhandenkommen bewachter Sachen 15 000 Euro, 4. für reine Vermögensschäden 12 500 Euro. Die Leistungen des Versicherungsunternehmens für alle innerhalb eines Versicherungsjahres verursachten Schäden können auf den doppelten Betrag der Mindestversicherungssumme begrenzt werden. Die in Satz 1 Nummer 3 und 4 genannten Risiken sind von der Versicherungspflicht ausgenommen, soweit der Gewerbetreibende nur für Auftraggeber tätig wird, die sich mit dieser Einschränkung der Versicherungspflicht nachweislich einverstanden erklärt haben.",
  "e": "Mindestdeckung der Haftpflicht: 1 Mio. € Personenschäden, 250.000 € Sachschäden, 15.000 € abhandengekommene Sachen, 12.500 € Vermögensschäden.",
  "u": "https://www.gesetze-im-internet.de/bewachv_2019/__14.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 15 Abs. 2 BewachV",
  "g": "BewachV",
  "n": "15",
  "a": null,
  "t": "Versicherungsbestätigung, Anzeigepflicht des Versicherungsunternehmens",
  "b": [
   "gew"
  ],
  "w": "(2) Das Versicherungsunternehmen ist verpflichtet, der für die Erlaubniserteilung zuständigen Behörde unverzüglich Folgendes anzuzeigen: 1. die Beendigung des Versicherungsvertrags, insbesondere infolge einer wirksamen Kündigung, 2. das Ausscheiden eines Versicherungsnehmers aus einem Gruppenversicherungsvertrag sowie 3. jede Änderung des Versicherungsvertrags, die den vorgeschriebenen Versicherungsschutz im Verhältnis zu Dritten beeinträchtigen kann. (3) Zuständige Stelle im Sinne des § 117 Absatz 2 des Versicherungsvertragsgesetzes ist die für die Erlaubniserteilung nach § 34a der Gewerbeordnung zuständige Behörde.",
  "e": "Endet oder ändert sich die Versicherung, meldet der Versicherer das sofort der Behörde.",
  "u": "https://www.gesetze-im-internet.de/bewachv_2019/__15.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 16 Abs. 1 BewachV",
  "g": "BewachV",
  "n": "16",
  "a": null,
  "t": "Beschäftigte, An- und Abmeldung von Wach- und Leitungspersonal",
  "b": [
   "gew"
  ],
  "w": "(1) Der Gewerbetreibende darf mit Bewachungsaufgaben sowie mit der Leitung eines Betriebs oder einer Zweigniederlassung nur eine Person beschäftigen, wenn er das Verfahren nach den Absätzen 2 und 3 eingehalten hat, die Mitteilung nach Absatz 2 Satz 3 oder die Bestätigung nach Absatz 3 Satz 2 erhalten hat und die zu beschäftigende Person 1. zuverlässig ist, 2. das 18. Lebensjahr vollendet hat oder einen in § 8 bezeichneten Abschluss besitzt und 3. die für ihre Tätigkeit notwendige Befähigung besitzt.",
  "e": "Mit Bewachung darf nur beschäftigt werden, wer zuverlässig, volljährig oder einschlägig ausgebildet und befähigt ist – und erst nach Meldung im Bewacherregister.",
  "u": "https://www.gesetze-im-internet.de/bewachv_2019/__16.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 17 Abs. 2 und 3 BewachV",
  "g": "BewachV",
  "n": "17",
  "a": "2",
  "t": "Dienstanweisung",
  "b": [
   "gew"
  ],
  "w": "(2) Der Gewerbetreibende hat der Wachperson vor der ersten Aufnahme der Bewachungstätigkeit einen Abdruck der Dienstanweisung gegen Empfangsbescheinigung auszuhändigen. (3) Der Gewerbetreibende hat die in seinem Gewerbebetrieb beschäftigten Personen vor der ersten Aufnahme der Bewachungstätigkeit schriftlich zu verpflichten, auch nach ihrem Ausscheiden Geschäfts- und Betriebsgeheimnisse Dritter, die ihnen in Ausübung des Dienstes bekannt geworden sind, nicht unbefugt zu offenbaren.",
  "e": "Die Dienstanweisung bekommt man vor dem ersten Dienst gegen Unterschrift. Über Geschäftsgeheimnisse schweigt man – auch nach dem Ausscheiden.",
  "u": "https://www.gesetze-im-internet.de/bewachv_2019/__17.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 18 Abs. 1 bis 3 BewachV",
  "g": "BewachV",
  "n": "18",
  "a": null,
  "t": "Ausweis, Kennzeichnung der Wachperson",
  "b": [
   "gew"
  ],
  "w": "(1) Der Gewerbetreibende hat der Wachperson spätestens vor der ersten Aufnahme der Bewachungstätigkeit einen Ausweis nach Maßgabe der Sätze 2 und 3 auszustellen. Der Ausweis muss enthalten: 1. Familienname und Vornamen der Wachperson, 2. Namen und Anschrift des Gewerbetreibenden, 3. Bezeichnung und Anschrift des Gewerbebetriebs, sofern diese abweichen von Namen oder Anschrift des Gewerbetreibenden nach Nummer 2, 4. Unterschriften der Wachperson sowie des Gewerbetreibenden, seines Vertreters oder seines Bevollmächtigten, 5. Bewacherregisteridentifikationsnummern der Wachperson und des Bewachungsunternehmens. Der Ausweis muss so beschaffen sein, dass er sich von amtlichen Ausweisen deutlich unterscheidet. (2) Jede Wachperson ist verpflichtet, den Ausweis in Verbindung mit dem im Bewacherregister angegebenen Ausweis- oder Identifizierungsdokument während des Wachdienstes mitzuführen und auf Verlangen den Beauftragten der Vollzugsbehörden, insbesondere Ordnungsämter, Polizei- oder Zollbehörden, vorzuzeigen. (3) Jede Wachperson, die Tätigkeiten nach § 34a Absatz 1a Satz 2 Nummer 1 und 3 bis 5 der Gewerbeordnung ausübt, hat während dieser Tätigkeiten sichtbar ein Schild mit ihrem Namen oder einer Kennnummer sowie der Bezeichnung des Gewerbebetriebs zu tragen. In den Fällen des § 34a Absatz 1a Satz 2 Nummer 4 und 5 der Gewerbeordnung gilt das auch für jede Wachperson in nicht leitender Funktion. Der Gewerbetreibende hat der Wachperson zu diesem Zweck spätestens vor der ersten Aufnahme der Bewachungstätigkeit ein entsprechendes Schild auszustellen.",
  "e": "Im Dienst hat man den Firmenausweis dabei und zeigt ihn Behörden auf Verlangen. Bei bestimmten Tätigkeiten ist ein Namens- oder Nummernschild Pflicht.",
  "u": "https://www.gesetze-im-internet.de/bewachv_2019/__18.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 19 BewachV",
  "g": "BewachV",
  "n": "19",
  "a": null,
  "t": "Dienstkleidung",
  "b": [
   "gew"
  ],
  "w": "(1) Bestimmt der Gewerbetreibende für seine Wachpersonen eine Dienstkleidung, so hat er dafür zu sorgen, dass sie sich von Uniformen der Angehörigen von Streitkräften oder behördlichen Vollzugsorganen deutlich unterscheiden und dass keine Abzeichen verwendet werden, die Amtsabzeichen zum Verwechseln ähnlich sind. (2) Jede Wachperson, die befriedetes Besitztum in Ausübung ihres Dienstes betreten soll, muss eine Dienstkleidung tragen. Satz 1 gilt entsprechend für Gewerbetreibende, die selbst als Wachperson tätig werden.",
  "e": "Dienstkleidung darf nicht wie eine Polizei- oder Militäruniform aussehen. Wer befriedetes Besitztum betritt, muss Dienstkleidung tragen.",
  "u": "https://www.gesetze-im-internet.de/bewachv_2019/__19.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 20 BewachV",
  "g": "BewachV",
  "n": "20",
  "a": null,
  "t": "Behandlung der Waffen und Anzeigepflicht nach Waffengebrauch",
  "b": [
   "gew",
   "waf"
  ],
  "w": "(1) Der Gewerbetreibende ist für die sichere Aufbewahrung der Waffen und der Munition verantwortlich. Er hat die ordnungsgemäße Rückgabe der Waffen und der Munition nach Beendigung des Wachdienstes sicherzustellen. (2) Hat der Gewerbetreibende oder eine Wachperson im Wachdienst von Waffen Gebrauch gemacht, so hat der Gewerbetreibende dies unverzüglich der für den Vollzug des § 34a der Gewerbeordnung zuständigen Behörde und, soweit noch keine Anzeige nach § 17 Absatz 1 Satz 3 erfolgt ist, der zuständigen Polizeidienststelle anzuzeigen.",
  "e": "Der Unternehmer verwahrt Waffen sicher und lässt sie nach Dienstende zurückgeben. Jeder Waffengebrauch wird sofort gemeldet.",
  "u": "https://www.gesetze-im-internet.de/bewachv_2019/__20.html",
  "h": "gesetze-im-internet.de"
 },

  "g": "BewachV",

  "a": "1",
  "t": "Buchführung und Aufbewahrung",

   "gew"
  ],
  "w": "(1) Der Gewerbetreibende hat nach Maßgabe des Satzes 2 und der Absätze 2 bis 4 die Pflicht, Aufzeichnungen zu machen sowie die dort genannten Belege an der Hauptniederlassung seines Gewerbebetriebs übersichtlich zu sammeln. Die Aufzeichnungen sind unverzüglich und in deutscher Sprache anzufertigen.",
  "e": "Der Unternehmer muss Aufzeichnungen sofort und auf Deutsch anfertigen.",
  "u": "https://www.gesetze-im-internet.de/bewachv_2019/__21.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 21 Abs. 4 BewachV",
  "g": "BewachV",
  "n": "21",
  "a": "4",
  "t": "Buchführung und Aufbewahrung",
  "b": [
   "gew"
  ],
  "w": "(4) Die Aufzeichnungen und Belege sind bis zum Schluss des dritten auf den Zeitpunkt ihrer Entstehung folgenden Kalenderjahres in den Geschäftsräumen aufzubewahren. Die Aufbewahrungsfrist endet hiervon abweichend 1. in den Fällen des Absatzes 2 Satz 1 und des Absatzes 3 Nummer 1 und aller sich hierauf beziehenden Schriftstücke drei Jahre nach dem Schluss des Kalenderjahres, in dem die Verträge endeten, 2. in den Fällen des Absatzes 2 Satz 2 Nummer 1 und des Absatzes 3 Nummer 2 bis 5 drei Jahre nach dem Schluss des Kalenderjahres, in dem das Beschäftigungsverhältnis endete.",
  "e": "Aufzeichnungen und Belege werden bis zum Ende des dritten Folgejahres aufbewahrt.",

  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 1 BGB",
  "g": "BGB",

 },
 {
  "k": "§ 90 BGB",
  "g": "BGB",

  "t": "Begriff der Sache",
  "b": [

  ],
  "w": "Sachen im Sinne des Gesetzes sind nur körperliche Gegenstände.",
  "e": "Sachen sind nur Gegenstände, die man anfassen kann.",

 },
 {
  "k": "§ 90a BGB",
  "g": "BGB",
  "n": "90a",
  "a": null,
  "t": "Tiere",
  "b": [
   "bgb"
  ],
  "w": "Tiere sind keine Sachen. Sie werden durch besondere Gesetze geschützt. Auf sie sind die für Sachen geltenden Vorschriften entsprechend anzuwenden, soweit nicht etwas anderes bestimmt ist.",

  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 104 BGB",
  "g": "BGB",
  "n": "104",
  "a": null,
  "t": "Geschäftsunfähigkeit",
  "b": [
   "bgb"
  ],
  "w": "Geschäftsunfähig ist: 1. wer nicht das siebente Lebensjahr vollendet hat, 2. wer sich in einem die freie Willensbestimmung ausschließenden Zustand krankhafter Störung der Geistestätigkeit befindet, sofern nicht der Zustand seiner Natur nach ein vorübergehender ist.",
  "e": "Kinder unter sieben Jahren können keine wirksamen Verträge schließen.",
  "u": "https://www.gesetze-im-internet.de/bgb/__104.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 106 BGB",
  "g": "BGB",
  "n": "106",
  "a": null,
  "t": "Beschränkte Geschäftsfähigkeit Minderjähriger",
  "b": [
   "bgb"
  ],
  "w": "Ein Minderjähriger, der das siebente Lebensjahr vollendet hat, ist nach Maßgabe der §§ 107 bis 113 in der Geschäftsfähigkeit beschränkt.",
  "e": "Von 7 bis 17 Jahren ist man nur eingeschränkt geschäftsfähig.",
  "u": "https://www.gesetze-im-internet.de/bgb/__106.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 226 BGB",
  "g": "BGB",
  "n": "226",
  "a": null,
  "t": "Schikaneverbot",
  "b": [
   "bgb"
  ],
  "w": "Die Ausübung eines Rechts ist unzulässig, wenn sie nur den Zweck haben kann, einem anderen Schaden zuzufügen.",
  "e": "Ein Recht darf man nicht ausüben, nur um einem anderen zu schaden.",
  "u": "https://www.gesetze-im-internet.de/bgb/__226.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 230 Abs. 1 bis 3 BGB",
  "g": "BGB",
  "n": "230",
  "a": null,
  "t": "Grenzen der Selbsthilfe",
  "b": [
   "bgb"
  ],
  "w": "(1) Die Selbsthilfe darf nicht weiter gehen, als zur Abwendung der Gefahr erforderlich ist. (2) Im Falle der Wegnahme von Sachen ist, sofern nicht Zwangsvollstreckung erwirkt wird, der dingliche Arrest zu beantragen. (3) Im Falle der Festnahme des Verpflichteten ist, sofern er nicht wieder in Freiheit gesetzt wird, der persönliche Sicherheitsarrest bei dem Amtsgericht zu beantragen, in dessen Bezirk die Festnahme erfolgt ist; der Verpflichtete ist unverzüglich dem Gericht vorzuführen.",
  "e": "Selbsthilfe nur so weit wie nötig. Nach einer Festnahme muss sofort das Amtsgericht eingeschaltet werden.",
  "u": "https://www.gesetze-im-internet.de/bgb/__230.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 231 BGB",
  "g": "BGB",
  "n": "231",
  "a": null,
  "t": "Irrtümliche Selbsthilfe",
  "b": [
   "bgb"
  ],
  "w": "Wer eine der in § 229 bezeichneten Handlungen in der irrigen Annahme vornimmt, dass die für den Ausschluss der Widerrechtlichkeit erforderlichen Voraussetzungen vorhanden seien, ist dem anderen Teil zum Schadensersatz verpflichtet, auch wenn der Irrtum nicht auf Fahrlässigkeit beruht.",
  "e": "Wer sich bei der Selbsthilfe irrt, zahlt den Schaden – auch ohne eigenes Verschulden.",
  "u": "https://www.gesetze-im-internet.de/bgb/__231.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 253 Abs. 2 BGB",
  "g": "BGB",
  "n": "253",
  "a": null,
  "t": "Immaterieller Schaden",
  "b": [
   "bgb"
  ],
  "w": "(2) Ist wegen einer Verletzung des Körpers, der Gesundheit, der Freiheit oder der sexuellen Selbstbestimmung Schadensersatz zu leisten, kann auch wegen des Schadens, der nicht Vermögensschaden ist, eine billige Entschädigung in Geld gefordert werden.",
  "e": "Bei Verletzung von Körper, Gesundheit oder Freiheit gibt es zusätzlich Schmerzensgeld.",
  "u": "https://www.gesetze-im-internet.de/bgb/__253.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 254 Abs. 1 BGB",
  "g": "BGB",
  "n": "254",
  "a": null,
  "t": "Mitverschulden",
  "b": [
   "bgb"
  ],
  "w": "(1) Hat bei der Entstehung des Schadens ein Verschulden des Beschädigten mitgewirkt, so hängt die Verpflichtung zum Ersatz sowie der Umfang des zu leistenden Ersatzes von den Umständen, insbesondere davon ab, inwieweit der Schaden vorwiegend von dem einen oder dem anderen Teil verursacht worden ist.",
  "e": "Ist der Geschädigte mitschuldig, bekommt er entsprechend weniger Ersatz.",
  "u": "https://www.gesetze-im-internet.de/bgb/__254.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 276 Abs. 2 BGB",
  "g": "BGB",
  "n": "276",
  "a": null,
  "t": "Verantwortlichkeit des Schuldners",
  "b": [
   "bgb"
  ],
  "w": "(2) Fahrlässig handelt, wer die im Verkehr erforderliche Sorgfalt außer Acht lässt.",
  "e": "Fahrlässig handelt, wer nicht so sorgfältig ist, wie man es erwarten darf.",
  "u": "https://www.gesetze-im-internet.de/bgb/__276.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 611 BGB",
  "g": "BGB",
  "n": "611",
  "a": null,
  "t": "Vertragstypische Pflichten beim Dienstvertrag",
  "b": [
   "bgb"
  ],
  "w": "(1) Durch den Dienstvertrag wird derjenige, welcher Dienste zusagt, zur Leistung der versprochenen Dienste, der andere Teil zur Gewährung der vereinbarten Vergütung verpflichtet. (2) Gegenstand des Dienstvertrags können Dienste jeder Art sein.",
  "e": "Beim Dienstvertrag schuldet der eine die Arbeit, der andere die Bezahlung – kein bestimmtes Ergebnis.",
  "u": "https://www.gesetze-im-internet.de/bgb/__611.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 827 BGB",
  "g": "BGB",
  "n": "827",
  "a": null,
  "t": "Ausschluss und Minderung der Verantwortlichkeit",
  "b": [
   "bgb"
  ],
  "w": "Wer im Zustand der Bewusstlosigkeit oder in einem die freie Willensbestimmung ausschließenden Zustand krankhafter Störung der Geistestätigkeit einem anderen Schaden zufügt, ist für den Schaden nicht verantwortlich. Hat er sich durch geistige Getränke oder ähnliche Mittel in einen vorübergehenden Zustand dieser Art versetzt, so ist er für einen Schaden, den er in diesem Zustand widerrechtlich verursacht, in gleicher Weise verantwortlich, wie wenn ihm Fahrlässigkeit zur Last fiele; die Verantwortlichkeit tritt nicht ein, wenn er ohne Verschulden in den Zustand geraten ist.",
  "e": "Wer bewusstlos oder geistig schwer gestört einen Schaden anrichtet, haftet nicht – außer er hat sich selbst berauscht.",
  "u": "https://www.gesetze-im-internet.de/bgb/__827.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 828 BGB",
  "g": "BGB",
  "n": "828",
  "a": null,
  "t": "Minderjährige",
  "b": [
   "bgb"
  ],
  "w": "(1) Wer nicht das siebente Lebensjahr vollendet hat, ist für einen Schaden, den er einem anderen zufügt, nicht verantwortlich. (2) Wer das siebente, aber nicht das zehnte Lebensjahr vollendet hat, ist für den Schaden, den er bei einem Unfall mit einem Kraftfahrzeug, einer Schienenbahn oder einer Schwebebahn einem anderen zufügt, nicht verantwortlich. Dies gilt nicht, wenn er die Verletzung vorsätzlich herbeigeführt hat. (3) Wer das 18. Lebensjahr noch nicht vollendet hat, ist, sofern seine Verantwortlichkeit nicht nach Absatz 1 oder 2 ausgeschlossen ist, für den Schaden, den er einem anderen zufügt, nicht verantwortlich, wenn er bei der Begehung der schädigenden Handlung nicht die zur Erkenntnis der Verantwortlichkeit erforderliche Einsicht hat.",
  "e": "Unter 7 Jahren haftet ein Kind nicht. Bis 18 kommt es darauf an, ob es das Unrecht einsehen konnte.",
  "u": "https://www.gesetze-im-internet.de/bgb/__828.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 831 Abs. 1 BGB",
  "g": "BGB",
  "n": "831",
  "a": null,
  "t": "Haftung für den Verrichtungsgehilfen",
  "b": [
   "bgb"
  ],
  "w": "(1) Wer einen anderen zu einer Verrichtung bestellt, ist zum Ersatz des Schadens verpflichtet, den der andere in Ausführung der Verrichtung einem Dritten widerrechtlich zufügt. Die Ersatzpflicht tritt nicht ein, wenn der Geschäftsherr bei der Auswahl der bestellten Person und, sofern er Vorrichtungen oder Gerätschaften zu beschaffen oder die Ausführung der Verrichtung zu leiten hat, bei der Beschaffung oder der Leitung die im Verkehr erforderliche Sorgfalt beobachtet oder wenn der Schaden auch bei Anwendung dieser Sorgfalt entstanden sein würde.",
  "e": "Der Arbeitgeber haftet für Schäden, die sein Mitarbeiter bei der Arbeit anrichtet – außer er hat ihn sorgfältig ausgewählt und angeleitet.",
  "u": "https://www.gesetze-im-internet.de/bgb/__831.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 833 BGB",
  "g": "BGB",
  "n": "833",
  "a": null,
  "t": "Haftung des Tierhalters",
  "b": [
   "bgb"
  ],
  "w": "Wird durch ein Tier ein Mensch getötet oder der Körper oder die Gesundheit eines Menschen verletzt oder eine Sache beschädigt, so ist derjenige, welcher das Tier hält, verpflichtet, dem Verletzten den daraus entstehenden Schaden zu ersetzen. Die Ersatzpflicht tritt nicht ein, wenn der Schaden durch ein Haustier verursacht wird, das dem Beruf, der Erwerbstätigkeit oder dem Unterhalt des Tierhalters zu dienen bestimmt ist, und entweder der Tierhalter bei der Beaufsichtigung des Tieres die im Verkehr erforderliche Sorgfalt beobachtet oder der Schaden auch bei Anwendung dieser Sorgfalt entstanden sein würde.",
  "e": "Der Tierhalter haftet für Schäden durch sein Tier. Bei beruflich genutzten Haustieren entfällt das, wenn er sorgfältig aufgepasst hat.",
  "u": "https://www.gesetze-im-internet.de/bgb/__833.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 868 BGB",
  "g": "BGB",
  "n": "868",
  "a": null,
  "t": "Mittelbarer Besitz",
  "b": [
   "bgb"
  ],
  "w": "Besitzt jemand eine Sache als Nießbraucher, Pfandgläubiger, Pächter, Mieter, Verwahrer oder in einem ähnlichen Verhältnis, vermöge dessen er einem anderen gegenüber auf Zeit zum Besitz berechtigt oder verpflichtet ist, so ist auch der andere Besitzer (mittelbarer Besitz).",
  "e": "Wer eine Sache vermietet oder verleiht, bleibt mittelbarer Besitzer.",
  "u": "https://www.gesetze-im-internet.de/bgb/__868.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 966 Abs. 1 BGB",
  "g": "BGB",
  "n": "966",
  "a": null,
  "t": "Verwahrungspflicht",
  "b": [
   "bgb"
  ],
  "w": "(1) Der Finder ist zur Verwahrung der Sache verpflichtet.",
  "e": "Der Finder muss die Sache aufbewahren.",
  "u": "https://www.gesetze-im-internet.de/bgb/__966.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 967 BGB",
  "g": "BGB",
  "n": "967",
  "a": null,
  "t": "Ablieferungspflicht",
  "b": [
   "bgb"
  ],
  "w": "Der Finder ist berechtigt und auf Anordnung der zuständigen Behörde verpflichtet, die Sache oder den Versteigerungserlös an die zuständige Behörde abzuliefern.",
  "e": "Der Finder darf die Sache bei der Behörde abgeben – und muss es, wenn sie es anordnet.",
  "u": "https://www.gesetze-im-internet.de/bgb/__967.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 971 Abs. 1 BGB",
  "g": "BGB",
  "n": "971",
  "a": null,
  "t": "Finderlohn",
  "b": [
   "bgb"
  ],
  "w": "(1) Der Finder kann von dem Empfangsberechtigten einen Finderlohn verlangen. Der Finderlohn beträgt von dem Werte der Sache bis zu 500 Euro fünf vom Hundert, von dem Mehrwert drei vom Hundert, bei Tieren drei vom Hundert. Hat die Sache nur für den Empfangsberechtigten einen Wert, so ist der Finderlohn nach billigem Ermessen zu bestimmen.",
  "e": "Finderlohn: 5 % bis 500 € Wert, darüber 3 %.",
  "u": "https://www.gesetze-im-internet.de/bgb/__971.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 978 Abs. 1 BGB",
  "g": "BGB",
  "n": "978",
  "a": null,
  "t": "Fund in öffentlicher Behörde oder Verkehrsanstalt",
  "b": [
   "bgb"
  ],
  "w": "(1) Wer eine Sache in den Geschäftsräumen oder den Beförderungsmitteln einer öffentlichen Behörde oder einer dem öffentlichen Verkehr dienenden Verkehrsanstalt findet und an sich nimmt, hat die Sache unverzüglich an die Behörde oder die Verkehrsanstalt oder an einen ihrer Angestellten abzuliefern. Die Vorschriften der §§ 965 bis 967 und 969 bis 977 finden keine Anwendung.",
  "e": "Wer etwas in einer Behörde, Bahn oder einem Bus findet, gibt es sofort dort ab.",
  "u": "https://www.gesetze-im-internet.de/bgb/__978.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 1004 BGB",
  "g": "BGB",
  "n": "1004",
  "a": null,
  "t": "Beseitigungs- und Unterlassungsanspruch",
  "b": [
   "bgb",
   "oso"
  ],
  "w": "(1) Wird das Eigentum in anderer Weise als durch Entziehung oder Vorenthaltung des Besitzes beeinträchtigt, so kann der Eigentümer von dem Störer die Beseitigung der Beeinträchtigung verlangen. Sind weitere Beeinträchtigungen zu besorgen, so kann der Eigentümer auf Unterlassung klagen. (2) Der Anspruch ist ausgeschlossen, wenn der Eigentümer zur Duldung verpflichtet ist.",
  "e": "Der Eigentümer kann verlangen, dass eine Störung beendet wird und nicht wieder vorkommt.",
  "u": "https://www.gesetze-im-internet.de/bgb/__1004.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 1 StGB",
  "g": "StGB",
  "n": "1",
  "a": null,
  "t": "Keine Strafe ohne Gesetz",
  "b": [
   "str"
  ],
  "w": "Eine Tat kann nur bestraft werden, wenn die Strafbarkeit gesetzlich bestimmt war, bevor die Tat begangen wurde.",
  "e": "Bestraft wird nur, was schon vor der Tat gesetzlich strafbar war.",
  "u": "https://www.gesetze-im-internet.de/stgb/__1.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 15 StGB",
  "g": "StGB",
  "n": "15",
  "a": null,
  "t": "Vorsätzliches und fahrlässiges Handeln",
  "b": [
   "str"
  ],
  "w": "Strafbar ist nur vorsätzliches Handeln, wenn nicht das Gesetz fahrlässiges Handeln ausdrücklich mit Strafe bedroht.",
  "e": "Strafbar ist grundsätzlich nur Vorsatz. Fahrlässigkeit nur, wenn das Gesetz es ausdrücklich sagt.",
  "u": "https://www.gesetze-im-internet.de/stgb/__15.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 20 StGB",
  "g": "StGB",
  "n": "20",
  "a": null,
  "t": "Schuldunfähigkeit wegen seelischer Störungen",
  "b": [
   "str"
  ],
  "w": "Ohne Schuld handelt, wer bei Begehung der Tat wegen einer krankhaften seelischen Störung, wegen einer tiefgreifenden Bewußtseinsstörung oder wegen einer Intelligenzminderung oder einer schweren anderen seelischen Störung unfähig ist, das Unrecht der Tat einzusehen oder nach dieser Einsicht zu handeln.",
  "e": "Wer wegen einer schweren seelischen Störung nicht einsehen kann, dass er Unrecht tut, handelt ohne Schuld.",
  "u": "https://www.gesetze-im-internet.de/stgb/__20.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 23 Abs. 1 StGB",
  "g": "StGB",
  "n": "23",
  "a": null,
  "t": "Strafbarkeit des Versuchs",
  "b": [
   "str"
  ],
  "w": "(1) Der Versuch eines Verbrechens ist stets strafbar, der Versuch eines Vergehens nur dann, wenn das Gesetz es ausdrücklich bestimmt.",
  "e": "Der Versuch eines Verbrechens ist immer strafbar, der eines Vergehens nur, wenn das Gesetz es bestimmt.",
  "u": "https://www.gesetze-im-internet.de/stgb/__23.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 24 Abs. 1 StGB",
  "g": "StGB",
  "n": "24",
  "a": null,
  "t": "Rücktritt",
  "b": [
   "str"
  ],
  "w": "(1) Wegen Versuchs wird nicht bestraft, wer freiwillig die weitere Ausführung der Tat aufgibt oder deren Vollendung verhindert. Wird die Tat ohne Zutun des Zurücktretenden nicht vollendet, so wird er straflos, wenn er sich freiwillig und ernsthaft bemüht, die Vollendung zu verhindern.",
  "e": "Wer freiwillig aufhört oder den Erfolg verhindert, wird nicht wegen Versuchs bestraft.",
  "u": "https://www.gesetze-im-internet.de/stgb/__24.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 25 StGB",
  "g": "StGB",
  "n": "25",
  "a": null,
  "t": "Täterschaft",
  "b": [
   "str"
  ],
  "w": "(1) Als Täter wird bestraft, wer die Straftat selbst oder durch einen anderen begeht. (2) Begehen mehrere die Straftat gemeinschaftlich, so wird jeder als Täter bestraft (Mittäter).",
  "e": "Täter ist, wer die Tat selbst, durch einen anderen oder gemeinsam mit anderen begeht.",
  "u": "https://www.gesetze-im-internet.de/stgb/__25.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 26 StGB",
  "g": "StGB",
  "n": "26",
  "a": null,
  "t": "Anstiftung",
  "b": [
   "str"
  ],
  "w": "Als Anstifter wird gleich einem Täter bestraft, wer vorsätzlich einen anderen zu dessen vorsätzlich begangener rechtswidriger Tat bestimmt hat.",
  "e": "Wer einen anderen zur Tat anstiftet, wird wie der Täter bestraft.",
  "u": "https://www.gesetze-im-internet.de/stgb/__26.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 27 StGB",
  "g": "StGB",
  "n": "27",
  "a": null,
  "t": "Beihilfe",
  "b": [
   "str"
  ],
  "w": "(1) Als Gehilfe wird bestraft, wer vorsätzlich einem anderen zu dessen vorsätzlich begangener rechtswidriger Tat Hilfe geleistet hat. (2) Die Strafe für den Gehilfen richtet sich nach der Strafdrohung für den Täter. Sie ist nach § 49 Abs. 1 zu mildern.",
  "e": "Wer dem Täter hilft, wird milder bestraft als der Täter.",
  "u": "https://www.gesetze-im-internet.de/stgb/__27.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 35 Abs. 1 StGB",
  "g": "StGB",
  "n": "35",
  "a": null,
  "t": "Entschuldigender Notstand",
  "b": [
   "str"
  ],
  "w": "(1) Wer in einer gegenwärtigen, nicht anders abwendbaren Gefahr für Leben, Leib oder Freiheit eine rechtswidrige Tat begeht, um die Gefahr von sich, einem Angehörigen oder einer anderen ihm nahestehenden Person abzuwenden, handelt ohne Schuld. Dies gilt nicht, soweit dem Täter nach den Umständen, namentlich weil er die Gefahr selbst verursacht hat oder weil er in einem besonderen Rechtsverhältnis stand, zugemutet werden konnte, die Gefahr hinzunehmen; jedoch kann die Strafe nach § 49 Abs. 1 gemildert werden, wenn der Täter nicht mit Rücksicht auf ein besonderes Rechtsverhältnis die Gefahr hinzunehmen hatte.",
  "e": "Wer Leben, Körper oder Freiheit von sich oder Nahestehenden nur durch eine Straftat retten kann, handelt ohne Schuld.",

 },

 {

  "t": "Antragsfrist",

  ],

  "k": "§ 126 Abs. 1 StGB",

  "t": "Störung des öffentlichen Friedens durch Androhung von Straftaten",
  "b": [
   "str"
  ],
  "w": "(1) Wer in einer Weise, die geeignet ist, den öffentlichen Frieden zu stören, 1. einen der in § 125a Satz 2 Nr. 1 bis 4 bezeichneten Fälle des Landfriedensbruchs, 2. eine Straftat gegen die sexuelle Selbstbestimmung in den Fällen des § 177 Absatz 4 bis 8 oder des § 178, 3. einen Mord (§ 211), Totschlag (§ 212) oder Völkermord (§ 6 des Völkerstrafgesetzbuches) oder ein Verbrechen gegen die Menschlichkeit (§ 7 des Völkerstrafgesetzbuches) oder ein Kriegsverbrechen (§§ 8, 9, 10, 11 oder 12 des Völkerstrafgesetzbuches), 4. eine gefährliche Körperverletzung (§ 224) oder eine schwere Körperverletzung (§ 226), 5. eine Straftat gegen die persönliche Freiheit in den Fällen des § 232 Absatz 3 Satz 2, des § 232a Absatz 3, 4 oder 5, des § 232b Absatz 3 oder 4, des § 233a Absatz 3 oder 4, jeweils soweit es sich um Verbrechen handelt, der §§ 234 bis 234b, 239a oder 239b, 6. einen Raub oder eine räuberische Erpressung (§§ 249 bis 251 oder 255), 7. ein gemeingefährliches Verbrechen in den Fällen der §§ 306 bis 306c oder 307 Abs. 1 bis 3, des § 308 Absatz 1 bis 4, des § 309 Abs. 1 bis 4, der §§ 313, 314 oder 315 Abs. 3, des § 315b Abs. 3, des § 316a Abs. 1 oder 3, des § 316c Abs. 1 oder 3 oder des § 318 Abs. 3 oder 4 oder 8. ein gemeingefährliches Vergehen in den Fällen des § 309 Abs. 6, des § 311 Abs. 1, des § 316b Abs. 1, des § 317 Abs. 1 oder des § 318 Abs. 1 androht, wird mit Freiheitsstrafe bis zu drei Jahren oder mit Geldstrafe bestraft.",
  "e": "Wer mit schweren Straftaten droht und damit die Allgemeinheit beunruhigt, macht sich strafbar – etwa mit einer Bombendrohung.",

 {

  "t": "Mißbrauch von Titeln, Berufsbezeichnungen und Abzeichen",

  ],
  "w": "(1) Wer unbefugt 1. inländische oder ausländische Amts- oder Dienstbezeichnungen, akademische Grade, Titel oder öffentliche Würden führt, 2. die Berufsbezeichnung Arzt, Zahnarzt, Psychologischer Psychotherapeut, Kinder- und Jugendlichenpsychotherapeut, Psychotherapeut, Tierarzt, Apotheker, Rechtsanwalt, Patentanwalt, Wirtschaftsprüfer, vereidigter Buchprüfer, Steuerberater oder Steuerbevollmächtigter führt, 3. die Bezeichnung öffentlich bestellter Sachverständiger führt oder 4. inländische oder ausländische Uniformen, Amtskleidungen oder Amtsabzeichen trägt, wird mit Freiheitsstrafe bis zu einem Jahr oder mit Geldstrafe bestraft. (2) Den in Absatz 1 genannten Bezeichnungen, akademischen Graden, Titeln, Würden, Uniformen, Amtskleidungen oder Amtsabzeichen stehen solche gleich, die ihnen zum Verwechseln ähnlich sind.",
  "e": "Fremde Titel, Uniformen oder Amtsabzeichen darf man nicht führen – auch keine zum Verwechseln ähnlichen.",

  "w": "(1) Wer von dem Vorhaben oder der Ausführung 1. (weggefallen) 2. eines Hochverrats in den Fällen der §§ 81 bis 83 Abs. 1, 3. eines Landesverrats oder einer Gefährdung der äußeren Sicherheit in den Fällen der §§ 94 bis 96, 97a oder 100, 4. einer Geld- oder Wertpapierfälschung in den Fällen der §§ 146, 151, 152 oder einer Fälschung von Zahlungskarten mit Garantiefunktion in den Fällen des § 152b Abs. 1 bis 3, 5. eines Mordes (§ 211) oder Totschlags (§ 212) oder eines Völkermordes (§ 6 des Völkerstrafgesetzbuches) oder eines Verbrechens gegen die Menschlichkeit (§ 7 des Völkerstrafgesetzbuches) oder eines Kriegsverbrechens (§§ 8, 9, 10, 11 oder 12 des Völkerstrafgesetzbuches) oder eines Verbrechens der Aggression (§ 13 des Völkerstrafgesetzbuches), 6. einer Straftat gegen die persönliche Freiheit in den Fällen des § 232 Absatz 3 Satz 2, des § 232a Absatz 3, 4 oder 5, des § 232b Absatz 3 oder 4, des § 233a Absatz 3 oder 4, jeweils soweit es sich um Verbrechen handelt, der §§ 234 bis 234b, 239a oder 239b, 7. eines Raubes oder einer räuberischen Erpressung (§§ 249 bis 251 oder 255) oder 8. einer gemeingefährlichen Straftat in den Fällen der §§ 306 bis 306c oder 307 Abs. 1 bis 3, des § 308 Absatz 1 bis 5, des § 309 Abs. 1 bis 5, der §§ 310, 313, 314 oder 315 Abs. 3, des § 315b Abs. 3 oder der §§ 316a oder 316c zu einer Zeit, zu der die Ausführung oder der Erfolg noch abgewendet werden kann, glaubhaft erfährt und es unterläßt, der Behörde oder dem Bedrohten rechtzeitig Anzeige zu machen, wird mit Freiheitsstrafe bis zu fünf Jahren oder mit Geldstrafe bestraft.",
  "e": "Wer von bestimmten geplanten schweren Straftaten erfährt und sie nicht rechtzeitig anzeigt, macht sich strafbar.",

 {
  "k": "§ 201 Abs. 1 StGB",

  "t": "Verletzung der Vertraulichkeit des Wortes",
  "b": [

  ],

  "e": "Vertrauliche Gespräche darf man nicht heimlich aufnehmen oder solche Aufnahmen weitergeben.",
