<script>
/* Sachgebiet 4b: Umgang mit Waffen. Eigene prüfungsnahe Übungsfragen – keine Original-IHK-Fragen.
   Das Waffenrecht wurde 2024 geändert – Detailfragen am aktuellen Gesetzestext gegenprüfen. */
SK.fragen("waf", [
  { u: "begriffe", d: 1, q: "Was bedeutet „Führen“ einer Waffe im Sinne des Waffengesetzes?", o: ["Die tatsächliche Gewalt über die Waffe außerhalb der eigenen Wohnung, der Geschäftsräume, des eigenen befriedeten Besitztums oder einer Schießstätte ausüben", ["Die Waffe im Tresor zu Hause aufbewahren", "Das ist Besitz, kein Führen."], ["Die Waffe im Geschäft kaufen", "Das ist Erwerben."], ["Die Waffe einem Kollegen geben", "Das ist Überlassen."]], e: "Führen knüpft an den Ort an: außerhalb des eigenen geschützten Bereichs.", r: "Anlage 1 Abschnitt 2 WaffG" },
  { u: "begriffe", d: 1, q: "Was bedeutet „Erwerben“ einer Waffe?", o: ["Die tatsächliche Gewalt über die Waffe erlangen", ["Den Kaufvertrag unterschreiben", "Entscheidend ist die tatsächliche Gewalt, nicht der Vertrag."], ["Die Waffe im Schaufenster ansehen", "Dabei erlangt man keine tatsächliche Gewalt."], ["Die Waffe abgeben", "Das ist Überlassen."]], e: "Erwerben ist rein tatsächlich zu verstehen – auch durch Leihe oder Fund.", r: "Anlage 1 Abschnitt 2 WaffG" },
  { u: "begriffe", t: "zu", d: 2, q: "Ordne jedem waffenrechtlichen Begriff die Bedeutung zu.", p: [["Erwerben", "tatsächliche Gewalt erlangen"], ["Besitzen", "tatsächliche Gewalt ausüben"], ["Überlassen", "tatsächliche Gewalt einem anderen einräumen"], ["Führen", "tatsächliche Gewalt außerhalb des eigenen geschützten Bereichs ausüben"]], e: "Diese vier Begriffe stehen in Anlage 1 zum WaffG." },
  { u: "begriffe", t: "mc", d: 2, q: "Welche zwei Gegenstände sind Waffen im Sinne des § 1 WaffG?", o: ["Schusswaffen", "Hieb- und Stoßwaffen wie der Schlagstock", ["Ein Küchenmesser in der Küche", "Es ist ein Gebrauchsgegenstand, kein zum Verletzen bestimmter Gegenstand."], ["Eine Taschenlampe", "Sie ist nicht dazu bestimmt, die Angriffs- oder Abwehrfähigkeit herabzusetzen."]], e: "Waffen sind Schusswaffen und gleichgestellte Gegenstände sowie tragbare Gegenstände, die ihrem Wesen nach dazu bestimmt sind, die Angriffs- oder Abwehrfähigkeit von Menschen zu beseitigen oder herabzusetzen.", r: "§ 1 Abs. 2 WaffG" },
  { u: "begriffe", d: 2, q: "Was regelt das Waffengesetz nach § 1 Abs. 1?", o: ["Den Umgang mit Waffen und Munition unter Berücksichtigung der Belange der öffentlichen Sicherheit und Ordnung", ["Die Ausbildung der Polizei an Waffen", "Für Behörden gelten Sonderregeln."], ["Die Herstellung von Kriegswaffen", "Dafür gilt das Kriegswaffenkontrollgesetz."], ["Die Notwehr mit Waffen", "Notwehr ist im StGB und BGB geregelt."]], e: "Umgang umfasst u. a. Erwerben, Besitzen, Überlassen, Führen, Verbringen, Mitnehmen, Schießen, Herstellen und Handeltreiben.", r: "§ 1 WaffG" },
  { u: "begriffe", t: "tf", d: 2, a: true, q: "Wer eine Schusswaffe von der Waffenkammer des Unternehmens zum Einsatzort bei sich trägt, führt sie im Sinne des Waffengesetzes.", e: "Die tatsächliche Gewalt wird außerhalb der Geschäftsräume ausgeübt.", r: "Anlage 1 WaffG" },
  { u: "begriffe", d: 2, q: "Was ist nach dem Waffengesetz eine Schusswaffe?", o: ["Ein Gegenstand, bei dem Geschosse durch einen Lauf getrieben werden und der u. a. zu Angriff, Verteidigung, Signalgebung, Jagd oder Sport bestimmt ist", ["Jeder Gegenstand, den man werfen kann", "Das genügt nicht."], ["Nur militärische Gewehre", "Der Begriff ist weiter."], ["Jedes Messer", "Messer sind keine Schusswaffen."]], e: "Auch Schreckschuss-, Reizstoff- und Signalwaffen sind Schusswaffen; für sie gelten Erleichterungen.", r: "Anlage 1 Abschnitt 1 WaffG" },

  { u: "erlaubnis", d: 1, q: "Ab welchem Alter ist der Umgang mit Waffen grundsätzlich gestattet?", o: ["Ab 18 Jahren", ["Ab 14 Jahren", "Die Grundregel verlangt Volljährigkeit."], ["Ab 16 Jahren", "Die Grundregel verlangt Volljährigkeit."], ["Ab 21 Jahren", "Die Grundregel liegt bei 18."]], e: "§ 2 Abs. 1 WaffG: Der Umgang mit Waffen oder Munition ist nur Personen gestattet, die das 18. Lebensjahr vollendet haben.", r: "§ 2 Abs. 1 WaffG" },
  { u: "erlaubnis", d: 1, q: "Wozu berechtigt die Waffenbesitzkarte?", o: ["Zum Erwerb und Besitz von Schusswaffen", ["Zum Führen von Schusswaffen in der Öffentlichkeit", "Dafür ist der Waffenschein nötig."], ["Zum Schießen außerhalb von Schießstätten", "Dafür ist eine Schießerlaubnis nötig."], ["Zum Handel mit Waffen", "Dafür ist eine Waffenhandelserlaubnis nötig."]], e: "Die Erlaubnis zum Erwerb und Besitz wird durch eine Waffenbesitzkarte erteilt.", r: "§ 10 Abs. 1 WaffG" },
  { u: "erlaubnis", d: 1, q: "Wozu berechtigt der Waffenschein?", o: ["Zum Führen einer Schusswaffe", ["Zum Besitz beliebig vieler Waffen", "Besitz wird über die Waffenbesitzkarte erlaubt."], ["Zum Kauf von verbotenen Waffen", "Verbotene Waffen bleiben verboten."], ["Zur Anwendung unmittelbaren Zwangs", "Der Waffenschein verleiht keine Eingriffsbefugnisse."]], e: "Die Erlaubnis zum Führen einer Waffe wird durch einen Waffenschein erteilt.", r: "§ 10 Abs. 4 WaffG" },
  { u: "erlaubnis", d: 2, q: "Wozu berechtigt der Kleine Waffenschein?", o: ["Zum Führen von Schreckschuss-, Reizstoff- und Signalwaffen mit Zulassungszeichen", ["Zum Führen scharfer Kurzwaffen bis Kaliber 6,35 mm", "Scharfe Waffen erfordern den Waffenschein."], ["Zum Führen dieser Waffen auch bei Volksfesten", "Bei öffentlichen Veranstaltungen gilt das Führverbot des § 42 WaffG."], ["Zum Erwerb von Waffen unter 18 Jahren", "Er ändert nichts an den Altersgrenzen."]], e: "Erwerb und Besitz dieser Waffen sind ab 18 erlaubnisfrei; das Führen erfordert den Kleinen Waffenschein.", r: "§ 10 Abs. 4 Satz 4 WaffG" },
  { u: "erlaubnis", t: "mc", d: 2, q: "Welche zwei Voraussetzungen nennt § 4 WaffG für eine waffenrechtliche Erlaubnis?", o: ["Zuverlässigkeit und persönliche Eignung", "Nachweis eines Bedürfnisses", ["Mitgliedschaft in einer Partei", "Das ist keine Voraussetzung."], ["Abgeschlossene Berufsausbildung", "Das ist keine Voraussetzung."]], e: "Voraussetzungen: Vollendung des 18. Lebensjahres, Zuverlässigkeit, persönliche Eignung, Sachkunde, Bedürfnis; beim Waffenschein zusätzlich eine Haftpflichtversicherung.", r: "§ 4 Abs. 1 WaffG" },
  { u: "erlaubnis", d: 2, q: "Wer besitzt nach § 5 WaffG in der Regel nicht die erforderliche Zuverlässigkeit?", o: ["Wer wegen einer vorsätzlichen Straftat zu einer Freiheitsstrafe verurteilt wurde, solange die gesetzlichen Fristen nicht abgelaufen sind", ["Wer keinen Führerschein hat", "Das ist kein Kriterium."], ["Wer Mieter einer Wohnung ist", "Das ist kein Kriterium."], ["Wer älter als 50 Jahre ist", "Das Alter ist kein Unzuverlässigkeitsgrund."]], e: "§ 5 WaffG nennt absolute und regelmäßige Unzuverlässigkeitsgründe, u. a. bestimmte Verurteilungen und die Annahme, dass Waffen missbräuchlich oder leichtfertig verwendet werden.", r: "§ 5 WaffG" },
  { u: "erlaubnis", d: 2, q: "Wie weist man die waffenrechtliche Sachkunde nach?", o: ["Durch eine Prüfung vor der zuständigen Stelle oder eine anerkannte Ausbildung bzw. Tätigkeit", ["Durch die Sachkundeprüfung nach § 34a GewO", "Diese ist eine gewerberechtliche Prüfung und ersetzt die Waffensachkunde nicht."], ["Durch eine eidesstattliche Versicherung", "Das genügt nicht."], ["Gar nicht – sie wird vermutet", "Sie ist nachzuweisen."]], e: "Die Waffensachkunde (§ 7 WaffG) ist von der Sachkunde nach § 34a GewO streng zu unterscheiden.", r: "§ 7 WaffG" },
  { u: "erlaubnis", d: 3, q: "Für welche Dauer wird ein Waffenschein höchstens erteilt?", o: ["Für höchstens drei Jahre; er kann zweimal um höchstens je drei Jahre verlängert werden.", ["Unbefristet", "Der Waffenschein ist befristet."], ["Für ein Jahr ohne Verlängerungsmöglichkeit", "Die Höchstdauer beträgt drei Jahre mit Verlängerung."], ["Für zehn Jahre", "Die Höchstdauer beträgt drei Jahre."]], e: "Die Befristung stellt sicher, dass das Bedürfnis regelmäßig überprüft wird.", r: "§ 10 Abs. 4 WaffG" },
  { u: "erlaubnis", t: "mc", d: 2, q: "Welche zwei Aussagen zu waffenrechtlichen Erlaubnissen sind richtig?", o: ["Die Waffenbesitzkarte berechtigt nicht zum Führen.", "Für den Waffenschein muss ein Bedürfnis nachgewiesen werden.", ["Der Waffenschein gilt automatisch für alle Kollegen mit.", "Erlaubnisse sind personenbezogen."], ["Mit dem Kleinen Waffenschein darf man scharfe Waffen führen.", "Er gilt nur für Schreckschuss-, Reizstoff- und Signalwaffen."]], e: "Waffenbesitzkarte: Erwerb und Besitz. Waffenschein: Führen.", r: "§§ 4, 8, 10 WaffG" },
  { u: "erlaubnis", t: "tf", d: 1, a: false, q: "Wer die Sachkundeprüfung nach § 34a GewO bestanden hat, darf im Dienst automatisch eine Schusswaffe führen.", e: "Dafür sind waffenrechtliche Erlaubnisse, die Zustimmung der Behörde nach § 28 WaffG und die Zustimmung des Gewerbetreibenden erforderlich.", r: "§ 28 WaffG; § 17 BewachV" },
  { u: "erlaubnis", t: "tf", d: 2, a: true, q: "Die Behörde überprüft Inhaber waffenrechtlicher Erlaubnisse in regelmäßigen Abständen erneut auf Zuverlässigkeit und persönliche Eignung.", e: "§ 4 Abs. 3 WaffG sieht eine Regelüberprüfung vor, mindestens nach Ablauf von drei Jahren.", r: "§ 4 Abs. 3 WaffG" },
  { u: "erlaubnis", t: "fa", d: 2, q: "Nenne die Voraussetzungen für die Erteilung einer waffenrechtlichen Erlaubnis nach § 4 WaffG.", m: "Der Antragsteller muss das 18. Lebensjahr vollendet haben, die erforderliche Zuverlässigkeit (§ 5) und persönliche Eignung (§ 6) besitzen, die erforderliche Sachkunde nachgewiesen haben (§ 7) und ein Bedürfnis nachweisen (§ 8). Für den Waffenschein und die Schießerlaubnis ist außerdem eine Haftpflichtversicherung nachzuweisen.", c: ["18 Jahre", "Zuverlässigkeit", "persönliche Eignung", "Sachkunde", "Bedürfnis", "Haftpflichtversicherung beim Waffenschein"] },

  { u: "bewachung", d: 2, q: "Wann wird nach § 28 WaffG bei einem Bewachungsunternehmer ein Bedürfnis für Schusswaffen anerkannt?", o: ["Wenn er glaubhaft macht, dass Bewachungsaufträge wahrgenommen werden oder werden sollen, die aus Gründen der Sicherung einer gefährdeten Person oder eines gefährdeten Objekts Schusswaffen erfordern", ["Immer, sobald er eine Erlaubnis nach § 34a GewO hat", "Die Gewerbeerlaubnis begründet kein waffenrechtliches Bedürfnis."], ["Wenn seine Mitarbeiter sich mit Waffe sicherer fühlen", "Ein subjektives Sicherheitsgefühl genügt nicht."], ["Wenn der Auftraggeber die Waffen bezahlt", "Die Kostenfrage ist nicht maßgeblich."]], e: "§ 28 WaffG ist die Sonderregel für das Bewachungsgewerbe.", r: "§ 28 Abs. 1 WaffG" },
  { u: "bewachung", d: 2, q: "Wann darf eine Schusswaffe nach § 28 WaffG im Bewachungsgewerbe geführt werden?", o: ["Nur bei der tatsächlichen Durchführung eines konkreten Auftrags, der Schusswaffen erfordert", ["Jederzeit, auch privat nach Feierabend", "Die Erlaubnis ist auf den Auftrag bezogen."], ["Bei jedem beliebigen Bewachungsauftrag", "Es muss ein Auftrag mit anerkanntem Bedürfnis sein."], ["Nur auf dem Weg zur Arbeit", "Maßgeblich ist der konkrete Auftrag."]], e: "Die Schusswaffe darf nur bei der Durchführung eines Auftrags nach § 28 Abs. 1 WaffG geführt werden.", r: "§ 28 Abs. 2 WaffG" },
  { u: "bewachung", d: 3, q: "Was muss der Bewachungsunternehmer tun, bevor eine Wachperson eine Schusswaffe des Unternehmens führen darf?", o: ["Er muss die Wachperson der zuständigen Behörde benennen und deren Zustimmung abwarten.", ["Nichts – seine eigene Erlaubnis gilt für alle Beschäftigten", "Die Behörde prüft jede Wachperson."], ["Er muss die Wachperson der IHK melden.", "Zuständig ist die Waffenbehörde."], ["Er muss die Waffe auf die Wachperson überschreiben.", "Die Waffe bleibt dem Unternehmen zugeordnet."]], e: "Die Behörde prüft Zuverlässigkeit, persönliche Eignung und Sachkunde der benannten Wachperson und erteilt die Zustimmung.", r: "§ 28 Abs. 3 WaffG" },
  { u: "bewachung", d: 2, f: 1, q: "Eine Wachperson mit privatem Jagdschein möchte ihre eigene Pistole im Objektschutz tragen, weil sie sich damit sicherer fühlt. Ist das zulässig?", o: ["Nein. Im Wachdienst dürfen Waffen nur nach § 28 WaffG und mit Zustimmung des Gewerbetreibenden geführt werden.", ["Ja, der Jagdschein genügt.", "Der Jagdschein berechtigt nicht zum Führen im Bewachungsdienst."], ["Ja, wenn die Waffe verdeckt getragen wird.", "Die Trageweise ändert nichts."], ["Ja, wenn der Auftraggeber einverstanden ist.", "Der Auftraggeber kann waffenrechtliche Erlaubnisse nicht ersetzen."]], e: "Privat erteilte Erlaubnisse sind an ihr jeweiliges Bedürfnis gebunden und decken den Wachdienst nicht.", r: "§ 28 WaffG; § 17 BewachV" },
  { u: "bewachung", t: "mc", d: 2, q: "Welche zwei Pflichten gelten nach einem Waffengebrauch im Wachdienst?", o: ["Die Wachperson zeigt den Gebrauch unverzüglich der Polizei und dem Gewerbetreibenden an.", "Der Gewerbetreibende zeigt den Gebrauch unverzüglich der für § 34a GewO zuständigen Behörde an.", ["Die Waffe ist sofort zu reinigen, um Spuren zu beseitigen.", "Das würde Beweismittel vernichten."], ["Der Vorfall ist nur im Kollegenkreis zu besprechen.", "Es bestehen gesetzliche Anzeigepflichten."]], e: "Die Anzeigepflichten ergeben sich aus § 17 Abs. 1 und § 20 Abs. 2 BewachV.", r: "§§ 17, 20 BewachV" },
  { u: "bewachung", t: "tf", d: 2, a: true, q: "Nach Beendigung des Wachdienstes sind Waffen und Munition ordnungsgemäß zurückzugeben.", e: "Der Gewerbetreibende hat die Rückgabe sicherzustellen und ist für die sichere Aufbewahrung verantwortlich.", r: "§ 20 Abs. 1 BewachV" },
  { u: "bewachung", t: "tf", d: 2, a: false, q: "Das Tragen einer Schusswaffe gibt der Wachperson das Recht, sie zur Durchsetzung des Hausrechts einzusetzen.", e: "Die Waffe verleiht keine Befugnisse. Ihr Einsatz ist nur in den engen Grenzen von Notwehr und Notstand als letztes Mittel denkbar.", r: "§ 32 StGB; § 34a Abs. 5 GewO" },
  { u: "bewachung", t: "fa", d: 3, q: "Unter welchen Voraussetzungen darf eine Wachperson im Dienst eine Schusswaffe führen?", m: "Der Bewachungsunternehmer muss ein waffenrechtliches Bedürfnis nach § 28 WaffG nachweisen: Bewachungsaufträge, die wegen der Gefährdung einer Person oder eines Objekts Schusswaffen erfordern. Er benötigt die entsprechenden waffenrechtlichen Erlaubnisse. Die Wachperson muss der Waffenbehörde benannt werden; diese prüft Zuverlässigkeit, persönliche Eignung und Sachkunde und muss zustimmen. Die Waffe darf nur bei der Durchführung des konkreten Auftrags und nach Weisung geführt werden. Nach der BewachV ist die Zustimmung des Gewerbetreibenden nötig; die UVV verlangt eine ausdrückliche Anordnung, Ausbildung an der Waffe und regelmäßige Schießübungen.", c: ["Bedürfnis nach § 28 WaffG", "Erlaubnis des Unternehmers", "Benennung und Zustimmung der Behörde", "nur konkreter Auftrag", "Zustimmung/Anordnung des Unternehmers", "Sachkunde und Schießübungen"] },

  { u: "verbote", d: 2, q: "Was gilt nach § 42 WaffG für öffentliche Veranstaltungen wie Volksfeste, Sportveranstaltungen oder Märkte?", o: ["Teilnehmer dürfen dort grundsätzlich keine Waffen führen.", ["Waffen dürfen geführt werden, wenn sie verdeckt getragen werden.", "Das Verbot gilt unabhängig von der Trageweise."], ["Das Verbot gilt nur für Schusswaffen über 9 mm.", "Es gilt für Waffen im Sinne des § 1 Abs. 2 WaffG."], ["Wachpersonen sind vom Verbot automatisch ausgenommen.", "Ausnahmen kann nur die zuständige Behörde zulassen."]], e: "Die Behörde kann Ausnahmen zulassen. Der Kleine Waffenschein hebt das Verbot nicht auf.", r: "§ 42 WaffG" },
  { u: "verbote", t: "mc", d: 2, q: "Welche zwei Gegenstände gehören zu den verbotenen Waffen nach Anlage 2 WaffG?", o: ["Schlagring", "Butterflymesser", ["Schlagstock aus Gummi", "Er ist eine erlaubnisfreie Hieb- und Stoßwaffe, aber kein verbotener Gegenstand."], ["Reizstoffsprühgerät mit amtlichem Prüfzeichen", "Mit Prüfzeichen ist es zugelassen."]], e: "Verboten sind u. a. Schlagringe, Stahlruten, Totschläger, Wurfsterne, Butterfly- und Faustmesser.", r: "Anlage 2 Abschnitt 1 WaffG" },
  { u: "verbote", d: 2, q: "Was verbietet § 42a WaffG?", o: ["Das Führen von Anscheinswaffen, Hieb- und Stoßwaffen sowie bestimmten Messern, sofern kein berechtigtes Interesse vorliegt", ["Den Besitz jeder Art von Messern", "Verboten ist das Führen bestimmter Gegenstände, nicht jeder Besitz."], ["Das Führen von Taschenlampen", "Taschenlampen sind nicht erfasst."], ["Den Verkauf von Sportwaffen", "Das regelt § 42a WaffG nicht."]], e: "Erfasst sind u. a. Einhandmesser und feststehende Messer mit einer Klingenlänge über 12 cm. Ein berechtigtes Interesse kann die Berufsausübung sein.", r: "§ 42a WaffG" },
  { u: "verbote", d: 2, f: 1, q: "Bei der Einlasskontrolle eines Konzerts wird bei einem Besucher ein Schlagring gefunden. Wie handelt die Wachperson richtig?", o: ["Einlass verweigern und die Polizei verständigen – der Schlagring ist ein verbotener Gegenstand.", ["Den Schlagring einbehalten und nach dem Konzert zurückgeben.", "Damit würde sie selbst Besitz an einem verbotenen Gegenstand ausüben und ihn wieder überlassen."], ["Den Besucher mit Schlagring einlassen, wenn er verspricht, ihn nicht zu benutzen.", "Das widerspricht Schutzauftrag und Gesetz."], ["Den Schlagring beschlagnahmen und vernichten.", "Beschlagnahme ist hoheitlich."]], e: "Schon der Besitz ist strafbar (§ 52 WaffG). Die Sicherstellung ist Sache der Polizei.", r: "Anlage 2 WaffG; § 52 WaffG" },
  { u: "verbote", t: "mc", d: 3, q: "Welche zwei Aussagen zum Führen von Waffen bei öffentlichen Veranstaltungen sind richtig?", o: ["Das Verbot des § 42 WaffG gilt auch für Inhaber eines Kleinen Waffenscheins.", "Die zuständige Behörde kann im Einzelfall Ausnahmen zulassen.", ["Der Veranstalter kann das Verbot durch die Hausordnung aufheben.", "Ein gesetzliches Verbot kann privat nicht aufgehoben werden."], ["Das Verbot gilt nur für Besucher unter 18 Jahren.", "Es gilt für alle Teilnehmer."]], e: "Wer als Sicherheitsdienst bei Veranstaltungen Waffen führen soll, braucht eine behördliche Ausnahme.", r: "§ 42 WaffG" },
  { u: "verbote", t: "tf", d: 2, a: true, q: "Elektroimpulsgeräte ohne amtliches Prüfzeichen gehören zu den verbotenen Waffen.", e: "Zugelassen sind nur Geräte mit Prüfzeichen; die übrigen sind nach Anlage 2 verboten.", r: "Anlage 2 WaffG" },
  { u: "verbote", t: "tf", d: 1, a: false, q: "Verbotene Waffen dürfen von Wachpersonen im Dienst besessen werden, wenn der Arbeitgeber zustimmt.", e: "Das Verbot gilt für jedermann. Der Arbeitgeber kann davon nicht befreien.", r: "§ 2 Abs. 3 WaffG; Anlage 2 WaffG" },

  { u: "pflichten", d: 2, q: "Welche Dokumente muss mitführen, wer eine erlaubnispflichtige Schusswaffe führt?", o: ["Personalausweis oder Pass und die waffenrechtliche Erlaubnisurkunde", ["Nur den Dienstausweis des Unternehmens", "Der Dienstausweis ersetzt weder Ausweis noch Erlaubnis."], ["Nur den Kaufbeleg der Waffe", "Der Kaufbeleg ist kein Erlaubnisdokument."], ["Keine – die Polizei kann alles elektronisch abfragen", "Das Gesetz verlangt das Mitführen."]], e: "Die Dokumente sind Polizeibeamten und sonst zur Personenkontrolle Befugten auf Verlangen zur Prüfung auszuhändigen.", r: "§ 38 WaffG" },
  { u: "pflichten", d: 2, q: "Was verlangt § 36 WaffG vom Besitzer von Waffen und Munition?", o: ["Die erforderlichen Vorkehrungen, damit sie nicht abhandenkommen oder Dritte sie unbefugt an sich nehmen", ["Die Aufbewahrung griffbereit unter dem Kopfkissen", "Das ist keine sichere Aufbewahrung."], ["Die Aufbewahrung im verschlossenen Auto", "Ein Fahrzeug ist kein zulässiger Aufbewahrungsort."], ["Keine besonderen Maßnahmen", "Das Gesetz verlangt sichere Aufbewahrung."]], e: "§ 36 Abs. 1 WaffG enthält die Grundpflicht. Die Einzelheiten – ungeladen, in einem zertifizierten Sicherheitsbehältnis – regelt § 13 der Allgemeinen Waffengesetz-Verordnung.", r: "§ 36 Abs. 1 WaffG; § 13 AWaffV" },
  { u: "pflichten", d: 2, q: "Was droht bei unerlaubtem Führen einer erlaubnispflichtigen Schusswaffe?", o: ["Eine Strafe nach den Strafvorschriften des Waffengesetzes", ["Nur eine mündliche Verwarnung", "Es handelt sich um eine Straftat."], ["Nichts, wenn die Waffe nicht benutzt wird", "Schon das Führen ohne Erlaubnis ist strafbar."], ["Nur der Entzug des Dienstausweises", "Es drohen strafrechtliche Folgen."]], e: "Die §§ 51 und 52 WaffG enthalten Strafvorschriften, § 53 WaffG Bußgeldvorschriften.", r: "§§ 51–53 WaffG" },
  { u: "pflichten", t: "mc", d: 2, q: "Welche zwei Folgen kann ein Verstoß gegen das Waffengesetz haben?", o: ["Freiheits- oder Geldstrafe bzw. Geldbuße", "Widerruf der waffenrechtlichen Erlaubnis wegen Unzuverlässigkeit", ["Automatische Beförderung", "Das ist keine Rechtsfolge."], ["Verlängerung des Waffenscheins", "Ein Verstoß führt eher zum Widerruf."]], e: "Waffenrechtliche Verstöße gefährden außerdem die gewerberechtliche Zuverlässigkeit nach § 34a GewO.", r: "§§ 45, 51–53 WaffG" },
  { u: "pflichten", t: "tf", d: 2, a: true, q: "Das Abhandenkommen einer erlaubnispflichtigen Waffe ist der zuständigen Behörde unverzüglich anzuzeigen.", e: "Die Anzeigepflicht bei Verlust ergibt sich aus dem Waffengesetz; im Unternehmen ist zusätzlich sofort der Vorgesetzte zu informieren.", r: "§ 37b WaffG" },
  { u: "pflichten", d: 2, f: 1, q: "Bei der Schichtübergabe will ein Kollege der ablösenden Wachperson seine geladene Dienstpistole in die Hand drücken. Was ist richtig?", o: ["Schusswaffen dürfen nur entladen übergeben werden; die übernehmende Person überzeugt sich sofort vom Ladezustand.", ["Die Übergabe geladen ist üblich und zulässig.", "Die Unfallverhütungsvorschrift verlangt die Übergabe im entladenen Zustand."], ["Die Waffe wird auf den Tisch geworfen.", "Das ist gefährlich und unzulässig."], ["Die Waffe wird im Holster gewechselt, ohne sie zu prüfen.", "Der Ladezustand ist sofort zu prüfen."]], e: "Das Laden und Entladen erfolgt an sicherem Ort mit Kugelfangeinrichtung.", r: "§ 21 DGUV Vorschrift 23" },

  { u: "mittel", d: 2, q: "Wie ist ein Schlagstock waffenrechtlich einzuordnen?", o: ["Als Hieb- und Stoßwaffe", ["Als Schusswaffe", "Er verschießt keine Geschosse."], ["Als verbotener Gegenstand", "Er ist nicht generell verboten, sein Führen aber eingeschränkt."], ["Als Werkzeug ohne waffenrechtliche Bedeutung", "Er ist seinem Wesen nach zum Verletzen bestimmt."]], e: "Hieb- und Stoßwaffen dürfen ab 18 erworben werden; das Führen ist nach § 42a WaffG nur bei berechtigtem Interesse erlaubt, bei öffentlichen Veranstaltungen nach § 42 WaffG verboten.", r: "§ 1 Abs. 2, §§ 42, 42a WaffG" },
  { u: "mittel", d: 2, q: "Unter welcher Voraussetzung darf ein Reizstoffsprühgerät gegen einen Menschen eingesetzt werden?", o: ["Nur wenn ein Rechtfertigungsgrund wie Notwehr vorliegt und der Einsatz erforderlich ist", ["Immer zur Durchsetzung eines Hausverbots", "Ein Hausverbot allein rechtfertigt den Einsatz nicht."], ["Wenn die Person unhöflich ist", "Unhöflichkeit ist kein Angriff."], ["Als Warnung vor jeder Ansprache", "Das wäre eine strafbare Körperverletzung."]], e: "Der Einsatz erfüllt den Tatbestand der gefährlichen Körperverletzung und ist nur gerechtfertigt, wenn ein gegenwärtiger rechtswidriger Angriff nicht milder abgewehrt werden kann.", r: "§§ 32, 224 StGB" },
  { u: "mittel", d: 3, q: "Was gilt für sogenannte Tierabwehrsprays (Pfefferspray mit entsprechender Kennzeichnung)?", o: ["Sie gelten wegen ihrer Zweckbestimmung zur Tierabwehr nach verbreiteter Auffassung nicht als Waffen im Sinne des WaffG; gegen Menschen dürfen sie nur in Notwehr oder Notstand eingesetzt werden.", ["Sie dürfen frei gegen Menschen eingesetzt werden.", "Der Einsatz gegen Menschen ist ohne Rechtfertigung strafbar."], ["Sie sind verbotene Waffen.", "Als Tierabwehrgeräte gekennzeichnet sind sie nicht verboten."], ["Sie erfordern einen Waffenschein.", "Ein Waffenschein ist nicht erforderlich."]], e: "Nach § 1 Abs. 2 Nr. 2 Buchst. a WaffG sind Waffen Gegenstände, die dazu bestimmt sind, die Angriffs- oder Abwehrfähigkeit von Menschen zu beseitigen oder herabzusetzen. Tierabwehrsprays haben diese Bestimmung nicht. Das Gesetz regelt sie nicht ausdrücklich; die Einordnung beruht auf Auslegung. Im Dienst gilt zusätzlich: nur mit Zustimmung des Gewerbetreibenden.", r: "§ 1 Abs. 2 WaffG (Auslegung); §§ 32, 34 StGB; § 17 BewachV" },
  { u: "mittel", t: "mc", d: 2, q: "Welche zwei Wirkungen und Risiken hat der Einsatz von Reizstoffen?", o: ["Reizung von Augen und Atemwegen des Getroffenen", "Gefährdung Unbeteiligter und der eigenen Person in geschlossenen Räumen oder bei Wind", ["Sichere sofortige Kampfunfähigkeit jeder Person", "Die Wirkung ist unsicher, besonders bei Alkohol- oder Drogeneinfluss."], ["Keinerlei gesundheitliche Gefahr", "Bei Vorerkrankungen sind ernste Folgen möglich."]], e: "Nach dem Einsatz ist Erste Hilfe zu leisten und bei Bedarf der Rettungsdienst zu rufen.", r: "Rahmenplan 4b" },
  { u: "mittel", d: 2, f: 1, q: "Eine Wachperson im Veranstaltungsdienst möchte einen Teleskopschlagstock am Gürtel tragen. Was ist zu beachten?", o: ["Bei öffentlichen Veranstaltungen ist das Führen von Waffen nach § 42 WaffG grundsätzlich verboten; außerdem ist die Zustimmung des Gewerbetreibenden nötig.", ["Das ist immer erlaubt, weil es zur Dienstausrüstung gehört.", "Das Führverbot gilt auch für Sicherheitspersonal ohne behördliche Ausnahme."], ["Es ist erlaubt, wenn der Schlagstock verdeckt getragen wird.", "Verdecktes Tragen ändert nichts am Verbot."], ["Es genügt der Kleine Waffenschein.", "Er gilt nur für Schreckschuss-, Reizstoff- und Signalwaffen."]], e: "Hieb- und Stoßwaffen unterliegen den Führverboten der §§ 42 und 42a WaffG.", r: "§§ 42, 42a WaffG; § 17 BewachV" },
  { u: "mittel", t: "tf", d: 2, a: false, q: "Das Bereithalten und Führen von Schreckschuss- oder Gaswaffen ist bei Wach- und Sicherungsaufgaben nach der Unfallverhütungsvorschrift zulässig.", e: "§ 19 Abs. 4 DGUV Vorschrift 23 erklärt das Bereithalten und Führen von Schreck- oder Gas-Schusswaffen bei Wach- und Sicherungsaufgaben für unzulässig.", r: "§ 19 Abs. 4 DGUV Vorschrift 23" },
  { u: "mittel", t: "fa", d: 2, q: "Warum ist der Einsatz von Waffen und Verteidigungsmitteln für Wachpersonen immer das letzte Mittel?", m: "Weil Wachpersonen keine hoheitlichen Befugnisse haben und jeder Einsatz einen Straftatbestand erfüllt, der nur durch Notwehr oder Notstand gerechtfertigt sein kann. Die Verteidigung muss erforderlich sein, also das mildeste wirksame Mittel. Vorrang haben Deeskalation, Abstand, Rückzug und das Hinzuziehen von Polizei und Kollegen. Der Einsatz birgt Risiken für Unbeteiligte und die eigene Person, die Wirkung ist nicht sicher vorhersehbar, und es folgen Anzeige- und Dokumentationspflichten sowie eine straf- und zivilrechtliche Überprüfung.", c: ["keine Hoheitsrechte", "Rechtfertigung nur über Notwehr/Notstand", "Erforderlichkeit, mildestes Mittel", "Risiken", "Anzeige- und Dokumentationspflicht"] }
]);

<script>
/* Sachgebiet 5: Unfallverhütungsvorschrift Wach- und Sicherungsdienste (DGUV Vorschrift 23).
   Eigene prüfungsnahe Übungsfragen – keine Original-IHK-Fragen.
   Grundlage: Text der DGUV Vorschrift 23 in der Fassung vom 1. Januar 1997 (abgerufen 04.10.2026). */
SK.fragen("uvv", [
  { u: "allg", d: 1, q: "Wofür gilt die DGUV Vorschrift 23?", o: ["Für Wach- und Sicherungstätigkeiten zum Schutz von Personen und Sachwerten", ["Nur für Geldtransporte", "Geldtransporte sind nur ein Teilbereich."], ["Nur für bewaffnete Wachpersonen", "Sie gilt unabhängig von der Bewaffnung."], ["Für alle Arbeitnehmer in Deutschland", "Sie ist eine Spezialvorschrift für Wach- und Sicherungsdienste."]], e: "§ 1 beschreibt den Geltungsbereich.", r: "§ 1 DGUV Vorschrift 23" },
  { u: "allg", d: 1, q: "An wen richten sich die Bestimmungen der DGUV Vorschrift 23, soweit nichts anderes bestimmt ist?", o: ["An Unternehmer und Versicherte", ["Nur an den Unternehmer", "Auch die Versicherten sind Adressaten."], ["Nur an die Versicherten", "Auch der Unternehmer ist Adressat."], ["An den Auftraggeber", "Der Auftraggeber ist nicht Adressat der UVV."]], e: "§ 2: Die Bestimmungen richten sich an Unternehmer und Versicherte.", r: "§ 2 DGUV Vorschrift 23" },
  { u: "allg", d: 2, q: "Was verlangt § 3 der DGUV Vorschrift 23 zur Eignung?", o: ["Wach- und Sicherungstätigkeiten dürfen nur von Versicherten ausgeführt werden, die die erforderlichen Befähigungen besitzen; über die Befähigungen sind Aufzeichnungen zu führen.", ["Jeder Versicherte muss mindestens 1,80 m groß sein.", "Eine solche Anforderung gibt es nicht."], ["Jeder Versicherte muss einen Waffenschein besitzen.", "Das ist keine allgemeine Eignungsvoraussetzung."], ["Die Eignung wird vom Auftraggeber bescheinigt.", "Verantwortlich ist der Unternehmer."]], e: "Die Versicherten dürfen für die Tätigkeit nicht offensichtlich ungeeignet sein.", r: "§ 3 DGUV Vorschrift 23" },
  { u: "allg", d: 2, q: "Was muss der Unternehmer nach § 4 durch Dienstanweisungen regeln?", o: ["Das Verhalten des Wach- und Sicherungspersonals einschließlich des Weitermeldens von Mängeln und besonderen Gefahren", ["Die Höhe der Gehälter", "Das ist nicht Gegenstand der UVV."], ["Die Urlaubsplanung", "Das ist nicht Gegenstand der UVV."], ["Die Preise gegenüber dem Auftraggeber", "Das ist nicht Gegenstand der UVV."]], e: "Die Dienstanweisung nach der UVV dient der Arbeitssicherheit.", r: "§ 4 Abs. 1 DGUV Vorschrift 23" },
  { u: "allg", t: "mc", d: 2, q: "Welche zwei Pflichten haben die Versicherten nach § 4 Abs. 3?", o: ["Die der Arbeitssicherheit dienenden Maßnahmen unterstützen und die Dienstanweisungen befolgen", "Keine Weisungen des Auftraggebers befolgen, die dem Sicherungsauftrag entgegenstehen", ["Die Dienstanweisungen selbst verfassen", "Das ist Aufgabe des Unternehmers."], ["Jede Weisung des Auftraggebers ausführen", "Weisungen, die dem Sicherungsauftrag entgegenstehen, dürfen nicht befolgt werden."]], e: "Die UVV schützt die Versicherten auch vor sicherheitswidrigen Wünschen des Kunden.", r: "§ 4 Abs. 3 DGUV Vorschrift 23" },
  { u: "allg", d: 2, f: 1, q: "Der Objektleiter des Kunden bittet die Wachperson, während der Nachtschicht die Notausgänge abzuschließen und nebenbei allein auf dem Dach eine defekte Lampe zu wechseln. Wie verhält sie sich richtig?", o: ["Sie befolgt die Weisung nicht, weil sie dem Sicherungsauftrag und der Arbeitssicherheit entgegensteht, und informiert ihren Vorgesetzten.", ["Sie führt alles aus – der Kunde ist König.", "Solche Weisungen dürfen nicht befolgt werden."], ["Sie wechselt nur die Lampe.", "Auch das ist eine gefährliche, nicht vereinbarte Nebentätigkeit."], ["Sie schließt nur die Notausgänge ab.", "Das gefährdet Personen und widerspricht dem Sicherungsauftrag."]], e: "Sicherungsumfang und Nebentätigkeiten müssen schriftlich festgelegt sein (§ 6 Abs. 2). Weisungen des Auftraggebers, die dem Sicherungsauftrag entgegenstehen, sind nicht zu befolgen.", r: "§ 4 Abs. 3, § 6 Abs. 2 DGUV Vorschrift 23" },
  { u: "allg", d: 1, q: "Was gilt nach § 5 für Alkohol und andere berauschende Mittel?", o: ["Genuss und Einnahme sind während der Dienstzeit und für einen angemessenen Zeitraum vor dem Einsatz verboten; bei Dienstantritt muss Nüchternheit gegeben sein.", ["Ein Bier in der Pause ist erlaubt.", "Während der Dienstzeit gilt ein vollständiges Verbot."], ["Das Verbot gilt nur für bewaffnete Wachpersonen.", "Es gilt für alle."], ["Erlaubt ist alles, solange niemand etwas merkt.", "Das Verbot gilt unabhängig von der Entdeckung."]], e: "Die Vorschrift erfasst auch den Zeitraum vor dem Dienst.", r: "§ 5 DGUV Vorschrift 23" },
  { u: "allg", t: "tf", d: 1, a: false, q: "Die Unfallverhütungsvorschrift verbietet Alkohol nur während der Dienstzeit; was davor getrunken wird, ist unerheblich.", e: "Das Verbot gilt auch für einen angemessenen Zeitraum vor dem Einsatz. Bei Dienstantritt muss Nüchternheit gegeben sein.", r: "§ 5 DGUV Vorschrift 23" },
  { u: "allg", t: "tf", d: 2, a: true, q: "Das Wach- und Sicherungspersonal ist anhand der Dienstanweisungen vor Aufnahme der Tätigkeit und darüber hinaus regelmäßig zu unterweisen.", e: "Außerdem ist das sicherheitsgerechte Verhalten bei besonderen Gefahren soweit wie möglich zu üben.", r: "§ 4 Abs. 2 DGUV Vorschrift 23" },
  { u: "allg", t: "fa", d: 2, q: "Welche Pflichten haben die Versicherten nach der DGUV Vorschrift 23? Nenne mindestens vier.", m: "Sie unterstützen die der Arbeitssicherheit dienenden Maßnahmen und befolgen die Dienstanweisungen. Sie befolgen keine Weisungen des Auftraggebers, die dem Sicherungsauftrag entgegenstehen. Sie sind bei Dienstantritt nüchtern und nehmen im Dienst keine berauschenden Mittel. Sie melden festgestellte Gefahren und die dagegen getroffenen Maßnahmen dem Unternehmer. Sie benutzen die zur Verfügung gestellten Ausrüstungen und Hilfsmittel bestimmungsgemäß. Brillenträger sichern die Brille gegen Verlieren oder führen eine Ersatzbrille mit.", c: ["Dienstanweisungen befolgen", "keine entgegenstehenden Weisungen des Auftraggebers", "Nüchternheit", "Gefahren melden", "Ausrüstung bestimmungsgemäß benutzen", "Brille sichern"] },

  { u: "objekt", d: 2, q: "Unter welcher Voraussetzung darf der Unternehmer Wach- und Sicherungsaufgaben übernehmen (§ 6)?", o: ["Wenn vermeidbare Gefahrstellen im Objektbereich beseitigt oder ausreichend abgesichert werden", ["Wenn der Auftraggeber einen Rabatt akzeptiert", "Das ist keine Voraussetzung der UVV."], ["Wenn mindestens zehn Wachpersonen eingesetzt werden", "Eine solche Mindestzahl gibt es nicht."], ["Ohne jede Voraussetzung", "Die UVV stellt Bedingungen."]], e: "Außerdem müssen Sicherungsumfang und -ablauf einschließlich Nebentätigkeiten schriftlich festgelegt werden.", r: "§ 6 DGUV Vorschrift 23" },
  { u: "objekt", d: 2, q: "Was muss der Unternehmer sicherstellen, wenn sich bei Sicherungstätigkeiten besondere Gefahren ergeben können (§ 7)?", o: ["Dass das Wach- und Sicherungspersonal überwacht wird", ["Dass das Personal eine Gefahrenzulage erhält", "Das regelt die UVV nicht."], ["Dass das Objekt geschlossen wird", "Das verlangt die Vorschrift nicht."], ["Dass nur Auszubildende eingesetzt werden", "Das wäre gerade nicht sachgerecht."]], e: "Überwachung kann z. B. durch regelmäßige Meldungen, Personen-Notsignal-Anlagen oder Doppelbesetzung erfolgen.", r: "§ 7 DGUV Vorschrift 23" },
  { u: "objekt", d: 2, q: "Wie oft sind die zu sichernden Objekte nach § 8 auf Gefahren zu prüfen?", o: ["Regelmäßig und bei besonderem Anlass unverzüglich", ["Einmalig bei Vertragsabschluss", "Die Prüfung ist regelmäßig zu wiederholen."], ["Nur auf Wunsch des Auftraggebers", "Der Unternehmer ist unabhängig vom Auftraggeber verpflichtet."], ["Alle zehn Jahre", "Die Prüfung hat regelmäßig zu erfolgen."]], e: "Über die Prüfungen sind Aufzeichnungen zu führen.", r: "§ 8 Abs. 1 DGUV Vorschrift 23" },
  { u: "objekt", d: 2, f: 1, q: "Beim nächtlichen Kontrollgang stellt die Wachperson fest, dass ein Gitterrost über einem Schacht fehlt. Sie sperrt die Stelle provisorisch ab. Was muss sie außerdem tun?", o: ["Die Gefahr und die getroffene Maßnahme dem Unternehmer melden", ["Nichts weiter – die Absperrung genügt", "Die Meldung an den Unternehmer ist vorgeschrieben."], ["Den Schacht selbst zubetonieren", "Das ist nicht ihre Aufgabe."], ["Den Vorfall nur dem nächsten Kollegen erzählen", "Erforderlich ist die Meldung an den Unternehmer."]], e: "§ 8 Abs. 3: Die Versicherten haben festgestellte Gefahren und die dagegen getroffenen Maßnahmen dem Unternehmer zu melden.", r: "§ 8 Abs. 3 DGUV Vorschrift 23" },
  { u: "objekt", d: 2, q: "Was verlangt § 9 zur Objekteinweisung?", o: ["Das Personal ist in das jeweilige Objekt und in die spezifischen Gefahren einzuweisen – und zwar zu den Zeiten, zu denen die Tätigkeit ausgeübt wird.", ["Eine Einweisung per E-Mail genügt.", "Die Einweisung erfolgt im Objekt."], ["Die Einweisung erfolgt immer tagsüber, auch für den Nachtdienst.", "Sie ist zu den Zeiten vorzunehmen, zu denen die Tätigkeit ausgeübt wird."], ["Eine Einweisung ist nur bei bewaffneten Diensten nötig.", "Sie ist für alle Objekte vorgeschrieben."]], e: "Wer nachts arbeitet, muss das Objekt auch unter Nachtbedingungen kennenlernen.", r: "§ 9 Abs. 1 und 2 DGUV Vorschrift 23" },
  { u: "objekt", t: "mc", d: 2, q: "Welche zwei Aussagen zur Überprüfung von Objekten (§ 8) treffen zu?", o: ["Der Unternehmer muss die Prüfung unabhängig von den Pflichten des Auftraggebers sicherstellen.", "Der Unternehmer hat vom Auftraggeber zu verlangen, dass vermeidbare Gefahren beseitigt oder Gefahrstellen abgesichert werden.", ["Für Gefahren im Objekt ist allein der Auftraggeber verantwortlich.", "Der Unternehmer hat eigene Pflichten."], ["Aufzeichnungen über die Prüfungen sind nicht erforderlich.", "Aufzeichnungen sind vorgeschrieben."]], e: "Bis zur Beseitigung muss der Unternehmer die Sicherheit des Personals auf andere Weise gewährleisten.", r: "§ 8 DGUV Vorschrift 23" },
  { u: "objekt", t: "tf", d: 2, a: true, q: "In Objekten, in denen Hunde eingesetzt sind, muss das Personal über das Verhalten bei der Begegnung mit diesen Hunden unterwiesen werden.", e: "Das bestimmt § 9 Abs. 3.", r: "§ 9 Abs. 3 DGUV Vorschrift 23" },
  { u: "objekt", t: "mc", d: 2, q: "Welche zwei Angaben müssen bei Übernahme eines Auftrags schriftlich festgelegt werden (§ 6 Abs. 2)?", o: ["Sicherungsumfang und Sicherungsablauf", "Vorgesehene Nebentätigkeiten", ["Die privaten Telefonnummern der Wachpersonen", "Das verlangt die Vorschrift nicht."], ["Die Lieblingsroute der Wachperson", "Das verlangt die Vorschrift nicht."]], e: "Nicht vereinbarte Nebentätigkeiten können die Sicherheit gefährden.", r: "§ 6 Abs. 2 DGUV Vorschrift 23" },

  { u: "ausr", d: 1, q: "Womit muss bei Dunkelheit eingesetztes Wach- und Sicherungspersonal ausgerüstet sein?", o: ["Mit leistungsfähigen Handleuchten", ["Mit Nachtsichtgeräten", "Vorgeschrieben sind Handleuchten."], ["Mit Signalraketen", "Das ist nicht vorgeschrieben."], ["Mit Schusswaffen", "Das ist nicht vorgeschrieben."]], e: "§ 10 Abs. 4.", r: "§ 10 Abs. 4 DGUV Vorschrift 23" },
  { u: "ausr", d: 2, q: "Wie müssen anlegbare Ausrüstungen und Hilfsmittel beschaffen sein (§ 10 Abs. 2)?", o: ["So, dass die Bewegungsfreiheit, insbesondere die der Hände, nicht mehr als unvermeidbar beeinträchtigt wird", ["Möglichst schwer, um Eindruck zu machen", "Das widerspricht der Vorschrift."], ["Farblich passend zur Polizeiuniform", "Verwechslungen mit der Polizei sind zu vermeiden."], ["So, dass sie die Hände dauerhaft binden", "Die Hände sollen frei bleiben."]], e: "Freie Hände sind wichtig für Eigensicherung und zum Abfangen von Stürzen.", r: "§ 10 Abs. 2 DGUV Vorschrift 23" },
  { u: "ausr", d: 1, q: "Was müssen Brillenträger bei Wach- und Sicherungsaufgaben beachten?", o: ["Die Brille gegen Verlieren sichern oder eine Ersatzbrille mitführen", ["Die Brille im Dienst abnehmen", "Das Sehvermögen muss korrigiert bleiben."], ["Nur Kontaktlinsen tragen", "Das ist nicht vorgeschrieben."], ["Nichts Besonderes", "§ 11 enthält eine ausdrückliche Pflicht."]], e: "§ 11.", r: "§ 11 DGUV Vorschrift 23" },
  { u: "ausr", t: "mc", d: 2, q: "Wofür hat der Unternehmer nach § 10 zu sorgen?", o: ["Dass Einrichtungen, Ausrüstungen und Hilfsmittel in ordnungsgemäßem Zustand sind und das Personal in der Handhabung unterwiesen ist", "Dass der Aufgabe entsprechendes Schuhwerk getragen wird", ["Dass jede Wachperson ein Dienstfahrzeug erhält", "Das verlangt die Vorschrift nicht."], ["Dass Ausrüstung von den Versicherten selbst bezahlt wird", "Das regelt die Vorschrift nicht so."]], e: "Die Versicherten haben die Ausrüstung bestimmungsgemäß zu benutzen (§ 10 Abs. 5).", r: "§ 10 DGUV Vorschrift 23" },
  { u: "ausr", t: "tf", d: 1, a: true, q: "Die Versicherten haben die zur Verfügung gestellten Ausrüstungen und Hilfsmittel bestimmungsgemäß zu benutzen.", e: "§ 10 Abs. 5.", r: "§ 10 Abs. 5 DGUV Vorschrift 23" },

  { u: "hund", d: 2, q: "Welche Hunde dürfen als Diensthunde eingesetzt werden?", o: ["Nur geprüfte Hunde mit Hundeführern", ["Jeder Hund, der bellt", "Das genügt nicht."], ["Private Hunde der Wachpersonen ohne Prüfung", "Als Diensthunde sind nur geprüfte Hunde zulässig."], ["Nur Hunde über 40 kg", "Ein Gewicht ist nicht vorgeschrieben."]], e: "Ungeprüfte Hunde dürfen nur zu Wahrnehmungs- und Meldeaufgaben eingesetzt werden, wenn der Führer den Hund unter Kontrolle hat.", r: "§ 12 DGUV Vorschrift 23" },
  { u: "hund", d: 2, q: "Welche Hunde dürfen nach § 12 nicht eingesetzt werden?", o: ["Hunde, die für die Aufgabe ungeeignet sind, zur Bösartigkeit neigen oder deren Leistungsstand nicht mehr gegeben ist", ["Hunde mit kurzem Fell", "Das ist kein Ausschlussgrund."], ["Hunde, die älter als drei Jahre sind", "Das ist kein Ausschlussgrund."], ["Hunde, die gut gehorchen", "Gehorsam ist gerade erwünscht."]], e: "Maßgeblich ist, ob der Hund dadurch Personen gefährden kann.", r: "§ 12 Abs. 1 DGUV Vorschrift 23" },
  { u: "hund", d: 3, q: "Wie hat die Übernahme und Abgabe eines Diensthundes zu erfolgen (§ 16)?", o: ["Im Zwinger bei geschlossener Tür; eine Übergabe von Person zu Person ist nicht erlaubt.", ["Von Hand zu Hand auf dem Parkplatz", "Die Übergabe von Person zu Person ist ausdrücklich nicht erlaubt."], ["Durch Anbinden am Dienstfahrzeug", "Das sieht die Vorschrift nicht vor."], ["Freilaufend auf dem Gelände", "Das ist nicht zulässig."]], e: "Bei zulässiger Anbindehaltung kann die Übernahme auch an den entsprechenden Einrichtungen erfolgen.", r: "§ 16 Abs. 1 DGUV Vorschrift 23" },
  { u: "hund", t: "mc", d: 3, q: "Welche zwei Regeln gelten für die Hundeführung (§ 16)?", o: ["Die Führleine darf nicht am Körper des Hundeführers oder am Fahrrad befestigt werden.", "Bei Begegnung mit Dritten ist der angeleinte Hund an der kurzen Leine so zu führen, dass er Dritte nicht erreichen kann.", ["Hunde werden grundsätzlich ohne Leine geführt.", "Ohne Leine nur dort, wo keine Begegnung mit Dritten zu erwarten ist."], ["Jeder Hundeführer verwendet seine eigenen Kommandos.", "Bei mehreren Hundeführern ist eine einheitliche Kommandosprache festzulegen."]], e: "Die Regeln schützen Hundeführer und Dritte.", r: "§ 16 DGUV Vorschrift 23" },
  { u: "hund", t: "tf", d: 2, a: true, q: "Belegte Hundezwinger dürfen nur von Hundeführern oder vom Unternehmer beauftragten Personen betreten werden, die mit dem jeweiligen Hund vertraut sind.", e: "§ 13 Abs. 3. An den Zwingern ist auf das Zutrittsverbot hinzuweisen.", r: "§ 13 DGUV Vorschrift 23" },
  { u: "hund", d: 2, q: "Wer darf als Hundeführer eingesetzt werden (§ 15)?", o: ["Versicherte, die entsprechend unterwiesen sind und dem Unternehmer ihre Befähigung nachgewiesen haben", ["Jeder, der einen Hund besitzt", "Erforderlich sind Unterweisung und Befähigungsnachweis."], ["Nur Tierärzte", "Das verlangt die Vorschrift nicht."], ["Nur Personen mit Waffenschein", "Das verlangt die Vorschrift nicht."]], e: "Die Befähigung ist regelmäßig nachzuweisen.", r: "§ 15 DGUV Vorschrift 23" },

  { u: "waffe", d: 2, q: "Wann darf das Wach- und Sicherungspersonal nach § 18 mit Schusswaffen ausgerüstet werden?", o: ["Nur wenn der Unternehmer dies ausdrücklich anordnet und die Versicherten zuverlässig, geeignet, sachkundig und an der Waffe ausgebildet sind", ["Immer bei Nachtdiensten", "Die Tageszeit ist kein Kriterium."], ["Wenn die Wachperson es wünscht", "Erforderlich ist die ausdrückliche Anordnung des Unternehmers."], ["Wenn der Auftraggeber die Kosten trägt", "Das ist kein Kriterium."]], e: "Zusätzlich sind die waffenrechtlichen Bestimmungen zu beachten.", r: "§ 18 Abs. 1 DGUV Vorschrift 23" },
  { u: "waffe", d: 2, q: "Was verlangt § 18 Abs. 2 von Trägern von Schusswaffen?", o: ["Regelmäßige Teilnahme an Schießübungen und Nachweis von Schießfertigkeit und Sachkunde", ["Einmalige Einweisung bei der Einstellung", "Die Übungen müssen regelmäßig stattfinden."], ["Tägliches Probeschießen im Objekt", "Schießübungen finden auf zugelassenen Schießständen statt."], ["Keine besonderen Nachweise", "Nachweise sind vorgeschrieben."]], e: "Über Schießübungen, Schießfertigkeit und Sachkundestand sind Aufzeichnungen zu führen.", r: "§ 18 Abs. 2 und 4 DGUV Vorschrift 23" },
  { u: "waffe", d: 2, q: "Wie müssen Schusswaffen im Dienst geführt werden (§ 20)?", o: ["In geeigneten Trageeinrichtungen, die ein Abgleiten oder Herausfallen verhindern", ["Lose in der Jackentasche", "Das ist nicht zulässig."], ["In der Hand", "Die Waffe ist in einer Trageeinrichtung zu führen."], ["Im Rucksack zwischen dem Proviant", "Das ist keine geeignete Trageeinrichtung."]], e: "Munition darf nicht lose mitgeführt werden.", r: "§ 20 Abs. 1 und 2 DGUV Vorschrift 23" },
  { u: "waffe", t: "mc", d: 2, q: "Welche zwei Regeln gelten nach der UVV für die Aufbewahrung von Schusswaffen und Munition (§ 22)?", o: ["Aufbewahrung in verschlossenen Stahlblechschränken mit Sicherheitsschloss oder entsprechend sicheren Einrichtungen", "Schusswaffen dürfen nur im entladenen Zustand aufbewahrt werden", ["Waffen und Munition liegen griffbereit zusammen auf dem Schreibtisch", "Das ist unzulässig."], ["Die Waffe bleibt geladen, damit sie schneller einsatzbereit ist", "Sie ist entladen aufzubewahren."]], e: "Die Einrichtung muss eine getrennte Unterbringung von Waffen und Munition ermöglichen.", r: "§ 22 DGUV Vorschrift 23" },
  { u: "waffe", t: "tf", d: 2, a: true, q: "Schusswaffen müssen mindestens einmal jährlich durch Sachkundige auf ihre Handhabungssicherheit geprüft werden.", e: "§ 19 Abs. 2: bei Verdacht auf Mängel, mindestens jedoch einmal jährlich.", r: "§ 19 Abs. 2 DGUV Vorschrift 23" },

  { u: "geld", d: 2, q: "Welche Personen darf der Unternehmer für Geldtransporte einsetzen (§ 24)?", o: ["Personen, die mindestens 18 Jahre alt, persönlich zuverlässig und geeignet sowie für diese Aufgabe besonders ausgebildet und eingewiesen sind", ["Jede Aushilfe ab 16 Jahren", "Das Mindestalter beträgt 18 Jahre."], ["Nur ehemalige Polizeibeamte", "Das verlangt die Vorschrift nicht."], ["Nur Personen mit Lkw-Führerschein", "Das verlangt die Vorschrift nicht."]], e: "§ 24.", r: "§ 24 DGUV Vorschrift 23" },
  { u: "geld", d: 2, q: "Wie viele Personen müssen einen Geldtransport durch Boten in öffentlich zugänglichen Bereichen grundsätzlich durchführen (§ 25)?", o: ["Mindestens zwei, von denen eine die Sicherung übernimmt", ["Eine", "Grundsätzlich sind mindestens zwei Personen erforderlich."], ["Mindestens vier", "Vorgeschrieben sind mindestens zwei."], ["Es gibt keine Vorgabe", "§ 25 enthält eine klare Vorgabe."]], e: "Das gilt auch für die Wegstrecke zwischen Transportfahrzeug und Übergabe- oder Übernahmestelle.", r: "§ 25 Abs. 1 DGUV Vorschrift 23" },
  { u: "geld", t: "mc", d: 3, q: "In welchen zwei Fällen darf vom Zwei-Personen-Grundsatz beim Botentransport abgewichen werden (§ 25 Abs. 2)?", o: ["Der Transport ist nicht als Geldtransport erkennbar.", "Es wird ausschließlich Hartgeld transportiert und dies ist für Außenstehende erkennbar.", ["Der Bote ist besonders kräftig.", "Das ist kein Ausnahmegrund."], ["Der Transport findet am Vormittag statt.", "Die Tageszeit ist kein Ausnahmegrund."]], e: "Weitere Ausnahmen: Das Geld wird unauffällig in der bürgerlichen Kleidung getragen oder deutlich erkennbare technische Ausrüstung verringert den Anreiz zu Überfällen nachhaltig.", r: "§ 25 Abs. 2 DGUV Vorschrift 23" },
  { u: "geld", t: "tf", d: 2, a: false, q: "Geldtransportbehältnisse dürfen mit dem Boten fest verbunden sein, z. B. durch eine Kette am Handgelenk.", e: "§ 25 Abs. 3: Sie dürfen mit Boten nicht fest verbunden sein – sonst wäre der Bote bei einem Überfall besonders gefährdet.", r: "§ 25 Abs. 3 DGUV Vorschrift 23" },

  { u: "v1", d: 2, q: "Wie oft sind Versicherte nach der DGUV Vorschrift 1 mindestens zu unterweisen?", o: ["Mindestens einmal jährlich", ["Einmal bei der Einstellung genügt", "Die Unterweisung ist zu wiederholen."], ["Alle fünf Jahre", "Die Mindestfrist ist ein Jahr."], ["Nur nach einem Unfall", "Sie hat vorbeugend zu erfolgen."]], e: "§ 4 Abs. 1 DGUV Vorschrift 1: Die Unterweisung muss erforderlichenfalls wiederholt werden, mindestens aber einmal jährlich erfolgen; sie muss dokumentiert werden.", r: "§ 4 Abs. 1 DGUV Vorschrift 1" },
  { u: "v1", d: 2, q: "Wer trägt die Beiträge zur gesetzlichen Unfallversicherung?", o: ["Allein der Unternehmer", ["Arbeitgeber und Arbeitnehmer je zur Hälfte", "Das gilt für andere Zweige der Sozialversicherung."], ["Allein der Arbeitnehmer", "Die Beiträge trägt der Unternehmer."], ["Der Auftraggeber des Sicherheitsunternehmens", "Er ist nicht beitragspflichtig."]], e: "§ 150 Abs. 1 SGB VII: Beitragspflichtig sind die Unternehmer. Träger sind die Berufsgenossenschaften und Unfallkassen.", r: "§ 150 SGB VII" },
  { u: "v1", t: "mc", d: 2, q: "Welche zwei Ereignisse sind Versicherungsfälle der gesetzlichen Unfallversicherung?", o: ["Arbeitsunfall", "Unfall auf dem unmittelbaren Weg zur Arbeit (Wegeunfall)", ["Erkältung im Urlaub", "Sie steht nicht im Zusammenhang mit der versicherten Tätigkeit."], ["Sportverletzung in der Freizeit", "Sie steht nicht im Zusammenhang mit der versicherten Tätigkeit."]], e: "§ 7 SGB VII: Versicherungsfälle sind Arbeitsunfälle und Berufskrankheiten. Nach § 8 Abs. 2 SGB VII gehört auch der unmittelbare Weg nach und von dem Ort der Tätigkeit zur versicherten Tätigkeit.", r: "§§ 7, 8 SGB VII" },
  { u: "v1", t: "fa", d: 2, q: "Welche Grundpflichten hat der Unternehmer nach der DGUV Vorschrift 1, und wie müssen Versicherte mitwirken?", m: "Der Unternehmer hat die erforderlichen Maßnahmen zur Verhütung von Arbeitsunfällen, Berufskrankheiten und arbeitsbedingten Gesundheitsgefahren sowie für eine wirksame Erste Hilfe zu treffen. Er unterweist die Versicherten vor Aufnahme der Tätigkeit und danach mindestens einmal jährlich und dokumentiert dies. Er macht die Vorschriften zugänglich und stellt Ersthelfer und Erste-Hilfe-Material bereit. Die Versicherten unterstützen die Maßnahmen, befolgen Weisungen, benutzen Einrichtungen bestimmungsgemäß, melden Mängel und Gefahren unverzüglich und versetzen sich nicht durch Alkohol oder andere Mittel in einen Zustand, in dem sie sich oder andere gefährden.", c: ["Unfallverhütung und Erste Hilfe organisieren", "Unterweisung mindestens jährlich", "Vorschriften zugänglich machen", "Versicherte: unterstützen, Weisungen befolgen", "Mängel melden", "keine Selbstgefährdung durch Alkohol"] },
  { u: "allg", t: "zu", d: 2, q: "Ordne jeder Vorschrift der DGUV Vorschrift 23 ihren Gegenstand zu.", p: [["§ 3", "Eignung"], ["§ 5", "Verbot berauschender Mittel"], ["§ 9", "Objekteinweisung"], ["§ 11", "Brillenträger"]], e: "Die Paragrafen 2 bis 11 enthalten die gemeinsamen Bestimmungen für alle Wach- und Sicherungstätigkeiten.", r: "DGUV Vorschrift 23" },
  { u: "waffe", t: "mc", d: 2, q: "Welche zwei Regeln gelten nach § 21 für die Übergabe von Schusswaffen?", o: ["Schusswaffen dürfen nur in entladenem Zustand übergeben werden.", "Der Übernehmende überzeugt sich sofort vom Ladezustand und kontrolliert die Waffe auf augenfällige Mängel.", ["Die Waffe wird durchgeladen übergeben.", "Sie ist entladen zu übergeben."], ["Bei festgestellten Mängeln wird die Waffe vorsichtig weiter geführt.", "Bei Mängeln darf die Waffe nicht geführt werden."]], e: "Laden und Entladen erfolgen an sicherem Ort mit Richtung auf eine geeignete Kugelfangeinrichtung.", r: "§ 21 DGUV Vorschrift 23" },
  { u: "geld", t: "mc", d: 3, q: "Welche zwei Regeln gelten für Geldtransportfahrzeuge beim Be- und Entladen in öffentlich zugänglichen Bereichen (§ 26)?", o: ["Das Fahrzeug muss ständig besetzt bleiben.", "Die Türen des besetzten Fahrzeugteils müssen verriegelt sein.", ["Der Motor muss ausgebaut werden.", "Das verlangt die Vorschrift nicht."], ["Alle Türen bleiben geöffnet, damit es schneller geht.", "Die Türen des besetzten Teils sind zu verriegeln."]], e: "Überfälle sind unverzüglich über Funk zu melden.", r: "§ 26 Abs. 5 DGUV Vorschrift 23" },
  { u: "hund", t: "mc", d: 2, q: "Welche zwei Aussagen zu Hundezwingern (§ 13) treffen zu?", o: ["An den Zwingern ist auf das Zutrittsverbot für Unbefugte hinzuweisen.", "Säuberung und Instandhaltung dürfen nur erfolgen, wenn der Zwinger nicht mit einem Hund belegt ist.", ["Mehrere Hunde werden grundsätzlich gemeinsam gehalten.", "Die Zwinger müssen eine Einzelhaltung ermöglichen."], ["Belegte Zwinger bleiben unverschlossen.", "Belegte Zwinger müssen abgeschlossen sein, wenn Entweichen oder Zutritt nicht anders verhindert ist."]], e: "§ 13 regelt Beschaffenheit, Kennzeichnung und Betreten der Zwinger.", r: "§ 13 DGUV Vorschrift 23" }
]);
