 {
  "k": "§ 201a Abs. 1 StGB",
  "g": "StGB",
  "n": "201a",
  "a": null,
  "t": "Verletzung des höchstpersönlichen Lebensbereichs und von Persönlichkeitsrechten durch Bildaufnahmen",
  "b": [
   "str",
   "ds"
  ],
  "w": "(1) Mit Freiheitsstrafe bis zu zwei Jahren oder mit Geldstrafe wird bestraft, wer 1. von einer anderen Person, die sich in einer Wohnung oder einem gegen Einblick besonders geschützten Raum befindet, unbefugt eine Bildaufnahme herstellt oder überträgt und dadurch den höchstpersönlichen Lebensbereich der abgebildeten Person verletzt, 2. eine Bildaufnahme, die die Hilflosigkeit einer anderen Person zur Schau stellt, unbefugt herstellt oder überträgt und dadurch den höchstpersönlichen Lebensbereich der abgebildeten Person verletzt, 3. eine Bildaufnahme, die in grob anstößiger Weise eine verstorbene Person zur Schau stellt, unbefugt herstellt oder überträgt, 4. eine durch eine Tat nach den Nummern 1 bis 3 hergestellte Bildaufnahme gebraucht oder einer dritten Person zugänglich macht oder 5. eine befugt hergestellte Bildaufnahme der in den Nummern 1 bis 3 bezeichneten Art wissentlich unbefugt einer dritten Person zugänglich macht und in den Fällen der Nummern 1 und 2 dadurch den höchstpersönlichen Lebensbereich der abgebildeten Person verletzt.",
  "e": "In Wohnungen und geschützten Räumen wie Umkleiden darf niemand heimlich fotografiert oder gefilmt werden – ebenso wenig hilflose Personen.",
  "u": "https://www.gesetze-im-internet.de/stgb/__201a.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 202 Abs. 1 StGB",

  ],
  "w": "(1) Wer unbefugt 1. einen verschlossenen Brief oder ein anderes verschlossenes Schriftstück, die nicht zu seiner Kenntnis bestimmt sind, öffnet oder 2. sich vom Inhalt eines solchen Schriftstücks ohne Öffnung des Verschlusses unter Anwendung technischer Mittel Kenntnis verschafft, wird mit Freiheitsstrafe bis zu einem Jahr oder mit Geldstrafe bestraft, wenn die Tat nicht in § 206 mit Strafe bedroht ist.",
  "e": "Fremde verschlossene Briefe darf man nicht öffnen.",
  "u": "https://www.gesetze-im-internet.de/stgb/__202.html",

 },
 {
  "k": "§ 202a StGB",
  "g": "StGB",
  "n": "202a",

  "t": "Ausspähen von Daten",
  "b": [

  ],
  "w": "(1) Wer unbefugt sich oder einem anderen Zugang zu Daten, die nicht für ihn bestimmt und die gegen unberechtigten Zugang besonders gesichert sind, unter Überwindung der Zugangssicherung verschafft, wird mit Freiheitsstrafe bis zu drei Jahren oder mit Geldstrafe bestraft. (2) Daten im Sinne des Absatzes 1 sind nur solche, die elektronisch, magnetisch oder sonst nicht unmittelbar wahrnehmbar gespeichert sind oder übermittelt werden.",

 },
 {
  "k": "§ 226 Abs. 1 StGB",
  "g": "StGB",
  "n": "226",
  "a": null,
  "t": "Schwere Körperverletzung",
  "b": [
   "str"
  ],
  "w": "(1) Hat die Körperverletzung zur Folge, daß die verletzte Person 1. das Sehvermögen auf einem Auge oder beiden Augen, das Gehör, das Sprechvermögen oder die Fortpflanzungsfähigkeit verliert, 2. ein wichtiges Glied des Körpers verliert oder dauernd nicht mehr gebrauchen kann oder 3. in erheblicher Weise dauernd entstellt wird oder in Siechtum, Lähmung oder geistige Krankheit oder Behinderung verfällt, so ist die Strafe Freiheitsstrafe von einem Jahr bis zu zehn Jahren.",
  "e": "Führt die Körperverletzung zu schweren Dauerschäden, drohen ein bis zehn Jahre Freiheitsstrafe.",

 {

  ],

  "e": "Auch wer jemanden aus Unachtsamkeit verletzt, macht sich strafbar.",

 {

  "g": "StGB",
  "n": "230",
  "a": null,
  "t": "Strafantrag",
  "b": [
   "str"
  ],
  "w": "(1) Die vorsätzliche Körperverletzung nach § 223 und die fahrlässige Körperverletzung nach § 229 werden nur auf Antrag verfolgt, es sei denn, daß die Strafverfolgungsbehörde wegen des besonderen öffentlichen Interesses an der Strafverfolgung ein Einschreiten von Amts wegen für geboten hält. Stirbt die verletzte Person, so geht bei vorsätzlicher Körperverletzung das Antragsrecht nach § 77 Abs. 2 auf die Angehörigen über.",
  "e": "Einfache und fahrlässige Körperverletzung werden nur auf Antrag verfolgt – oder bei besonderem öffentlichen Interesse.",
  "u": "https://www.gesetze-im-internet.de/stgb/__230.html",

 {
  "k": "§ 241 Abs. 1 und 2 StGB",

  "a": null,
  "t": "Bedrohung",
  "b": [
   "str"
  ],
  "w": "(1) Wer einen Menschen mit der Begehung einer gegen ihn oder eine ihm nahestehende Person gerichteten rechtswidrigen Tat gegen die sexuelle Selbstbestimmung, die körperliche Unversehrtheit, die persönliche Freiheit oder gegen eine Sache von bedeutendem Wert bedroht, wird mit Freiheitsstrafe bis zu einem Jahr oder mit Geldstrafe bestraft. (2) Wer einen Menschen mit der Begehung eines gegen ihn oder eine ihm nahestehende Person gerichteten Verbrechens bedroht, wird mit Freiheitsstrafe bis zu zwei Jahren oder mit Geldstrafe bestraft.",
  "e": "Wer jemandem mit einer Straftat gegen ihn oder Nahestehende droht, macht sich strafbar.",
  "u": "https://www.gesetze-im-internet.de/stgb/__241.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 243 Abs. 1 StGB",
  "g": "StGB",
  "n": "243",
  "a": null,
  "t": "Besonders schwerer Fall des Diebstahls",
  "b": [
   "str"
  ],
  "w": "(1) In besonders schweren Fällen wird der Diebstahl mit Freiheitsstrafe von drei Monaten bis zu zehn Jahren bestraft. Ein besonders schwerer Fall liegt in der Regel vor, wenn der Täter 1. zur Ausführung der Tat in ein Gebäude, einen Dienst- oder Geschäftsraum oder in einen anderen umschlossenen Raum einbricht, einsteigt, mit einem falschen Schlüssel oder einem anderen nicht zur ordnungsmäßigen Öffnung bestimmten Werkzeug eindringt oder sich in dem Raum verborgen hält, 2. eine Sache stiehlt, die durch ein verschlossenes Behältnis oder eine andere Schutzvorrichtung gegen Wegnahme besonders gesichert ist, 3. gewerbsmäßig stiehlt, 4. aus einer Kirche oder einem anderen der Religionsausübung dienenden Gebäude oder Raum eine Sache stiehlt, die dem Gottesdienst gewidmet ist oder der religiösen Verehrung dient, 5. eine Sache von Bedeutung für Wissenschaft, Kunst oder Geschichte oder für die technische Entwicklung stiehlt, die sich in einer allgemein zugänglichen Sammlung befindet oder öffentlich ausgestellt ist, 6. stiehlt, indem er die Hilflosigkeit einer anderen Person, einen Unglücksfall oder eine gemeine Gefahr ausnutzt oder 7. eine Handfeuerwaffe, zu deren Erwerb es nach dem Waffengesetz der Erlaubnis bedarf, ein Maschinengewehr, eine Maschinenpistole, ein voll- oder halbautomatisches Gewehr oder eine Sprengstoff enthaltende Kriegswaffe im Sinne des Kriegswaffenkontrollgesetzes oder Sprengstoff stiehlt.",
  "e": "Besonders schwer ist Diebstahl zum Beispiel bei Einbruch, bei besonders gesicherten Sachen oder wenn gewerbsmäßig gestohlen wird.",
  "u": "https://www.gesetze-im-internet.de/stgb/__243.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 244 Abs. 1 StGB",
  "g": "StGB",
  "n": "244",
  "a": null,
  "t": "Diebstahl mit Waffen; Bandendiebstahl; Wohnungseinbruchdiebstahl",
  "b": [
   "str"
  ],
  "w": "(1) Mit Freiheitsstrafe von sechs Monaten bis zu zehn Jahren wird bestraft, wer 1. einen Diebstahl begeht, bei dem er oder ein anderer Beteiligter a) eine Waffe oder ein anderes gefährliches Werkzeug bei sich führt, b) sonst ein Werkzeug oder Mittel bei sich führt, um den Widerstand einer anderen Person durch Gewalt oder Drohung mit Gewalt zu verhindern oder zu überwinden, 2. als Mitglied einer Bande, die sich zur fortgesetzten Begehung von Raub oder Diebstahl verbunden hat, unter Mitwirkung eines anderen Bandenmitglieds stiehlt oder 3. einen Diebstahl begeht, bei dem er zur Ausführung der Tat in eine Wohnung einbricht, einsteigt, mit einem falschen Schlüssel oder einem anderen nicht zur ordnungsmäßigen Öffnung bestimmten Werkzeug eindringt oder sich in der Wohnung verborgen hält.",
  "e": "Härter bestraft wird Diebstahl mit Waffe, als Bande oder durch Wohnungseinbruch.",
  "u": "https://www.gesetze-im-internet.de/stgb/__244.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 248a StGB",
  "g": "StGB",
  "n": "248a",
  "a": null,
  "t": "Diebstahl und Unterschlagung geringwertiger Sachen",
  "b": [
   "str"
  ],
  "w": "Der Diebstahl und die Unterschlagung geringwertiger Sachen werden in den Fällen der §§ 242 und 246 nur auf Antrag verfolgt, es sei denn, daß die Strafverfolgungsbehörde wegen des besonderen öffentlichen Interesses an der Strafverfolgung ein Einschreiten von Amts wegen für geboten hält.",
  "e": "Diebstahl und Unterschlagung geringwertiger Sachen werden nur auf Antrag verfolgt – oder bei besonderem öffentlichen Interesse.",
  "u": "https://www.gesetze-im-internet.de/stgb/__248a.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 248b Abs. 1 StGB",
  "g": "StGB",
  "n": "248b",
  "a": null,
  "t": "Unbefugter Gebrauch eines Fahrzeugs",
  "b": [
   "str"
  ],
  "w": "(1) Wer ein Kraftfahrzeug oder ein Fahrrad gegen den Willen des Berechtigten in Gebrauch nimmt, wird mit Freiheitsstrafe bis zu drei Jahren oder mit Geldstrafe bestraft, wenn die Tat nicht in anderen Vorschriften mit schwererer Strafe bedroht ist.",
  "e": "Wer ein fremdes Auto oder Fahrrad ohne Erlaubnis benutzt, macht sich strafbar.",
  "u": "https://www.gesetze-im-internet.de/stgb/__248b.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 248c Abs. 1 StGB",
  "g": "StGB",
  "n": "248c",
  "a": null,
  "t": "Entziehung elektrischer Energie",
  "b": [
   "str"
  ],
  "w": "(1) Wer einer elektrischen Anlage oder Einrichtung fremde elektrische Energie mittels eines Leiters entzieht, der zur ordnungsmäßigen Entnahme von Energie aus der Anlage oder Einrichtung nicht bestimmt ist, wird, wenn er die Handlung in der Absicht begeht, die elektrische Energie sich oder einem Dritten rechtswidrig zuzueignen, mit Freiheitsstrafe bis zu fünf Jahren oder mit Geldstrafe bestraft.",
  "e": "Wer Strom unerlaubt abzapft, macht sich strafbar.",
  "u": "https://www.gesetze-im-internet.de/stgb/__248c.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 253 Abs. 1 und 2 StGB",
  "g": "StGB",
  "n": "253",
  "a": null,
  "t": "Erpressung",
  "b": [
   "str"
  ],
  "w": "(1) Wer einen Menschen rechtswidrig mit Gewalt oder durch Drohung mit einem empfindlichen Übel zu einer Handlung, Duldung oder Unterlassung nötigt und dadurch dem Vermögen des Genötigten oder eines anderen Nachteil zufügt, um sich oder einen Dritten zu Unrecht zu bereichern, wird mit Freiheitsstrafe bis zu fünf Jahren oder mit Geldstrafe bestraft. (2) Rechtswidrig ist die Tat, wenn die Anwendung der Gewalt oder die Androhung des Übels zu dem angestrebten Zweck als verwerflich anzusehen ist.",
  "e": "Erpressung: jemanden mit Gewalt oder Drohung zu etwas zwingen, das ihn Geld kostet, um sich zu bereichern.",
  "u": "https://www.gesetze-im-internet.de/stgb/__253.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 255 StGB",
  "g": "StGB",
  "n": "255",
  "a": null,
  "t": "Räuberische Erpressung",
  "b": [
   "str"
  ],
  "w": "Wird die Erpressung durch Gewalt gegen eine Person oder unter Anwendung von Drohungen mit gegenwärtiger Gefahr für Leib oder Leben begangen, so ist der Täter gleich einem Räuber zu bestrafen.",
  "e": "Erpressung mit Gewalt gegen eine Person oder Drohung gegen Leib oder Leben wird wie Raub bestraft.",
  "u": "https://www.gesetze-im-internet.de/stgb/__255.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 259 Abs. 1 StGB",
  "g": "StGB",
  "n": "259",
  "a": null,
  "t": "Hehlerei",
  "b": [
   "str"
  ],
  "w": "(1) Wer eine Sache, die ein anderer gestohlen oder sonst durch eine gegen fremdes Vermögen gerichtete rechtswidrige Tat erlangt hat, ankauft oder sonst sich oder einem Dritten verschafft, sie absetzt oder absetzen hilft, um sich oder einen Dritten zu bereichern, wird mit Freiheitsstrafe bis zu fünf Jahren oder mit Geldstrafe bestraft.",
  "e": "Hehlerei: gestohlene Sachen kaufen, sich verschaffen oder weiterverkaufen, um daran zu verdienen.",
  "u": "https://www.gesetze-im-internet.de/stgb/__259.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 263 Abs. 1 StGB",
  "g": "StGB",
  "n": "263",
  "a": null,
  "t": "Betrug",
  "b": [
   "str"
  ],
  "w": "(1) Wer in der Absicht, sich oder einem Dritten einen rechtswidrigen Vermögensvorteil zu verschaffen, das Vermögen eines anderen dadurch beschädigt, daß er durch Vorspiegelung falscher oder durch Entstellung oder Unterdrückung wahrer Tatsachen einen Irrtum erregt oder unterhält, wird mit Freiheitsstrafe bis zu fünf Jahren oder mit Geldstrafe bestraft.",
  "e": "Betrug: jemanden täuschen, damit er sich oder andere finanziell schädigt, um sich selbst zu bereichern.",
  "u": "https://www.gesetze-im-internet.de/stgb/__263.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 265a Abs. 1 StGB",
  "g": "StGB",
  "n": "265a",
  "a": null,
  "t": "Erschleichen von Leistungen",
  "b": [
   "str"
  ],
  "w": "(1) Wer die Leistung eines Automaten oder eines öffentlichen Zwecken dienenden Telekommunikationsnetzes, die Beförderung durch ein Verkehrsmittel oder den Zutritt zu einer Veranstaltung oder einer Einrichtung in der Absicht erschleicht, das Entgelt nicht zu entrichten, wird mit Freiheitsstrafe bis zu einem Jahr oder mit Geldstrafe bestraft, wenn die Tat nicht in anderen Vorschriften mit schwererer Strafe bedroht ist.",
  "e": "Wer schwarzfährt oder sich Eintritt erschleicht, macht sich strafbar.",
  "u": "https://www.gesetze-im-internet.de/stgb/__265a.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 267 Abs. 1 StGB",
  "g": "StGB",
  "n": "267",
  "a": null,
  "t": "Urkundenfälschung",
  "b": [
   "str"
  ],
  "w": "(1) Wer zur Täuschung im Rechtsverkehr eine unechte Urkunde herstellt, eine echte Urkunde verfälscht oder eine unechte oder verfälschte Urkunde gebraucht, wird mit Freiheitsstrafe bis zu fünf Jahren oder mit Geldstrafe bestraft.",
  "e": "Wer Urkunden fälscht, verfälscht oder solche benutzt, um zu täuschen, macht sich strafbar.",
  "u": "https://www.gesetze-im-internet.de/stgb/__267.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 303c StGB",
  "g": "StGB",
  "n": "303c",
  "a": null,
  "t": "Strafantrag",
  "b": [
   "str"
  ],
  "w": "In den Fällen der §§ 303, 303a Abs. 1 und 2 sowie § 303b Abs. 1 bis 3 wird die Tat nur auf Antrag verfolgt, es sei denn, daß die Strafverfolgungsbehörde wegen des besonderen öffentlichen Interesses an der Strafverfolgung ein Einschreiten von Amts wegen für geboten hält.",
  "e": "Sachbeschädigung wird nur auf Antrag verfolgt – oder bei besonderem öffentlichen Interesse.",
  "u": "https://www.gesetze-im-internet.de/stgb/__303c.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 48 Abs. 1 StPO",
  "g": "StPO",
  "n": "48",
  "a": null,
  "t": "Zeugenpflichten; Ladung",
  "b": [
   "str"
  ],
  "w": "(1) Zeugen sind verpflichtet, zu dem zu ihrer Vernehmung bestimmten Termin vor dem Richter zu erscheinen. Sie haben die Pflicht auszusagen, wenn keine im Gesetz zugelassene Ausnahme vorliegt.",
  "e": "Zeugen müssen vor Gericht erscheinen und aussagen.",
  "u": "https://www.gesetze-im-internet.de/stpo/__48.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 51 Abs. 1 StPO",
  "g": "StPO",
  "n": "51",
  "a": null,
  "t": "Folgen des Ausbleibens eines Zeugen",
  "b": [
   "str"
  ],
  "w": "(1) Einem ordnungsgemäß geladenen Zeugen, der nicht erscheint, werden die durch das Ausbleiben verursachten Kosten auferlegt. Zugleich wird gegen ihn ein Ordnungsgeld und für den Fall, daß dieses nicht beigetrieben werden kann, Ordnungshaft festgesetzt. Auch ist die zwangsweise Vorführung des Zeugen zulässig; § 135 gilt entsprechend. Im Falle wiederholten Ausbleibens kann das Ordnungsmittel noch einmal festgesetzt werden.",
  "e": "Wer als Zeuge unentschuldigt fehlt, zahlt die Kosten und ein Ordnungsgeld und kann vorgeführt werden.",
  "u": "https://www.gesetze-im-internet.de/stpo/__51.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 52 Abs. 1 StPO",
  "g": "StPO",
  "n": "52",
  "a": null,
  "t": "Zeugnisverweigerungsrecht der Angehörigen des Beschuldigten",
  "b": [
   "str"
  ],
  "w": "(1) Zur Verweigerung des Zeugnisses sind berechtigt 1. der Verlobte des Beschuldigten; 2. der Ehegatte des Beschuldigten, auch wenn die Ehe nicht mehr besteht; 2a. der Lebenspartner des Beschuldigten, auch wenn die Lebenspartnerschaft nicht mehr besteht; 3. wer mit dem Beschuldigten in gerader Linie verwandt oder verschwägert, in der Seitenlinie bis zum dritten Grad verwandt oder bis zum zweiten Grad verschwägert ist oder war.",
  "e": "Verlobte, Ehepartner und nahe Verwandte des Beschuldigten dürfen die Aussage verweigern.",
  "u": "https://www.gesetze-im-internet.de/stpo/__52.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 55 Abs. 1 StPO",
  "g": "StPO",
  "n": "55",
  "a": null,
  "t": "Auskunftsverweigerungsrecht",
  "b": [
   "str"
  ],
  "w": "(1) Jeder Zeuge kann die Auskunft auf solche Fragen verweigern, deren Beantwortung ihm selbst oder einem der in § 52 Abs. 1 bezeichneten Angehörigen die Gefahr zuziehen würde, wegen einer Straftat oder einer Ordnungswidrigkeit verfolgt zu werden.",
  "e": "Auf Fragen, mit denen man sich selbst oder Angehörige belasten würde, muss man nicht antworten.",
  "u": "https://www.gesetze-im-internet.de/stpo/__55.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 57 StPO",
  "g": "StPO",
  "n": "57",
  "a": null,
  "t": "Belehrung",
  "b": [
   "str"
  ],
  "w": "Vor der Vernehmung werden die Zeugen zur Wahrheit ermahnt und über die strafrechtlichen Folgen einer unrichtigen oder unvollständigen Aussage belehrt. Auf die Möglichkeit der Vereidigung werden sie hingewiesen. Im Fall der Vereidigung sind sie über die Bedeutung des Eides und darüber zu belehren, dass der Eid mit oder ohne religiöse Beteuerung geleistet werden kann.",
  "e": "Zeugen werden vor der Aussage zur Wahrheit ermahnt und über die Folgen falscher Aussagen belehrt.",
  "u": "https://www.gesetze-im-internet.de/stpo/__57.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 94 Abs. 1 und 2 StPO",
  "g": "StPO",
  "n": "94",
  "a": null,
  "t": "Sicherstellung und Beschlagnahme von Gegenständen zu Beweiszwecken",
  "b": [
   "str",
   "oso"
  ],
  "w": "(1) Gegenstände, die als Beweismittel für die Untersuchung von Bedeutung sein können, sind in Verwahrung zu nehmen oder in anderer Weise sicherzustellen. (2) Befinden sich die Gegenstände in dem Gewahrsam einer Person und werden sie nicht freiwillig herausgegeben, so bedarf es der Beschlagnahme.",
  "e": "Beweisstücke stellt die Behörde sicher; gibt jemand sie nicht freiwillig heraus, werden sie beschlagnahmt.",
  "u": "https://www.gesetze-im-internet.de/stpo/__94.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 136 Abs. 1 StPO",
  "g": "StPO",
  "n": "136",
  "a": null,
  "t": "Vernehmung",
  "b": [
   "str"
  ],
  "w": "(1) Bei Beginn der Vernehmung ist dem Beschuldigten zu eröffnen, welche Tat ihm zu Last gelegt wird und welche Strafvorschriften in Betracht kommen. Er ist darauf hinzuweisen, daß es ihm nach dem Gesetz freistehe, sich zu der Beschuldigung zu äußern oder nicht zur Sache auszusagen und jederzeit, auch schon vor seiner Vernehmung, einen von ihm zu wählenden Verteidiger zu befragen. Möchte der Beschuldigte vor seiner Vernehmung einen Verteidiger befragen, sind ihm Informationen zur Verfügung zu stellen, die es ihm erleichtern, einen Verteidiger zu kontaktieren. Auf bestehende anwaltliche Notdienste ist dabei hinzuweisen. Er ist ferner darüber zu belehren, daß er zu seiner Entlastung einzelne Beweiserhebungen beantragen und unter den Voraussetzungen des § 140 die Bestellung eines Pflichtverteidigers nach Maßgabe des § 141 Absatz 1 und des § 142 Absatz 1 beantragen kann; zu Letzterem ist er dabei auf die Kostenfolge des § 465 hinzuweisen. In geeigneten Fällen soll der Beschuldigte auch darauf, dass er sich schriftlich äußern kann, sowie auf die Möglichkeit eines Täter-Opfer-Ausgleichs hingewiesen werden.",
  "e": "Ein Beschuldigter erfährt den Vorwurf, darf schweigen und jederzeit einen Verteidiger befragen.",
  "u": "https://www.gesetze-im-internet.de/stpo/__136.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 152 StPO",
  "g": "StPO",
  "n": "152",
  "a": null,
  "t": "Anklagebehörde; Legalitätsgrundsatz",
  "b": [
   "str",
   "oso"
  ],
  "w": "(1) Zur Erhebung der öffentlichen Klage ist die Staatsanwaltschaft berufen. (2) Sie ist, soweit nicht gesetzlich ein anderes bestimmt ist, verpflichtet, wegen aller verfolgbaren Straftaten einzuschreiten, sofern zureichende tatsächliche Anhaltspunkte vorliegen.",
  "e": "Die Staatsanwaltschaft erhebt Anklage und muss jeder verfolgbaren Straftat nachgehen (Legalitätsprinzip).",
  "u": "https://www.gesetze-im-internet.de/stpo/__152.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 158 Abs. 1 StPO",
  "g": "StPO",
  "n": "158",
  "a": null,
  "t": "Strafanzeige; Strafantrag",
  "b": [
   "str"
  ],
  "w": "(1) Die Anzeige einer Straftat und der Strafantrag können bei der Staatsanwaltschaft, den Behörden und Beamten des Polizeidienstes und den Amtsgerichten angebracht werden. Die Anzeige und der Strafantrag sind durch die aufnehmende Stelle zu protokollieren oder auf sonstige Weise zu dokumentieren. Dem Verletzten ist auf Antrag der Eingang seiner Anzeige schriftlich zu bestätigen. Die Bestätigung soll eine kurze Zusammenfassung der Angaben des Verletzten zu Tatzeit, Tatort und angezeigter Tat enthalten. Die Bestätigung kann versagt werden, soweit der Untersuchungszweck, auch in einem anderen Strafverfahren, gefährdet erscheint.",
  "e": "Strafanzeige kann man bei Polizei, Staatsanwaltschaft oder Amtsgericht erstatten.",
  "u": "https://www.gesetze-im-internet.de/stpo/__158.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 160 Abs. 1 und 2 StPO",
  "g": "StPO",
  "n": "160",
  "a": null,
  "t": "Pflicht zur Sachverhaltsaufklärung",
  "b": [
   "str"
  ],
  "w": "(1) Sobald die Staatsanwaltschaft durch eine Anzeige oder auf anderem Wege von dem Verdacht einer Straftat Kenntnis erhält, hat sie zu ihrer Entschließung darüber, ob die öffentliche Klage zu erheben ist, den Sachverhalt zu erforschen. (2) Die Staatsanwaltschaft hat nicht nur die zur Belastung, sondern auch die zur Entlastung dienenden Umstände zu ermitteln und für die Erhebung der Beweise Sorge zu tragen, deren Verlust zu besorgen ist.",
  "e": "Die Staatsanwaltschaft klärt den Sachverhalt auf – Belastendes und Entlastendes.",
  "u": "https://www.gesetze-im-internet.de/stpo/__160.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 163 Abs. 1 StPO",
  "g": "StPO",
  "n": "163",
  "a": null,
  "t": "Aufgaben der Polizei im Ermittlungsverfahren",
  "b": [
   "str",
   "oso"
  ],
  "w": "(1) Die Behörden und Beamten des Polizeidienstes haben Straftaten zu erforschen und alle keinen Aufschub gestattenden Anordnungen zu treffen, um die Verdunkelung der Sache zu verhüten. Zu diesem Zweck sind sie befugt, alle Behörden um Auskunft zu ersuchen, bei Gefahr im Verzug auch, die Auskunft zu verlangen, sowie Ermittlungen jeder Art vorzunehmen, soweit nicht andere gesetzliche Vorschriften ihre Befugnisse besonders regeln.",
  "e": "Die Polizei erforscht Straftaten und trifft alle eiligen Maßnahmen, damit nichts verdunkelt wird.",
  "u": "https://www.gesetze-im-internet.de/stpo/__163.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 163b Abs. 1 StPO",
  "g": "StPO",
  "n": "163b",
  "a": null,
  "t": "Maßnahmen zur Identitätsfeststellung",
  "b": [
   "str",
   "oso"
  ],
  "w": "(1) Ist jemand einer Straftat verdächtig, so können die Staatsanwaltschaft und die Beamten des Polizeidienstes die zur Feststellung seiner Identität erforderlichen Maßnahmen treffen; § 163a Abs. 4 Satz 1 gilt entsprechend. Der Verdächtige darf festgehalten werden, wenn die Identität sonst nicht oder nur unter erheblichen Schwierigkeiten festgestellt werden kann. Unter den Voraussetzungen von Satz 2 sind auch die Durchsuchung der Person des Verdächtigen und der von ihm mitgeführten Sachen sowie die Durchführung erkennungsdienstlicher Maßnahmen zulässig.",
  "e": "Wer jemand ist, dürfen nur Staatsanwaltschaft und Polizei feststellen – notfalls mit Festhalten und Durchsuchung.",
  "u": "https://www.gesetze-im-internet.de/stpo/__163b.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 1 Abs. 1 OWiG",
  "g": "OWiG",
  "n": "1",
  "a": null,
  "t": "Begriffsbestimmung",
  "b": [
   "str",
   "oso"
  ],
  "w": "(1) Eine Ordnungswidrigkeit ist eine rechtswidrige und vorwerfbare Handlung, die den Tatbestand eines Gesetzes verwirklicht, das die Ahndung mit einer Geldbuße zuläßt.",
  "e": "Eine Ordnungswidrigkeit ist ein Verstoß, für den das Gesetz nur eine Geldbuße vorsieht.",
  "u": "https://www.gesetze-im-internet.de/owig_1968/__1.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 46 Abs. 3 OWiG",
  "g": "OWiG",
  "n": "46",
  "a": null,
  "t": "Anwendung der Vorschriften über das Strafverfahren",
  "b": [
   "str"
  ],
  "w": "(3) Anstaltsunterbringung, Verhaftung und vorläufige Festnahme, Beschlagnahme von Postsendungen und Telegrammen sowie Auskunftsersuchen über Umstände, die dem Post- und Fernmeldegeheimnis unterliegen, sind unzulässig. § 160 Abs. 3 Satz 2 der Strafprozeßordnung über die Gerichtshilfe ist nicht anzuwenden. Ein Klageerzwingungsverfahren findet nicht statt. Die Vorschriften über die Beteiligung des Verletzten am Verfahren und über das länderübergreifende staatsanwaltschaftliche Verfahrensregister sind nicht anzuwenden; dies gilt nicht für § 406e der Strafprozeßordnung.",
  "e": "Im Bußgeldverfahren gibt es keine Verhaftung und keine vorläufige Festnahme.",
  "u": "https://www.gesetze-im-internet.de/owig_1968/__46.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 47 Abs. 1 OWiG",
  "g": "OWiG",
  "n": "47",
  "a": null,
  "t": "Verfolgung von Ordnungswidrigkeiten",
  "b": [
   "str",
   "oso"
  ],
  "w": "(1) Die Verfolgung von Ordnungswidrigkeiten liegt im pflichtgemäßen Ermessen der Verfolgungsbehörde. Solange das Verfahren bei ihr anhängig ist, kann sie es einstellen.",
  "e": "Ob eine Ordnungswidrigkeit verfolgt wird, entscheidet die Behörde nach Ermessen (Opportunitätsprinzip).",
  "u": "https://www.gesetze-im-internet.de/owig_1968/__47.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 36 Abs. 1 StVO",
  "g": "StVO",
  "n": "36",
  "a": null,
  "t": "Zeichen und Weisungen der Polizeibeamten",
  "b": [
   "oso"
  ],
  "w": "(1) Die Zeichen und Weisungen der Polizeibeamten sind zu befolgen. Sie gehen allen anderen Anordnungen und sonstigen Regeln vor, entbinden den Verkehrsteilnehmer jedoch nicht von seiner Sorgfaltspflicht.",
  "e": "Zeichen und Weisungen der Polizei im Verkehr sind zu befolgen und gehen allem anderen vor.",
  "u": "https://www.gesetze-im-internet.de/stvo_2013/__36.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 1 AGG",
  "g": "AGG",
  "n": "1",
  "a": null,
  "t": "Ziel des Gesetzes",
  "b": [
   "umm"
  ],
  "w": "Ziel des Gesetzes ist, Benachteiligungen aus Gründen der Rasse oder wegen der ethnischen Herkunft, des Geschlechts, der Religion oder Weltanschauung, einer Behinderung, des Alters oder der sexuellen Identität zu verhindern oder zu beseitigen.",
  "e": "Niemand soll wegen Herkunft, Geschlecht, Religion, Behinderung, Alter oder sexueller Identität benachteiligt werden.",
  "u": "https://www.gesetze-im-internet.de/agg/__1.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 19 Abs. 1 AGG",
  "g": "AGG",
  "n": "19",
  "a": null,
  "t": "Zivilrechtliches Benachteiligungsverbot",
  "b": [
   "umm",
   "oso"
  ],
  "w": "(1) Eine Benachteiligung aus Gründen der Rasse oder wegen der ethnischen Herkunft, wegen des Geschlechts, der Religion, einer Behinderung, des Alters oder der sexuellen Identität bei der Begründung, Durchführung und Beendigung zivilrechtlicher Schuldverhältnisse, die 1. typischerweise ohne Ansehen der Person zu vergleichbaren Bedingungen in einer Vielzahl von Fällen zustande kommen (Massengeschäfte) oder bei denen das Ansehen der Person nach der Art des Schuldverhältnisses eine nachrangige Bedeutung hat und die zu vergleichbaren Bedingungen in einer Vielzahl von Fällen zustande kommen oder 2. eine privatrechtliche Versicherung zum Gegenstand haben, ist unzulässig.",
  "e": "Bei Alltagsgeschäften, die für jeden gleich ablaufen – etwa Einlass oder Einkauf –, ist solche Benachteiligung verboten.",
  "u": "https://www.gesetze-im-internet.de/agg/__19.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 21 Abs. 1 und 2 AGG",
  "g": "AGG",
  "n": "21",
  "a": null,
  "t": "Ansprüche",
  "b": [
   "umm"
  ],
  "w": "(1) Der Benachteiligte kann bei einem Verstoß gegen das Benachteiligungsverbot unbeschadet weiterer Ansprüche die Beseitigung der Beeinträchtigung verlangen. Sind weitere Beeinträchtigungen zu besorgen, so kann er auf Unterlassung klagen. (2) Bei einer Verletzung des Benachteiligungsverbots ist der Benachteiligende verpflichtet, den hierdurch entstandenen Schaden zu ersetzen. Dies gilt nicht, wenn der Benachteiligende die Pflichtverletzung nicht zu vertreten hat. Wegen eines Schadens, der nicht Vermögensschaden ist, kann der Benachteiligte eine angemessene Entschädigung in Geld verlangen.",
  "e": "Wer benachteiligt wurde, kann Unterlassung, Schadensersatz und eine Entschädigung verlangen.",
  "u": "https://www.gesetze-im-internet.de/agg/__21.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 4 Abs. 1 JuSchG",
  "g": "JuSchG",
  "n": "4",
  "a": null,
  "t": "Gaststätten",
  "b": [
   "umm"
  ],
  "w": "(1) Der Aufenthalt in Gaststätten darf Kindern und Jugendlichen unter 16 Jahren nur gestattet werden, wenn eine personensorgeberechtigte oder erziehungsbeauftragte Person sie begleitet oder wenn sie in der Zeit zwischen 5 Uhr und 23 Uhr eine Mahlzeit oder ein Getränk einnehmen. Jugendlichen ab 16 Jahren darf der Aufenthalt in Gaststätten ohne Begleitung einer personensorgeberechtigten oder erziehungsbeauftragten Person in der Zeit von 24 Uhr und 5 Uhr morgens nicht gestattet werden.",
  "e": "Unter 16 nur mit Begleitung in die Gaststätte; ab 16 allein bis 24 Uhr.",
  "u": "https://www.gesetze-im-internet.de/juschg/__4.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 22 (Auszug) KunstUrhG",
  "g": "KunstUrhG",
  "n": "22",
  "a": null,
  "t": "Recht am eigenen Bild",
  "b": [
   "umm",
   "ds"
  ],
  "w": "Bildnisse dürfen nur mit Einwilligung des Abgebildeten verbreitet oder öffentlich zur Schau gestellt werden. Die Einwilligung gilt im Zweifel als erteilt, wenn der Abgebildete dafür, daß er sich abbilden ließ, eine Entlohnung erhielt.",
  "e": "Bilder von Personen darf man nur mit deren Einwilligung verbreiten.",
  "u": "https://www.gesetze-im-internet.de/kunsturhg/__22.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 1 Abs. 1 bis 3 WaffG",
  "g": "WaffG",
  "n": "1",
  "a": null,
  "t": "Gegenstand und Zweck des Gesetzes, Begriffsbestimmungen",
  "b": [
   "waf"
  ],
  "w": "(1) Dieses Gesetz regelt den Umgang mit Waffen oder Munition unter Berücksichtigung der Belange der öffentlichen Sicherheit und Ordnung. (2) Waffen sind 1. Schusswaffen oder ihnen gleichgestellte Gegenstände und 2. tragbare Gegenstände, a) die ihrem Wesen nach dazu bestimmt sind, die Angriffs- oder Abwehrfähigkeit von Menschen zu beseitigen oder herabzusetzen, insbesondere Hieb- und Stoßwaffen; b) die, ohne dazu bestimmt zu sein, insbesondere wegen ihrer Beschaffenheit, Handhabung oder Wirkungsweise geeignet sind, die Angriffs- oder Abwehrfähigkeit von Menschen zu beseitigen oder herabzusetzen, und die in diesem Gesetz genannt sind. (3) Umgang mit einer Waffe oder Munition hat, wer diese erwirbt, besitzt, überlässt, führt, verbringt, mitnimmt, damit schießt, herstellt, bearbeitet, instand setzt oder damit Handel treibt. Umgang mit einer Schusswaffe hat auch, wer diese unbrauchbar macht.",
  "e": "Das Waffengesetz regelt den Umgang mit Waffen. Waffen sind Schusswaffen und Gegenstände, die Menschen angriffs- oder wehrlos machen sollen.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__1.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 4 Abs. 1 WaffG",
  "g": "WaffG",
  "n": "4",
  "a": null,
  "t": "Voraussetzungen für eine Erlaubnis",
  "b": [
   "waf"
  ],
  "w": "(1) Eine Erlaubnis setzt voraus, dass der Antragsteller 1. das 18. Lebensjahr vollendet hat (§ 2 Abs. 1), 2. die erforderliche Zuverlässigkeit (§ 5) und persönliche Eignung (§ 6) besitzt, 3. die erforderliche Sachkunde nachgewiesen hat (§ 7), 4. ein Bedürfnis nachgewiesen hat (§ 8) und 5. bei der Beantragung eines Waffenscheins oder einer Schießerlaubnis eine Versicherung gegen Haftpflicht in Höhe von 1 Million Euro - pauschal für Personen- und Sachschäden - nachweist.",
  "e": "Für eine Waffenerlaubnis braucht man: 18 Jahre, Zuverlässigkeit, Eignung, Sachkunde, ein Bedürfnis – beim Waffenschein zusätzlich eine Haftpflichtversicherung.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__4.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 5 Abs. 1 WaffG",
  "g": "WaffG",
  "n": "5",
  "a": null,
  "t": "Zuverlässigkeit",
  "b": [
   "waf"
  ],
  "w": "(1) Die erforderliche Zuverlässigkeit besitzen Personen nicht, 1. die rechtskräftig verurteilt worden sind a) wegen eines Verbrechens, b) wegen sonstiger vorsätzlicher Straftaten zu einer Freiheitsstrafe von mindestens einem Jahr oder c) zu einer Freiheitsstrafe oder Geldstrafe von mindestens 90 Tagessätzen wegen einer Straftat nach den §§ 80a, 83 Absatz 2, § 84 Absatz 1 bis 3, § 85 Absatz 1 Satz 1 und Absatz 2, § 87 Absatz 1, den §§ 87a, 88 Absatz 1, § 89 Absatz 1, § 89a Absatz 1 bis 3 und 8, § 89b Absatz 1, § 89c Absatz 1, 2 und 8, § 91 Absatz 1, § 95 Absatz 1, § 96 Absatz 2 oder § 97b des Strafgesetzbuches, nach § 98 des Strafgesetzbuches, soweit nicht ein Fall des § 98 Absatz 2 des Strafgesetzbuches vorliegt, nach § 99 Absatz 1 des Strafgesetzbuches, soweit nicht ein Fall des § 99 Absatz 3 des Strafgesetzbuches vorliegt, nach § 100a Absatz 1 in Verbindung mit Absatz 4 des Strafgesetzbuches oder nach den §§ 129, 129a Absatz 3 und 5 des Strafgesetzbuches, auch in Verbindung mit § 129b Absatz 1 des Strafgesetzbuches, wenn seit dem Eintritt der Rechtskraft der letzten Verurteilung zehn Jahre noch nicht verstrichen sind, 2. bei denen Tatsachen die Annahme rechtfertigen, dass sie a) Waffen oder Munition missbräuchlich oder leichtfertig verwenden werden, b) mit Waffen oder Munition nicht vorsichtig oder sachgemäß umgehen oder diese Gegenstände nicht sorgfältig verwahren werden, c) Waffen oder Munition Personen überlassen werden, die zur Ausübung der tatsächlichen Gewalt über diese Gegenstände nicht berechtigt sind.",
  "e": "Unzuverlässig ist zum Beispiel, wer wegen eines Verbrechens verurteilt wurde oder bei dem Missbrauch oder leichtfertiger Umgang mit Waffen zu befürchten ist.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__5.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 6 Abs. 1 Satz 1 WaffG",
  "g": "WaffG",
  "n": "6",
  "a": null,
  "t": "Persönliche Eignung",
  "b": [
   "waf"
  ],
  "w": "(1) Die erforderliche persönliche Eignung besitzen Personen nicht, wenn Tatsachen die Annahme rechtfertigen, dass sie 1. geschäftsunfähig sind, 2. abhängig von Alkohol oder anderen berauschenden Mitteln, psychisch krank oder debil sind oder 3. auf Grund in der Person liegender Umstände mit Waffen oder Munition nicht vorsichtig oder sachgemäß umgehen oder diese Gegenstände nicht sorgfältig verwahren können oder dass die konkrete Gefahr einer Fremd- oder Selbstgefährdung besteht.",
  "e": "Ungeeignet ist zum Beispiel, wer alkohol- oder drogenabhängig oder psychisch krank ist oder mit Waffen nicht sorgfältig umgeht.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__6.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 7 Abs. 1 WaffG",
  "g": "WaffG",
  "n": "7",
  "a": null,
  "t": "Sachkunde",
  "b": [
   "waf"
  ],
  "w": "(1) Den Nachweis der Sachkunde hat erbracht, wer eine Prüfung vor der dafür bestimmten Stelle bestanden hat oder seine Sachkunde durch eine Tätigkeit oder Ausbildung nachweist.",
  "e": "Waffensachkunde weist man durch eine Prüfung oder eine passende Ausbildung nach.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__7.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 8 WaffG",
  "g": "WaffG",
  "n": "8",
  "a": null,
  "t": "Bedürfnis, allgemeine Grundsätze",
  "b": [
   "waf"
  ],
  "w": "Der Nachweis eines Bedürfnisses ist erbracht, wenn gegenüber den Belangen der öffentlichen Sicherheit oder Ordnung 1. besonders anzuerkennende persönliche oder wirtschaftliche Interessen, vor allem als Jäger, Sportschütze, Brauchtumsschütze, Waffen- oder Munitionssammler, Waffen- oder Munitionssachverständiger, gefährdete Person, als Waffenhersteller oder -händler oder als Bewachungsunternehmer, und 2. die Geeignetheit und Erforderlichkeit der Waffen oder Munition für den beantragten Zweck glaubhaft gemacht sind.",
  "e": "Ein Bedürfnis hat, wer einen anerkannten Grund für die Waffe glaubhaft macht – etwa als Bewachungsunternehmer.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__8.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 10 Abs. 1 WaffG",
  "g": "WaffG",
  "n": "10",
  "a": "1",
  "t": "Erteilung von Erlaubnissen zum Erwerb, Besitz, Führen und Schießen",
  "b": [
   "waf"
  ],
  "w": "(1) Die Erlaubnis zum Erwerb und Besitz von Waffen wird durch eine Waffenbesitzkarte oder durch Eintragung in eine bereits vorhandene Waffenbesitzkarte erteilt. Für die Erteilung einer Erlaubnis für Schusswaffen sind Art, Anzahl und Kaliber der Schusswaffen anzugeben. Die Erlaubnis zum Erwerb einer Waffe gilt für die Dauer eines Jahres, die Erlaubnis zum Besitz wird in der Regel unbefristet erteilt.",
  "e": "Die Waffenbesitzkarte erlaubt Erwerb und Besitz.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__10.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 10 Abs. 4 WaffG",
  "g": "WaffG",
  "n": "10",
  "a": "4",
  "t": "Erteilung von Erlaubnissen zum Erwerb, Besitz, Führen und Schießen",
  "b": [
   "waf"
  ],
  "w": "(4) Die Erlaubnis zum Führen einer Waffe wird durch einen Waffenschein erteilt. Eine Erlaubnis nach Satz 1 zum Führen von Schusswaffen wird für bestimmte Schusswaffen auf höchstens drei Jahre erteilt; die Geltungsdauer kann zweimal um höchstens je drei Jahre verlängert werden, sie ist kürzer zu bemessen, wenn nur ein vorübergehendes Bedürfnis nachgewiesen wird. Der Geltungsbereich des Waffenscheins ist auf bestimmte Anlässe oder Gebiete zu beschränken, wenn ein darüber hinausgehendes Bedürfnis nicht nachgewiesen wird. Die Voraussetzungen für die Erteilung einer Erlaubnis zum Führen von Schreckschuss-, Reizstoff- und Signalwaffen sind in der Anlage 2 Abschnitt 2 Unterabschnitt 3 Nr. 2 und 2.1 genannt (Kleiner Waffenschein).",
  "e": "Der Waffenschein erlaubt das Führen – höchstens drei Jahre, zweimal verlängerbar. Für Schreckschusswaffen gibt es den Kleinen Waffenschein.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__10.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 28 Abs. 3 WaffG",
  "g": "WaffG",
  "n": "28",
  "a": "3",
  "t": "Erwerb, Besitz und Führen von Schusswaffen und Munition durch Bewachungsunternehmer und ihr Bewachungspersonal",
  "b": [
   "waf"
  ],
  "w": "(3) Wachpersonen, die auf Grund eines Arbeitsverhältnisses Schusswaffen des Erlaubnisinhabers nach dessen Weisung besitzen oder führen sollen, sind der zuständigen Behörde zur Prüfung zu benennen; der Unternehmer soll die betreffende Wachperson in geeigneter Weise vorher über die Benennung unter Hinweis auf die Erforderlichkeit der Verarbeitung personenbezogener Daten bei der Behörde unterrichten. Die Überlassung von Schusswaffen oder Munition darf erst erfolgen, wenn die zuständige Behörde zugestimmt hat. Die Zustimmung ist zu versagen, wenn die Wachperson nicht die Voraussetzungen des § 4 Abs. 1 Nr. 1 bis 3 erfüllt oder die Haftpflichtversicherung des Bewachungsunternehmers das Risiko des Umgangs mit Schusswaffen durch die Wachpersonen nicht umfasst.",
  "e": "Wachpersonen, die Firmenwaffen tragen sollen, werden der Behörde gemeldet. Erst nach deren Zustimmung dürfen sie die Waffe bekommen.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__28.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 36 Abs. 1 WaffG",
  "g": "WaffG",
  "n": "36",
  "a": null,
  "t": "Aufbewahrung von Waffen oder Munition",
  "b": [
   "waf"
  ],
  "w": "(1) Wer Waffen oder Munition besitzt, hat die erforderlichen Vorkehrungen zu treffen, um zu verhindern, dass diese Gegenstände abhanden kommen oder Dritte sie unbefugt an sich nehmen.",
  "e": "Wer Waffen besitzt, muss verhindern, dass sie wegkommen oder Unbefugte herankommen.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__36.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 37b Abs. 3 WaffG",
  "g": "WaffG",
  "n": "37b",
  "a": null,
  "t": "Anzeige der Vernichtung,der Unbrauchbarmachung und des Abhandenkommens",
  "b": [
   "waf"
  ],
  "w": "(3) Sind einer Person Waffen oder Munition, deren Erwerb oder Besitz der Erlaubnis bedarf, oder Erlaubnisurkunden abhandengekommen, so hat sie dies der zuständigen Behörde unverzüglich nach Feststellung des Abhandenkommens anzuzeigen.",
  "e": "Kommt eine erlaubnispflichtige Waffe abhanden, meldet man das sofort der Behörde.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__37b.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 38 Abs. 1 WaffG",
  "g": "WaffG",
  "n": "38",
  "a": null,
  "t": "Ausweispflichten",
  "b": [
   "waf"
  ],
  "w": "(1) Wer eine Waffe führt, muss folgende Dokumente mit sich führen: 1. seinen Personalausweis oder Pass und a) wenn es einer Erlaubnis zum Erwerb bedarf, die Waffenbesitzkarte oder, wenn es einer Erlaubnis zum Führen bedarf, den Waffenschein, b) im Fall des Verbringens einer Waffe oder von Munition gemäß § 29 den Erlaubnisschein, c) im Fall des Verbringens einer Waffe oder von Munition aus dem Geltungsbereich des Gesetzes gemäß § 30 den Erlaubnisschein oder eine Ablichtung hiervon sowie zusätzlich zum Erlaubnisschein oder der Ablichtung hiervon die Bestätigung der Anzeige durch das Bundesverwaltungsamt, bei elektronischer Anzeigebestätigung einen Ausdruck der Bestätigung des Bundesverwaltungsamts, d) im Fall der Mitnahme einer Waffe oder von Munition aus einem Drittstaat gemäß § 32 Absatz 1 den Erlaubnisschein, im Fall der Mitnahme auf Grund einer Erlaubnis nach § 32 Absatz 4 auch den Beleg für den Grund der Mitnahme, e) im Fall der Mitnahme einer Schusswaffe oder von Munition nach Anlage 1 Abschnitt 3 (Kategorien A 1.2 bis C) aa) aus einem anderen Mitgliedstaat gemäß § 32 Absatz 1 und 2 den Erlaubnisschein und den Europäischen Feuerwaffenpass, bb) aus dem Geltungsbereich dieses Gesetzes gemäß § 32 Absatz 1a den Erlaubnisschein, cc) aus einem anderen Mitgliedstaat oder aus dem Geltungsbereich dieses Gesetzes gemäß § 32 Absatz 3 den Europäischen Feuerwaffenpass und einen Beleg für den Grund der Mitnahme, f) im Fall der vorübergehenden Berechtigung zum Erwerb oder zum Führen auf Grund des § 12 Absatz 1 Nummer 1 und 2 oder § 28 Absatz 4 einen Beleg, aus dem der Name des Überlassers und des Besitzberechtigten sowie das Datum der Überlassung hervorgeht, oder g) im Fall des Schießens mit einer Schießerlaubnis nach § 10 Absatz 5 diese und 2. in den Fällen des § 13 Absatz 6 den Jagdschein. In den Fällen des § 13 Absatz 3 sowie im Fall des Führens einer Waffe, die auf Grund einer unbefristeten Erlaubnis gemäß § 14 Absatz 6 erworben wurde, genügt an Stelle der Waffenbesitzkarte ein schriftlicher Nachweis darüber, dass die Antragsfrist noch nicht verstrichen oder ein Antrag gestellt worden ist. Satz 1 gilt nicht in Fällen des § 12 Absatz 3 Nummer 1.",
  "e": "Wer eine Waffe führt, hat Ausweis und Erlaubnis dabei und händigt sie der Polizei auf Verlangen aus.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__38.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 45 Abs. 1 und 2 WaffG",
  "g": "WaffG",
  "n": "45",
  "a": null,
  "t": "Rücknahme und Widerruf",
  "b": [
   "waf"
  ],
  "w": "(1) Eine Erlaubnis nach diesem Gesetz ist zurückzunehmen, wenn nachträglich bekannt wird, dass die Erlaubnis hätte versagt werden müssen. (2) Eine Erlaubnis nach diesem Gesetz ist zu widerrufen, wenn nachträglich Tatsachen eintreten, die zur Versagung hätten führen müssen. Eine Erlaubnis nach diesem Gesetz kann auch widerrufen werden, wenn inhaltliche Beschränkungen nicht beachtet werden.",
  "e": "Eine Waffenerlaubnis wird zurückgenommen oder widerrufen, wenn ihre Voraussetzungen fehlen oder wegfallen.",
  "u": "https://www.gesetze-im-internet.de/waffg_2002/__45.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 13 Abs. 1 AWaffV",
  "g": "AWaffV",
  "n": "13",
  "a": null,
  "t": "Aufbewahrung von Waffen oder Munition",
  "b": [
   "waf"
  ],
  "w": "(1) Schusswaffen, deren Erwerb und Besitz erlaubnispflichtig sind, verbotene Waffen und verbotene Munition sind ungeladen und in einem Behältnis aufzubewahren, das 1. mindestens der Norm DIN/EN 1143-1 (Stand Mai 1997, Oktober 2002, Februar 2006, Januar 2010, Juli 2012 oder Juli 2019) 2 mit dem in Absatz 2 geregelten Widerstandsgrad und Gewicht entspricht und 2. zum Nachweis dessen über eine Zertifizierung durch eine akkreditierte Stelle gemäß Absatz 10 verfügt. Der in Satz 1 Nummer 1 genannten Norm gleichgestellt sind Normen eines anderen Mitgliedstaates des Übereinkommens über den Europäischen Wirtschaftsraum, die das gleiche Schutzniveau aufweisen. Die zuständige Behörde kann eine andere gleichwertige Aufbewahrung der Waffen und Munition zulassen. Vergleichbar gesicherte Räume sind als gleichwertig anzusehen. Alternative Sicherungseinrichtungen, die keine Behältnisse oder Räume sind, sind zulässig, sofern sie 1. ein den jeweiligen Anforderungen mindestens gleichwertiges Schutzniveau aufweisen und 2. zum Nachweis dessen über eine Zertifizierung durch eine akkreditierte Stelle gemäß Absatz 10 verfügen.",
  "e": "Erlaubnispflichtige Schusswaffen lagern ungeladen in einem zertifizierten Sicherheitsbehältnis.",
  "u": "https://www.gesetze-im-internet.de/awaffv/__13.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 4 Abs. 1 BDSG",
  "g": "BDSG",
  "n": "4",
  "a": "1",
  "t": "Videoüberwachung öffentlich zugänglicher Räume",
  "b": [
   "ds"
  ],
  "w": "(1) Die Beobachtung öffentlich zugänglicher Räume mit optisch-elektronischen Einrichtungen (Videoüberwachung) ist nur zulässig, soweit sie 1. zur Aufgabenerfüllung öffentlicher Stellen, 2. zur Wahrnehmung des Hausrechts oder 3. zur Wahrnehmung berechtigter Interessen für konkret festgelegte Zwecke erforderlich ist und keine Anhaltspunkte bestehen, dass schutzwürdige Interessen der betroffenen Personen überwiegen. Bei der Videoüberwachung von 1. öffentlich zugänglichen großflächigen Anlagen, wie insbesondere Sport-, Versammlungs- und Vergnügungsstätten, Einkaufszentren oder Parkplätzen, oder 2. Fahrzeugen und öffentlich zugänglichen großflächigen Einrichtungen des öffentlichen Schienen-, Schiffs- und Busverkehrs gilt der Schutz von Leben, Gesundheit oder Freiheit von dort aufhältigen Personen als ein besonders wichtiges Interesse.",
  "e": "Öffentlich zugängliche Räume dürfen nur gefilmt werden, wenn es nötig ist – etwa fürs Hausrecht – und die Interessen der Gefilmten nicht überwiegen.",
  "u": "https://www.gesetze-im-internet.de/bdsg_2018/__4.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 4 Abs. 3 BDSG",
  "g": "BDSG",
  "n": "4",
  "a": "3",
  "t": "Videoüberwachung öffentlich zugänglicher Räume",
  "b": [
   "ds"
  ],
  "w": "(3) Die Speicherung oder Verwendung von nach Absatz 1 erhobenen Daten ist zulässig, wenn sie zum Erreichen des verfolgten Zwecks erforderlich ist und keine Anhaltspunkte bestehen, dass schutzwürdige Interessen der betroffenen Personen überwiegen. Absatz 1 Satz 2 gilt entsprechend. Für einen anderen Zweck dürfen sie nur weiterverarbeitet werden, soweit dies zur Abwehr von Gefahren für die staatliche und öffentliche Sicherheit sowie zur Verfolgung von Straftaten erforderlich ist.",
  "e": "Aufnahmen dürfen nur für ihren Zweck genutzt werden – sonst nur zur Gefahrenabwehr oder Strafverfolgung.",
  "u": "https://www.gesetze-im-internet.de/bdsg_2018/__4.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 4 Abs. 5 BDSG",
  "g": "BDSG",
  "n": "4",
  "a": "5",
  "t": "Videoüberwachung öffentlich zugänglicher Räume",
  "b": [
   "ds"
  ],
  "w": "(5) Die Daten sind unverzüglich zu löschen, wenn sie zur Erreichung des Zwecks nicht mehr erforderlich sind oder schutzwürdige Interessen der betroffenen Personen einer weiteren Speicherung entgegenstehen.",
  "e": "Aufnahmen werden sofort gelöscht, wenn man sie nicht mehr braucht.",
  "u": "https://www.gesetze-im-internet.de/bdsg_2018/__4.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 26 Abs. 1 Satz 1 BDSG",
  "g": "BDSG",
  "n": "26",
  "a": null,
  "t": "Datenverarbeitung für Zwecke des Beschäftigungsverhältnisses",
  "b": [
   "ds"
  ],
  "w": "(1) Personenbezogene Daten von Beschäftigten dürfen für Zwecke des Beschäftigungsverhältnisses verarbeitet werden, wenn dies für die Entscheidung über die Begründung eines Beschäftigungsverhältnisses oder nach Begründung des Beschäftigungsverhältnisses für dessen Durchführung oder Beendigung oder zur Ausübung oder Erfüllung der sich aus einem Gesetz oder einem Tarifvertrag, einer Betriebs- oder Dienstvereinbarung (Kollektivvereinbarung) ergebenden Rechte und Pflichten der Interessenvertretung der Beschäftigten erforderlich ist.",
  "e": "Daten von Beschäftigten dürfen verarbeitet werden, soweit das Arbeitsverhältnis es erfordert.",
  "u": "https://www.gesetze-im-internet.de/bdsg_2018/__26.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 38 Abs. 1 BDSG",
  "g": "BDSG",
  "n": "38",
  "a": null,
  "t": "Datenschutzbeauftragte nichtöffentlicher Stellen",
  "b": [
   "ds"
  ],
  "w": "(1) Ergänzend zu Artikel 37 Absatz 1 Buchstabe b und c der Verordnung (EU) 2016/679 benennen der Verantwortliche und der Auftragsverarbeiter eine Datenschutzbeauftragte oder einen Datenschutzbeauftragten, soweit sie in der Regel mindestens 20 Personen ständig mit der automatisierten Verarbeitung personenbezogener Daten beschäftigen. Nehmen der Verantwortliche oder der Auftragsverarbeiter Verarbeitungen vor, die einer Datenschutz-Folgenabschätzung nach Artikel 35 der Verordnung (EU) 2016/679 unterliegen, oder verarbeiten sie personenbezogene Daten geschäftsmäßig zum Zweck der Übermittlung, der anonymisierten Übermittlung oder für Zwecke der Markt- oder Meinungsforschung, haben sie unabhängig von der Anzahl der mit der Verarbeitung beschäftigten Personen eine Datenschutzbeauftragte oder einen Datenschutzbeauftragten zu benennen.",
  "e": "Ab 20 Personen, die ständig mit automatisierter Datenverarbeitung zu tun haben, braucht ein Betrieb einen Datenschutzbeauftragten.",
  "u": "https://www.gesetze-im-internet.de/bdsg_2018/__38.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 42 Abs. 1 und 2 BDSG",
  "g": "BDSG",
  "n": "42",
  "a": null,
  "t": "Strafvorschriften",
  "b": [
   "ds"
  ],
  "w": "(1) Mit Freiheitsstrafe bis zu drei Jahren oder mit Geldstrafe wird bestraft, wer wissentlich nicht allgemein zugängliche personenbezogene Daten einer großen Zahl von Personen, ohne hierzu berechtigt zu sein, 1. einem Dritten übermittelt oder 2. auf andere Art und Weise zugänglich macht und hierbei gewerbsmäßig handelt. (2) Mit Freiheitsstrafe bis zu zwei Jahren oder mit Geldstrafe wird bestraft, wer personenbezogene Daten, die nicht allgemein zugänglich sind, 1. ohne hierzu berechtigt zu sein, verarbeitet oder 2. durch unrichtige Angaben erschleicht und hierbei gegen Entgelt oder in der Absicht handelt, sich oder einen anderen zu bereichern oder einen anderen zu schädigen.",
  "e": "Strafbar ist, nicht öffentliche Daten vieler Menschen gewerbsmäßig weiterzugeben oder Daten gegen Geld oder zum Schaden anderer zu missbrauchen.",
  "u": "https://www.gesetze-im-internet.de/bdsg_2018/__42.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 43 Abs. 1 und 2 BDSG",
  "g": "BDSG",
  "n": "43",
  "a": null,
  "t": "Bußgeldvorschriften",
  "b": [
   "ds"
  ],
  "w": "(1) Ordnungswidrig handelt, wer vorsätzlich oder fahrlässig 1. entgegen § 30 Absatz 1 ein Auskunftsverlangen nicht richtig behandelt oder 2. entgegen § 30 Absatz 2 Satz 1 einen Verbraucher nicht, nicht richtig, nicht vollständig oder nicht rechtzeitig unterrichtet. (2) Die Ordnungswidrigkeit kann mit einer Geldbuße bis zu fünfzigtausend Euro geahndet werden.",
  "e": "§ 43 betrifft nur Auskünfte bei Verbraucherkrediten – er ist keine allgemeine Bußgeldvorschrift für Datenschutzverstöße.",
  "u": "https://www.gesetze-im-internet.de/bdsg_2018/__43.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 7 Abs. 1 SGB VII",
  "g": "SGB VII",
  "n": "7",
  "a": null,
  "t": "Begriff",
  "b": [
   "uvv"
  ],
  "w": "(1) Versicherungsfälle sind Arbeitsunfälle und Berufskrankheiten.",
  "e": "Versichert sind Arbeitsunfälle und Berufskrankheiten.",
  "u": "https://www.gesetze-im-internet.de/sgb_7/__7.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 8 Abs. 1 SGB VII",
  "g": "SGB VII",
  "n": "8",
  "a": "1",
  "t": "Arbeitsunfall",
  "b": [
   "uvv"
  ],
  "w": "(1) Arbeitsunfälle sind Unfälle von Versicherten infolge einer den Versicherungsschutz nach § 2, 3 oder 6 begründenden Tätigkeit (versicherte Tätigkeit). Unfälle sind zeitlich begrenzte, von außen auf den Körper einwirkende Ereignisse, die zu einem Gesundheitsschaden oder zum Tod führen. Wird die versicherte Tätigkeit im Haushalt der Versicherten oder an einem anderen Ort ausgeübt, besteht Versicherungsschutz in gleichem Umfang wie bei Ausübung der Tätigkeit auf der Unternehmensstätte.",
  "e": "Ein Arbeitsunfall ist ein Unfall bei der versicherten Tätigkeit.",
  "u": "https://www.gesetze-im-internet.de/sgb_7/__8.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 8 Abs. 2 Nr. 1 (Auszug) SGB VII",
  "g": "SGB VII",
  "n": "8",
  "a": "2",
  "t": "Arbeitsunfall",
  "b": [
   "uvv"
  ],
  "w": "(2) Versicherte Tätigkeiten sind auch 1. das Zurücklegen des mit der versicherten Tätigkeit zusammenhängenden unmittelbaren Weges nach und von dem Ort der Tätigkeit,",
  "e": "Auch der direkte Weg zur Arbeit und zurück ist versichert.",
  "u": "https://www.gesetze-im-internet.de/sgb_7/__8.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 150 Abs. 1 Satz 1 SGB VII",
  "g": "SGB VII",
  "n": "150",
  "a": null,
  "t": "Beitragspflichtige",
  "b": [
   "uvv"
  ],
  "w": "(1) Beitragspflichtig sind die Unternehmer, für deren Unternehmen Versicherte tätig sind oder zu denen Versicherte in einer besonderen, die Versicherung begründenden Beziehung stehen.",
  "e": "Die Beiträge zur Unfallversicherung zahlen die Unternehmer.",
  "u": "https://www.gesetze-im-internet.de/sgb_7/__150.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 29 Abs. 1 Nr. 1 (Auszug) BtMG",
  "g": "BtMG",
  "n": "29",
  "a": null,
  "t": "Straftaten",
  "b": [
   "str"
  ],
  "w": "(1) Mit Freiheitsstrafe bis zu fünf Jahren oder mit Geldstrafe wird bestraft, wer 1. Betäubungsmittel unerlaubt anbaut, herstellt, mit ihnen Handel treibt, sie, ohne Handel zu treiben, einführt, ausführt, veräußert, abgibt, sonst in den Verkehr bringt, erwirbt oder sich in sonstiger Weise verschafft,",
  "e": "Anbau, Handel und Erwerb von Betäubungsmitteln ohne Erlaubnis sind strafbar; Nr. 3 erfasst auch den Besitz.",
  "u": "https://www.gesetze-im-internet.de/btmg_1981/__29.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 2 Abs. 1 KCanG",
  "g": "KCanG",
  "n": "2",
  "a": null,
  "t": "Umgang mit Cannabis",
  "b": [
   "str"
  ],
  "w": "(1) Es ist verboten, 1. Cannabis zu besitzen, 2. Cannabis anzubauen, 3. Cannabis herzustellen, 4. mit Cannabis Handel zu treiben, 5. Cannabis einzuführen oder auszuführen, 6. Cannabis durchzuführen, 7. Cannabis abzugeben oder weiterzugeben, 8. Cannabis zum unmittelbaren Verbrauch zu überlassen, 9. Cannabis zu verabreichen, 10. Cannabis sonst in den Verkehr zu bringen, 11. sich Cannabis zu verschaffen oder 12. Cannabis zu erwerben oder entgegenzunehmen.",
  "e": "Der Umgang mit Cannabis ist grundsätzlich verboten – das Gesetz macht Ausnahmen für Erwachsene.",
  "u": "https://www.gesetze-im-internet.de/kcang/__2.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "§ 3 Abs. 1 KCanG",
  "g": "KCanG",
  "n": "3",
  "a": null,
  "t": "Erlaubter Besitz von Cannabis",
  "b": [
   "str"
  ],
  "w": "(1) Personen, die das 18. Lebensjahr vollendet haben, ist der Besitz von bis zu 25 Gramm Cannabis, bei Blüten, blütennahen Blättern oder sonstigem Pflanzenmaterial der Cannabispflanze bezogen auf das Gewicht nach dem Trocknen, zum Eigenkonsum erlaubt.",
  "e": "Erwachsene dürfen bis zu 25 Gramm Cannabis zum Eigenkonsum besitzen.",
  "u": "https://www.gesetze-im-internet.de/kcang/__3.html",
  "h": "gesetze-im-internet.de"
 },
 {
  "k": "Art. 2 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "2",
  "a": null,
  "t": "Anwendungsbereich",
  "b": [
   "ds"
  ],
  "w": "(1) Diese Verordnung gilt für die ganz oder teilweise automatisierte Verarbeitung personenbezogener Daten sowie für die nichtautomatisierte Verarbeitung personenbezogener Daten, die in einem Dateisystem gespeichert sind oder gespeichert werden sollen.",
  "e": "Die DS-GVO gilt für automatisierte Verarbeitung und für geordnete Papierablagen.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 4 Nr. 2 DS-GVO",
  "g": "DS-GVO",
  "n": "4",
  "a": null,
  "t": "Verarbeitung",
  "b": [
   "ds"
  ],
  "w": "2. „Verarbeitung“ jeden mit oder ohne Hilfe automatisierter Verfahren ausgeführten Vorgang oder jede solche Vorgangsreihe im Zusammenhang mit personenbezogenen Daten wie das Erheben, das Erfassen, die Organisation, das Ordnen, die Speicherung, die Anpassung oder Veränderung, das Auslesen, das Abfragen, die Verwendung, die Offenlegung durch Übermittlung, Verbreitung oder eine andere Form der Bereitstellung, den Abgleich oder die Verknüpfung, die Einschränkung, das Löschen oder die Vernichtung;",
  "e": "Verarbeitung ist jeder Umgang mit Daten – vom Erheben bis zum Löschen.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex",
  "r": "2"
 },
 {
  "k": "Art. 4 Nr. 7 DS-GVO",
  "g": "DS-GVO",
  "n": "4",
  "a": null,
  "t": "Verantwortlicher",
  "b": [
   "ds"
  ],
  "w": "7. „Verantwortlicher“ die natürliche oder juristische Person, Behörde, Einrichtung oder andere Stelle, die allein oder gemeinsam mit anderen über die Zwecke und Mittel der Verarbeitung von personenbezogenen Daten entscheidet; sind die Zwecke und Mittel dieser Verarbeitung durch das Unionsrecht oder das Recht der Mitgliedstaaten vorgegeben, so kann der Verantwortliche beziehungsweise können die bestimmten Kriterien seiner Benennung nach dem Unionsrecht oder dem Recht der Mitgliedstaaten vorgesehen werden;",
  "e": "Verantwortlich ist, wer über Zweck und Mittel der Verarbeitung entscheidet.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex",
  "r": "7"
 },
 {
  "k": "Art. 4 Nr. 8 DS-GVO",
  "g": "DS-GVO",
  "n": "4",
  "a": null,
  "t": "Auftragsverarbeiter",
  "b": [
   "ds"
  ],
  "w": "8. „Auftragsverarbeiter“ eine natürliche oder juristische Person, Behörde, Einrichtung oder andere Stelle, die personenbezogene Daten im Auftrag des Verantwortlichen verarbeitet;",
  "e": "Auftragsverarbeiter ist, wer Daten für den Verantwortlichen verarbeitet.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex",
  "r": "8"
 },
 {
  "k": "Art. 4 Nr. 11 DS-GVO",
  "g": "DS-GVO",
  "n": "4",
  "a": null,
  "t": "Einwilligung",
  "b": [
   "ds"
  ],
  "w": "11. „Einwilligung“ der betroffenen Person jede freiwillig für den bestimmten Fall, in informierter Weise und unmissverständlich abgegebene Willensbekundung in Form einer Erklärung oder einer sonstigen eindeutigen bestätigenden Handlung, mit der die betroffene Person zu verstehen gibt, dass sie mit der Verarbeitung der sie betreffenden personenbezogenen Daten einverstanden ist;",
  "e": "Eine Einwilligung muss freiwillig, informiert und eindeutig sein.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex",
  "r": "11"
 },
 {
  "k": "Art. 5 Abs. 2 DS-GVO",
  "g": "DS-GVO",
  "n": "5",
  "a": "2",
  "t": "Rechenschaftspflicht",
  "b": [
   "ds"
  ],
  "w": "(2) Der Verantwortliche ist für die Einhaltung des Absatzes 1 verantwortlich und muss dessen Einhaltung nachweisen können („Rechenschaftspflicht“).",
  "e": "Der Verantwortliche muss nachweisen können, dass er die Grundsätze einhält.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 7 Abs. 3 DS-GVO",
  "g": "DS-GVO",
  "n": "7",
  "a": null,
  "t": "Widerruf der Einwilligung",
  "b": [
   "ds"
  ],
  "w": "(3) Die betroffene Person hat das Recht, ihre Einwilligung jederzeit zu widerrufen. Durch den Widerruf der Einwilligung wird die Rechtmäßigkeit der aufgrund der Einwilligung bis zum Widerruf erfolgten Verarbeitung nicht berührt. Die betroffene Person wird vor Abgabe der Einwilligung hiervon in Kenntnis gesetzt. Der Widerruf der Einwilligung muss so einfach wie die Erteilung der Einwilligung sein.",
  "e": "Eine Einwilligung kann man jederzeit widerrufen – so einfach, wie man sie gegeben hat.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 9 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "9",
  "a": null,
  "t": "Besondere Kategorien",
  "b": [
   "ds"
  ],
  "w": "(1) Die Verarbeitung personenbezogener Daten, aus denen die rassische und ethnische Herkunft, politische Meinungen, religiöse oder weltanschauliche Überzeugungen oder die Gewerkschaftszugehörigkeit hervorgehen, sowie die Verarbeitung von genetischen Daten, biometrischen Daten zur eindeutigen Identifizierung einer natürlichen Person, Gesundheitsdaten oder Daten zum Sexualleben oder der sexuellen Orientierung einer natürlichen Person ist untersagt.",
  "e": "Besonders sensible Daten – etwa Gesundheit, Religion, Herkunft – dürfen grundsätzlich nicht verarbeitet werden.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 12 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "12",
  "a": null,
  "t": "Transparente Information",
  "b": [
   "ds"
  ],
  "w": "(1) Der Verantwortliche trifft geeignete Maßnahmen, um der betroffenen Person alle Informationen gemäß den Artikeln 13 und 14 und alle Mitteilungen gemäß den Artikeln 15 bis 22 und Artikel 34, die sich auf die Verarbeitung beziehen, in präziser, transparenter, verständlicher und leicht zugänglicher Form in einer klaren und einfachen Sprache zu übermitteln; dies gilt insbesondere für Informationen, die sich speziell an Kinder richten. Die Übermittlung der Informationen erfolgt schriftlich oder in anderer Form, gegebenenfalls auch elektronisch. Falls von der betroffenen Person verlangt, kann die Information mündlich erteilt werden, sofern die Identität der betroffenen Person in anderer Form nachgewiesen wurde.",
  "e": "Informationen an Betroffene müssen klar, verständlich und leicht zugänglich sein.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 13 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "13",
  "a": null,
  "t": "Informationspflicht",
  "b": [
   "ds"
  ],
  "w": "(1) Werden personenbezogene Daten bei der betroffenen Person erhoben, so teilt der Verantwortliche der betroffenen Person zum Zeitpunkt der Erhebung dieser Daten Folgendes mit: a) den Namen und die Kontaktdaten des Verantwortlichen sowie gegebenenfalls seines Vertreters; b) gegebenenfalls die Kontaktdaten des Datenschutzbeauftragten; c) die Zwecke, für die die personenbezogenen Daten verarbeitet werden sollen, sowie die Rechtsgrundlage für die Verarbeitung; d) wenn die Verarbeitung auf Artikel 6 Absatz 1 Buchstabe f beruht, die berechtigten Interessen, die von dem Verantwortlichen oder einem Dritten verfolgt werden; e) gegebenenfalls die Empfänger oder Kategorien von Empfängern der personenbezogenen Daten und f) gegebenenfalls die Absicht des Verantwortlichen, die personenbezogenen Daten an ein Drittland oder eine internationale Organisation zu übermitteln, sowie das Vorhandensein oder das Fehlen eines Angemessenheitsbeschlusses der Kommission oder im Falle von Übermittlungen gemäß Artikel 46 oder Artikel 47 oder Artikel 49 Absatz 1 Unterabsatz 2 einen Verweis auf die geeigneten oder angemessenen Garantien und die Möglichkeit, wie eine Kopie von ihnen zu erhalten ist, oder wo sie verfügbar sind.",
  "e": "Wer Daten direkt bei jemandem erhebt, sagt ihm sofort, wer verantwortlich ist und wozu die Daten dienen.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 15 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "15",
  "a": null,
  "t": "Auskunftsrecht",
  "b": [
   "ds"
  ],
  "w": "(1) Die betroffene Person hat das Recht, von dem Verantwortlichen eine Bestätigung darüber zu verlangen, ob sie betreffende personenbezogene Daten verarbeitet werden; ist dies der Fall, so hat sie ein Recht auf Auskunft über diese personenbezogenen Daten und auf folgende Informationen: a) die Verarbeitungszwecke; b) die Kategorien personenbezogener Daten, die verarbeitet werden; c) die Empfänger oder Kategorien von Empfängern, gegenüber denen die personenbezogenen Daten offengelegt worden sind oder noch offengelegt werden, insbesondere bei Empfängern in Drittländern oder bei internationalen Organisationen; d) falls möglich die geplante Dauer, für die die personenbezogenen Daten gespeichert werden, oder, falls dies nicht möglich ist, die Kriterien für die Festlegung dieser Dauer; e) das Bestehen eines Rechts auf Berichtigung oder Löschung der sie betreffenden personenbezogenen Daten oder auf Einschränkung der Verarbeitung durch den Verantwortlichen oder eines Widerspruchsrechts gegen diese Verarbeitung; f) das Bestehen eines Beschwerderechts bei einer Aufsichtsbehörde; g) wenn die personenbezogenen Daten nicht bei der betroffenen Person erhoben werden, alle verfügbaren Informationen über die Herkunft der Daten; h) das Bestehen einer automatisierten Entscheidungsfindung einschließlich Profiling gemäß Artikel 22 Absätze 1 und 4 und — zumindest in diesen Fällen — aussagekräftige Informationen über die involvierte Logik sowie die Tragweite und die angestrebten Auswirkungen einer derartigen Verarbeitung für die betroffene Person.",
  "e": "Jeder kann Auskunft verlangen, ob und welche Daten über ihn verarbeitet werden.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 16 DS-GVO",
  "g": "DS-GVO",
  "n": "16",
  "a": null,
  "t": "Recht auf Berichtigung",
  "b": [
   "ds"
  ],
  "w": "Die betroffene Person hat das Recht, von dem Verantwortlichen unverzüglich die Berichtigung sie betreffender unrichtiger personenbezogener Daten zu verlangen. Unter Berücksichtigung der Zwecke der Verarbeitung hat die betroffene Person das Recht, die Vervollständigung unvollständiger personenbezogener Daten — auch mittels einer ergänzenden Erklärung — zu verlangen.",
  "e": "Falsche Daten müssen auf Verlangen sofort berichtigt werden.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 17 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "17",
  "a": null,
  "t": "Recht auf Löschung",
  "b": [
   "ds"
  ],
  "w": "(1) Die betroffene Person hat das Recht, von dem Verantwortlichen zu verlangen, dass sie betreffende personenbezogene Daten unverzüglich gelöscht werden, und der Verantwortliche ist verpflichtet, personenbezogene Daten unverzüglich zu löschen, sofern einer der folgenden Gründe zutrifft: a) Die personenbezogenen Daten sind für die Zwecke, für die sie erhoben oder auf sonstige Weise verarbeitet wurden, nicht mehr notwendig. b) Die betroffene Person widerruft ihre Einwilligung, auf die sich die Verarbeitung gemäß Artikel 6 Absatz 1 Buchstabe a oder Artikel 9 Absatz 2 Buchstabe a stützte, und es fehlt an einer anderweitigen Rechtsgrundlage für die Verarbeitung. c) Die betroffene Person legt gemäß Artikel 21 Absatz 1 Widerspruch gegen die Verarbeitung ein und es liegen keine vorrangigen berechtigten Gründe für die Verarbeitung vor, oder die betroffene Person legt gemäß Artikel 21 Absatz 2 Widerspruch gegen die Verarbeitung ein. d) Die personenbezogenen Daten wurden unrechtmäßig verarbeitet. e) Die Löschung der personenbezogenen Daten ist zur Erfüllung einer rechtlichen Verpflichtung nach dem Unionsrecht oder dem Recht der Mitgliedstaaten erforderlich, dem der Verantwortliche unterliegt. f) Die personenbezogenen Daten wurden in Bezug auf angebotene Dienste der Informationsgesellschaft gemäß Artikel 8 Absatz 1 erhoben.",
  "e": "Daten müssen gelöscht werden, wenn sie nicht mehr gebraucht werden, die Einwilligung widerrufen wurde oder die Verarbeitung unrechtmäßig war.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 21 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "21",
  "a": null,
  "t": "Widerspruchsrecht",
  "b": [
   "ds"
  ],
  "w": "(1) Die betroffene Person hat das Recht, aus Gründen, die sich aus ihrer besonderen Situation ergeben, jederzeit gegen die Verarbeitung sie betreffender personenbezogener Daten, die aufgrund von Artikel 6 Absatz 1 Buchstaben e oder f erfolgt, Widerspruch einzulegen; dies gilt auch für ein auf diese Bestimmungen gestütztes Profiling. Der Verantwortliche verarbeitet die personenbezogenen Daten nicht mehr, es sei denn, er kann zwingende schutzwürdige Gründe für die Verarbeitung nachweisen, die die Interessen, Rechte und Freiheiten der betroffenen Person überwiegen, oder die Verarbeitung dient der Geltendmachung, Ausübung oder Verteidigung von Rechtsansprüchen.",
  "e": "Gegen Verarbeitung aus berechtigtem Interesse kann man widersprechen; dann braucht der Verantwortliche zwingende Gründe.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 24 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "24",
  "a": null,
  "t": "Verantwortung des Verantwortlichen",
  "b": [
   "ds"
  ],
  "w": "(1) Der Verantwortliche setzt unter Berücksichtigung der Art, des Umfangs, der Umstände und der Zwecke der Verarbeitung sowie der unterschiedlichen Eintrittswahrscheinlichkeit und Schwere der Risiken für die Rechte und Freiheiten natürlicher Personen geeignete technische und organisatorische Maßnahmen um, um sicherzustellen und den Nachweis dafür erbringen zu können, dass die Verarbeitung gemäß dieser Verordnung erfolgt. Diese Maßnahmen werden erforderlichenfalls überprüft und aktualisiert.",
  "e": "Der Verantwortliche sorgt mit technischen und organisatorischen Maßnahmen dafür, dass die Regeln eingehalten werden.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 28 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "28",
  "a": null,
  "t": "Auftragsverarbeiter",
  "b": [
   "ds"
  ],
  "w": "(1) Erfolgt eine Verarbeitung im Auftrag eines Verantwortlichen, so arbeitet dieser nur mit Auftragsverarbeitern, die hinreichend Garantien dafür bieten, dass geeignete technische und organisatorische Maßnahmen so durchgeführt werden, dass die Verarbeitung im Einklang mit den Anforderungen dieser Verordnung erfolgt und den Schutz der Rechte der betroffenen Person gewährleistet.",
  "e": "Wer Daten von anderen verarbeiten lässt, darf nur zuverlässige Dienstleister beauftragen.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 29 DS-GVO",
  "g": "DS-GVO",
  "n": "29",
  "a": null,
  "t": "Verarbeitung nur auf Weisung",
  "b": [
   "ds"
  ],
  "w": "Der Auftragsverarbeiter und jede dem Verantwortlichen oder dem Auftragsverarbeiter unterstellte Person, die Zugang zu personenbezogenen Daten hat, dürfen diese Daten ausschließlich auf Weisung des Verantwortlichen verarbeiten, es sei denn, dass sie nach dem Unionsrecht oder dem Recht der Mitgliedstaaten zur Verarbeitung verpflichtet sind.",
  "e": "Wer Zugang zu Daten hat, verarbeitet sie nur auf Weisung des Verantwortlichen.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 32 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "32",
  "a": null,
  "t": "Sicherheit der Verarbeitung",
  "b": [
   "ds"
  ],
  "w": "(1) Unter Berücksichtigung des Stands der Technik, der Implementierungskosten und der Art, des Umfangs, der Umstände und der Zwecke der Verarbeitung sowie der unterschiedlichen Eintrittswahrscheinlichkeit und Schwere des Risikos für die Rechte und Freiheiten natürlicher Personen treffen der Verantwortliche und der Auftragsverarbeiter geeignete technische und organisatorische Maßnahmen, um ein dem Risiko angemessenes Schutzniveau zu gewährleisten; diese Maßnahmen schließen unter anderem Folgendes ein: a) die Pseudonymisierung und Verschlüsselung personenbezogener Daten; b) die Fähigkeit, die Vertraulichkeit, Integrität, Verfügbarkeit und Belastbarkeit der Systeme und Dienste im Zusammenhang mit der Verarbeitung auf Dauer sicherzustellen; c) die Fähigkeit, die Verfügbarkeit der personenbezogenen Daten und den Zugang zu ihnen bei einem physischen oder technischen Zwischenfall rasch wiederherzustellen; d) ein Verfahren zur regelmäßigen Überprüfung, Bewertung und Evaluierung der Wirksamkeit der technischen und organisatorischen Maßnahmen zur Gewährleistung der Sicherheit der Verarbeitung.",
  "e": "Daten sind technisch und organisatorisch so zu schützen, wie es dem Risiko entspricht.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 34 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "34",
  "a": null,
  "t": "Benachrichtigung der Betroffenen",
  "b": [
   "ds"
  ],
  "w": "(1) Hat die Verletzung des Schutzes personenbezogener Daten voraussichtlich ein hohes Risiko für die persönlichen Rechte und Freiheiten natürlicher Personen zur Folge, so benachrichtigt der Verantwortliche die betroffene Person unverzüglich von der Verletzung.",
  "e": "Bei hohem Risiko werden auch die Betroffenen sofort über die Datenpanne informiert.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 35 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "35",
  "a": null,
  "t": "Datenschutz-Folgenabschätzung",
  "b": [
   "ds"
  ],
  "w": "(1) Hat eine Form der Verarbeitung, insbesondere bei Verwendung neuer Technologien, aufgrund der Art, des Umfangs, der Umstände und der Zwecke der Verarbeitung voraussichtlich ein hohes Risiko für die Rechte und Freiheiten natürlicher Personen zur Folge, so führt der Verantwortliche vorab eine Abschätzung der Folgen der vorgesehenen Verarbeitungsvorgänge für den Schutz personenbezogener Daten durch. Für die Untersuchung mehrerer ähnlicher Verarbeitungsvorgänge mit ähnlich hohen Risiken kann eine einzige Abschätzung vorgenommen werden.",
  "e": "Bei riskanten Verarbeitungen prüft der Verantwortliche vorher die Folgen für die Betroffenen.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 37 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "37",
  "a": null,
  "t": "Datenschutzbeauftragter",
  "b": [
   "ds"
  ],
  "w": "(1) Der Verantwortliche und der Auftragsverarbeiter benennen auf jeden Fall einen Datenschutzbeauftragten, wenn a) die Verarbeitung von einer Behörde oder öffentlichen Stelle durchgeführt wird, mit Ausnahme von Gerichten, die im Rahmen ihrer justiziellen Tätigkeit handeln, b) die Kerntätigkeit des Verantwortlichen oder des Auftragsverarbeiters in der Durchführung von Verarbeitungsvorgängen besteht, welche aufgrund ihrer Art, ihres Umfangs und/oder ihrer Zwecke eine umfangreiche regelmäßige und systematische Überwachung von betroffenen Personen erforderlich machen, oder c) die Kerntätigkeit des Verantwortlichen oder des Auftragsverarbeiters in der umfangreichen Verarbeitung besonderer Kategorien von Daten gemäß Artikel 9 oder von personenbezogenen Daten über strafrechtliche Verurteilungen und Straftaten gemäß Artikel 10 besteht.",
  "e": "Behörden und Stellen, die Menschen umfangreich überwachen oder sensible Daten verarbeiten, brauchen einen Datenschutzbeauftragten.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 82 Abs. 1 DS-GVO",
  "g": "DS-GVO",
  "n": "82",
  "a": null,
  "t": "Schadenersatz",
  "b": [
   "ds"
  ],
  "w": "(1) Jede Person, der wegen eines Verstoßes gegen diese Verordnung ein materieller oder immaterieller Schaden entstanden ist, hat Anspruch auf Schadenersatz gegen den Verantwortlichen oder gegen den Auftragsverarbeiter.",
  "e": "Wer durch einen Datenschutzverstoß einen Schaden erleidet, bekommt Schadensersatz.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "Art. 83 Abs. 5 DS-GVO (Auszug)",
  "g": "DS-GVO",
  "n": "83",
  "a": null,
  "t": "Geldbußen",
  "b": [
   "ds"
  ],
  "w": "(5) Bei Verstößen gegen die folgenden Bestimmungen werden im Einklang mit Absatz 2 Geldbußen von bis zu 20 000 000 EUR oder im Fall eines Unternehmens von bis zu 4 % seines gesamten weltweit erzielten Jahresumsatzes des vorangegangenen Geschäftsjahrs verhängt, je nachdem, welcher der Beträge höher ist:",
  "e": "Bei schweren Verstößen drohen Geldbußen bis 20 Mio. € oder 4 % des weltweiten Jahresumsatzes.",
  "u": "https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679",
  "h": "EUR-Lex"
 },
 {
  "k": "§ 1 Abs. 1 PolG NRW",
  "g": "PolG NRW",
  "n": "1",
  "a": "1",
  "t": "Aufgaben der Polizei",
  "b": [
   "oso"
  ],
  "w": "(1) Die Polizei hat die Aufgabe, Gefahren für die öffentliche Sicherheit oder Ordnung abzuwehren (Gefahrenabwehr). Sie hat im Rahmen dieser Aufgabe Straftaten zu verhüten sowie vorbeugend zu bekämpfen und die erforderlichen Vorbereitungen für die Hilfeleistung und das Handeln in Gefahrenfällen zu treffen. Sind außer in den Fällen des Satzes 2 neben der Polizei andere Behörden für die Gefahrenabwehr zuständig, hat die Polizei in eigener Zuständigkeit tätig zu werden, soweit ein Handeln der anderen Behörden nicht oder nicht rechtzeitig möglich erscheint; dies gilt insbesondere für die den Ordnungsbehörden obliegende Aufgabe, gemäß § 1 Ordnungsbehördengesetz Gefahren für die öffentliche Ordnung abzuwehren. Die Polizei hat die zuständigen Behörden, insbesondere die Ordnungsbehörden, unverzüglich von allen Vorgängen zu unterrichten, die deren Eingreifen erfordern.",
  "e": "Aufgabe der Polizei ist es, Gefahren abzuwehren und Straftaten zu verhüten.",
  "u": "https://recht.nrw.de/lrgv/gesetz/13122025-polizeigesetz-des-landes-nordrhein-westfalen-bekanntmachung-der-neufassung/",
  "h": "recht.nrw.de"
 },
 {
  "k": "§ 2 PolG NRW",
  "g": "PolG NRW",
  "n": "2",
  "a": null,
  "t": "Grundsatz der Verhältnismäßigkeit",
  "b": [
   "oso"
  ],
  "w": "(1) Von mehreren möglichen und geeigneten Maßnahmen hat die Polizei diejenige zu treffen, die den Einzelnen und die Allgemeinheit voraussichtlich am wenigsten beeinträchtigt. (2) Eine Maßnahme darf nicht zu einem Nachteil führen, der zu dem erstrebten Erfolg erkennbar außer Verhältnis steht. (3) Eine Maßnahme ist nur solange zulässig, bis ihr Zweck erreicht ist oder sich zeigt, dass er nicht erreicht werden kann.",
  "e": "Die Polizei wählt das mildeste geeignete Mittel; der Nachteil darf nicht außer Verhältnis zum Erfolg stehen.",
