<style>
/* Sachkunde 34a Lerntrainer – Gestaltung
   Identität: Nachtblau + Signal-Amber, DIN-artige Überschriften, ruhige Papierflächen. */
:root {
  --bg: #f3f1ea;
  --surface: #ffffff;
  --surface-2: #f8f6f0;
  --ink: #14212b;
  --ink-2: #4a5964;
  --line: #ddd8cb;
  --line-strong: #b9b3a3;
  --primary: #15384f;
  --primary-hover: #0f2a3c;
  --primary-ink: #ffffff;
  --primary-soft: #e2ebf1;
  --accent: #a8690e;
  --accent-soft: #f6ead0;
  --ok: #1b7446;
  --ok-soft: #e1f1e7;
  --bad: #b0281f;
  --bad-soft: #f9e5e2;
  --warn: #855600;
  --warn-soft: #f7ecce;
  --info: #2a5c88;
  --info-soft: #e1ecf6;
  --rail: #0f2a3c;
  --rail-ink: #c5d3dc;
  --rail-active: #ffffff;
  --signal: #e8a530;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --r-s: 6px; --r-m: 10px; --r-l: 14px;
  --shadow: 0 1px 2px rgba(20, 33, 43, .06), 0 2px 8px rgba(20, 33, 43, .04);
  --shadow-up: 0 -2px 12px rgba(20, 33, 43, .08);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: "Bahnschrift", "DIN Alternate", "DIN 2014", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --t: 160ms ease;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d151b; --surface: #15202a; --surface-2: #1a2833; --ink: #e9eff3; --ink-2: #a5b4bf;
    --line: #283843; --line-strong: #3c505e;
    --primary: #8cc3e0; --primary-hover: #a7d3ea; --primary-ink: #0b1b25; --primary-soft: #1c3342;
    --accent: #e3ae55; --accent-soft: #382c14;
    --ok: #62c592; --ok-soft: #153224; --bad: #f28d83; --bad-soft: #3a1c1a;
    --warn: #e4b85f; --warn-soft: #392d13; --info: #8ab9e3; --info-soft: #182c3f;
    --rail: #0a1218; --rail-ink: #a5b4bf; --signal: #e8a530;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-up: 0 -2px 12px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  --bg: #0d151b; --surface: #15202a; --surface-2: #1a2833; --ink: #e9eff3; --ink-2: #a5b4bf;
  --line: #283843; --line-strong: #3c505e;
  --primary: #8cc3e0; --primary-hover: #a7d3ea; --primary-ink: #0b1b25; --primary-soft: #1c3342;
  --accent: #e3ae55; --accent-soft: #382c14;
  --ok: #62c592; --ok-soft: #153224; --bad: #f28d83; --bad-soft: #3a1c1a;
  --warn: #e4b85f; --warn-soft: #392d13; --info: #8ab9e3; --info-soft: #182c3f;
  --rail: #0a1218; --rail-ink: #a5b4bf; --signal: #e8a530;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-up: 0 -2px 12px rgba(0, 0, 0, .4);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font); overflow-x: hidden; }
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
h1, h2, h3, .eyebrow, .brand, .big, .stat-v, .part, .gnum { font-family: var(--display); }
h1 { font-size: clamp(1.7rem, 1.2rem + 2vw, 2.4rem); line-height: 1.12; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-size: 1.3rem; line-height: 1.25; font-weight: 600; text-wrap: balance; }
h3 { font-size: 1.05rem; line-height: 1.3; font-weight: 600; margin-bottom: var(--s3); }
h4 { font-size: .9rem; margin: var(--s4) 0 var(--s2); }
a { color: var(--primary); text-underline-offset: 3px; }
a:hover { color: var(--primary-hover); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; border-radius: var(--r-s); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: var(--s3); top: -60px; background: var(--primary); color: var(--primary-ink); padding: var(--s2) var(--s4); border-radius: var(--r-s); z-index: 100; }
.skip:focus { top: var(--s3); }
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.25em; }
.ic-ok { color: var(--ok); } .ic-bad { color: var(--bad); }

/* ---------- Grundgerüst ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--rail); color: var(--rail-ink); padding: var(--s5) var(--s3); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: var(--s5); }
.brand { display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s2); color: #fff; text-decoration: none; font-size: 1.05rem; font-weight: 600; line-height: 1.15; }
.brand small { display: block; font: 400 .72rem/1.3 var(--font); color: var(--rail-ink); letter-spacing: .02em; }
.brand svg { width: 38px; height: 38px; flex: none; }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail nav a { display: flex; align-items: center; gap: var(--s3); padding: 10px var(--s3); border-radius: var(--r-s); color: var(--rail-ink); text-decoration: none; font-size: .95rem; border-left: 3px solid transparent; transition: background var(--t), color var(--t); }
.rail nav a:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.rail nav a[aria-current] { background: rgba(255, 255, 255, .1); color: var(--rail-active); border-left-color: var(--signal); font-weight: 600; }
.rail hr { border: 0; border-top: 1px solid rgba(255, 255, 255, .12); margin: var(--s3) var(--s2); }
.rail-foot { margin-top: auto; font-size: .75rem; padding: 0 var(--s2); line-height: 1.45; opacity: .85; }
.stage { min-width: 0; }
#main { max-width: 1040px; margin: 0 auto; padding: var(--s6) var(--s5) var(--s7); display: flex; flex-direction: column; gap: var(--s5); outline: none; }
#banner { max-width: 1040px; margin: 0 auto; padding: 0 var(--s5); }
#banner .note { margin-top: var(--s4); }
#banner .actions { margin-top: var(--s2); }
.app { padding-top: env(safe-area-inset-top); }
.tabbar, #sheet { display: none; }

.pagehead { display: flex; flex-direction: column; gap: var(--s2); }
.eyebrow { font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.lead { color: var(--ink-2); max-width: 68ch; }
.crumb a { display: inline-flex; align-items: center; gap: var(--s2); text-decoration: none; font-size: .9rem; font-weight: 600; }

/* ---------- Karten, Raster ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: var(--s5); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
.card h3 + .muted { margin-top: calc(var(--s2) * -1); }
.cardfoot { margin-top: auto; font-size: .88rem; padding-top: var(--s2); }
.grid { display: grid; gap: var(--s5); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: flex; gap: var(--s5); justify-content: space-between; align-items: center; flex-wrap: wrap; }
.split > div:first-child { flex: 1 1 280px; display: flex; flex-direction: column; gap: var(--s2); }
.center { align-items: center; text-align: center; justify-content: center; }
.actions { display: flex; flex-wrap: wrap; gap: var(--s3); margin-top: var(--s2); }

/* ---------- Schaltflächen ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 44px; padding: 0 var(--s4); border: 1px solid var(--line-strong); border-radius: var(--r-m); background: var(--surface); color: var(--ink); font-weight: 600; font-size: .95rem; text-decoration: none; transition: background var(--t), border-color var(--t), transform var(--t); white-space: nowrap; }
.btn:hover { background: var(--surface-2); border-color: var(--ink-2); color: var(--ink); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: var(--primary-ink); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-lg { min-height: 52px; padding: 0 var(--s5); font-size: 1rem; }
.btn-sm { min-height: 36px; padding: 0 var(--s3); font-size: .88rem; }
.btn-danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn-danger:hover { background: var(--bad); border-color: var(--bad); color: var(--surface); filter: brightness(.92); }
.btn-bad { color: var(--bad); border-color: var(--bad); }
.btn-ok { color: var(--ok); border-color: var(--ok); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--primary); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.iconbtn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid transparent; border-radius: var(--r-s); padding: 6px 10px; color: var(--ink-2); font-size: .85rem; min-height: 36px; }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn[aria-pressed="true"] { color: var(--accent); }
.iconbtn[aria-pressed="true"] .ic { fill: currentColor; }

/* ---------- Chips, Hinweise ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; line-height: 1.4; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.chip .ic { width: 1em; height: 1em; stroke-width: 2.4; }
.chip-ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip-bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip-info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.chip-primary { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.chip-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.note { display: flex; gap: var(--s3); padding: var(--s4); border-radius: var(--r-m); border: 1px solid; font-size: .93rem; }
.note > .ic { margin-top: 2px; }
.note-warn { background: var(--warn-soft); border-color: transparent; color: var(--ink); }
.note-warn > .ic { color: var(--warn); }
.note-info { background: var(--info-soft); border-color: transparent; }
.note-info > .ic { color: var(--info); }
.note-bad { background: var(--bad-soft); border-color: transparent; margin-top: var(--s3); }
.note-bad > .ic { color: var(--bad); }
.note .btn { margin-top: var(--s3); }
.hint { display: flex; gap: var(--s2); align-items: flex-start; font-size: .88rem; color: var(--ink-2); }
.hint.err { color: var(--bad); }
.stand { display: flex; gap: var(--s3); font-size: .86rem; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: var(--s4); }
.stand .ic { color: var(--info); margin-top: 2px; }
.disclaimer { font-size: .88rem; color: var(--ink-2); border-left: 3px solid var(--signal); padding-left: var(--s3); }
.empty { padding: var(--s5); text-align: center; color: var(--ink-2); }

/* ---------- Fortschritt ---------- */
.bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width 300ms ease; }
.bar-ok > i { background: var(--ok); } .bar-bad > i { background: var(--bad); } .bar-warn > i { background: var(--warn); } .bar-info > i { background: var(--info); }
.ring { position: relative; width: 132px; height: 132px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.ring-bg { stroke: var(--line); }
.ring-fg { stroke: var(--primary); stroke-linecap: round; transition: stroke-dashoffset 500ms ease; }
.ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 2px; font-family: var(--display); }
.ring-num b { font-size: 2.2rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.ring-num span { font-size: 1rem; color: var(--ink-2); margin-top: .55em; }
.goal { display: flex; flex-direction: column; gap: 6px; }
.goal-top { display: flex; justify-content: space-between; gap: var(--s3); font-size: .92rem; }
.big { font-size: 2.6rem; line-height: 1; font-weight: 600; }
.big-s { font-family: var(--display); font-size: 1.35rem; font-weight: 600; line-height: 1.2; }
.unit { font-size: 1rem; color: var(--ink-2); font-weight: 400; font-family: var(--font); }

/* ---------- Start ---------- */
.hero { flex-direction: row; align-items: center; gap: var(--s6); padding: var(--s6); border-top: 4px solid var(--primary); }
.hero-body { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.hero h2 { font-size: 1.6rem; }
.card > .btn, .card > a.btn { align-self: flex-start; margin-top: auto; }

/* ---------- Fortschrittsseite ---------- */
.stats { gap: var(--s4); }
.stat { padding: var(--s4); gap: 2px; }
.stat-l { font-size: .8rem; color: var(--ink-2); }
.stat-v { font-size: 1.9rem; font-weight: 600; line-height: 1.15; }
.stat-s { font-size: .8rem; color: var(--ink-2); }
.next { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; border-left: 4px solid var(--signal); }
.next h3 { margin: 4px 0; font-size: 1.2rem; }
.kv { display: grid; grid-template-columns: minmax(110px, max-content) 1fr; gap: 6px var(--s4); font-size: .93rem; }
.kv dt { color: var(--ink-2); }
.kv dd { min-width: 0; overflow-wrap: anywhere; }
.lamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--s3); }
.lamp { display: flex; gap: var(--s3); align-items: center; padding: var(--s3); border: 1px solid var(--line); border-radius: var(--r-m); text-decoration: none; color: inherit; transition: border-color var(--t), background var(--t); }
.lamp:hover { border-color: var(--line-strong); background: var(--surface-2); color: inherit; }
.lamp-dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.lamp-dot .ic { stroke-width: 2.4; }
.lamp-ok { background: var(--ok-soft); color: var(--ok); } .lamp-bad { background: var(--bad-soft); color: var(--bad); }
.lamp-warn { background: var(--warn-soft); color: var(--warn); } .lamp-info { background: var(--info-soft); color: var(--info); }
.lamp-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; font-size: .82rem; }
.lamp-main b { font-size: .95rem; }
.rows li { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.rows li:last-child { border-bottom: 0; }
.rows small { display: block; font-size: .85rem; }
.checks { display: flex; flex-direction: column; gap: var(--s3); }
.checks li { display: flex; gap: var(--s3); align-items: flex-start; }
.checks li > .ic { margin-top: 2px; padding: 3px; border-radius: 50%; width: 1.5em; height: 1.5em; stroke-width: 2.4; }
.checks li.ok > .ic { background: var(--ok-soft); color: var(--ok); }
.checks li.open > .ic { background: var(--info-soft); color: var(--info); }
.checks small { display: block; font-size: .85rem; }

/* ---------- Themen ---------- */
.group { display: flex; flex-direction: column; gap: var(--s3); }
.group > h2 { display: flex; align-items: center; gap: var(--s3); font-size: 1.1rem; }
.gnum { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; font-size: .95rem; flex: none; }
.topic { text-decoration: none; color: inherit; transition: border-color var(--t), transform var(--t); }
.topic:hover { border-color: var(--primary); color: inherit; transform: translateY(-1px); }
.topic-top { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.part { font-size: 1.1rem; font-weight: 600; color: var(--accent); margin-right: auto; }
.topic h3 { margin: 0; font-size: 1.2rem; }
.topic .muted { font-size: .92rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.topic-foot { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); flex-wrap: wrap; font-size: .85rem; color: var(--ink-2); }
.bul { display: flex; flex-direction: column; gap: var(--s2); }
.bul li { position: relative; padding-left: 1.2em; }
.bul li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; background: var(--accent); border-radius: 1px; transform: rotate(45deg); }
.terms { display: grid; grid-template-columns: minmax(140px, 220px) 1fr; gap: var(--s3) var(--s5); }
.terms dt { font-weight: 600; }
.terms dd { color: var(--ink-2); padding-bottom: var(--s3); border-bottom: 1px solid var(--line); }
.subs li > span { flex: 1 1 260px; min-width: 0; }
.deck { display: flex; flex-direction: column; gap: var(--s3); flex: 1; }
.flash { flex: 1; min-height: 190px; border: 1px solid var(--line-strong); border-radius: var(--r-m); background: var(--surface-2); padding: var(--s5); display: flex; flex-direction: column; gap: var(--s2); align-items: center; justify-content: center; text-align: center; }
.flash.flipped { background: var(--primary-soft); border-color: var(--primary); }
.flash-side { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.flash-text { font-family: var(--display); font-size: 1.3rem; line-height: 1.3; font-weight: 600; }
.flash.flipped .flash-text { font: 400 1rem/1.5 var(--font); }
.flash-hint { font-size: .78rem; color: var(--ink-2); }
.deck-nav { display: flex; align-items: center; justify-content: center; gap: var(--s4); }

/* ---------- Lernmodus ---------- */
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: var(--s3); }
.mode { text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px var(--s3); padding: var(--s3) var(--s4); border: 1px solid var(--line-strong); border-radius: var(--r-m); background: var(--surface); min-height: 68px; transition: border-color var(--t), background var(--t); }
.mode .muted { grid-column: 1; font-size: .82rem; line-height: 1.35; }
.mode .num { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-family: var(--display); font-size: 1.2rem; color: var(--ink-2); }
.mode:hover { border-color: var(--primary); }
.mode[aria-checked="true"] { background: var(--primary-soft); border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.tags { display: flex; flex-wrap: wrap; gap: var(--s2); margin-bottom: var(--s3); }
.tag { min-height: 38px; padding: 0 var(--s3); border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: .88rem; transition: background var(--t), border-color var(--t); }
.tag:hover { border-color: var(--primary); }
.tag[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 600; }
.tag[aria-pressed="true"]::before { content: "✓ "; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-m); overflow: hidden; align-self: flex-start; }

  /* ---------- Glossar ---------- */
  SK.glossary = [
    ["Besitz", "Tatsächliche Gewalt über eine Sache (§ 854 BGB). Es kommt nicht darauf an, wem die Sache gehört. Auch der Dieb ist Besitzer – allerdings ein unrechtmäßiger."],
    ["Eigentum", "Rechtliche Herrschaft über eine Sache (§ 903 BGB). Der Eigentümer darf mit der Sache nach Belieben verfahren und andere von jeder Einwirkung ausschließen, soweit Gesetz oder Rechte Dritter nicht entgegenstehen."],
    ["Hausrecht", "Befugnis, darüber zu entscheiden, wer einen Raum oder ein Grundstück betreten und dort verweilen darf. Es folgt aus Eigentum und Besitz (§§ 858 ff., 903, 1004 BGB) und wird strafrechtlich durch § 123 StGB geschützt. Sicherheitskräfte üben es nur aus, wenn es ihnen übertragen wurde."],
    ["Notwehr", "Die Verteidigung, die erforderlich ist, um einen gegenwärtigen rechtswidrigen Angriff von sich oder einem anderen abzuwenden (§ 32 StGB, § 227 BGB). Wer in Notwehr handelt, handelt nicht rechtswidrig."],
    ["Nothilfe", "Notwehr zugunsten eines anderen. Es gelten dieselben Voraussetzungen wie bei der Notwehr."],
    ["Notstand", "Rechtfertigender Notstand (§ 34 StGB): Abwehr einer gegenwärtigen, nicht anders abwendbaren Gefahr, wenn das geschützte Interesse das beeinträchtigte wesentlich überwiegt. Zivilrechtlich: Verteidigungsnotstand (§ 228 BGB) und Angriffsnotstand (§ 904 BGB)."],
    ["Jedermann-Festnahme", "Umgangssprachlich für die vorläufige Festnahme nach § 127 Abs. 1 StPO: Jeder darf eine auf frischer Tat betroffene oder verfolgte Person festhalten, wenn sie fluchtverdächtig ist oder ihre Identität nicht sofort festgestellt werden kann."],
    ["Vorläufige Festnahme", "Festhalten einer Person ohne richterliche Anordnung nach § 127 StPO. Für Private gilt nur Absatz 1. Die Person ist unverzüglich der Polizei zu übergeben; Durchsuchung und Vernehmung sind nicht erlaubt."],
    ["Verhältnismäßigkeit", "Eine Maßnahme muss geeignet sein, das Ziel zu erreichen, erforderlich (kein milderes gleich wirksames Mittel) und angemessen (Nachteil steht nicht außer Verhältnis zum Zweck)."],
    ["Datenschutz", "Schutz des Einzelnen davor, dass er durch den Umgang mit seinen personenbezogenen Daten in seinem Persönlichkeitsrecht beeinträchtigt wird. Geregelt vor allem in DS-GVO und BDSG."],
    ["Personenbezogene Daten", "Alle Informationen, die sich auf eine identifizierte oder identifizierbare natürliche Person beziehen (Art. 4 Nr. 1 DS-GVO), z. B. Name, Anschrift, Kfz-Kennzeichen, Videoaufnahme."],
    ["Gegenwärtiger Angriff", "Ein Angriff ist gegenwärtig, wenn er unmittelbar bevorsteht, gerade stattfindet oder noch andauert. Ist er beendet, ist keine Notwehr mehr möglich."],
    ["Öffentliche Sicherheit", "Unverletzlichkeit der Rechtsordnung, der subjektiven Rechte und Rechtsgüter des Einzelnen sowie der Einrichtungen und Veranstaltungen des Staates. Ihr Schutz ist Aufgabe von Polizei und Ordnungsbehörden."],
    ["Öffentliche Ordnung", "Gesamtheit der ungeschriebenen Regeln, deren Befolgung nach den herrschenden Anschauungen als unerlässliche Voraussetzung eines geordneten Zusammenlebens gilt."],
    ["Deeskalation", "Alle Maßnahmen, die eine angespannte Situation entschärfen: ruhige Ansprache, Abstand, Zuhören, respektvoller Ton, Auswege anbieten. Deeskalation hat Grenzen, wenn Gewalt unmittelbar droht."],
    ["Zutrittskontrolle", "Organisatorische und technische Maßnahmen, die sicherstellen, dass nur Berechtigte bestimmte Bereiche betreten. Identifikation über Wissen (PIN), Besitz (Karte) oder Biometrie."],
    ["Einbruchmeldeanlage", "Gefahrenmeldeanlage, die Einbruchsversuche über Melder (z. B. Magnetkontakt, Glasbruch-, Bewegungsmelder) erkennt und meldet. Sie verhindert den Einbruch nicht, sondern verkürzt die Zeit bis zur Reaktion."],
    ["Brandmeldeanlage", "Gefahrenmeldeanlage zur frühen Erkennung von Bränden über automatische Melder und Handfeuermelder. Sie alarmiert und leitet in der Regel an die Feuerwehr weiter."],
    ["Besitzdiener", "Wer die tatsächliche Gewalt über eine Sache für einen anderen weisungsgebunden ausübt (§ 855 BGB). Besitzer ist nur der andere. Wachpersonen sind typischerweise Besitzdiener."],
    ["Verbotene Eigenmacht", "Wer dem Besitzer ohne dessen Willen den Besitz entzieht oder ihn im Besitz stört, handelt widerrechtlich, sofern das Gesetz es nicht gestattet (§ 858 BGB)."],
    ["Selbsthilfe", "Eigenmächtige vorläufige Sicherung eines Anspruchs (§ 229 BGB), wenn obrigkeitliche Hilfe nicht rechtzeitig zu erlangen ist und sonst die Verwirklichung des Anspruchs vereitelt oder wesentlich erschwert würde."],
    ["Strafantrag", "Erklärung des Verletzten, dass er die Strafverfolgung wünscht. Bei Antragsdelikten Voraussetzung der Verfolgung; Frist drei Monate ab Kenntnis von Tat und Täter (§ 77b StGB)."],
    ["Strafanzeige", "Mitteilung eines möglicherweise strafbaren Sachverhalts an Polizei, Staatsanwaltschaft oder Amtsgericht (§ 158 StPO). Jeder kann sie erstatten."],
    ["Gewaltmonopol", "Grundsatz, dass nur der Staat zur Durchsetzung von Recht Zwang anwenden darf. Private dürfen Gewalt nur in den engen Grenzen der Notrechte anwenden."],
    ["Frische Tat", "Eine Tat ist frisch, wenn der Täter bei der Begehung oder unmittelbar danach am Tatort oder in dessen unmittelbarer Nähe angetroffen wird."],
    ["Garantenstellung", "Besondere Rechtspflicht, einen Schaden abzuwenden (§ 13 StGB), z. B. aus Vertrag. Wachpersonen können für das bewachte Objekt Garanten sein."],
    ["Dienstanweisung", "Schriftliche Regelung des Wachdienstes nach § 17 BewachV. Sie muss u. a. den Hinweis enthalten, dass Wachpersonen keine polizeilichen Befugnisse haben."],
    ["Bewacherregister", "Bundesweites elektronisches Register nach § 11b GewO mit Daten zu Gewerbetreibenden, Wachpersonen und deren Qualifikation und Zuverlässigkeit."],
    ["Unterrichtung", "Verfahren bei der IHK über 40 Unterrichtsstunden ohne Prüfung. Mindestvoraussetzung für Wachpersonen, soweit keine Sachkundeprüfung verlangt wird."],
    ["Brandklassen", "Einteilung brennbarer Stoffe: A feste, glutbildende Stoffe; B flüssige oder flüssig werdende Stoffe; C Gase; D Metalle; F Speisefette und -öle."]
  ].sort(function (a, b) { return a[0].localeCompare(b[0], "de"); });

    { k: "Verteilung auf Sachgebiete", v: "In der Simulation: 7/5/5/13/13/5/8/19/7 Fragen", s: "private Anbieterangabe", q: "nicht durch IHK-Quelle bestätigt" },
    { k: "Zulassung zur mündlichen Prüfung", v: "Nur nach bestandenem schriftlichem Teil", s: "offiziell bestätigt", q: "IHK Aachen, Nord Westfalen, Rhein-Neckar" },
    { k: "Mündlicher Teil: Dauer", v: "etwa 15 Minuten je Prüfling", s: "offiziell bestätigt", q: "§ 11 BewachV; IHK-Seiten" },
    { k: "Mündlicher Teil: Gruppengröße", v: "Nach BewachV bis zu fünf Prüflinge gleichzeitig; IHK Berlin und Nord Westfalen prüfen bis zu drei gleichzeitig.", s: "weicht je IHK ab", q: "§ 11 BewachV; IHK Aachen (5); IHK Berlin, Nord Westfalen (3)" },
    { k: "Mündlicher Teil: Schwerpunkte", v: "Sachgebiete nach § 7 Nr. 1 und Nr. 6 BewachV (Recht der öffentlichen Sicherheit und Ordnung einschließlich Gewerberecht; Umgang mit Menschen). IHK Nord Westfalen nennt zusätzlich Datenschutz.", s: "offiziell bestätigt", q: "§ 11 BewachV; DIHK-Rahmenplan" },
    { k: "Mündlicher Teil: Bestehen", v: "mindestens 50 %", s: "durch mehrere seriöse Quellen bestätigt", q: "IHK Aachen, IHK Nord Westfalen" },
    { k: "Prüfungsgebühr", v: "Kammerspezifisch: 122 € (Aachen), 170 € (Hanau), 184 € (Nord Westfalen), 200 € (Berlin), 230 € (Rhein-Neckar), 250 € (Heilbronn-Franken, ab 01.10.2026)", s: "weicht je IHK ab", q: "jeweilige IHK-Seite" },
    { k: "Frist für den mündlichen Teil", v: "IHK Berlin: innerhalb von zwei Jahren nach Bestehen des schriftlichen Teils", s: "weicht je IHK ab", q: "IHK Berlin; bei eigener IHK erfragen" },
    { k: "Prüfungssprache", v: "Deutsch", s: "offiziell bestätigt", q: "IHK Berlin" }
  ];
