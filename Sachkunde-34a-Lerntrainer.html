<script>
/* Sachgebiet 7: Grundzüge der Sicherheitstechnik. Eigene prüfungsnahe Übungsfragen – keine Original-IHK-Fragen. */
SK.fragen("tec", [
  { u: "mech", d: 1, q: "Welche Aufgabe haben mechanische Sicherungseinrichtungen?", o: ["Sie setzen dem Täter Widerstand entgegen und verzögern das Eindringen.", ["Sie melden den Einbruch an die Polizei.", "Melden ist Aufgabe der Einbruchmeldeanlage."], ["Sie zeichnen den Täter auf.", "Das ist Aufgabe der Videoüberwachung."], ["Sie ersetzen den Wachdienst vollständig.", "Mechanik, Elektronik und Personal ergänzen sich."]], e: "Mechanik schafft Widerstandszeit. Erst zusammen mit Meldung und Intervention entsteht ein wirksamer Schutz." },
  { u: "mech", t: "mc", d: 1, q: "Welche zwei Einrichtungen gehören zu den mechanischen Sicherungen?", o: ["Einfriedung (Zaun, Mauer)", "Einbruchhemmende Tür", ["Bewegungsmelder", "Das ist ein elektronischer Melder."], ["Videokamera", "Sie gehört zur elektronischen Überwachung."]], e: "Mechanische Sicherungen sind u. a. Einfriedungen, Tore, Schlösser, Gitter, Sicherheitsverglasung und Wertbehältnisse." },
  { u: "mech", d: 1, q: "Was ist eine Vereinzelungsanlage?", o: ["Eine Einrichtung, die jeweils nur einer Person den Durchgang ermöglicht, z. B. Drehkreuz oder Personenschleuse", ["Ein Tresor für einzelne Wertsachen", "Das ist ein Wertbehältnis."], ["Ein Zaun mit nur einem Pfosten", "Das ist nicht gemeint."], ["Eine Kamera mit nur einem Objektiv", "Das ist nicht gemeint."]], e: "Vereinzelung verhindert, dass Unberechtigte mit einem Berechtigten „mitschlüpfen“." },
  { u: "mech", d: 2, q: "Was ist das Kennzeichen einer Hauptschlüsselanlage?", o: ["Ein übergeordneter Schlüssel schließt alle Zylinder der Anlage; Einzelschlüssel schließen nur ihren Bereich.", ["Alle Schlüssel schließen alle Türen.", "Das wäre eine gleichschließende Anlage."], ["Es gibt nur einen einzigen Schlüssel.", "Es gibt Haupt- und Einzelschlüssel."], ["Die Türen haben keine Zylinder.", "Schließanlagen bestehen aus Zylindern und Schlüsseln."]], e: "Bei der Zentralschlossanlage schließen dagegen mehrere verschiedene Schlüssel eine gemeinsame Tür (z. B. Haustür im Mehrfamilienhaus)." },
  { u: "mech", d: 2, f: 1, q: "Eine Wachperson verliert auf dem Rundgang den Generalschlüssel des Objekts. Was ist zu tun?", o: ["Den Verlust sofort der Leitstelle bzw. dem Vorgesetzten melden, damit Auftraggeber informiert und Maßnahmen eingeleitet werden können", ["Abwarten, ob der Schlüssel wieder auftaucht", "Bis dahin ist das Objekt ungeschützt."], ["Heimlich einen Nachschlüssel anfertigen lassen", "Das ist unzulässig und löst das Sicherheitsproblem nicht."], ["Den Verlust erst im Monatsbericht erwähnen", "Die Meldung muss sofort erfolgen."]], e: "Schlüssel sind Sicherheitsmittel. Ihr Verlust kann den Austausch der Schließanlage erfordern und ist zu dokumentieren." },
  { u: "mech", d: 2, q: "Was unterscheidet Verbundsicherheitsglas (VSG) von Einscheibensicherheitsglas (ESG)?", o: ["VSG besteht aus mehreren Scheiben mit reißfester Folie und hält beim Bruch zusammen; ESG zerfällt in kleine stumpfe Krümel.", ["ESG ist durchschusshemmend, VSG nicht.", "ESG ist nicht angriffhemmend."], ["VSG ist normales Fensterglas.", "VSG ist ein Verbund mit Folie."], ["Es gibt keinen Unterschied.", "Aufbau und Bruchverhalten sind verschieden."]], e: "Angriffhemmende Verglasungen (durchwurf-, durchbruch-, durchschusshemmend) beruhen auf Verbundaufbauten." },
  { u: "mech", t: "zu", d: 2, q: "Ordne jeder Verglasung die Schutzwirkung zu.", p: [["Durchwurfhemmend", "hält geworfenen Gegenständen stand"], ["Durchbruchhemmend", "verzögert das Herstellen einer Öffnung mit Werkzeug"], ["Durchschusshemmend", "hält Geschossen stand"]], e: "Die Widerstandsklassen angriffhemmender Verglasungen sind genormt." },
  { u: "mech", d: 2, q: "Wofür stehen die Klassen RC 1 bis RC 6 bei Türen und Fenstern?", o: ["Für die Widerstandsklasse gegen Einbruchversuche", ["Für die Wärmedämmung", "Das wird anders gekennzeichnet."], ["Für die Feuerwiderstandsdauer", "Feuerschutzabschlüsse werden anders klassifiziert."], ["Für die Schallschutzklasse", "Das wird anders gekennzeichnet."]], e: "RC steht für „Resistance Class“ nach DIN EN 1627. Je höher die Klasse, desto länger der Widerstand.", r: "DIN EN 1627" },
  { u: "mech", t: "tf", d: 1, a: true, q: "Auch die beste mechanische Sicherung kann mit genügend Zeit und Werkzeug überwunden werden.", e: "Deshalb muss die Widerstandszeit länger sein als die Zeit bis zum Eintreffen der Intervention." },
  { u: "mech", t: "mc", d: 2, q: "Worauf achtet die Wachperson beim Verschlussrundgang?", o: ["Türen, Tore und Fenster sind verschlossen und unbeschädigt.", "Die Einfriedung weist keine Lücken, Übersteighilfen oder Beschädigungen auf.", ["Die Schreibtische der Mitarbeiter sind aufgeräumt.", "Das gehört nicht zum Verschlussrundgang."], ["Die Kaffeemaschine ist entkalkt.", "Das gehört nicht zum Verschlussrundgang."]], e: "Feststellungen werden gemeldet und im Wachbuch dokumentiert." },
  { u: "mech", t: "fa", d: 2, q: "Erkläre den Grundsatz „Mechanik vor Elektronik“.", m: "Mechanische Sicherungen wie Zaun, Tür, Schloss und Verglasung halten den Täter auf und kosten ihn Zeit. Elektronische Anlagen wie die Einbruchmeldeanlage verhindern den Einbruch nicht, sie erkennen und melden ihn nur. Wirksam wird der Schutz erst im Zusammenspiel: Die Mechanik verzögert, die Elektronik meldet früh, und Personal oder Polizei greifen ein, bevor der Täter sein Ziel erreicht. Ohne Mechanik ist der Täter schneller am Ziel, als die Intervention eintrifft.", c: ["Mechanik = Widerstandszeit", "Elektronik = erkennen und melden", "Intervention", "Zusammenspiel"] },

  { u: "ema", d: 1, q: "Was leistet eine Einbruchmeldeanlage (EMA)?", o: ["Sie erkennt Einbruchsversuche und meldet sie – sie verhindert sie nicht.", ["Sie hält Täter körperlich auf.", "Das ist Aufgabe der Mechanik."], ["Sie nimmt Täter fest.", "Das kann keine technische Anlage."], ["Sie löscht Brände.", "Das ist Aufgabe von Löschanlagen."]], e: "Eine EMA verkürzt die Zeit zwischen Tat und Reaktion." },
  { u: "ema", t: "mc", d: 2, q: "Welche zwei Bestandteile gehören zu einer Einbruchmeldeanlage?", o: ["Einbruchmelderzentrale", "Melder (z. B. Magnetkontakt, Bewegungsmelder)", ["Sprinklerkopf", "Er gehört zur Löschanlage."], ["Handfeuermelder", "Er gehört zur Brandmeldeanlage."]], e: "Hinzu kommen Schalteinrichtung, Energieversorgung mit Notstrom, Alarmierungs- und Übertragungseinrichtung." },
  { u: "ema", d: 2, q: "Was überwacht ein Magnetkontakt?", o: ["Das Öffnen von Türen und Fenstern", ["Bewegungen im Raum", "Das überwacht ein Bewegungsmelder."], ["Rauch in der Luft", "Das überwacht ein Rauchmelder."], ["Den Bruch einer Glasscheibe", "Das überwacht ein Glasbruchmelder."]], e: "Der Magnetkontakt ist ein Öffnungsmelder der Außenhautüberwachung." },
  { u: "ema", d: 2, q: "Worauf reagiert ein Passiv-Infrarot-Bewegungsmelder?", o: ["Auf die Bewegung einer Wärmequelle im Erfassungsbereich", ["Auf Geräusche", "Er wertet Wärmestrahlung aus."], ["Auf Rauch", "Dafür gibt es Rauchmelder."], ["Auf das Öffnen einer Tür", "Dafür gibt es Öffnungsmelder."]], e: "Er sendet selbst nichts aus („passiv“) und dient der Raum- bzw. Fallenüberwachung." },
  { u: "ema", t: "zu", d: 2, q: "Ordne jedem Melder seine Überwachungsaufgabe zu.", p: [["Magnetkontakt", "Öffnung von Tür oder Fenster"], ["Riegelschaltkontakt", "Verschluss – ist abgeschlossen?"], ["Glasbruchmelder", "Durchbruch der Scheibe"], ["Bewegungsmelder", "Bewegung im Raum"]], e: "Außenhautüberwachung prüft Öffnung, Verschluss und Durchbruch; Bewegungsmelder überwachen den Raum." },
  { u: "ema", d: 2, q: "Was versteht man unter Außenhautüberwachung?", o: ["Die Überwachung der Gebäudehülle – Türen, Fenster, Wände – auf Öffnen, Verschluss und Durchbruch", ["Die Überwachung der Innenräume mit Bewegungsmeldern", "Das ist Raum- bzw. Fallenüberwachung."], ["Die Überwachung des Geländes vor dem Zaun", "Das ist Freigeländeüberwachung."], ["Die Überwachung einzelner Wertgegenstände", "Das ist Objektüberwachung."]], e: "Vorteil: Der Alarm wird ausgelöst, bevor der Täter im Gebäude ist." },
  { u: "ema", d: 2, q: "Was ist ein stiller Alarm?", o: ["Die Meldung geht ohne Signal vor Ort an eine hilfeleistende Stelle, z. B. die Notruf- und Serviceleitstelle.", ["Die Sirene läuft besonders leise.", "Vor Ort gibt es kein Signal."], ["Die Anlage ist ausgeschaltet.", "Dann gäbe es keinen Alarm."], ["Der Alarm wird nur protokolliert.", "Er wird übertragen."]], e: "Der stille Alarm wird vor allem bei Überfallmeldungen eingesetzt, um Täter nicht zu Kurzschlusshandlungen zu verleiten." },
  { u: "ema", d: 2, q: "Was bedeutet „Zwangsläufigkeit“ bei einer Einbruchmeldeanlage?", o: ["Die Anlage lässt sich nur scharf schalten, wenn alle Türen und Fenster geschlossen und alle Melder in Ordnung sind, und der gesicherte Bereich kann nicht versehentlich betreten werden.", ["Die Anlage schaltet sich zu einer festen Uhrzeit aus.", "Das ist nicht gemeint."], ["Die Anlage löst täglich einen Probealarm aus.", "Das ist nicht gemeint."], ["Die Anlage arbeitet ohne Strom.", "Das ist nicht gemeint."]], e: "Zwangsläufigkeit ist das wichtigste Mittel gegen Falschalarme durch Bedienfehler." },
  { u: "ema", d: 2, q: "Wozu dient die Sabotageüberwachung einer Gefahrenmeldeanlage?", o: ["Sie meldet Eingriffe an der Anlage selbst, z. B. das Öffnen von Gehäusen oder das Durchtrennen von Leitungen.", ["Sie überwacht die Arbeitszeit der Wachpersonen.", "Das ist nicht ihre Aufgabe."], ["Sie verhindert Stromausfälle.", "Dafür gibt es die Notstromversorgung."], ["Sie zeichnet Gespräche auf.", "Das wäre unzulässig."]], e: "Sabotagemeldungen werden auch bei unscharfer Anlage ausgelöst." },
  { u: "ema", t: "mc", d: 2, q: "Welche zwei Aussagen zu Überfallmeldeanlagen treffen zu?", o: ["Sie werden von gefährdeten Personen bewusst ausgelöst.", "Die Alarmierung erfolgt in der Regel still.", ["Sie lösen automatisch bei Bewegung aus.", "Sie werden willentlich betätigt."], ["Sie sind nur bei scharf geschalteter Einbruchmeldeanlage aktiv.", "Überfallmelder sind ständig in Betrieb."]], e: "Typische Auslöser sind Überfalltaster, Fußleisten oder Geldscheinkontakte." },
  { u: "ema", t: "tf", d: 2, a: true, q: "Eine Gefahrenmeldeanlage braucht eine Notstromversorgung, damit sie auch bei Netzausfall funktioniert.", e: "Üblich ist ein Akku, der die Anlage für eine festgelegte Zeit weiter versorgt." },
  { u: "ema", t: "tf", d: 1, a: false, q: "Bei einem Einbruchalarm geht die Wachperson grundsätzlich allein und sofort in das Objekt, um die Täter zu stellen.", e: "Vorrang hat die Eigensicherung: Lage von außen prüfen, Leitstelle informieren, bei Einbruchspuren auf die Polizei warten." },

  { u: "bma", d: 1, q: "Welche Aufgabe hat eine Brandmeldeanlage (BMA)?", o: ["Brände früh erkennen, Personen warnen und die Feuerwehr alarmieren", ["Brände selbstständig löschen", "Das ist Aufgabe von Löschanlagen."], ["Einbrecher melden", "Das ist Aufgabe der Einbruchmeldeanlage."], ["Die Raumtemperatur regeln", "Das ist Aufgabe der Klimatechnik."]], e: "Die BMA kann zusätzlich Brandfallsteuerungen auslösen, z. B. Türen schließen oder Aufzüge stilllegen." },
  { u: "bma", t: "mc", d: 1, q: "Welche zwei Melder gehören zu einer Brandmeldeanlage?", o: ["Automatischer Rauchmelder", "Handfeuermelder (Druckknopfmelder)", ["Magnetkontakt", "Er gehört zur Einbruchmeldeanlage."], ["Glasbruchmelder", "Er gehört zur Einbruchmeldeanlage."]], e: "Automatische Melder reagieren auf Rauch, Wärme oder Flammen; Handfeuermelder werden von Personen betätigt." },
  { u: "bma", d: 2, q: "Auf welche Brandkenngrößen reagieren automatische Brandmelder?", o: ["Rauch, Wärme und Flammenstrahlung", ["Lärm und Erschütterung", "Das sind keine Brandkenngrößen."], ["Luftdruck und Wind", "Das sind keine Brandkenngrößen."], ["Helligkeit und Farbe der Wände", "Das sind keine Brandkenngrößen."]], e: "Rauchmelder sprechen meist am frühesten an, weil die meisten Brände mit Rauchentwicklung beginnen." },
  { u: "bma", d: 2, q: "Wozu dienen Feuerwehr-Laufkarten an der Brandmelderzentrale?", o: ["Sie zeigen der Feuerwehr den Weg zum ausgelösten Melder.", ["Sie dokumentieren die Laufleistung der Wachpersonen.", "Das ist nicht ihr Zweck."], ["Sie sind Zutrittsausweise für Besucher.", "Das ist nicht ihr Zweck."], ["Sie ersetzen den Feuerlöscher.", "Das ist nicht ihr Zweck."]], e: "Jeder Meldergruppe ist eine Laufkarte mit Grundriss und Weg zugeordnet." },
  { u: "bma", d: 2, q: "Wozu dient ein Feuerwehr-Schlüsseldepot?", o: ["Es ermöglicht der Feuerwehr im Alarmfall den gewaltlosen Zugang zum Objekt.", ["Es bewahrt die Privatschlüssel der Mitarbeiter auf.", "Das ist nicht sein Zweck."], ["Es ist ein Briefkasten für Fundsachen.", "Das ist nicht sein Zweck."], ["Es dient als Tresor für Bargeld.", "Das ist nicht sein Zweck."]], e: "Das Depot wird bei Brandalarm von der Brandmelderzentrale freigegeben." },
  { u: "bma", d: 2, f: 1, q: "Die Brandmelderzentrale zeigt eine Alarmmeldung aus dem Lager im dritten Stock an. Die Feuerwehr ist automatisch alarmiert. Was tut die Wachperson?", o: ["Meldung ablesen, Einsatzkräfte an der Zufahrt erwarten und einweisen, Räumung nach Alarmplan unterstützen – den Alarm nicht eigenmächtig zurückstellen", ["Den Alarm sofort zurückstellen, um Kosten zu vermeiden", "Das Rückstellen ist der Feuerwehr bzw. Berechtigten vorbehalten."], ["Erst einmal allein ins Lager gehen und nachsehen, ohne jemandem Bescheid zu geben", "Das gefährdet sie selbst und verzögert die Einweisung."], ["Die Sirene abschalten, damit keine Unruhe entsteht", "Die Warnung der Personen ist gerade der Zweck."]], e: "Maßgeblich sind Alarmplan und Brandschutzordnung des Objekts. Erkundung nur, wenn dort vorgesehen und ohne Eigengefährdung." },
  { u: "bma", t: "tf", d: 2, a: true, q: "Meldet die Brandmelderzentrale eine Störung, ist das nach Dienstanweisung unverzüglich weiterzugeben, weil der betroffene Bereich nicht mehr sicher überwacht wird.", e: "Bis zur Instandsetzung sind Ersatzmaßnahmen nötig, z. B. zusätzliche Kontrollgänge." },
  { u: "bma", t: "tf", d: 1, a: false, q: "Handfeuermelder dürfen zu Übungszwecken jederzeit von jedermann betätigt werden.", e: "Der Missbrauch von Notrufen und Notzeichen ist strafbar (§ 145 StGB) und verursacht Einsatzkosten.", r: "§ 145 StGB" },

  { u: "zko", d: 1, q: "Was regelt ein Zutrittskontrollsystem?", o: ["Wer wann wohin Zutritt erhält", ["Welche Internetseiten aufgerufen werden", "Das ist Sache der IT-Sicherheit."], ["Wie viel Strom verbraucht wird", "Das ist nicht seine Aufgabe."], ["Welche Löschmittel bereitstehen", "Das gehört zum Brandschutz."]], e: "Das System prüft Berechtigungen nach Person, Ort und Zeit und protokolliert Vorgänge." },
  { u: "zko", t: "zu", d: 2, q: "Ordne jedem Identifikationsmerkmal ein Beispiel zu.", p: [["Wissen", "PIN-Code"], ["Besitz", "Chipkarte oder Transponder"], ["Biometrie", "Fingerabdruck"]], e: "Hohe Sicherheit entsteht durch die Kombination von zwei Merkmalen, z. B. Karte und PIN." },
  { u: "zko", d: 2, q: "Welcher Nachteil haftet der Identifikation allein über eine Ausweiskarte an?", o: ["Die Karte kann weitergegeben, verloren oder gestohlen werden.", ["Karten funktionieren nur bei Tageslicht.", "Das trifft nicht zu."], ["Karten können nicht gesperrt werden.", "Karten lassen sich im System sperren."], ["Karten sind grundsätzlich verboten.", "Das trifft nicht zu."]], e: "Geprüft wird nur der Besitz, nicht die Person. Deshalb werden Karte und PIN oder Biometrie kombiniert." },
  { u: "zko", d: 2, f: 1, q: "Ein Mitarbeiter hält einer unbekannten Person freundlich die Tür zum gesicherten Bereich auf. Wie nennt man dieses Risiko, und wie reagiert die Wachperson?", o: ["Mitgehen („Tailgating“) – die Person ansprechen und Berechtigung prüfen", ["Notstand – nichts tun", "Es liegt kein Notstand vor."], ["Sabotage – sofort die Polizei rufen", "Zunächst ist die Berechtigung zu klären."], ["Vereinzelung – das ist erwünscht", "Vereinzelung soll das Mitgehen gerade verhindern."]], e: "Organisatorische Regeln und Aufmerksamkeit ergänzen die Technik." },
  { u: "zko", t: "mc", d: 2, q: "Welche zwei Ziele verfolgt die Besucherverwaltung am Empfang?", o: ["Nur angemeldete oder berechtigte Personen erhalten Zutritt.", "Es ist nachvollziehbar, wer sich im Objekt befindet – wichtig auch bei einer Räumung.", ["Möglichst viele Daten über Besucher sammeln", "Das widerspricht der Datenminimierung."], ["Besucher möglichst lange warten lassen", "Das ist kein Ziel."]], e: "Besucher erhalten in der Regel einen Besucherausweis und werden abgeholt oder begleitet." },
  { u: "zko", d: 2, q: "Welche Bestandteile hat eine Videoüberwachungsanlage?", o: ["Kamera, Übertragungsweg, Monitor und gegebenenfalls Aufzeichnung", ["Melder, Zentrale und Sirene", "Das beschreibt eine Einbruchmeldeanlage."], ["Zylinder, Schlüssel und Beschlag", "Das beschreibt ein Schloss."], ["Düse, Schlauch und Ventil", "Das beschreibt einen Feuerlöscher."]], e: "Videoanlagen dienen der Beobachtung, Alarmverifikation und Beweissicherung." },
  { u: "zko", d: 2, q: "Wozu eignet sich die Videoüberwachung im Zusammenspiel mit einer Einbruchmeldeanlage besonders?", o: ["Zur Überprüfung, ob ein Alarm echt ist, bevor Kräfte entsandt werden (Alarmverifikation)", ["Zum Ersatz aller mechanischen Sicherungen", "Video hält niemanden auf."], ["Zum Löschen von Bränden", "Das kann Video nicht."], ["Zur Heizungssteuerung", "Das ist nicht ihr Zweck."]], e: "Das Bild zeigt, was den Alarm ausgelöst hat, und hilft bei der Einschätzung der Lage." },
  { u: "zko", t: "tf", d: 2, a: true, q: "Zutrittskontrollsysteme können Berechtigungen zeitlich begrenzen, etwa nur während der Arbeitszeit.", e: "Raum-Zeit-Zonen sind ein Standardmerkmal elektronischer Zutrittskontrolle." },
  { u: "zko", t: "mc", d: 2, q: "Welche zwei Maßnahmen gehören zur EDV-Sicherheit am Arbeitsplatz der Wachperson?", o: ["Sichere Passwörter verwenden und nicht weitergeben", "Bildschirm beim Verlassen sperren", ["Fremde USB-Sticks zum Testen anschließen", "Das ist ein typisches Einfallstor für Schadsoftware."], ["Passwörter im Wachbuch notieren", "Das gefährdet die Vertraulichkeit."]], e: "EDV-Sicherheit umfasst außerdem Datensicherung, Virenschutz, Firewall und unterbrechungsfreie Stromversorgung." },

  { u: "nsl", d: 1, q: "Was ist eine Notruf- und Serviceleitstelle (NSL)?", o: ["Eine ständig besetzte Stelle, die Gefahrenmeldungen empfängt, bewertet und Maßnahmen einleitet", ["Die Telefonzentrale der IHK", "Das ist nicht gemeint."], ["Ein Lager für Löschmittel", "Das ist nicht gemeint."], ["Die Kantine des Sicherheitsunternehmens", "Das ist nicht gemeint."]], e: "Die NSL arbeitet nach Alarmplänen und entsendet Interventionskräfte oder verständigt Polizei und Feuerwehr." },
  { u: "nsl", d: 2, q: "Was ist die Aufgabe einer Interventionskraft?", o: ["Nach einer Alarmmeldung das Objekt anfahren, die Lage prüfen und nach Alarmplan handeln", ["Die Alarmanlage reparieren", "Das ist Aufgabe des Errichters."], ["Polizeiliche Ermittlungen führen", "Das ist Aufgabe der Polizei."], ["Die Versicherung informieren", "Das ist nicht ihre Aufgabe."]], e: "Bei Einbruchspuren gilt: Eigensicherung, Rückmeldung an die NSL, Polizei abwarten." },
  { u: "nsl", d: 2, q: "Wozu dient ein Wächterkontrollsystem?", o: ["Zum Nachweis, dass Kontrollgänge zur vorgesehenen Zeit an den vorgesehenen Stellen durchgeführt wurden", ["Zur Überwachung der Besucher", "Das ist nicht sein Zweck."], ["Zur Messung der Raumtemperatur", "Das ist nicht sein Zweck."], ["Zur Steuerung der Beleuchtung", "Das ist nicht sein Zweck."]], e: "Die Wachperson erfasst an Kontrollstellen ihre Anwesenheit; die Daten dienen als Leistungsnachweis und der Sicherheit der Wachperson." },
  { u: "nsl", d: 2, q: "Was löst eine Totmannschaltung bzw. Personen-Notsignal-Anlage aus?", o: ["Einen Alarm, wenn die Person nicht mehr reagiert oder in eine auffällige Lage gerät", ["Das automatische Abschließen aller Türen", "Das ist nicht ihre Funktion."], ["Eine Gehaltsabrechnung", "Das ist nicht ihre Funktion."], ["Die Scharfschaltung der Einbruchmeldeanlage", "Das ist nicht ihre Funktion."]], e: "Sie dient der Überwachung von Einzelarbeitsplätzen – wichtig für Wachpersonen im Alleindienst." },
  { u: "nsl", t: "mc", d: 2, q: "Welche zwei Alarmarten kennt eine Personen-Notsignal-Anlage?", o: ["Willensabhängiger Alarm durch Drücken der Notruftaste", "Willensunabhängiger Alarm, z. B. Lage- oder Ruhealarm", ["Brandalarm durch Rauch", "Das ist Aufgabe der Brandmeldeanlage."], ["Einbruchalarm durch Glasbruch", "Das ist Aufgabe der Einbruchmeldeanlage."]], e: "Willensunabhängige Alarme lösen aus, wenn die Person stürzt, sich nicht bewegt oder eine Quittierung ausbleibt." },
  { u: "nsl", t: "tf", d: 2, a: false, q: "Ein Wächterkontrollsystem ist ausschließlich ein Kontrollinstrument des Arbeitgebers und hat für die Sicherheit der Wachperson keine Bedeutung.", e: "Bleibt eine Kontrollmeldung aus, kann das ein Hinweis auf einen Notfall sein – das System dient auch dem Schutz der Wachperson." },
  { u: "nsl", t: "fa", d: 2, q: "Beschreibe den Ablauf von der Alarmauslösung bis zum Abschluss einer Intervention.", m: "Ein Melder löst aus, die Zentrale überträgt die Meldung an die Notruf- und Serviceleitstelle. Dort wird die Meldung angenommen und nach dem hinterlegten Alarmplan bewertet, gegebenenfalls per Video oder Rückruf verifiziert. Die NSL entsendet die Interventionskraft und verständigt je nach Lage Polizei, Feuerwehr und den Kunden. Die Interventionskraft fährt das Objekt an, prüft unter Eigensicherung zunächst von außen, meldet der NSL und betritt das Objekt nur, wenn keine Hinweise auf Täter vorliegen. Bei Einbruchspuren wartet sie auf die Polizei. Anschließend wird das Objekt gesichert, die Anlage wieder scharf geschaltet und der Einsatz dokumentiert.", c: ["Auslösung und Übertragung", "Bewertung nach Alarmplan", "Entsendung, Verständigung", "Eigensicherung, Außenkontrolle", "Polizei bei Spuren", "Sicherung und Dokumentation"] },

  { u: "funk", d: 1, q: "Welche Regel gehört zur Funkdisziplin?", o: ["Kurz, klar und sachlich sprechen: erst denken, dann drücken, dann sprechen", ["Möglichst lange Gespräche führen", "Der Kanal muss frei bleiben."], ["Private Unterhaltungen über Funk führen", "Der Funk dient dem Dienst."], ["Namen und Adressen von Betroffenen ausführlich durchgeben", "Personenbezogene Daten nur soweit nötig übermitteln."]], e: "Funk kann mitgehört werden. Deshalb: wenig personenbezogene Daten, klare Rufnamen, Bestätigung des Empfangs." },
  { u: "funk", d: 2, q: "Welchen Vorteil hat digitaler Betriebsfunk gegenüber analogem Funk?", o: ["Bessere Sprachqualität, mehr Funktionen wie Datenübertragung und in der Regel besserer Schutz vor Mithören", ["Er funktioniert ohne Stromversorgung.", "Auch digitale Geräte brauchen Energie."], ["Er hat grundsätzlich unbegrenzte Reichweite.", "Die Reichweite ist begrenzt."], ["Er braucht keine Frequenzzuteilung.", "Betriebsfunk erfordert eine Frequenzzuteilung."]], e: "Ein Nachteil: Am Rand der Reichweite bricht die Verbindung abrupt ab, während analoger Funk allmählich verrauscht." },
  { u: "funk", d: 2, q: "Was unterscheidet Bündelfunk vom einfachen Betriebsfunk?", o: ["Mehrere Nutzergruppen teilen sich ein Bündel von Kanälen, die automatisch zugewiesen werden.", ["Bündelfunk nutzt Kabel statt Funkwellen.", "Bündelfunk ist drahtlos."], ["Bündelfunk funktioniert nur innerhalb eines Raumes.", "Die Reichweite ist größer."], ["Es gibt keinen Unterschied.", "Die Kanalvergabe unterscheidet sich."]], e: "Die automatische Kanalzuteilung nutzt die Frequenzen besser aus." },
  { u: "funk", t: "mc", d: 2, q: "Welche zwei Kommunikationsmittel sind drahtgebunden?", o: ["Festnetztelefon", "Gegensprechanlage", ["Handfunkgerät", "Es arbeitet drahtlos."], ["Mobiltelefon", "Es arbeitet drahtlos."]], e: "Drahtgebundene Mittel sind störungsärmer, aber ortsfest; drahtlose sind mobil, aber von Empfang und Akku abhängig." },
  { u: "funk", t: "tf", d: 1, a: true, q: "Vor Dienstbeginn prüft die Wachperson Funktion und Akkustand ihrer Kommunikationsmittel.", e: "Ohne funktionierende Verbindung kann im Notfall keine Hilfe gerufen werden." },

  { u: "brand", d: 1, q: "Welche Voraussetzungen müssen für eine Verbrennung zusammentreffen?", o: ["Brennbarer Stoff, Sauerstoff und Zündenergie im richtigen Mengenverhältnis", ["Wasser, Sand und Wind", "Das sind keine Brandvoraussetzungen."], ["Strom, Glas und Metall", "Das sind keine Brandvoraussetzungen."], ["Nur ein brennbarer Stoff", "Ohne Sauerstoff und Zündenergie brennt nichts."]], e: "Löschen heißt, mindestens eine dieser Voraussetzungen zu entziehen." },
  { u: "brand", t: "zu", d: 2, q: "Ordne jeder Brandklasse die brennbaren Stoffe zu.", p: [["Brandklasse A", "feste, glutbildende Stoffe wie Holz und Papier"], ["Brandklasse B", "flüssige oder flüssig werdende Stoffe wie Benzin"], ["Brandklasse C", "Gase wie Propan"], ["Brandklasse D", "Metalle wie Magnesium"]], e: "Hinzu kommt Brandklasse F für Speisefette und -öle.", r: "DIN EN 2" },
  { u: "brand", d: 2, q: "Welche Brandklasse gilt für brennendes Frittierfett?", o: ["F", ["A", "A steht für feste, glutbildende Stoffe."], ["B", "Speisefette haben eine eigene Brandklasse."], ["C", "C steht für Gase."]], e: "Fettbrände werden mit Fettbrandlöschern oder durch Abdecken erstickt – niemals mit Wasser.", r: "DIN EN 2" },
  { u: "brand", d: 2, f: 1, q: "In der Betriebsküche brennt Fett in einer Pfanne. Was ist richtig?", o: ["Energiezufuhr abstellen und das Feuer mit Deckel oder Fettbrandlöscher ersticken", ["Mit Wasser löschen", "Wasser verdampft schlagartig und schleudert brennendes Fett heraus (Fettexplosion)."], ["Die Pfanne ins Freie tragen", "Dabei drohen schwere Verbrennungen und Brandausbreitung."], ["Das Fenster öffnen, damit der Rauch abzieht, und abwarten", "Frischluft facht das Feuer an."]], e: "Bei Fettbränden ist Wasser lebensgefährlich." },
  { u: "brand", d: 2, q: "Worauf beruht die Löschwirkung von Wasser hauptsächlich?", o: ["Auf dem Abkühlen des brennenden Stoffes", ["Auf dem Verdrängen des Sauerstoffs", "Das ist die Hauptwirkung von CO₂."], ["Auf einer chemischen Reaktion mit der Flamme", "Das ist die Wirkung von Löschpulver."], ["Auf dem Entzug des brennbaren Stoffes", "Das ist eine andere Löschmethode."]], e: "Wasser eignet sich für Brandklasse A. Nicht geeignet ist es u. a. bei Fett-, Metall- und Flüssigkeitsbränden sowie an elektrischen Anlagen unter Spannung." },
  { u: "brand", d: 2, q: "Für welche Brände ist ein Kohlendioxidlöscher (CO₂) besonders geeignet?", o: ["Für Flüssigkeitsbrände und Brände an elektrischen Anlagen, weil er rückstandsfrei löscht", ["Für Glutbrände von Holz im Freien", "CO₂ kühlt kaum und verweht im Freien."], ["Für Metallbrände", "Dafür ist Metallbrandpulver nötig."], ["Für Fettbrände in der Fritteuse", "Dafür gibt es Fettbrandlöscher."]], e: "CO₂ erstickt die Flamme. In kleinen geschlossenen Räumen besteht Erstickungsgefahr für Personen." },
  { u: "brand", t: "mc", d: 2, q: "Welche zwei Regeln gelten für den Einsatz von Feuerlöschern?", o: ["Mit dem Wind angreifen und von vorn unten in die Glut löschen", "Genügend Löscher gleichzeitig einsetzen, nicht nacheinander", ["Gegen den Wind angreifen, um den Rauch zu sehen", "Dann zieht man Rauch und Flammen auf sich."], ["Benutzte Löscher wieder an den Halter hängen", "Sie sind nach Gebrauch füllen zu lassen."]], e: "Weitere Regeln: Tropf- und Fließbrände von oben nach unten löschen, auf Rückzündung achten, Fluchtweg im Rücken behalten." },
  { u: "brand", d: 2, q: "Was gehört zum vorbeugenden baulichen Brandschutz?", o: ["Brandwände, Feuerschutztüren und gekennzeichnete Flucht- und Rettungswege", ["Der Löschangriff der Feuerwehr", "Das ist abwehrender Brandschutz."], ["Das Bedienen des Feuerlöschers", "Das ist abwehrender Brandschutz."], ["Die Brandursachenermittlung", "Sie erfolgt nach dem Brand."]], e: "Vorbeugender Brandschutz soll die Entstehung und Ausbreitung von Bränden verhindern und Rettung ermöglichen." },
  { u: "brand", d: 2, f: 1, q: "Beim Kontrollgang stellt die Wachperson fest, dass eine Feuerschutztür mit einem Holzkeil offen gehalten wird. Wie handelt sie?", o: ["Keil entfernen, Tür schließen, Feststellung melden und dokumentieren", ["Nichts tun – die Mitarbeiter wollen es so", "Die Tür verliert ihre Schutzfunktion."], ["Die Tür aushängen", "Das verschlimmert die Lage."], ["Einen zweiten Keil dazulegen", "Das verschlimmert die Lage."]], e: "Feuerschutzabschlüsse müssen selbst schließen. Zulässig ist das Offenhalten nur mit zugelassenen Feststellanlagen, die im Brandfall auslösen." },
  { u: "brand", t: "mc", d: 2, q: "Worauf achtet die Wachperson bei der Brandschutzkontrolle?", o: ["Flucht- und Rettungswege sind frei und Notausgänge von innen zu öffnen.", "Feuerlöscher sind vorhanden, zugänglich und geprüft.", ["Die Brandmeldeanlage ist nachts abgeschaltet.", "Sie muss in Betrieb sein."], ["Brandlasten lagern in den Treppenräumen.", "Treppenräume sind von Brandlasten frei zu halten."]], e: "Mängel werden gemeldet; akute Gefahren werden sofort beseitigt, soweit das gefahrlos möglich ist." },
  { u: "brand", d: 1, q: "Welche Farbe und Form haben Rettungszeichen, z. B. für Notausgänge?", o: ["Grün mit weißem Symbol, rechteckig oder quadratisch", ["Rot und rund", "Rot und rund sind Verbotszeichen."], ["Gelb und dreieckig", "Das sind Warnzeichen."], ["Blau und rund", "Das sind Gebotszeichen."]], e: "Brandschutzzeichen sind rot und quadratisch bzw. rechteckig mit weißem Symbol.", r: "ASR A1.3" },
  { u: "brand", t: "tf", d: 1, a: false, q: "Im Brandfall ist zuerst das Inventar zu retten, danach sind Personen zu warnen.", e: "Menschenrettung geht vor Brandbekämpfung und Sachwertschutz. Reihenfolge: Brand melden, in Sicherheit bringen, Löschversuch nur ohne Eigengefährdung." },
  { u: "brand", t: "tf", d: 2, a: true, q: "Die größte Gefahr für Menschen bei Bränden geht meist vom Rauch aus, nicht von den Flammen.", e: "Brandrauch enthält Atemgifte wie Kohlenmonoxid und nimmt die Sicht. Deshalb gilt: gebückt gehen, Türen schließen." },
  { u: "brand", t: "fa", d: 2, q: "Du entdeckst auf dem Kontrollgang einen Entstehungsbrand im Papierlager. Beschreibe dein Vorgehen.", m: "Ruhe bewahren. Brand melden: Handfeuermelder betätigen bzw. Notruf 112 mit den Angaben wo, was, wie viele Betroffene. Personen im Gefahrenbereich warnen und in Sicherheit bringen, Hilfsbedürftige mitnehmen. Türen schließen, um Rauch und Feuer aufzuhalten; keine Aufzüge benutzen. Einen Löschversuch mit dem geeigneten Feuerlöscher nur unternehmen, wenn das ohne Eigengefährdung möglich ist und der Fluchtweg frei bleibt. Feuerwehr an der Zufahrt erwarten, einweisen und über Lage, vermisste Personen und besondere Gefahren informieren. Danach Vorgesetzte und Auftraggeber verständigen und alles dokumentieren.", c: ["Brand melden", "Personen warnen und retten", "Türen schließen, keine Aufzüge", "Löschversuch nur ohne Eigengefährdung", "Feuerwehr einweisen", "Dokumentation"] },

  { u: "stoer", d: 2, f: 1, q: "Die Einbruchmelderzentrale zeigt eine Störung an und lässt sich nicht scharf schalten. Was tut die Wachperson?", o: ["Störung nach Dienstanweisung melden, nicht selbst an der Anlage manipulieren und bis zur Behebung Ersatzmaßnahmen durchführen", ["Die Störung ignorieren und nach Hause gehen", "Das Objekt bliebe ungesichert."], ["Den betroffenen Melder abklemmen", "Eingriffe sind dem Fachpersonal vorbehalten."], ["Die Sicherung der Anlage herausdrehen", "Das setzt die Anlage außer Betrieb."]], e: "Ersatzmaßnahmen sind z. B. verstärkte Kontrollgänge. Jede Störung wird dokumentiert." },
  { u: "stoer", d: 2, q: "Was ist ein Falschalarm?", o: ["Ein Alarm, dem keine tatsächliche Gefahr zugrunde liegt, z. B. durch Bedienfehler oder technische Ursachen", ["Ein Alarm, der zu leise ist", "Das ist nicht gemeint."], ["Ein Alarm in der falschen Sprache", "Das ist nicht gemeint."], ["Jeder Alarm in der Nacht", "Die Tageszeit ist nicht entscheidend."]], e: "Auch ein vermuteter Falschalarm ist zunächst wie ein echter Alarm zu behandeln, bis das Gegenteil feststeht." },
  { u: "stoer", d: 2, f: 1, q: "Bei einem Räumungsalarm im Bürogebäude weigert sich ein Mitarbeiter, seinen Arbeitsplatz zu verlassen. Wie handelt die Wachperson?", o: ["Eindringlich zum Verlassen auffordern, die Gefahr erklären, sich nicht selbst gefährden und die Person der Einsatzleitung melden", ["Den Mitarbeiter mit Gewalt hinaustragen", "Zwang ist nur in engen Grenzen des Notstands denkbar; Vorrang haben Aufforderung und Meldung."], ["Die Tür von außen abschließen", "Das ist lebensgefährlich und unzulässig."], ["Den Alarm für diesen Flur abschalten", "Das ist unzulässig."]], e: "Zurückgebliebene Personen werden am Sammelplatz der Einsatzleitung gemeldet." },
  { u: "stoer", t: "mc", d: 2, q: "Welche zwei Aufgaben hat die Wachperson bei einer Evakuierung?", o: ["Personen zu den Ausgängen und zum Sammelplatz leiten", "Feststellungen über zurückgebliebene oder vermisste Personen an die Einsatzleitung melden", ["Aufzüge für eine schnellere Räumung freigeben", "Aufzüge werden im Brandfall nicht benutzt."], ["Wertgegenstände der Mitarbeiter einsammeln", "Menschenrettung hat Vorrang."]], e: "Grundlage sind Alarmplan, Brandschutzordnung und Flucht- und Rettungsplan des Objekts." },
  { u: "stoer", d: 2, q: "Wo sammeln sich die Personen nach einer Räumung?", o: ["Am festgelegten Sammelplatz", ["Im Foyer des Gebäudes", "Das Gebäude ist zu verlassen."], ["Auf der Feuerwehrzufahrt", "Sie muss frei bleiben."], ["Im Parkhaus", "Maßgeblich ist der festgelegte Sammelplatz."]], e: "Am Sammelplatz wird die Vollzähligkeit geprüft." },
  { u: "stoer", t: "tf", d: 2, a: true, q: "Bei Ausfall der Stromversorgung sorgt die Sicherheitsbeleuchtung dafür, dass Flucht- und Rettungswege erkennbar bleiben.", e: "Sie wird aus einer unabhängigen Stromquelle gespeist. Ihre Funktion ist bei Kontrollgängen zu beachten und Ausfälle sind zu melden." },
  { u: "stoer", t: "fa", d: 2, q: "Wie verhältst du dich bei einer technischen Störung an einer sicherheitsrelevanten Anlage?", m: "Ich lese die Störungsmeldung genau ab und notiere Anlage, Meldung, Ort und Uhrzeit. Ich melde die Störung sofort nach Alarm- bzw. Meldeplan an Leitstelle, Vorgesetzte und den Bereitschaftsdienst des Auftraggebers oder Errichters. Ich greife nicht selbst in die Anlage ein, überbrücke oder deaktiviere nichts. Bis zur Behebung treffe ich die vorgesehenen Ersatzmaßnahmen, etwa zusätzliche Kontrollgänge im betroffenen Bereich. Bei Gefahr für Personen leite ich Schutzmaßnahmen ein. Abschließend dokumentiere ich Störung, Meldungen und Maßnahmen im Wachbuch.", c: ["Meldung genau erfassen", "nach Meldeplan weitergeben", "nicht selbst eingreifen", "Ersatzmaßnahmen", "Dokumentation"] }
]);
